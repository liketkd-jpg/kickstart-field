# VERSION 파일(예: 1.3.1)을 바꿔서 올리면 GitHub가 윈도우용 현장 모드 프로그램을 만들고
# v1.3.1 릴리스를 만들어 파일을 붙입니다. 같은 번호 릴리스가 이미 있으면 건너뜁니다.
# 대회 노트북은 켤 때 최신 릴리스(Latest)의 KICKSTART-field-windows.exe 를 보고 스스로 업데이트합니다.
name: release
on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 버전 확인
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "v$V 릴리스가 이미 있어 건너뜁니다"; fi
      - uses: actions/setup-go@v5
        if: steps.ver.outputs.skip != '1'
        with:
          go-version-file: server/go.mod
      - name: 윈도우 프로그램 만들기
        if: steps.ver.outputs.skip != '1'
        run: |
          V="${{ steps.ver.outputs.v }}"
          mkdir -p dist/KICKSTART_Field
          cd server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$V" -o ../dist/KICKSTART-field-windows.exe .
          cd ../dist
          cp KICKSTART-field-windows.exe KICKSTART_Field/
          cp ../dist-extra/* KICKSTART_Field/
          zip -qr KICKSTART_Field.zip KICKSTART_Field
          sha256sum KICKSTART-field-windows.exe
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip != '1'
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/KICKSTART-field-windows.exe
            dist/KICKSTART_Field.zip
          make_latest: true
          body: "KICKSTART UP 현장 모드 v${{ steps.ver.outputs.v }} · 대회 노트북은 인터넷이 될 때 켜면 자동으로 이 버전으로 바뀝니다. 처음 설치는 KICKSTART_Field.zip 을 받아 압축을 푸세요."
