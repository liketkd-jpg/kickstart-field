# 버전 태그(v1.3.1 등)를 올리면 GitHub가 윈도우용 현장 모드 프로그램을 만들어 릴리스에 자동으로 붙입니다.
# 대회 노트북은 켤 때 이 릴리스(Latest)의 KICKSTART-field-windows.exe 를 보고 스스로 업데이트합니다.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: 윈도우 프로그램 만들기
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist/KICKSTART_Field
          cd server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$V" -o ../dist/KICKSTART-field-windows.exe .
          cd ../dist
          cp KICKSTART-field-windows.exe KICKSTART_Field/
          cp ../dist-extra/* KICKSTART_Field/
          zip -qr KICKSTART_Field.zip KICKSTART_Field
          sha256sum KICKSTART-field-windows.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KICKSTART-field-windows.exe
            dist/KICKSTART_Field.zip
          make_latest: true
          body: "KICKSTART UP 현장 모드 ${{ github.ref_name }} · 대회 노트북은 인터넷이 될 때 켜면 자동으로 이 버전으로 바뀝니다. 처음 설치는 KICKSTART_Field.zip 을 받아 압축을 푸세요."
