<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KICKSTART UP 대회 접수</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Serif+KR:wght@500;600;700;900&family=Nanum+Brush+Script&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="supabase.js"></script>
<style>
/* Layout: 검은 경기장 바닥 위 금색 선 — 위는 대회 일정(공지판), 아래는 지도자가 쓰는 접수 작업대. 브랜드가 한 가지 모습(어두운 바탕)이라 다크 한 가지로 고정 */
:root{
  --ink:#0A0B0E; --panel:#121419; --panel2:#181B22; --line:#2A2E37; --line2:#3A3F4B;
  --text:#F2EEE6; --mute:#9EA4AF; --dim:#6E7480;
  --gold:#D8B46E; --gold2:#F3DFAE; --gold3:#8E6A30; --goldInk:#1A1306;
  --blue:#2F6BE6; --red:#D7263D; --ok:#3CC57E; --warn:#F2B84B; --bad:#FF6B76;
  --f-disp:"Archivo","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Archivo",ui-monospace,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-family:var(--f-disp);font-weight:900;font-size:clamp(28px,4.6vw,46px);line-height:1.12}
h2{font-size:21px;font-weight:900}
h3{font-size:17px;font-weight:800}
.mute{color:var(--mute)} .small{font-size:13px} .num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-disp);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}

/* 시험판 띠 */
.demo{background:linear-gradient(90deg,#2A2110,#1A160D);border-bottom:1px solid #4A3B1C;font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:8px}
.demo b{color:var(--gold2)}
.demo .sp{flex:1}

/* 머리 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(10,11,14,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);flex:none}
.brand svg{width:34px;height:34px}
.brand .wm{font-family:var(--f-disp);font-weight:800;font-stretch:118%;font-size:17px;letter-spacing:.06em}
.brand .wm b{background:linear-gradient(180deg,#F3DFAE,#B8904E);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mute);font-stretch:100%}
.nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.nav a{white-space:nowrap;text-decoration:none;color:var(--mute);font-weight:700;padding:8px 12px;border-radius:9px}
.nav a:hover{color:var(--text);background:var(--panel2)}
.nav a.on{color:var(--gold2);background:#1E1A10}
.who{display:flex;align-items:center;gap:8px;flex:none}
.who .nm{font-weight:800;font-size:14px}
@media (max-width:760px){.top .wrap{flex-wrap:wrap;gap:10px}.nav{order:3;flex-basis:100%}.brand .sub{display:none}}

/* 단추·입력 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 15px;font-weight:800;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--gold3)}
.btn.gold{background:linear-gradient(180deg,#EBD5A3,#B8904E);border-color:#A07E43;color:var(--goldInk)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:#5A2A30}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f>span{font-size:12.5px;font-weight:800;color:var(--mute)}
label.f>span i{font-style:normal;color:var(--bad)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;background:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,180,110,.18)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;accent-color:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.chip.open{color:#9EF0C2;border-color:#24563C;background:#0F2219}
.chip.soon{color:var(--warn);border-color:#5A4417;background:#211A0C}
.chip.closed{color:var(--dim)}
.chip.ps{color:#F0D79F;border-color:#5C4A24}
.chip.ky{color:#9DBBFF;border-color:#25407A}
.chip.gp{color:#FFB3A6;border-color:#6A2C25}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:26px;text-align:center;color:var(--mute)}
.note{font-size:13px;color:var(--mute);border-left:2px solid var(--gold3);padding-left:10px}
.err{color:var(--bad);font-size:13px;font-weight:700}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;font-weight:800;color:var(--mute);background:var(--panel2);padding:9px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:#F2EEE6;color:#0A0B0E;font-weight:800;border-radius:999px;padding:11px 18px;max-width:calc(100% - 32px);box-shadow:0 12px 30px rgba(0,0,0,.5)}
main{padding-block:28px 64px}

/* 대회 일정: 공지판 */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:end;padding-block:12px 26px;border-bottom:1px solid var(--line);margin-bottom:26px}
.hero p{max-width:60ch;margin:12px 0 0;color:var(--mute)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.steps div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}
.steps b{display:block;font-family:var(--f-num);font-size:26px;color:var(--gold);line-height:1}
.steps span{font-size:13px;font-weight:700}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.comps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.comp{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.comp::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--gold3),var(--gold2),var(--gold3))}
.comp.closed::before{background:var(--line2)}
.comp h3{font-size:19px;font-weight:900}
.date{display:flex;gap:14px;align-items:flex-end}
.date .d{font-family:var(--f-num);font-weight:700;font-size:44px;line-height:.9;color:var(--gold2)}
.date .m{font-size:13px;color:var(--mute);font-weight:700;line-height:1.35}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.meta dt{color:var(--mute);font-weight:700}
.meta dd{margin:0}
.dday{font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--warn)}

/* 접수 작업대 */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.desk{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;color:var(--mute)}
.tabs button.on{background:linear-gradient(180deg,#EBD5A3,#B8904E);border-color:#A07E43;color:var(--goldInk)}
.ath{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.ath .nm{font-weight:800}
.ath.picked{border-color:var(--gold3);background:#1A170F}
.form{border:1px solid var(--gold3);border-radius:14px;padding:16px;background:#14120C;display:flex;flex-direction:column;gap:12px}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.cart .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cart .line:last-of-type{border-bottom:none}
.sum{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line2);padding-top:12px}
.sum b{font-family:var(--f-num);font-size:30px;color:var(--gold2)}
.acct{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.st{font-weight:800;font-size:12px;border-radius:7px;padding:3px 8px;white-space:nowrap}
.st.wait{background:#2A220F;color:var(--warn)}
.st.paid{background:#0F2A1C;color:var(--ok)}
.st.cancel{background:#2A1416;color:var(--bad)}

/* 로그인 */
.auth{max-width:460px;margin:0 auto}
.auth .card{display:flex;flex-direction:column;gap:14px;padding:26px}

/* 관리자 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpis div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpis b{display:block;font-family:var(--f-num);font-size:30px;line-height:1.05;color:var(--gold2)}
.kpis span{font-size:12.5px;color:var(--mute);font-weight:700}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.exp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.exp{grid-template-columns:minmax(0,1fr)}}
.exp .card{display:flex;flex-direction:column;gap:10px}
.exp .card .n{font-family:var(--f-num);font-size:34px;line-height:1;color:var(--text)}
input[type=file]{width:100%;background:var(--ink);border:1px dashed var(--line2);border-radius:10px;padding:8px;color:var(--mute);font-size:13px}
input[type=file]::file-selector-button{font:inherit;font-weight:800;border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:8px;padding:6px 12px;margin-right:10px;cursor:pointer}
.mdl{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:30px;padding:0 10px;border-radius:999px;font-weight:900;font-size:13px;color:#1A1306;white-space:nowrap}
.mdl.r1{background:linear-gradient(135deg,#F3DFAE,#C9A262)} .mdl.r2{background:linear-gradient(135deg,#F1F3F6,#A9B1BC)} .mdl.r3{background:linear-gradient(135deg,#F0C6A4,#B07042)}
.awl{display:flex;flex-direction:column;gap:8px}
.awr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.certgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:820px){.certgrid{grid-template-columns:minmax(0,1fr)}}
.certprev{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px}
.certprev canvas{width:100%;max-width:270px;height:auto;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);background:#FBF8F1}
.stylepick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stylepick .sp{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;background:var(--panel2);font-size:12.5px;font-weight:800;text-align:center}
.stylepick .sp.on{border-color:var(--gold);background:#1E1A10}
.stylepick input{position:absolute;opacity:0;pointer-events:none}
.stylepick canvas{width:100%;max-width:110px;height:auto;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:800;cursor:pointer;border:1px solid var(--line2);border-radius:999px;padding:8px 14px;background:var(--panel)}
.switch input{width:20px;height:20px;accent-color:var(--ok)}
.ovl{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.dlg textarea{min-height:170px}
.flash{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#16200F;border:1px solid #2F5A2A;color:#D8F5C8;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.al{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-left:4px solid var(--gold3);background:var(--panel);border-radius:12px;padding:12px 14px}
.al.warn{border-left-color:var(--warn)} .al.hot{border-left-color:var(--bad);background:#1E1214} .al.info{border-left-color:var(--blue)}
.al>div{min-width:0} .al .btn{flex:none}
@media (max-width:560px){.al{flex-direction:column;align-items:stretch}}
.notice{border:1px solid #25407A;background:#0F1626;border-radius:12px;padding:12px 14px;white-space:pre-wrap}
.notice b{display:block;color:#9DBBFF;font-size:13px;margin-bottom:2px}
.atabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.atabs button{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;font-weight:800;color:var(--mute);cursor:pointer;white-space:nowrap}
.atabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
tr.tot td{background:var(--panel2);font-weight:700}
.danger-zone{border-color:#5A2A30}
footer{border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
footer .wrap{padding-block:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#home" aria-label="KICKSTART UP 대회 접수 처음으로">
    <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="ksg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3DFAE"/><stop offset=".55" stop-color="#C9A262"/><stop offset="1" stop-color="#8E6A30"/></linearGradient></defs><path fill="none" stroke="url(#ksg)" stroke-width="2.2" stroke-linejoin="round" d="M32 3 57.1 17.5v29L32 61 6.9 46.5v-29z"/><path fill="url(#ksg)" d="M19 16h7.5v32H19z"/><path fill="url(#ksg)" d="M26.5 36.5 34.5 32l11 16h-8.6z"/><path fill="url(#ksg)" d="M26.5 32v-6.3c7.4-1.4 13.6-5.7 17.6-12l5.4 3.8C44.6 25.4 36.4 30.9 26.5 32z"/><path fill="url(#ksg)" d="M53 4.5l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z"/></svg>
    <span class="wm">KICKSTART <b>UP</b><span class="sub">대회 접수</span></span>
  </a>
  <nav class="nav" id="nav"></nav>
  <div class="who" id="who"></div>
</div></header>

<main><div class="wrap" id="view"></div></main>
<footer><div class="wrap">KICKSTART UP · 태권도 대회 운영 시스템 · 접수 명단은 품새·겨루기·격파 대회 앱으로 바로 넘어갑니다</div></footer>
<div class="toast" id="toast" hidden></div>
<script>
/* ================= 기본 자료 (대회 앱 불러오기 형식과 같은 값) ================= */
const SPORTS={poomsae:{n:'품새',c:'ps'},kyorugi:{n:'겨루기',c:'ky'},gyeokpa:{n:'격파',c:'gp'}};
const PS_DIV=['초등부','중등부','고등부','대학부','일반부','성인부','금강1부','금강2부','태백1부','태백2부','지태1부','지태2부','천권부','한수부','장년1부','장년2부'];
const PS_GRADE=['','1학년','2학년','3학년','4학년','5학년','6학년','저학년','중학년','고학년'];
const KY_DIV=['초등부','중등부','고등부','대학부','일반부'];
const KY_NAMED=['핀급','플라이급','밴텀급','페더급','라이트급','웰터급','라이트미들급','미들급','라이트헤비급','헤비급'];
const KY_KG={남:['-54kg','-58kg','-63kg','-68kg','-74kg','-80kg','-87kg','+87kg'],여:['-46kg','-49kg','-53kg','-57kg','-62kg','-67kg','-73kg','+73kg']};
const GP_EV=[
  {n:'높이 뛰어차기',k:'height'},{n:'제자리 연속 뒤 후려차기',k:'rec'},{n:'제자리 연속 돌개차기',k:'rec'},
  {n:'체공 도약 격파',k:'tech'},{n:'수직축 회전 격파',k:'tech'},{n:'수평축 회전 격파',k:'tech'},{n:'종합 격파',k:'tech'},
  {n:'기술격파 단체전',k:'team'},{n:'주먹 격파',k:'power'},{n:'손날 격파',k:'power'},{n:'손 종합 격파',k:'power'},{n:'발 격파',k:'power'}];
const GP_LV=['초등 중학년부','초등 고학년부','중등 1학년부','중등 2학년부','중등 3학년부','고등 1학년부','고등 2학년부','고등 3학년부','대학 1부','대학 2부','일반 1부','일반 2부'];
const YEAR=2026;

/* ================= 저장: Supabase (대회 접수 데이터베이스) ================= */

const H0=location.hash;let HDONE=false;
function fixAuthHash(session){if(HDONE)return;HDONE=true;
  if(!/access_token=|error_description=|type=recovery/.test(H0))return;
  const P=new URLSearchParams(H0.slice(1));
  if(P.get('error_description')){UI.flash=/expired|invalid/i.test(P.get('error_description'))?'메일 링크가 만료되었거나 이미 사용되었습니다. 로그인해 보시고, 안 되면 대회 본부에 임시 비밀번호를 요청해 주세요':'메일 링크를 처리하지 못했습니다: '+P.get('error_description');history.replaceState(null,'','#login');return;}
  if(P.get('type')==='recovery'||UI.recovery){UI.recovery=true;history.replaceState(null,'','#pwreset');return;}
  history.replaceState(null,'',session?'#home':'#login');if(session)UI.flash='가입 확인이 끝났습니다. 환영합니다!';}
function msgOf(e){const m=String(e&&e.message||e||'');
  if(/Invalid login credentials/i.test(m))return '이메일이나 비밀번호가 맞지 않습니다. 다시 확인해 주세요';
  if(/Email not confirmed/i.test(m))return '가입 확인 메일의 링크를 먼저 눌러 주세요';
  if(/already registered|already been registered/i.test(m))return '이미 가입한 이메일입니다. 로그인해 주세요';
  if(/Password should be at least/i.test(m))return '비밀번호는 6자 이상으로 해 주세요';
  if(/Failed to fetch|NetworkError/i.test(m))return '인터넷 연결을 확인해 주세요';
  if(/rate limit/i.test(m))return '잠시 뒤 다시 시도해 주세요 (요청이 너무 많습니다)';
  if(/sending (confirmation|recovery|magic)|email address not authorized/i.test(m))return '메일을 보내지 못했습니다. 대회 본부에 연락해 주세요 (관리자: Supabase에서 「Confirm email」을 꺼 주세요)';
  if(/different from the old/i.test(m))return '지금 쓰는 비밀번호와 다른 비밀번호로 해 주세요';
  if(/Signups not allowed/i.test(m))return '지금은 회원가입을 받지 않습니다';
  if(/Bucket not found|row-level security.*objects|storage/i.test(m))return '파일 저장소에 올리지 못했습니다. 요강은 「링크」 칸에 주소로 넣어 주세요';
  return m.replace(/^.*?:\s*/,'')||'처리하지 못했습니다';
}

function fmtDate(s){const d=new Date(s+'T00:00:00');return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. (${wd[d.getDay()]})`;}
function today(){const d=new Date();return d.toISOString().slice(0,10);}
function dday(s){const a=new Date(today()+'T00:00:00'),b=new Date(s+'T00:00:00');return Math.round((b-a)/864e5);}

function vLogin(){return `<div class="auth"><form class="card" id="fLogin"><span class="eyebrow">Coach Login</span><h2>로그인</h2>
  <label class="f"><span>이메일</span><input type="email" id="lEmail" autocomplete="username" required placeholder="coach@example.kr"></label>
  <label class="f"><span>비밀번호</span><input type="password" id="lPw" autocomplete="current-password" required></label>
  ${UI.err?`<span class="err">${esc(UI.err)}</span>`:''}
  <button class="btn gold" type="submit">로그인</button>
  <div class="row between small"><span class="mute">처음이신가요? <a href="#signup">지도자 회원가입</a></span><a href="#forgot">비밀번호를 잊으셨나요?</a></div></form></div>`;}
function vForgot(){return `<div class="auth"><div class="card"><span class="eyebrow">Password Help</span><h2>비밀번호를 잊으셨나요?</h2>
  <div class="acct"><b>가장 빠른 방법 · 대회 본부에 연락</b><br><span class="mute">대회 본부(관리자)가 <b>임시 비밀번호</b>를 만들어 알려 드립니다. 그 비밀번호로 로그인한 뒤 「내 정보」에서 새 비밀번호로 바꾸세요.</span>${hqContact()?`<br><span>연락처: <b>${esc(hqContact())}</b></span>`:''}</div>
  <form class="stack" id="fForgot" style="gap:10px"><b class="small">메일로 재설정 링크 받기</b>
    <label class="f"><span>가입한 이메일</span><input type="email" id="fgEmail" required autocomplete="username"></label>
    <button class="btn" type="submit">재설정 메일 보내기</button>
    <span class="small mute">메일이 10분 안에 오지 않으면 위 방법(대회 본부 연락)을 써 주세요.</span></form>
  <a class="small" href="#login">← 로그인으로</a></div></div>`;}
function hqContact(){const c=D().comps.find(x=>x.contact&&compState(x)[0]!=='closed')||D().comps.find(x=>x.contact);return c?c.contact:'';}
function pwFields(){return `<label class="f"><span>새 비밀번호 (6자 이상)</span><input type="password" id="pw1" required autocomplete="new-password"></label>
  <label class="f"><span>새 비밀번호 한 번 더</span><input type="password" id="pw2" required autocomplete="new-password"></label>`;}
function vPwReset(){if(!me())return `<div class="auth"><div class="card"><h2>링크를 확인하는 중…</h2><p class="mute">잠시 기다려도 화면이 바뀌지 않으면 링크가 만료된 것입니다. <a href="#forgot">다시 받기</a></p></div></div>`;
  return `<div class="auth"><form class="card" id="fPwReset"><span class="eyebrow">New Password</span><h2>새 비밀번호 정하기</h2><p class="small mute" style="margin:0">${esc(me().email)}</p>${pwFields()}<button class="btn gold" type="submit">비밀번호 바꾸기</button></form></div>`;}
function vMe(){const u=me();return `<div class="stack" style="max-width:720px;margin:0 auto"><div><span class="eyebrow">My Account</span><h1>내 정보</h1><p class="mute" style="margin:6px 0 0">${esc(u.email)} · ${u.role==='admin'?'대회 본부(관리자)':'지도자'}</p></div>
  <form class="card stack" id="fMe"><h3>회원 정보</h3>
    <div class="grid2"><label class="f"><span>이름 <i>*</i></span><input type="text" id="mName" required value="${esc(u.name)}"></label>
      <label class="f"><span>소속 (도장·학교·팀) <i>*</i></span><input type="text" id="mOrg" required value="${esc(u.org)}"></label>
      <label class="f"><span>휴대폰 <i>*</i></span><input type="tel" id="mPhone" required value="${esc(u.phone)}"></label>
      <label class="f"><span>지도자 자격 번호 (선택)</span><input type="text" id="mLic" value="${esc(u.license||'')}"></label></div>
    <div class="row"><button class="btn gold" type="submit">저장</button></div></form>
  <form class="card stack" id="fPw"><h3>비밀번호 바꾸기</h3><div class="grid2">${pwFields()}</div>
    <span class="small mute">대회 본부에서 받은 임시 비밀번호로 들어오셨다면 여기서 꼭 바꿔 주세요.</span>
    <div class="row"><button class="btn" type="submit">비밀번호 바꾸기</button></div></form></div>`;}
function vSignup(){return `<div class="auth" style="max-width:620px"><form class="card" id="fSignup"><span class="eyebrow">Coach Sign Up</span><h2>지도자 회원가입</h2>
  <p class="small mute" style="margin:0">선수를 대회에 접수하는 지도자(관장·사범·감독) 계정입니다. 선수 본인은 가입하지 않습니다.</p>
  <div class="grid2"><label class="f"><span>이름 <i>*</i></span><input type="text" id="sName" required></label>
    <label class="f"><span>소속 (도장·학교·팀) <i>*</i></span><input type="text" id="sOrg" required placeholder="경민태권도장"></label>
    <label class="f"><span>휴대폰 <i>*</i></span><input type="tel" id="sPhone" required placeholder="010-0000-0000"></label>
    <label class="f"><span>이메일 (로그인 아이디) <i>*</i></span><input type="email" id="sEmail" required></label>
    <label class="f"><span>비밀번호 <i>*</i></span><input type="password" id="sPw" required autocomplete="new-password" placeholder="6자 이상"></label>
    <label class="f"><span>지도자 자격 번호 (선택)</span><input type="text" id="sLic" placeholder="국기원 지도자 자격 번호"></label></div>
  <label class="check"><input type="checkbox" id="sAgree" required><span><b>개인정보 수집·이용 동의 (필수)</b> · 대회 접수와 운영을 위해 지도자와 선수의 이름·소속·성별·생년월일·연락처를 모으고, 대회가 끝난 뒤 1년 동안 보관합니다.</span></label>
  ${UI.err?`<span class="err">${esc(UI.err)}</span>`:''}
  <button class="btn gold" type="submit">가입하고 시작하기</button></form></div>`;}

/* ---------- 내 선수 ---------- */
function myAth(){const u=me();return D().athletes.filter(a=>a.coachId===u.id);}
function athForm(a){a=a||{};const ag=age(a.birth);
  return `<form class="form" id="fAth"><div class="row between"><h3>${a.id?'선수 정보 고치기':'선수 등록'}</h3>${a.id?'<button class="btn sm ghost" type="button" data-a="athCancel">닫기</button>':''}</div>
    <div class="grid3"><label class="f"><span>이름 <i>*</i></span><input type="text" id="aName" required value="${esc(a.name||'')}"></label>
      <label class="f"><span>성별 <i>*</i></span>${sel('aGender',['남','여'],a.gender||'남')}</label>
      <label class="f"><span>생년월일 <i>*</i></span><input type="date" id="aBirth" required value="${esc(a.birth||'')}" data-on="birth"></label>
      <label class="f"><span>소속</span><input type="text" id="aOrg" value="${esc(a.org||me().org)}"></label>
      <label class="f"><span>체중 kg (겨루기·위력격파)</span><input type="number" id="aWeight" step="0.1" min="15" max="200" value="${esc(a.weight||'')}"></label>
      <label class="f"><span>신장 cm (높이 뛰어차기)</span><input type="number" id="aHeight" step="0.1" min="80" max="230" value="${esc(a.height||'')}"></label></div>
    <span class="small mute" id="aSchool">${a.birth?'학년 추정: '+schoolTxt(a.birth):'생년월일을 넣으면 학년과 부별을 자동으로 맞춥니다.'}</span>
    <label class="check" id="aGuard" ${ag!==null&&ag<14?'':'hidden'}><input type="checkbox" id="aGuardOk" ${a.guardian?'checked':''}><span><b>만 14세 미만 선수: 보호자 동의를 받았습니다 (필수)</b> · 법에 따라 만 14세 미만의 개인정보는 보호자(법정대리인) 동의가 있어야 모을 수 있습니다.</span></label>
    ${UI.err?`<span class="err">${esc(UI.err)}</span>`:''}
    <div class="row"><button class="btn gold" type="submit">${a.id?'저장':'선수 등록'}</button></div></form>`;}
function vAthletes(){const L=myAth();const ed=UI.editAth?L.find(a=>a.id===UI.editAth):null;
  return `<div class="stack"><div class="row between"><div><span class="eyebrow">My Athletes</span><h1>내 선수</h1></div><span class="mute">${L.length}명 등록</span></div>
    <p class="mute" style="margin:0">한 번 등록한 선수는 대회마다 다시 적지 않고 골라서 접수합니다.</p>
    ${athForm(ed)}
    ${L.length?`<div class="tablewrap"><table><tr><th>이름</th><th>성별</th><th>생년월일</th><th>학년</th><th>소속</th><th>체중·신장</th><th></th></tr>
      ${L.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${a.gender}</td><td class="num">${esc(a.birth)}</td><td>${schoolTxt(a.birth)}</td><td>${esc(a.org)}</td>
        <td class="num">${a.weight?a.weight+'kg':''}${a.weight&&a.height?' · ':''}${a.height?a.height+'cm':''}</td>
        <td style="white-space:nowrap"><button class="btn sm" type="button" data-a="athEdit" data-id="${a.id}">고치기</button> <button class="btn sm danger" type="button" data-a="athDel" data-id="${a.id}">${UI.delArm===a.id?'한 번 더 누르면 삭제':'삭제'}</button></td></tr>`).join('')}</table></div>`
      :'<div class="empty">아직 등록한 선수가 없습니다. 위 칸에 첫 선수를 등록해 주세요.</div>'}</div>`;}

/* ---------- 대회 접수 ---------- */
function entryLabel(e){const f=e.f||{};const names=e.athleteIds.map(id=>(D().athletes.find(a=>a.id===id)||{}).name||'(삭제됨)');
  if(e.sport==='poomsae')return {who:names.join(' · '),what:`${f.type} ${f.kind} · ${f.div}${f.grade?' '+f.grade:''}`};
  if(e.sport==='kyorugi')return {who:names[0],what:`${f.div}${f.grade?' '+f.grade:''} · ${f.weight}`};
  return {who:names.join(' · '),what:`${f.ev} · ${f.div}${f.weight?' · '+f.weight+'kg':''}${f.height?' · '+f.height+'cm':''}`};}
function entryForm(c,sport,a){const f=UI.form||defaults(sport,a);UI.form=f;const L=myAth();
  let h='';
  if(sport==='poomsae'){
    const need=f.kind==='복식'?2:f.kind==='단체'?3:1;
    h=`<div class="grid2"><label class="f"><span>구분</span>${sel('eType',['공인','자유'],f.type,'data-on="ef" data-k="type"')}</label>
      <label class="f"><span>종목</span>${sel('eKind',['개인','복식','단체'],f.kind,'data-on="ef" data-k="kind"')}</label>
      <label class="f"><span>부별</span>${sel('eDiv',PS_DIV,f.div,'data-on="ef" data-k="div"')}</label>
      <label class="f"><span>학년 (초·중·고)</span>${sel('eGrade',PS_GRADE,f.grade,'data-on="ef" data-k="grade"')}</label></div>
      ${need>1?`<div class="stack" style="gap:6px"><span class="small"><b>함께 나갈 팀원 ${need-1}명</b> (복식 2명 · 단체 3명)</span>${L.filter(x=>x.id!==a.id).map(x=>`<label class="check"><input type="checkbox" data-on="mate" value="${x.id}" ${(f.mates||[]).includes(x.id)?'checked':''}><span>${esc(x.name)} <span class="small mute">${x.gender} · ${schoolTxt(x.birth)}</span></span></label>`).join('')||'<span class="small mute">팀원으로 고를 선수가 더 필요합니다.</span>'}</div>`:''}`;
  }else if(sport==='kyorugi'){
    const named=['초등부','중등부','고등부'].includes(f.div),list=['',...(named?KY_NAMED:KY_KG[a.gender])];
    h=`<div class="grid3"><label class="f"><span>부별</span>${sel('eDiv',KY_DIV,f.div,'data-on="ef" data-k="div"')}</label>
      <label class="f"><span>학년</span>${sel('eGrade',['','1학년','2학년','3학년','4학년','5학년','6학년'],f.grade,'data-on="ef" data-k="grade"')}</label>
      <label class="f"><span>체급 <i>*</i></span>${sel('eWeight',list.map(x=>x?x:{v:'',l:'체급 고르기'}),f.weight,'data-on="ef" data-k="weight"')}</label></div>
      <span class="small mute">${named?'초·중·고등부는 체급 이름(핀급~헤비급)으로, 대학·일반부는 kg으로 나눕니다.':'대학·일반부 '+a.gender+'자 체급입니다.'} ${a.weight?`등록 체중 ${a.weight}kg`:''}</span>`;
  }else{
    const ev=GP_EV.find(x=>x.n===f.ev)||GP_EV[3];const lv=ev.k==='power'||ev.k==='team'?['대학부',...GP_LV]:GP_LV;
    h=`<div class="grid2"><label class="f"><span>종목</span>${sel('eEv',GP_EV.map(x=>x.n),f.ev,'data-on="ef" data-k="ev"')}</label>
      <label class="f"><span>부별</span>${sel('eDiv',lv,f.div,'data-on="ef" data-k="div"')}</label>
      ${ev.k==='power'?`<label class="f"><span>체중 kg <i>*</i> (계체 전 신청 체중)</span><input type="number" id="eW" step="0.1" value="${esc(f.weight||'')}" data-on="ef" data-k="weight"></label>`:''}
      ${ev.k==='height'?`<label class="f"><span>신장 cm <i>*</i></span><input type="number" id="eH" step="0.1" value="${esc(f.height||'')}" data-on="ef" data-k="height"></label>`:''}</div>
      ${ev.k==='team'?`<div class="stack" style="gap:6px"><span class="small"><b>단체전 팀원</b> (선수 포함 5~10명)</span>${L.filter(x=>x.id!==a.id).map(x=>`<label class="check"><input type="checkbox" data-on="mate" value="${x.id}" ${(f.mates||[]).includes(x.id)?'checked':''}><span>${esc(x.name)}</span></label>`).join('')}</div>`:''}`;
  }
  return `<div class="form"><div class="row between"><h3>${esc(a.name)} <span class="small mute">${a.gender} · ${schoolTxt(a.birth)}</span></h3><button class="btn sm ghost" type="button" data-a="pickClose">닫기</button></div>
    ${h}${UI.err?`<span class="err">${esc(UI.err)}</span>`:''}
    <div class="row between"><span class="small mute">참가비 ${won(c.fee[sport])}</span><button class="btn gold" type="button" data-a="addEntry">접수 목록에 넣기</button></div></div>`;}
function vEnter(id){const c=D().comps.find(x=>x.id===id);if(!c)return '<div class="empty">대회를 찾지 못했습니다.</div>';
  if(compState(c)[0]==='closed')return `<div class="empty">접수가 끝난 대회입니다. <a href="#home">대회 일정</a></div>`;
  if(!c.sports.includes(UI.tab))UI.tab=c.sports[0];
  const u=me(),L=myAth(),sport=UI.tab;
  const mine=D().entries.filter(e=>e.compId===c.id&&e.coachId===u.id&&e.status!=='cancel');
  const cart=(UI.cart||[]).filter(e=>e.compId===c.id);
  const inSport=new Set([...mine,...cart].filter(e=>e.sport===sport).flatMap(e=>e.athleteIds));
  const total=cart.reduce((s,e)=>s+e.fee,0);
  return `<div class="stack"><a class="small" href="#comp-${c.id}">← 대회 안내</a>
    <div><span class="eyebrow">Entry</span><h1>${esc(c.name)}</h1><p class="mute" style="margin:6px 0 0">${fmtDate(c.date)} · ${esc(c.place)} · 마감 ${fmtDate(c.deadline)}</p></div>
    <div class="desk"><div class="stack">
      <div class="tabs">${c.sports.map(s=>`<button type="button" class="${s===sport?'on':''}" data-a="tab" data-s="${s}">${SPORTS[s].n}</button>`).join('')}</div>
      <p class="small mute" style="margin:0">선수를 누르면 ${SPORTS[sport].n} 접수 칸이 열립니다. 부별·학년은 생년월일로 미리 맞춰 두었으니 확인만 해 주세요.</p>
      ${L.length?L.map(a=>{const done=inSport.has(a.id);return `<div class="ath ${UI.pick===a.id?'picked':''}"><div><span class="nm">${esc(a.name)}</span> <span class="small mute">${a.gender} · ${schoolTxt(a.birth)}${a.weight?' · '+a.weight+'kg':''}</span></div>
        ${done?'<span class="chip open">접수함</span>':`<button class="btn sm ${UI.pick===a.id?'':'gold'}" type="button" data-a="pick" data-id="${a.id}">${UI.pick===a.id?'작성 중':'접수'}</button>`}</div>
        ${UI.pick===a.id?entryForm(c,sport,a):''}`;}).join(''):'<div class="empty">먼저 「내 선수」에서 선수를 등록해 주세요. <a href="#athletes">선수 등록하러 가기</a></div>'}
    </div>
    <aside class="card cart stack"><h3>접수 목록</h3>
      ${cart.length?cart.map((e,i)=>{const l=entryLabel(e);return `<div class="line"><div><span class="chip ${SPORTS[e.sport].c}">${SPORTS[e.sport].n}</span> <b>${esc(l.who)}</b><div class="small mute">${esc(l.what)}</div></div>
        <div style="text-align:right"><span class="num">${won(e.fee)}</span><br><button class="btn sm ghost" type="button" data-a="cartDel" data-i="${i}">빼기</button></div></div>`;}).join(''):'<span class="small mute">아직 넣은 선수가 없습니다.</span>'}
      <div class="sum"><span class="mute">참가비 합계</span><b>${won(total)}</b></div>
      <div class="acct small"><b>입금 계좌</b><br>${esc(c.account)}<br><span class="mute">입금자명은 「소속명」으로 해 주세요. 대회 본부가 입금을 확인하면 접수 내역에 「입금 확인」이 표시됩니다.</span></div>
      <button class="btn gold" type="button" data-a="submit" data-c="${c.id}" ${cart.length?'':'disabled'}>${cart.length}건 접수하기</button>
      ${mine.length?`<span class="small mute">이 대회에 이미 접수한 ${mine.length}건은 <a href="#entries">내 접수 내역</a>에 있습니다.</span>`:''}
    </aside></div></div>`;}

/* ---------- 내 접수 내역 ---------- */
const STS={wait:['wait','입금 확인 전'],paid:['paid','입금 확인'],cancel:['cancel','취소함']};
function vEntries(){const u=me();const E=D().entries.filter(e=>e.coachId===u.id);
  const byComp=D().comps.filter(c=>E.some(e=>e.compId===c.id));
  return `<div class="stack"><div><span class="eyebrow">My Entries</span><h1>내 접수 내역</h1></div>
    ${byComp.length?byComp.map(c=>{const L=E.filter(e=>e.compId===c.id),live=L.filter(e=>e.status!=='cancel'),open=compState(c)[0]!=='closed';
      return `<section class="card stack"><div class="row between"><div><h3>${esc(c.name)}</h3><span class="small mute">${fmtDate(c.date)} · 마감 ${fmtDate(c.deadline)}</span></div>
        <div class="row">${open?`<a class="btn sm" href="#enter-${c.id}">선수 더 접수</a>`:''}<span class="num" style="font-size:20px;color:var(--gold2)">${won(live.reduce((s,e)=>s+e.fee,0))}</span></div></div>
        <div class="tablewrap"><table><tr><th>종목</th><th>선수</th><th>부문</th><th>참가비</th><th>상태</th><th></th></tr>
        ${L.map(e=>{const l=entryLabel(e),[k,t]=STS[e.status];return `<tr><td><span class="chip ${SPORTS[e.sport].c}">${SPORTS[e.sport].n}</span></td><td><b>${esc(l.who)}</b></td><td class="small">${esc(l.what)}</td><td class="num">${won(e.fee)}</td><td><span class="st ${k}">${t}</span></td>

const coachOf=id=>D().users.find(u=>u.id===id)||{};
/* 도장(지도자)별 참가비 합계 */
function dojangRows(c,E){const by=new Map();
  for(const e of E){if(!by.has(e.coachId))by.set(e.coachId,{co:coachOf(e.coachId),n:{},cnt:0,total:0,paid:0});const r=by.get(e.coachId);
    r.n[e.sport]=(r.n[e.sport]||0)+1;r.cnt++;r.total+=e.fee;if(e.status==='paid')r.paid+=e.fee;}
  return [...by.entries()].map(([id,r])=>({id,...r,due:r.total-r.paid})).sort((a,b)=>(b.due>0)-(a.due>0)||String(a.co.org).localeCompare(String(b.co.org),'ko'));}
function payMsg(c,r){return `[KICKSTART UP] ${c.name} 참가비 안내\n${r.co.org||''} ${r.co.name||''} 지도자님, 접수 ${r.cnt}건 참가비 ${won(r.total)} 중 ${won(r.due)}이 아직 확인되지 않았습니다.\n입금 계좌: ${c.account}\n입금자명: ${r.co.org||r.co.name||''}\n접수 마감: ${fmtDate(c.deadline)}${c.contact?'\n문의: '+c.contact:''}`;}
function vDojang(c,E){const L=dojangRows(c,E),T=L.reduce((s,r)=>({cnt:s.cnt+r.cnt,total:s.total+r.total,paid:s.paid+r.paid}),{cnt:0,total:0,paid:0}),dueN=L.filter(r=>r.due>0).length;

  return `<div class="row between"><div><h2>도장별 참가비 합계표</h2><p class="small mute" style="margin:4px 0 0">한 도장이 여러 선수 참가비를 한꺼번에 입금하면 「모두 입금 확인」을 누르세요. 미입금 도장에는 안내 문자를 보낼 수 있습니다.</p></div>
    <div class="row"><button class="btn" type="button" data-a="dojangX">합계표 엑셀</button>${dueN?`<button class="btn gold" type="button" data-a="copyAll">미입금 ${dueN}곳 안내문 복사</button>`:''}</div></div>

    ${L.map(r=>`<tr><td><b>${esc(r.co.org||'')}</b><div class="small mute">${esc(r.co.name||'')}</div></td><td class="small num">${esc(r.co.phone||'')}</td>${c.sports.map(s=>`<td class="num">${r.n[s]||''}</td>`).join('')}
      <td class="num">${won(r.total)}</td><td class="num">${won(r.paid)}</td><td class="num" style="color:${r.due?'var(--warn)':'var(--ok)'};font-weight:800">${r.due?won(r.due):'완료 ✓'}</td>

    <tr class="tot"><td colspan="2"><b>합계 ${L.length}곳</b></td>${c.sports.map(s=>`<td class="num">${L.reduce((n,r)=>n+(r.n[s]||0),0)}</td>`).join('')}<td class="num"><b>${won(T.total)}</b></td><td class="num">${won(T.paid)}</td><td class="num"><b>${won(T.total-T.paid)}</b></td><td></td></tr></table></div>`;}

const MEDAL={1:['금','GOLD','#E9CB7A','#A47C2C','#5A4210'],2:['은','SILVER','#E4E8EE','#9AA2AD','#3E4550'],3:['동','BRONZE','#E7B28A','#9A5E33','#4A2A12']};
function awardTitle(r){if(r.kind==='team')return r.rank===1?'종합 우승':r.rank===2?'종합 준우승':'종합 3위';return `${MEDAL[r.rank]?MEDAL[r.rank][0]+'메달 · ':''}제${r.rank}위`;}
function medalChip(r){const m=MEDAL[r.rank];return `<span class="mdl r${r.rank}" aria-label="${r.rank}위">${r.kind==='team'?'종합 ':''}${m?m[0]:r.rank+'위'}</span>`;}

/* 정해진 순서의 난수 (같은 상장은 언제나 같은 모양) */

/* 띠(리본) 한 줄: 여러 개의 3차 곡선을 이어 그리고, 비틀림·박음질 줄·그림자를 넣음 */

/* 진짜 태권도 띠: 넓은 천 띠 + 촘촘한 박음질 줄 + 빛에 따른 입체감 + 그림자 + 잘린 띠 끝 */
function belt(ctx,segs,w,col,o){o=o||{};const N=150,P=[];
  segs.forEach((sg,si)=>{for(let i=si?1:0;i<=N;i++)P.push(bez(sg,i/N));});
  const M=P.length,L=[],R=[],A=[],tw=o.twist||0;
  for(let i=0;i<M;i++){const a=P[Math.max(0,i-1)],b=P[Math.min(M-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const s=i/(M-1),f=tw?Math.max(.08,Math.abs(Math.cos((s*tw+(o.ph||0))*Math.PI))):1,hw=w*f/2;
    L.push([P[i][0]-dy*hw,P[i][1]+dx*hw]);R.push([P[i][0]+dy*hw,P[i][1]-dx*hw]);A.push([Math.atan2(dy,dx),f]);}

  const at=(i,t)=>[L[i][0]+(R[i][0]-L[i][0])*t,L[i][1]+(R[i][1]-L[i][1])*t];
  /* 그림자 */
  ctx.save();ctx.shadowColor='rgba(40,25,10,.30)';ctx.shadowBlur=w*.45;ctx.shadowOffsetX=w*.06;ctx.shadowOffsetY=w*.22;poly();ctx.fillStyle=col;ctx.fill();ctx.restore();
  ctx.save();poly();ctx.clip();
  /* 빛: 띠가 꺾이는 방향에 따라 밝고 어둡게 */
  const strong=o.dark?.75:1;
  for(let i=0;i<M-1;i++){const [ang,f]=A[i];const li=Math.cos(ang+Math.PI*.3)*.5+.5,dk=1-f;
    ctx.beginPath();ctx.moveTo(L[i][0],L[i][1]);ctx.lineTo(L[i+1][0],L[i+1][1]);ctx.lineTo(R[i+1][0],R[i+1][1]);ctx.lineTo(R[i][0],R[i][1]);ctx.closePath();
    ctx.fillStyle=`rgba(255,255,255,${(li*.16*strong*(1-dk)).toFixed(3)})`;ctx.fill();
    if(dk>.05||li<.35){ctx.fillStyle=`rgba(0,0,0,${Math.min(.6,dk*.55+(.35-Math.min(li,.35))*.5).toFixed(3)})`;ctx.fill();}}
  /* 가장자리 둥근 그늘 */
  const edge=(t,a,lw)=>{ctx.beginPath();for(let i=0;i<M;i++){const p=at(i,t);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.strokeStyle=a;ctx.lineWidth=lw;ctx.stroke();};
  edge(0,'rgba(0,0,0,.35)',w*.12);edge(1,'rgba(0,0,0,.30)',w*.12);edge(.5,`rgba(255,255,255,${o.dark?.035:.05})`,w*.4);

    ctx.beginPath();for(let i=0;i<M;i++){const p=at(i,t);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.strokeStyle=o.dark?'rgba(0,0,0,.55)':'rgba(0,0,0,.26)';ctx.lineWidth=Math.max(1.2,w/70);ctx.stroke();
    ctx.beginPath();for(let i=0;i<M;i++){const p=at(i,t+.012);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.strokeStyle=o.dark?'rgba(255,255,255,.07)':'rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();}
  /* 천 결 */
  const rr=rng(o.seed||5);ctx.globalAlpha=.06;for(let i=0;i<M;i+=2)for(let k=0;k<3;k++){const p=at(i,rr());ctx.fillStyle=rr()<.5?'#000':'#fff';ctx.fillRect(p[0],p[1],2,2);}ctx.globalAlpha=1;
  /* 띠 끝: 박음질 가로줄 */
  if(o.endCap){const i=o.endCap==='start'?Math.round(M*.012)+1:M-1-Math.round(M*.012)-1;ctx.beginPath();const a=at(i,0),b=at(i,1);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.stroke();}
  ctx.restore();}

async function saveBytes(data,name,mime,okMsg){
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data});toast(okMsg);return;}}}catch(e){if(e&&e.code==='declined')return;}
  try{const u=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},3000);toast(okMsg);}
  catch(e){toast('이 화면에서는 파일을 내려받을 수 없습니다');}
}
function exportXlsx(c,sport){const rows=exportRows(c,sport);return saveXlsx(rows,`${c.name}_${SPORTS[sport].n}_접수명단.xlsx`,'선수명단',`${SPORTS[sport].n} 명단 ${rows.length-1}건을 내려받았습니다`);}
function dojangXlsx(c){const L=dojangRows(c,D().entries.filter(e=>e.compId===c.id&&e.status!=='cancel'));
  const rows=[['소속','지도자','휴대폰','이메일',...c.sports.map(s=>SPORTS[s].n+' 건수'),'참가비 합계','입금 확인','남은 금액'],
    ...L.map(r=>[r.co.org||'',r.co.name||'',r.co.phone||'',r.co.email||'',...c.sports.map(s=>r.n[s]||0),r.total,r.paid,r.due])];
  rows.push(['합계','','','',...c.sports.map(s=>L.reduce((n,r)=>n+(r.n[s]||0),0)),L.reduce((n,r)=>n+r.total,0),L.reduce((n,r)=>n+r.paid,0),L.reduce((n,r)=>n+r.due,0)]);
  return saveXlsx(rows,`${c.name}_도장별_참가비.xlsx`,'도장별 참가비','도장별 참가비 합계표를 내려받았습니다');}
async function copyText(t,okMsg){let ok=false;try{await navigator.clipboard.writeText(t);ok=true;}catch(e){try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove();}catch(_){}}
  toast(ok?okMsg:'복사하지 못했습니다. 길게 눌러 직접 복사해 주세요');return ok;}
function tempPassword(){const A='abcdefghjkmnpqrstuvwxyz',N='23456789';let p='';for(let i=0;i<3;i++)p+=A[Math.floor(Math.random()*A.length)];for(let i=0;i<4;i++)p+=N[Math.floor(Math.random()*N.length)];return p;}

  else if(a==='atab'){UI.atab=b.dataset.t;UI.err='';UI.tempPw=null;render();}

  else if(a==='copyOne'||a==='copyAll'){const c=S.comps.find(x=>x.id===UI.adminComp);if(!c)return;const L=dojangRows(c,S.entries.filter(e=>e.compId===c.id&&e.status!=='cancel')).filter(r=>r.due>0&&(a==='copyAll'||r.id===b.dataset.id));
    copyText(L.map(r=>payMsg(c,r)+(a==='copyAll'&&r.co.phone?`\n(연락처 ${r.co.phone})`:'')).join('\n\n────────\n\n'),a==='copyAll'?`미입금 ${L.length}곳 안내문을 복사했습니다. 카카오톡·문자에 붙여 넣으세요`:'안내문을 복사했습니다. 카카오톡·문자에 붙여 넣으세요');}
  else if(a==='tempPw'){const id=b.dataset.id;if(UI.pwArm!==id){UI.pwArm=id;render();setTimeout(()=>{if(UI.pwArm===id){UI.pwArm=null;render();}},4000);return;}
    const pw=tempPassword(),u=coachOf(id);run(async()=>{const {error}=await sb.rpc('admin_set_password',{p_user:id,p_pw:pw});if(error)throw error;UI.pwArm=null;UI.tempPw={who:`${u.org||''} ${u.name||''}`.trim(),pw};render();});}

document.addEventListener('change',e=>{
  const t=e.target,on=t.dataset&&t.dataset.on;
  if(on==='ef'&&t.type==='number'){UI.form={...UI.form,[t.dataset.k]:t.value};return;}
  if(on==='ef'){UI.form={...UI.form,[t.dataset.k]:t.value};if(t.dataset.k==='div'&&UI.tab==='kyorugi')UI.form.weight='';
    if(t.dataset.k==='ev'){const ev=GP_EV.find(x=>x.n===t.value);if((ev.k==='power'||ev.k==='team')&&!['대학부',...GP_LV].includes(UI.form.div))UI.form.div='대학부';}
    UI.err='';render();}
  else if(on==='mate'){const s=new Set(UI.form.mates||[]);t.checked?s.add(t.value):s.delete(t.value);UI.form={...UI.form,mates:[...s]};}
  else if(on==='adComp'){UI.adminComp=t.value;render();}

});

function formErr(f,m){let el=f.querySelector('.err');if(!el){el=document.createElement('span');el.className='err';const btn=f.querySelector('button[type=submit]');(btn&&btn.closest('.row')||btn||f).before(el);}el.textContent=m;el.setAttribute('role','alert');}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=id=>(document.getElementById(id)||{}).value||'';
  if(f.id==='fLogin')run(async()=>{const {data,error}=await sb.auth.signInWithPassword({email:v('lEmail').trim(),password:v('lPw')});
    if(error){formErr(f,msgOf(error));return;}await reload();const u=me();go(u&&u.role==='admin'?'admin':'home');toast(`${u?u.name:''}님, 반갑습니다`);});
  else if(f.id==='fSignup')run(async()=>{
    if(v('sPw').length<6){formErr(f,'비밀번호는 6자 이상으로 해 주세요');return;}
    const {data,error}=await sb.auth.signUp({email:v('sEmail').trim(),password:v('sPw'),options:{data:{name:v('sName').trim(),org:v('sOrg').trim(),phone:v('sPhone').trim(),license:v('sLic').trim()},emailRedirectTo:location.origin+location.pathname}});
    if(error){formErr(f,msgOf(error));return;}
    if(!data.session){f.innerHTML=`<span class="eyebrow">Check your email</span><h2>가입 확인 메일을 보냈습니다</h2><p class="mute">${esc(v('sEmail'))} 메일함에서 「Confirm your signup」 메일의 링크를 누르면 가입이 끝납니다. 그다음 로그인해 주세요.</p><a class="btn gold" href="#login">로그인 화면으로</a>`;return;}
    await reload();go('athletes');toast('가입했습니다. 이제 선수를 등록해 주세요');});
  else if(f.id==='fAth'){const birth=v('aBirth'),ag=age(birth),guard=document.getElementById('aGuardOk');
    if(ag!==null&&ag<14&&!(guard&&guard.checked)){formErr(f,'만 14세 미만 선수는 보호자 동의를 확인해 주세요');return;}
    const data={name:v('aName').trim(),gender:v('aGender'),birth:birth||null,org:v('aOrg').trim()||me().org,weight:Number(v('aWeight'))||null,height:Number(v('aHeight'))||null,guardian:!!(guard&&guard.checked&&ag<14)};
    run(async()=>{if(UI.editAth){await q(sb.from('athletes').update(data).eq('id',UI.editAth));toast('선수 정보를 고쳤습니다');}
      else{await q(sb.from('athletes').insert(data));toast(`${data.name} 선수를 등록했습니다`);}
      UI.editAth=null;UI.err='';await reload();});}
  else if(f.id==='fComp'){const sports=Object.keys(SPORTS).filter(k=>document.getElementById('cS_'+k).checked),editId=f.dataset.id;
    if(!sports.length){formErr(f,'종목을 하나 이상 골라 주세요');return;}
    if(v('cDead')>v('cDate')){formErr(f,'접수 마감일은 대회일보다 앞이어야 합니다');return;}
    const old=editId?D().comps.find(x=>x.id===editId):null,link=v('cDocUrl').trim(),file=(document.getElementById('cDoc')||{}).files,del=document.getElementById('cDocDel');
    if(link&&!/^https?:\/\//i.test(link)){formErr(f,'요강 링크는 https:// 로 시작하는 주소로 넣어 주세요');return;}
    if(file&&file[0]&&file[0].size>20*1024*1024){formErr(f,'요강 파일은 20MB까지 올릴 수 있습니다');return;}
    const c={name:v('cName').trim(),place:v('cPlace').trim(),date:v('cDate'),deadline:v('cDead'),sports,fee:Object.fromEntries(sports.map(k=>[k,Number(v('cF_'+k))||0])),account:v('cAcct').trim()||'입금 계좌를 적어 주세요',note:v('cNote').trim(),notice:v('cNotice').trim(),contact:v('cContact').trim()};
    if(!editId)c.host='KICKSTART UP';
    run(async()=>{let doc=null;
      if(file&&file[0]){const F=file[0],ext=(F.name.match(/\.[A-Za-z0-9]{1,5}$/)||['.pdf'])[0].toLowerCase(),path=`${editId||'new'}/${Date.now()}${ext}`;
        const {error}=await sb.storage.from('comp-docs').upload(path,F,{upsert:true,contentType:F.type||undefined});if(error){formErr(f,msgOf(error));return;}
        doc={doc_url:sb.storage.from('comp-docs').getPublicUrl(path).data.publicUrl,doc_name:F.name};}
      else if(link)doc={doc_url:link,doc_name:old&&old.docUrl===link?old.docName:'링크'};
      else if(del&&del.checked)doc={doc_url:'',doc_name:''};
      Object.assign(c,doc||{});
      if(editId){await q(sb.from('comps').update(c).eq('id',editId));UI.err='';await reload();toast('대회 정보를 고쳤습니다');}
      else{const r=await q(sb.from('comps').insert(c).select());UI.newComp=false;UI.adminComp=r&&r[0]&&r[0].id;UI.err='';await reload();toast('대회를 만들었습니다. 「대회 일정」에 바로 보입니다');}});}
  else if(f.id==='fCert'){const c=D().comps.find(x=>x.id===UI.adminComp);if(!c)return;
    const cert={...c.cert,style:(document.querySelector('input[name=ceStyle]:checked')||{}).value||c.cert.style||'belt',host:v('ceHost').trim(),title:v('ceTitle').trim(),rep:v('ceRep').trim(),date:v('ceDate'),serial:v('ceSerial').trim()};
    run(async()=>{await q(sb.from('comps').update({cert}).eq('id',c.id));await reload();toast('상장 설정을 저장했습니다');});}
  else if(f.id==='fMe'){const d={name:v('mName').trim(),org:v('mOrg').trim(),phone:v('mPhone').trim(),license:v('mLic').trim()};
    if(!d.name||!d.org||!d.phone){formErr(f,'이름·소속·휴대폰을 모두 적어 주세요');return;}
    run(async()=>{await q(sb.from('profiles').update(d).eq('id',me().id));await reload();toast('내 정보를 저장했습니다');});}
  else if(f.id==='fPw'||f.id==='fPwReset'){const p1=v('pw1'),p2=v('pw2');
    if(p1.length<6){formErr(f,'비밀번호는 6자 이상으로 해 주세요');return;}if(p1!==p2){formErr(f,'두 비밀번호가 서로 다릅니다');return;}
    run(async()=>{const {error}=await sb.auth.updateUser({password:p1});if(error){formErr(f,msgOf(error));return;}
      f.reset();UI.recovery=false;toast('비밀번호를 바꿨습니다. 다음부터 새 비밀번호로 로그인하세요');if(f.id==='fPwReset')go('home');});}
  else if(f.id==='fForgot'){const em=v('fgEmail').trim();
    run(async()=>{const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(error){formErr(f,msgOf(error));return;}
      f.innerHTML=`<b>${esc(em)}</b><span class="mute small">로 비밀번호 재설정 메일을 보냈습니다. 메일의 링크를 누르면 새 비밀번호를 정하는 화면이 열립니다. 메일이 오지 않으면 대회 본부에 임시 비밀번호를 요청해 주세요.</span>`;});}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.contact){UI.contact=null;render();}});
render();reload();
</script>
</body>
</html>
