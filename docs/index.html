<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KICKSTART UP 대회 접수</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Serif+KR:wght@500;600;700;900&family=Nanum+Brush+Script&family=Cinzel:wght@600;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="supabase.js"></script>
<script>/*@@LV*/
/* KICKSTART UP 관람객용 실시간 결과 화면 (현장 와이파이 /view · 접수 홈페이지 #live 공통)
   LV.html(snap, st) → 화면 글.  snap = {v,at,comp,courts:[{court,online,apps:[{app,appName,board,results}]}]} */
(function(){
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const APPN={poomsae:'품새',kyorugi:'겨루기',gyeokpa:'격파',hero:'태권 히어로'};
const MD={1:['금','g'],2:['은','s'],3:['동','b']};
function ago(at,now){if(!at)return '';const s=Math.max(0,Math.round(((now||Date.now())-at)/1000));if(s<10)return '방금';if(s<60)return s+'초 전';if(s<3600)return Math.floor(s/60)+'분 전';return Math.floor(s/3600)+'시간 전';}
const hm=t=>{if(!t)return '';const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const nt=s=>String(s||'').replace(/\s+/g,'');
/* 화면에 보이는 도장 이름 모두 (「⭐ 내 도장」 고르기) */
function teamsOf(snap){const S=new Set();flat(snap).forEach(({b,r})=>{if(b){(b.now&&b.now.names||[]).forEach(p=>p.team&&S.add(p.team));(b.next||[]).forEach(n=>(n.names||[]).forEach(p=>p.team&&S.add(p.team)));(b.upcoming||[]).forEach(u=>(u.names||[]).forEach(p=>p.team&&S.add(p.team)));}
  (r&&r.divs||[]).forEach(d=>(d.podium||[]).forEach(p=>p.team&&S.add(p.team)));});return [...S].sort((a,b)=>a.localeCompare(b,'ko'));}
/* 내 도장 선수: 지금 · 곧(다음 순서) · 이어지는 부문(예상 시각) · 입상 */
function mine(F,my){const L=[],seen=new Set(),m=nt(my);if(!m)return L;
  F.forEach(({c,a,b,r})=>{const where=`${c.court?c.court+'코트':''} · ${a.appName||APPN[a.app]||''}`,eta=a.eta||{};
    if(b&&b.now)(b.now.names||[]).forEach(p=>{if(nt(p.team)===m){seen.add(p.name+'|'+b.now.div);L.push({k:'now',p,where,div:b.now.div,txt:'지금 경기 중'});}});
    if(b)(b.next||[]).forEach((n,i)=>(n.names||[]).forEach(p=>{if(nt(p.team)===m&&!seen.has(p.name+'|'+n.div)){seen.add(p.name+'|'+n.div);L.push({k:'next',p,where,div:n.div,txt:i===0?'바로 다음':`${i+1}번째 뒤`});}}));
    if(b)(b.upcoming||[]).forEach(u=>(u.names||[]).forEach(p=>{if(nt(p.team)===m&&!seen.has(p.name+'|'+u.name)){seen.add(p.name+'|'+u.name);const t=(eta.divs||[]).find(d=>d.name===u.name);
      L.push({k:'soon',p,where,div:u.name,txt:u.name===b.curDiv?'이 부문 대기':t&&t.start?`약 ${hm(t.start)} 시작`:'곧 이어서'});}}));
    (r&&r.divs||[]).forEach(d=>(d.podium||[]).forEach(p=>{if(nt(p.team)===m)L.push({k:'medal',p,where,div:d.div,rank:p.rank});}));});
  const o={now:0,next:1,soon:2,medal:3};return L.sort((x,y)=>o[x.k]-o[y.k]).slice(0,80);}
function hit(q,...v){if(!q)return false;const t=v.join(' ').toLowerCase().replace(/\s+/g,'');return t.includes(q);}
function mark(s,q){s=String(s||'');if(!q)return E(s);const i=s.toLowerCase().indexOf(q);if(i<0)return E(s);return E(s.slice(0,i))+'<mark>'+E(s.slice(i,i+q.length))+'</mark>'+E(s.slice(i+q.length));}
function person(p,q,my){return `<span class="lv-p ${p.side?'lv-'+p.side:''} ${my&&nt(p.team)===nt(my)?'lv-me':''}" data-notr>${p.side?'<i></i>':''}<b>${mark(p.name,q)}</b>${p.team?` <small>${mark(p.team,q)}</small>`:''}</span>`;}
function flat(snap){const out=[];(snap&&snap.courts||[]).forEach(c=>(c.apps||[]).forEach(a=>out.push({c,a,b:a.board||null,r:a.results||null})));return out;}
/* 도장 종합: 금 3점 · 은 2점 · 동 1점 */
function teamTable(F){const T=new Map();
  F.forEach(({r})=>(r&&r.divs||[]).forEach(d=>(d.podium||[]).forEach(p=>{if(!p.team||!MD[p.rank])return;const t=T.get(p.team)||{team:p.team,g:0,s:0,b:0};t[MD[p.rank][1]]++;T.set(p.team,t);})));
  return [...T.values()].map(t=>({...t,pt:t.g*3+t.s*2+t.b})).sort((a,b)=>b.pt-a.pt||b.g-a.g||b.s-a.s||a.team.localeCompare(b.team,'ko'));}
function find(F,q){const L=[];if(!q)return L;
  F.forEach(({c,a,b,r})=>{const where=`${c.court?c.court+'코트 · ':''}${a.appName||APPN[a.app]||''}`;
    if(b&&b.now)(b.now.names||[]).forEach(p=>{if(hit(q,p.name,p.team))L.push({k:'now',p,where,div:b.now.div,txt:b.now.status||'경기 중'});});
    if(b)(b.next||[]).forEach((n,i)=>(n.names||[]).forEach(p=>{if(hit(q,p.name,p.team))L.push({k:'next',p,where,div:n.div,txt:i===0?'바로 다음':`${i+1}번째 뒤`});}));
    if(r)(r.divs||[]).forEach(d=>(d.podium||[]).forEach(p=>{if(hit(q,p.name,p.team))L.push({k:'medal',p,where,div:d.div,rank:p.rank});}));});
  const ord={now:0,next:1,medal:2};return L.sort((x,y)=>ord[x.k]-ord[y.k]).slice(0,60);}
function court(c,a,b,q,my){const eta=a.eta||null;const off=c.online===false,pr=b&&b.progress,pc=pr&&pr.total?Math.round(pr.done/pr.total*100):0;
  const nx=(b&&b.next||[]).slice(0,5);
  return `<section class="lv-court ${off?'off':''}"><header><span class="lv-c">${E(c.court||'')}</span><b>${E(c.court?c.court+'코트':'코트')}</b><span class="lv-app">${E(a.appName||APPN[a.app]||'')}</span>
      <span class="lv-st ${off?'off':b&&b.now?'on':''}">${off?'연결 끊김':b&&b.now?E(b.now.status||'경기 중'):'대기'}</span></header>
    ${b?`<div class="lv-div"><span data-notr>${E(b.curDiv||'—')}</span>${pr?`<small>${pr.done}/${pr.total}</small>`:''}</div>${pr?`<div class="lv-bar"><i style="width:${pc}%"></i></div>`:''}
    ${b.now?`<div class="lv-now"><small>지금${b.now.label?' · '+E(b.now.label):''}</small>${(b.now.names||[]).map(p=>person(p,q,my)).join('')}</div>`:'<div class="lv-now lv-mute">아직 시작한 경기가 없습니다</div>'}
    ${nx.length?`<div class="lv-next"><small>다음 순서</small><ol>${nx.map(n=>`<li data-notr>${n.div!==b.curDiv?`<em>${E(n.div)}</em>`:''}${(n.names||[]).map(p=>`<span class="${my&&nt(p.team)===nt(my)?'lv-me':''}">${mark(p.name,q)}${p.team?` <small>${mark(p.team,q)}</small>`:''}</span>`).join(' <i>vs</i> ')}</li>`).join('')}</ol></div>`:''}
    ${b.nextDiv&&b.nextDiv!==b.curDiv?`<div class="lv-nd">다음 부문 · <b data-notr>${E(b.nextDiv)}</b>${eta&&eta.next?` <span class="lv-t">약 ${hm(eta.next)}</span>`:''}</div>`:''}
    ${eta&&eta.end?`<div class="lv-eta"><span>⏱ 이 코트 끝 약 <b>${hm(eta.end)}</b></span>${eta.real?'':'<small>예상</small>'}</div>`:''}`
    :'<div class="lv-now lv-mute">진행 정보를 기다리는 중</div>'}</section>`;}
function results(F,q){const D=[];F.forEach(({c,a,r})=>(r&&r.divs||[]).forEach(d=>{if((d.podium||[]).length)D.push({c,a,d});}));
  if(!D.length)return '<div class="lv-empty">아직 나온 입상 결과가 없습니다. 부문이 끝나면 여기에 바로 나옵니다.</div>';
  D.sort((x,y)=>(y.d.done?0:1)-(x.d.done?0:1));
  const show=q?D.filter(({d})=>hit(q,d.div)||(d.podium||[]).some(p=>hit(q,p.name,p.team))):D;
  return `<div class="lv-res">${show.map(({c,a,d})=>`<article><header><b data-notr>${mark(d.div,q)}</b><small>${E(a.appName||APPN[a.app]||'')}${c.court?' · '+E(c.court)+'코트':''}${d.done?'':' · 진행 중'}</small></header>
    <ol>${(d.podium||[]).slice().sort((x,y)=>x.rank-y.rank).map(p=>`<li class="${hit(q,p.name,p.team)?'hit':''}"><span class="lv-m ${MD[p.rank]?MD[p.rank][1]:''}" aria-label="${p.rank}위">${p.rank}</span><b data-notr>${mark(p.name,q)}</b><small data-notr>${mark(p.team,q)}</small></li>`).join('')}</ol></article>`).join('')||'<div class="lv-empty">찾는 이름이 결과에 없습니다</div>'}</div>`;}
/* v1.4.49 큰 화면(관중 TV)용: 「나란히」는 모든 코트를 한 줄에 나란히(스크롤 없이), 「넘기기」는 코트 4개씩 10초마다 저절로 넘김 */
function wallCourts(F,q,st){const all=F.map(({c,a,b})=>court(c,a,b,q,st.my));const n=all.length;
  if(st.wall==='side')return `<div class="lv-courts lv-side" style="--n:${Math.min(n,6)}">${all.join('')}</div>`;
  if(st.wall==='rot'){const per=4,pages=Math.max(1,Math.ceil(n/per)),pg=Math.floor((st.pgAt||Date.now())/10000)%pages;
    return `<div class="lv-courts lv-side" style="--n:${Math.min(per,n)}">${all.slice(pg*per,pg*per+per).join('')}</div>${pages>1?`<div class="lv-pg">${Array.from({length:pages},(_,i)=>`<i class="${i===pg?'on':''}"></i>`).join('')}<small>${pg*per+1}~${Math.min(n,pg*per+per)}번째 코트 · 10초마다 넘어갑니다</small></div>`:''}`;}
  return `<div class="lv-courts">${all.join('')}</div>`;}
/* v1.4.59 하루 일정표 (본부 운영표에서 보냄): 코트를 나란히, 찾는 말이 있으면 그 부문을 밝게 */
function schedHtml(S,q){if(!S||!(S.courts||[]).length)return '<div class="lv-empty">아직 일정표가 없습니다</div>';
  return `<p class="lv-sub" style="margin:0">시작 ${E(S.start||'')} · 예상 시각이며 진행에 따라 앞당겨지거나 늦어질 수 있습니다 · 30분 먼저 대기해 주세요</p>
  <div class="lv-sched" style="--n:${Math.min(S.courts.length,6)}">${S.courts.map(c=>`<section><h3><span>${E(c.c)}코트</span><small>${E(c.ev||'')}</small></h3>
    ${(c.rows||[]).map(r=>r.b?`<div class="lv-sr lv-sb"><span>${E(r.t)}</span><span>${E(r.s)}~${E(r.e)}</span></div>`:`<div class="lv-sr ${q&&hit(q,r.t)?'hit':''}"><span class="lv-st2">${E(r.s)}</span><span data-notr>${q?mark(r.t,q):E(r.t)}</span><small>${E(r.n||'')}</small></div>`).join('')}
    ${c.end?`<div class="lv-se">끝 약 ${E(c.end)}</div>`:''}</section>`).join('')}</div>`;}
function html(snap,st){st=st||{};const q=String(st.q||'').toLowerCase().replace(/\s+/g,''),tab=st.tab||'courts',now=st.now||Date.now();
  if(snap&&snap.sched&&!(snap.courts||[]).length)return {head:snap.comp?`<div class="lv-top"><h2 data-notr>${E(snap.comp)}</h2></div>`:'',body:`<div class="lv-tabs"><button type="button" class="on">일정표</button></div>${schedHtml(snap.sched,q)}`};
  if(!snap||!(snap.courts||[]).length)return {head:snap&&snap.comp?`<div class="lv-top"><h2>${E(snap.comp)}</h2></div>`:'',body:`<div class="lv-empty lv-wait"><b>경기 소식을 기다리는 중입니다</b><br>대회가 시작되면 코트별 진행 상황과 입상 결과가 여기에 바로 나옵니다.</div>`};
  const F=flat(snap),T=teamTable(F),stale=snap.at&&now-snap.at>60000;
  const found=find(F,q);
  const nRes=F.reduce((n,{r})=>n+((r&&r.divs)||[]).filter(d=>(d.podium||[]).length).length,0);
  const MY=st.my?mine(F,st.my):null,nOn=F.filter(({b})=>b&&b.now).length,nCt=new Set((snap.courts||[]).map(c=>c.court)).size;
  const myBox=st.my?`<section class="lv-mybox"><h3><span>⭐ ${E(st.my)}</span><small>${MY.length?`지금 ${MY.filter(x=>x.k==='now').length} · 곧 ${MY.filter(x=>x.k==='next'||x.k==='soon').length} · 입상 ${MY.filter(x=>x.k==='medal').length}`:'지금·다음 부문에 이 도장 선수가 없습니다'}</small></h3>
    ${MY.length?`<ul>${MY.map(f=>`<li class="lv-f-${f.k}">${f.k==='medal'?`<span class="lv-m ${MD[f.rank]?MD[f.rank][1]:''}">${f.rank}</span>`:`<span class="lv-tag">${f.k==='now'?'지금':f.k==='next'?'곧':'예정'}</span>`}<div><b data-notr>${E(f.p.name)}</b><span class="lv-sub" data-notr>${E(f.where)} · ${E(f.div)}</span></div>${f.txt?`<em>${E(f.txt)}</em>`:''}</li>`).join('')}</ul>`:''}</section>`:'';
  return {head:`<div class="lv-top"><div class="lv-kpis"><span><b>${nCt}</b>코트</span><span><b>${nOn}</b>경기 중</span><span><b>${nRes}</b>입상 부문</span></div><div><span class="lv-live ${stale?'stale':''}"><i></i>${stale?'잠시 끊김':'LIVE'}</span> <small>${E(ago(snap.at,now))} 갱신</small></div>${snap.comp?`<h2 data-notr>${E(snap.comp)}</h2>`:''}</div>`,body:`
    ${myBox}${q?`<section class="lv-found"><h3>「${E(st.q)}」 찾은 곳 <small>${found.length}</small></h3>${found.length?`<ul>${found.map(f=>`<li class="lv-f-${f.k}">${f.k==='medal'?`<span class="lv-m ${MD[f.rank]?MD[f.rank][1]:''}">${f.rank}</span>`:`<span class="lv-tag">${f.k==='now'?'지금':'곧'}</span>`}<div><b data-notr>${mark(f.p.name,q)}</b> <small data-notr>${mark(f.p.team,q)}</small><div class="lv-sub">${E(f.where)} · <span data-notr>${E(f.div||'')}</span>${f.k==='next'?' · '+E(f.txt):f.k==='now'?' · '+E(f.txt):''}</div></div></li>`).join('')}</ul>`:'<div class="lv-empty">지금 진행·다음 순서·입상 결과에 없습니다</div>'}</section>`:''}
    <div class="lv-tabs" role="tablist">${[['courts','코트 현황'],['results',`입상 결과${nRes?` <small>${nRes}</small>`:''}`],['teams','도장 종합'],...(snap.sched?[['sched','일정표']]:[])].map(([k,l])=>`<button type="button" role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-lv="tab" data-t="${k}">${l}</button>`).join('')}</div>
    ${tab==='sched'?schedHtml(snap.sched,q):tab==='courts'?wallCourts(F,q,st)
     :tab==='results'?results(F,q)
     :T.length?`<div class="lv-teams"><table><tr><th>순위</th><th>도장</th><th>금</th><th>은</th><th>동</th><th>점수</th></tr>${T.map((t,i)=>`<tr class="${hit(q,t.team)?'hit':''}"><td>${i&&T[i-1].pt===t.pt?'':i+1}</td><td><b data-notr>${mark(t.team,q)}</b></td><td>${t.g}</td><td>${t.s}</td><td>${t.b}</td><td><b>${t.pt}</b></td></tr>`).join('')}</table><p class="lv-sub">금 3점 · 은 2점 · 동 1점으로 더한 참고 순위입니다. 공식 종합 순위는 대회 본부 발표를 따릅니다.</p></div>`:'<div class="lv-empty">아직 입상한 도장이 없습니다</div>'}`};}
const CSS=`.lv{--g1:#F3DFAE;--g2:#C9A262;--g3:#8E6A30;--bg:#0B0D12;--p1:#14171D;--p2:#1B1F27;--ln:rgba(255,255,255,.09);--tx:#F2EEE6;--mu:#A39C8E;display:flex;flex-direction:column;gap:14px;color:var(--tx);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;word-break:keep-all}
.lv small{color:var(--mu);font-weight:600}
.lv-top{display:flex;flex-direction:column;gap:4px}.lv-top h2{margin:0;font-size:clamp(20px,5vw,28px);line-height:1.25}
.lv-live{display:inline-flex;align-items:center;gap:6px;font:800 12px/1 "Archivo",sans-serif;letter-spacing:.12em;color:#FF5C6C;background:rgba(255,92,108,.12);border:1px solid rgba(255,92,108,.35);border-radius:999px;padding:5px 10px}
.lv-live i{width:8px;height:8px;border-radius:50%;background:#FF5C6C;animation:lvp 1.4s infinite}.lv-live.stale{color:#E3A64A;background:rgba(227,166,74,.12);border-color:rgba(227,166,74,.35)}.lv-live.stale i{background:#E3A64A;animation:none}
@keyframes lvp{50%{opacity:.25}}
.lv-q{display:flex;align-items:center;gap:8px;background:var(--p1);border:1px solid rgba(201,162,98,.45);border-radius:14px;padding:0 14px}.lv-q input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:inherit;font-size:16px;padding:13px 0;outline:none}
.lv mark{background:rgba(243,223,174,.85);color:#1A1306;border-radius:3px;padding:0 1px}
.lv-tabs{display:flex;gap:6px;border-bottom:1px solid var(--ln);overflow-x:auto}.lv-tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font:inherit;font-weight:800;font-size:15px;padding:10px 12px;cursor:pointer;white-space:nowrap}.lv-tabs button.on{color:var(--g1);border-bottom-color:var(--g2)}
.lv-courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lv-court{background:linear-gradient(160deg,var(--p2),var(--p1));border:1px solid var(--ln);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}.lv-court.off{opacity:.6}
.lv-court header{display:flex;align-items:center;gap:8px}.lv-court header b{font-size:18px}
.lv-c{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(180deg,#EBD5A3,#B8904E);color:#1A1306;font:900 16px/1 "Archivo",sans-serif}
.lv-app{font-size:13px;font-weight:800;color:var(--g1);border:1px solid rgba(201,162,98,.4);border-radius:999px;padding:2px 9px}

Excel unten laden und in der App über „📂 Datei wählen“ hochladen. Klassen werden automatisch erstellt."], "res1": ["In the app’s “Results · Awards” screen tap <b>🌐 Send results to entry website</b> and the medal results arrive here. Check them, then turn on “Publish to coaches” so coaches can download their athletes’ certificates.", "En «Resultados · Premios» de la app pulsa <b>🌐 Enviar resultados a la web</b> y llegarán aquí. Revísalos y activa «Publicar para entrenadores» para que descarguen los diplomas.", "在比赛应用“成绩·颁奖”中点击<b>🌐 将成绩发送到报名网站</b>，获奖成绩会进入这里。确认后开启“向教练公开”，教练即可下载自己选手的奖状。", "Trong màn «Kết quả · Trao giải» của ứng dụng, bấm <b>🌐 Gửi kết quả lên trang đăng ký</b>, kết quả sẽ về đây. Kiểm tra rồi bật «Công bố cho HLV» để HLV tải giấy khen.", "Dans « Résultats · Remises » de l’app, touchez <b>🌐 Envoyer les résultats au site</b> ; ils arrivent ici. Vérifiez puis activez « Publier aux entraîneurs » pour qu’ils téléchargent les diplômes.", "في شاشة «النتائج · الجوائز» بالتطبيق اضغط <b>🌐 إرسال النتائج إلى موقع التسجيل</b> فتصل النتائج هنا. راجعها ثم فعّل «النشر للمدربين» ليتمكنوا من تنزيل الشهادات.", "In der App unter „Ergebnisse · Siegerehrung“ <b>🌐 Ergebnisse an Anmeldeseite senden</b> tippen; die Platzierungen erscheinen hier. Prüfen und „Für Trainer veröffentlichen“ einschalten, damit Trainer die Urkunden laden."], "enter1": ["The {v1} entries already submitted are in <a href=\"#entries\">My entries</a>.", "Las {v1} inscripciones ya enviadas están en <a href=\"#entries\">Mis inscripciones</a>.", "已提交的{v1}项报名见<a href=\"#entries\">我的报名</a>。", "{v1} mục đã đăng ký nằm trong <a href=\"#entries\">Đăng ký của tôi</a>.", "Les {v1} inscriptions déjà envoyées sont dans <a href=\"#entries\">Mes inscriptions</a>.", "التسجيلات ({v1}) المرسلة موجودة في <a href=\"#entries\">تسجيلاتي</a>.", "Die {v1} bereits gesendeten Meldungen stehen unter <a href=\"#entries\">Meine Meldungen</a>."], "entries0": ["You have not entered any competition yet. Pick one under <a href=\"#home\">Competitions</a>.", "Aún no te has inscrito. Elige una en <a href=\"#home\">Competiciones</a>.", "尚未报名任何赛事，请在<a href=\"#home\">赛事日程</a>中选择。", "Chưa đăng ký giải nào. Hãy chọn trong <a href=\"#home\">Lịch thi đấu</a>.", "Aucune inscription. Choisissez une compétition dans <a href=\"#home\">Compétitions</a>.", "لم تسجل بعد. اختر بطولة من <a href=\"#home\">البطولات</a>.", "Noch keine Meldungen. Wettkampf unter <a href=\"#home\">Wettkämpfe</a> wählen."], "cefx1": ["Athlete names use the <b>English name</b> the coach entered under “My athletes”; if there is none, the Korean name is used. Division names are translated word by word where possible and otherwise stay in Korean.", "Los nombres de los deportistas usan el <b>nombre en alfabeto latino</b> que el entrenador escribió en «Mis deportistas»; si no hay, se usa el nombre coreano. Las categorías se traducen cuando se conocen las palabras; si no, quedan en coreano.", "选手姓名使用教练在“我的选手”中填写的<b>英文姓名</b>，没有则使用韩文姓名。组别名称能翻译的词会翻译，无法翻译时保留韩文。", "Tên vận động viên dùng <b>tên tiếng Anh</b> do HLV nhập ở «VĐV của tôi»; nếu không có thì dùng tên tiếng Hàn. Tên hạng mục được dịch các từ đã biết, nếu không thì giữ tiếng Hàn.", "Les noms des athlètes utilisent le <b>nom en alphabet latin</b> saisi par l’entraîneur dans « Mes athlètes » ; sinon, le nom coréen. Les catégories sont traduites mot à mot quand c’est possible, sinon elles restent en coréen.", "تُكتب أسماء اللاعبين <b>بالأحرف اللاتينية</b> كما أدخلها المدرب في «لاعبيّ»؛ وإن لم توجد يُستخدم الاسم الكوري. تُترجم أسماء الفئات حين تكون الكلمات معروفة، وإلا تبقى بالكورية.", "Athletennamen erscheinen mit dem <b>Namen in lateinischer Schrift</b>, den der Trainer unter „Meine Athleten“ eingetragen hat; sonst der koreanische Name. Kategorien werden übersetzt, soweit die Wörter bekannt sind, sonst bleiben sie koreanisch."], "live1": ["On competition day, open the field program on the <b>HQ laptop</b>, press <b>“Send to internet”</b>, log in with this admin account and press “Start sending”. Court progress and medal results then appear at this link every few seconds. On the venue Wi-Fi, spectators can also use “Open spectator screen” without internet.", "El día del torneo, en el <b>portátil de la organización</b> abre el programa de sede, pulsa <b>«Enviar a internet»</b>, inicia sesión con esta cuenta de administrador y pulsa «Empezar a enviar». El progreso de las áreas y los resultados aparecerán en este enlace cada pocos segundos. En el wifi de la sede también se puede usar «Abrir pantalla del público» sin internet.", "比赛当天，在<b>本部电脑</b>的现场程序首页点击<b>“发送到互联网”</b>，用此管理员账号登录后点击“开始发送”。各场地进度和获奖结果每隔几秒就会显示在此链接。在赛场Wi-Fi内，也可以不用互联网，通过“打开观众页面”查看。", "Ngày thi đấu, trên <b>máy tính BTC</b> mở chương trình tại chỗ, bấm <b>«Gửi lên internet»</b>, đăng nhập tài khoản quản trị này rồi bấm «Bắt đầu gửi». Tiến độ các sân và kết quả sẽ hiện ở liên kết này vài giây một lần. Trong wifi nhà thi đấu cũng có thể xem bằng «Mở màn hình khán giả» mà không cần internet.", "Le jour J, sur l’<b>ordinateur de l’organisation</b>, ouvrez le programme sur site, appuyez sur <b>« Envoyer sur internet »</b>, connectez-vous avec ce compte administrateur puis « Commencer l’envoi ». L’avancement des aires et les résultats apparaissent sur ce lien toutes les quelques secondes. Sur le wifi du site, on peut aussi utiliser « Ouvrir l’écran public » sans internet.", "في يوم البطولة، افتح برنامج الموقع على <b>حاسوب اللجنة</b>، واضغط <b>«الإرسال إلى الإنترنت»</b>، وسجّل الدخول بحساب المدير هذا ثم اضغط «بدء الإرسال». ستظهر حالة الملاعب والنتائج على هذا الرابط كل بضع ثوانٍ. وداخل شبكة Wi-Fi في مكان البطولة يمكن أيضًا استخدام «فتح شاشة الجمهور» دون إنترنت.", "Am Turniertag auf dem <b>Organisations-Laptop</b> das Vor-Ort-Programm öffnen, <b>„Ins Internet senden“</b> drücken, mit diesem Admin-Konto anmelden und „Senden starten“ drücken. Der Stand der Flächen und die Ergebnisse erscheinen dann alle paar Sekunden unter diesem Link. Im WLAN der Halle geht es auch ohne Internet über „Zuschauerbildschirm öffnen“."]};</script><script>/* ===== 홈페이지 다국어: 한국어 · English · Español · 中文 · Tiếng Việt · Français · العربية · Deutsch =====

const SL=[['ko','한국어'],['en','English'],['es','Español'],['zh','中文'],['vi','Tiếng Việt'],['fr','Français'],['ar','العربية'],['de','Deutsch']];

const HGL=/[가-힣]/,NUMRE=/\d[\d,.]*/g;
/* {s1}·{n1} 칸이 있는 문장은 정규식으로 */
const PAT=Object.keys(TRD).filter(k=>/\{[sn]\d\}/.test(k)).map(k=>{const names=[];const re=new RegExp('^'+k.replace(/[.*+?^$()|[\]\\]/g,'\\$&').replace(/\{([sn]\d)\}/g,(m,n)=>{names.push(n);return n[0]==='s'?'(.+?)':'(\\d[\\d,.]*)';})+'$');return {k,re,names};}).sort((a,b)=>b.k.length-a.k.length);
function trOne(s){const L=SLI[LANG];if(L==null)return null;let e=TRD[s];if(e&&e[L])return e[L];
  for(const p of PAT){const m=s.match(p.re);if(!m)continue;const v=TRD[p.k][L];if(!v)return null;let out=v;p.names.forEach((n,i)=>{let x=m[i+1];if(n[0]==='s'){const t=tr(x);if(t)x=t;}out=out.split('{'+n+'}').join(x);});return out;}
  return null;}
function tr(s){if(LANG==='ko'||!s||!HGL.test(s))return null;const k=s.replace(/\s+/g,' ').trim();if(!k)return null;
  const ed=k.match(/^(.*?)\s*([·:])$/);if(ed&&HGL.test(ed[1])){const x=tr(ed[1]);if(x)return x+' '+ed[2];}
  let t=trOne(k);if(t)return t;

  if(k.includes(' · ')){const parts=k.split(' · ');let any=false;const out=parts.map(p=>{const x=trOne(p)||tr2(p);if(x){any=true;return x;}return p;});if(any)return out.join(' · ');}

function trNode(n){const o=ORIG.has(n)?ORIG.get(n):n.nodeValue;if(!HGL.test(o)){return;}

const AORIG=new WeakMap();
function trAttrs(el){for(const a of ['placeholder','aria-label','title']){const v=el.getAttribute&&el.getAttribute(a);if(!v)continue;let m=AORIG.get(el);if(!m){m={};AORIG.set(el,m);}
  if(!(a in m)){if(!HGL.test(v))continue;m[a]=v;}const o=m[a];const t=LANG==='ko'?o:(tr(o)||o);if(v!==t)el.setAttribute(a,t);}}
function trHtml(el){const k=el.dataset.trh,o=el.__trhO||(el.__trhO=el.innerHTML);const d=TRH[k],L=SLI[LANG];
  let h=LANG==='ko'||!d||!d[L]?o:d[L];if(d&&d[L]&&LANG!=='ko'){Object.entries(el.dataset).forEach(([a,v])=>{if(/^v\d$/.test(a))h=h.split('{'+a+'}').join(esc(v));});}

function applyDir(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';const t=TT('KICKSTART UP 대회 접수');document.title=LANG==='ko'?'KICKSTART UP 대회 접수':t;}

    if(!t){LIVE.none=true;LIVE.snap=null;if(LIVE.v)LIVE.v.set({comp:'',courts:[]});return;}
    if(t!==LIVE.at||force){const d=await sb.from('live_view').select('data,updated_at').eq('comp_id',id);if(d.error)throw d.error;const row=d.data&&d.data[0];

function alertsFor(u){const A=[];if(!u||u.role!=='coach')return A;
  const E=D().entries.filter(e=>e.coachId===u.id&&e.status!=='cancel');
  for(const c of D().comps){if(c.hidden)continue;const [k]=compState(c);if(dday(c.date)<0)continue;const mine=E.filter(e=>e.compId===c.id),n=dday(c.deadline);
    if(k!=='closed'&&n<=7)A.push({lv:n<=2?'hot':'warn',t:`「${c.name}」 접수 마감 ${n===0?'오늘':'D-'+n} (${fmtDate(c.deadline)})`,s:mine.length?`이 대회에 ${mine.length}건 접수했습니다.`:'아직 접수하지 않았습니다.',a:`<a class="btn sm gold" href="#enter-${c.id}">${mine.length?'선수 더 접수':'접수하기'}</a>`});
    const wait=mine.filter(e=>e.status==='wait');
    if(wait.length)A.push({lv:'warn',t:`「${c.name}」 입금 확인 전 ${wait.length}건 · ${won(wait.reduce((s,e)=>s+e.fee,0))}`,s:`입금 계좌: ${c.account} · 입금자명은 「${u.org}」`,a:`<a class="btn sm" href="#entries">접수 내역</a>`});
    if(mine.length&&c.notice)A.push({lv:'info',t:`「${c.name}」 공지`,s:c.notice,a:''});
    if(mine.length&&drawsOf(c.id).length)A.push({lv:'info',t:`「${c.name}」 대진표가 올라왔습니다`,s:`${drawsOf(c.id).map(d=>SPORTS[d.sport]?SPORTS[d.sport].n:d.sport).join(' · ')} · ${fmtAt(drawLast(c.id))} 올림 · 「내 선수만」으로 우리 선수 순서를 바로 볼 수 있습니다`,a:`<a class="btn sm gold" href="#draw-${c.id}">대진표 보기</a>`});}
  return A;}
function vAlerts(){const A=alertsFor(me());if(!A.length)return '';
  return `<section class="alerts" aria-label="알림"><h2 class="small eyebrow" style="font-size:12px">알림 ${A.length}</h2>${A.map(x=>`<div class="al ${x.lv}"><div><b>${esc(x.t)}</b><div class="small mute">${esc(x.s)}</div></div>${x.a}</div>`).join('')}</section>`;}

  return `<div class="stack">

      ${drawsOf(c.id).length?`<div class="notice drn"><b>📋 대진표 · 출전 순서가 올라왔습니다</b><div>${drawsOf(c.id).map(d=>SPORTS[d.sport]?SPORTS[d.sport].n:d.sport).join(' · ')} · ${fmtAt(drawLast(c.id))} 올림</div><a class="btn gold sm" href="#draw-${c.id}" style="margin-top:8px;align-self:flex-start">대진표 보기</a></div>`:''}

        <div class="row" style="gap:6px;align-items:flex-end"><label class="f" style="flex:1;min-width:110px"><span>이름</span><input type="text" id="tmName"></label>

    }else
    h=`<div class="grid2"><label class="f"><span>구분</span>${sel('eType',['공인','자유'],f.type,'data-on="ef" data-k="type"')}</label>
      <label class="f"><span>종목</span>${sel('eKind',['개인','복식','단체'],f.kind,'data-on="ef" data-k="kind"')}</label>
      <label class="f"><span>부별</span>${sel('eDiv',PS_DIV,f.div,'data-on="ef" data-k="div"')}</label>

      ${/^실버/.test(f.div||'')?`<span class="small mute">실버 1: 55~64세 (1962~1971년생) · 실버 2: 65세 이상 (1961년 이전 출생) · 통합: 55세 이상 모두 (생활체육 대회는 실버부를 통합으로 묶습니다)</span>`:''}${f.div==='유치부'?`<span class="small mute">생활체육 대회 부별: 3~5세 → 유치부 1부 · 6~7세 → 유치부 2부${f.grade?` (지금: ${/^[3-5]/.test(f.grade)?'유치부 1부':'유치부 2부'})`:''}</span>`:''}

      <label class="f"><span>성별 (선수 정보)</span><input type="text" value="${esc(a.gender)}자부" disabled></label></div>

  }else{
    const ev=GP_EV.find(x=>x.n===f.ev)||GP_EV[3];const lv=ev.k==='power'||ev.k==='team'?['대학부',...GP_LV]:GP_LV;

function vEnter(id){const c=D().comps.find(x=>x.id===id);if(!c)return '<div class="empty">대회를 찾지 못했습니다.</div>';
  if(compState(c)[0]==='closed'||c.hidden)return `<div class="empty">접수가 끝난 대회입니다. <a href="#home">대회 일정</a></div>`;
  if(!offers(c,UI.tab))UI.tab=tabsOf(c)[0];
  const u=me(),L=myAth(),sport=UI.tab,LF=lvFilter(L,sport);
  const mine=D().entries.filter(e=>e.compId===c.id&&e.coachId===u.id&&e.status!=='cancel');
  const cart=(UI.cart||[]).filter(e=>e.compId===c.id);
  const inSport=new Set([...mine,...cart].filter(e=>tabOfEntry(e)===sport).flatMap(e=>e.athleteIds));
  const total=cart.reduce((s,e)=>s+e.fee,0);
  return `<div class="stack">
    <div><span class="eyebrow">Entry</span><h1>${esc(c.name)}</h1><p class="mute" style="margin:6px 0 0">${fmtDate(c.date)} · ${esc(c.place)} · 마감 ${fmtDate(c.deadline)}</p></div>

    <div class="desk"><div class="stack">
      <div class="tabs">${tabsOf(c).map(s=>`<button type="button" class="${s===sport?'on':''}" data-a="tab" data-s="${s}">${TABS[s].n}</button>`).join('')}</div>
      <p class="small mute" style="margin:0">${TABS[sport].type?`팀 대표 선수 한 명을 누르고, 팀 이름과 팀원을 고르세요. ${sport==='gym'?'태권체조는 7명 이상':`팀 대항 종합경연은 9명 이상${teamW(c,TEAM_T['팀대항 종합경연'])?'(여자 1명 이상)':''}`}, 한 팀 30명까지입니다. 「내 선수」에 없는 팀원은 접수 칸에서 바로 등록할 수 있습니다.`:`선수를 누르면 ${TABS[sport].n} 접수 칸이 열립니다. 부별·학년은 생년월일로 미리 맞춰 두었으니 확인만 해 주세요.`}</p>

      ${L.length?LF.list.map(a=>{const done=inSport.has(a.id);return `<div class="ath ${UI.pick===a.id?'picked':''}"><div><span class="nm">${esc(a.name)}</span> <span class="small mute">${a.gender} · ${schoolTxt(a.birth)}${a.weight?' · '+a.weight+'kg':''}</span></div>
        ${done?'<span class="chip open">접수함</span>':`<button class="btn sm ${UI.pick===a.id?'':'gold'}" type="button" data-a="pick" data-id="${a.id}">${UI.pick===a.id?'작성 중':TABS[sport].type?'이 선수로 팀 만들기':'접수'}</button>`}</div>
        ${UI.pick===a.id?entryForm(c,sport,a):''}`;}).join(''):'<div class="empty">먼저 「내 선수」에서 선수를 등록해 주세요. <a href="#athletes">선수 등록하러 가기</a></div>'}

      ${cart.length?cart.map((e,i)=>{const l=entryLabel(e),T=TABS[tabOfEntry(e)];return `<div class="line"><div><span class="chip ${T.c}">${T.n}</span> <b>${esc(l.who)}</b><div class="small mute">${esc(l.what)}</div>${needMusic(e)&&M.musicOk?`<label class="btn sm ${e.music?'ghost':''} musup" style="margin-top:6px">🎵 ${e.music?esc(e.music.name.length>18?e.music.name.slice(0,16)+'…':e.music.name)+' · '+mb(e.music.size):'음원 첨부 (나중에 내도 됨)'}<input type="file" accept="${MUSIC_ACCEPT}" data-cartmus="${i}" hidden></label>`:''}</div>
        <div style="text-align:right"><span class="num">${won(e.fee)}</span><br><button class="btn sm ghost" type="button" data-a="cartDel" data-i="${i}">빼기</button></div></div>`;}).join(''):'<span class="small mute">아직 넣은 선수가 없습니다.</span>'}

      <div class="sum"><span class="mute">참가비 합계</span><b>${won(total)}</b></div>
      <div class="acct small"><b>입금 계좌</b><br>${esc(c.account)}<br><span class="mute">입금자명은 「소속명」으로 해 주세요. 대회 본부가 입금을 확인하면 접수 내역에 「입금 확인」이 표시됩니다.</span></div>
      ${(()=>{const W=cart.map(x=>ageWarn(x)).filter(Boolean);return W.length?`<div class="agebox"><b>⚠ 생년월일과 학년이 다릅니다 · 한 번 더 확인해 주세요</b><ul>${W.map(w=>`<li>${esc(w)}</li>`).join('')}</ul><label class="check"><input type="checkbox" id="ageOkAll"><span>위 선수의 학년이 맞는 것을 확인했습니다 (조기 입학 등)</span></label><span class="small mute">학년이 틀렸으면 장바구니에서 빼고 학년을 고쳐 다시 담아 주세요. 체크하고 접수하면 대회 본부가 한 번 더 확인합니다.</span></div>`:'';})()}
      <button class="btn gold" type="button" data-a="submit" data-c="${c.id}" ${cart.length?'':'disabled'}>${cart.length}건 접수하기</button>
      ${mine.length?`<span class="small mute" data-trh="enter1" data-v1="${mine.length}">이 대회에 이미 접수한 ${mine.length}건은 <a href="#entries">내 접수 내역</a>에 있습니다.</span>`:''}
    </aside></div></div>`;}

/* ---- 저장: Supabase quote_store (대표만) · 표가 없으면 이 컴퓨터 브라우저에 ---- */
const QT_LS='ks_quote_store';
function qtLsAll(){try{return JSON.parse(localStorage.getItem(QT_LS)||'{}')||{};}catch(e){return {};}}
async function qtLoad(){if(QT.loading)return;QT.loading=true;let rows=null;
  try{rows=await qAll(()=>sb.from('quote_store').select('*').order('key',{ascending:true}));QT.ok=true;}catch(e){QT.ok=false;QT.err=msgOf(e);}
  const all={};if(rows)rows.forEach(r=>all[r.key]=r.value);else Object.assign(all,qtLsAll());
  QT.prices=all.prices&&all.prices.length?all.prices:qtClone(QT_PRICES0);
  QT.co={...QT_CO0,...(all.company||{})};
  QT.quotes=Object.keys(all).filter(k=>k.startsWith('q:')).map(k=>all[k]).filter(Boolean).sort((a,b)=>String(b.no).localeCompare(String(a.no)));
  QT.loaded=true;QT.loading=false;qtRefresh();}
const QT_PEND={};
function qtSave(key,val){QT_PEND[key]=val;clearTimeout(qtSave.t);QT.saving='저장 중…';qtStat();qtSave.t=setTimeout(qtFlush,700);}
async function qtFlush(){const P={...QT_PEND};Object.keys(QT_PEND).forEach(k=>delete QT_PEND[k]);
  try{if(QT.ok){for(const k of Object.keys(P)){const v=P[k];const r=v===null?await sb.from('quote_store').delete().eq('key',k):await sb.from('quote_store').upsert({key:k,value:v,updated_at:new Date().toISOString()});if(r.error)throw r.error;}}
    else{const all=qtLsAll();Object.keys(P).forEach(k=>{if(P[k]===null)delete all[k];else all[k]=P[k];});localStorage.setItem(QT_LS,JSON.stringify(all));}
    QT.saving='저장됨';}catch(e){QT.saving='저장하지 못했습니다: '+msgOf(e);Object.assign(QT_PEND,P);}
  qtStat();}
function qtStat(){const el=document.getElementById('qtSave');if(el)el.textContent=QT.saving;}

/* ---- 계산 ---- */
function qtAuto(q,l){const nd=Math.max(0,(q.disc||[]).length),d=Math.max(1,qtNum(q.days)||1),c=Math.max(1,qtNum(q.courts)||1);
  if(!l.auto)return;
  if(l.unit==='evday'){l.qty=nd;l.days=d;}else if(l.unit==='courtday'){l.qty=c;l.days=d;}else if(l.unit==='day'){l.qty=1;l.days=d;}
  else if(l.unit==='perday'){l.qty=l.qty||1;l.days=d;}else if(l.unit==='once'){l.qty=1;l.days=1;}else{l.qty=l.qty||1;l.days=1;}}
const qtGross=l=>qtNum(l.price)*qtNum(l.qty)*qtNum(l.days);
const qtAmt=l=>Math.max(0,qtGross(l)-qtNum(l.disc));
function qtTot(q){const L=(q.lines||[]).filter(l=>l.on!==false);const gross=L.reduce((s,l)=>s+qtGross(l),0),ld=L.reduce((s,l)=>s+Math.min(qtGross(l),qtNum(l.disc)),0),ex=qtNum(q.extraDisc);
  const net=Math.max(0,gross-ld-ex),vat=q.vat==='excl'?Math.round(net*0.1):0;return {L,gross,disc:ld+ex,ld,ex,net,vat,total:net+vat};}
function qtLineOf(p,q){const l={key:p.id,ko:p.ko,en:p.en,desc:p.desc||'',descEn:p.descEn||'',price:qtNum(p.price),unit:p.unit||'once',qty:1,days:1,disc:0,note:'',on:true,auto:true};qtAuto(q,l);return l;}
function qtRecalc(q){(q.lines||[]).forEach(l=>qtAuto(q,l));}
function qtNew(){const co=QT.co,d=qtToday(),pre=(co.prefix||'KS').replace(/[^\w-]/g,'')||'KS',k=`${pre}-${d.replace(/-/g,'')}-`;
  const n=QT.quotes.filter(x=>String(x.no||'').startsWith(k)).length+1;
  const q={id:'q'+Date.now().toString(36),no:k+String(n).padStart(2,'0'),status:'draft',date:d,valid:co.valid||30,to:'',attn:'',event:'',venue:'',start:'',days:1,courts:3,disc:['poomsae','gyeokpa'],vat:'incl',lang:'both',extraDisc:0,terms:co.terms||'',termsEn:co.termsEn||'',memo:'',lines:[]};
  q.lines=QT.prices.filter(p=>p.on).map(p=>qtLineOf(p,q));return q;}

/* ---- 숫자 → 한글·영어 금액 ---- */
function qtHangul(n){n=Math.round(n);if(!n)return '영';const D='영일이삼사오육칠팔구',U=['','십','백','천'],B=['','만','억','조'];let s='',i=0;
  while(n>0){const g=n%10000;n=Math.floor(n/10000);if(g){const ds=String(g).padStart(4,'0');let t='';for(let k=0;k<4;k++){const v=+ds[k];if(v)t+=D[v]+U[3-k];}s=t+B[i]+s;}i++;}return s;}
function qtEnglish(n){n=Math.round(n);if(!n)return 'zero';const o=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const h=x=>{let s='';if(x>=100){s=o[Math.floor(x/100)]+' hundred';x%=100;if(x)s+=' ';}if(x>=20){s+=t[Math.floor(x/10)];if(x%10)s+='-'+o[x%10];}else if(x)s+=o[x];return s;};
  const S=[[1e9,'billion'],[1e6,'million'],[1e3,'thousand']];let s='';for(const [v,w] of S){if(n>=v){s+=h(Math.floor(n/v))+' '+w+' ';n%=v;}}if(n)s+=h(n);s=s.trim();return s.charAt(0).toUpperCase()+s.slice(1);}

  x.fillStyle=x.strokeStyle=R;x.translate(S/2,S/2);
  const ring=(r,w)=>{x.lineWidth=w;x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.stroke();};
  const arc=(t,r,font,bottom,sp)=>{x.font=font;x.textAlign='center';x.textBaseline='middle';const ch=[...t],w=ch.map(c=>x.measureText(c).width+sp);let a=-(w.reduce((p,v)=>p+v,0)-sp)/r/2;
    ch.forEach((c,i)=>{const m=a+(w[i]-sp)/2/r;x.save();x.rotate(bottom?-m:m);x.translate(0,bottom?r:-r);x.fillText(c,0,0);x.restore();a+=w[i]/r;});};
  const star=(cx,cy,r)=>{x.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.42:r,an=-Math.PI/2+i*Math.PI/5;x.lineTo(cx+rr*Math.cos(an),cy+rr*Math.sin(an));}x.closePath();x.fill();};

    x.font=`900 104px ${SER}`;const G=[['킥',104,-148],['스',104,-40],['타',104,68],['트',-104,-148],['업',-104,-40],['인',-104,68]];

  /* 도장 잉크 느낌: 작은 빈 점 · 가장자리 거칠게 */
  const rnd=qtRng(kind.length*7919+13);x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='destination-out';

  return QT.seals[kind]=cv.toDataURL('image/png');}

function qtPages(q,co){const B=qtBlocks(q,co),M=document.createElement('div');M.style.cssText='position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;z-index:-9';document.body.appendChild(M);

function loadH2C(){if(window.html2canvas)return Promise.resolve(window.html2canvas);return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=()=>res(window.html2canvas);s.onerror=()=>rej(new Error('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요'));document.head.appendChild(s);});}
async function qtPdf(){const q=QT.cur;if(!q)return;toast('견적서 PDF를 만드는 중…');const co=QT.co;

  await qtLogoPng();const [lib,h2c]=await Promise.all([loadJsPDF(),loadH2C()]);try{await document.fonts.ready;}catch(e){}
  const W=document.createElement('div');W.style.cssText='position:fixed;left:0;top:0;z-index:-50;pointer-events:none';W.setAttribute('data-notr','');W.innerHTML=qtPages(q,co).join('');document.body.appendChild(W);

  finally{W.remove();}}
async function qtPrint(){const q=QT.cur;if(!q)return;const co=QT.co;await qtLogoPng();if(co.seal&&!['none','custom'].includes(co.seal))await qtSealUrl(co.seal);

const qtSaveQ=()=>{const q=QT.cur;if(!q)return;const i=QT.quotes.findIndex(x=>x.id===q.id);if(i<0)QT.quotes.unshift(q);qtSave('q:'+q.id,q);};
function qtLive(){const q=QT.cur;if(!q)return;const T=qtTot(q);q.lines.forEach((l,i)=>{const el=document.querySelector(`[data-qa="${i}"]`);if(el)el.textContent=won(qtAmt(l));
    ['qty','days'].forEach(f=>{const inp=document.querySelector(`[data-ql="${i}:${f}"]`);if(inp&&document.activeElement!==inp)inp.value=qtNum(l[f]);});});

document.addEventListener('input',e=>{const t=e.target;if(!t||!t.closest||!t.closest('#qt'))return;const d=t.dataset;
  if(d.qf!=null&&QT.cur){const f=d.qf,q=QT.cur;q[f]=['days','courts','valid','extraDisc'].includes(f)?qtNum(t.value):t.value;if(['days','courts'].includes(f))qtRecalc(q);if(f==='lang'){qtRefresh();qtSaveQ();return;}qtLive();}
  else if(d.ql!=null&&QT.cur){const [i,f]=d.ql.split(':'),l=QT.cur.lines[+i];if(!l)return;if(f==='on'){l.on=t.checked;t.closest('.qt-line').classList.toggle('off',!t.checked);}
    else if(['price','qty','days','disc'].includes(f)){l[f]=qtNum(t.value);if(f==='qty'||f==='days')l.auto=false;}else l[f]=t.value;qtLive();}
  else if(d.qp!=null){const [i,f]=d.qp.split(':'),p=QT.prices[+i];if(!p)return;p[f]=f==='on'?t.checked:f==='price'?qtNum(t.value):t.value;qtSave('prices',QT.prices);}
  else if(d.qc!=null){QT.co[d.qc]=d.qc==='valid'?qtNum(t.value):t.value;qtSave('company',QT.co);}});
document.addEventListener('change',e=>{const t=e.target;if(!t||!t.closest||!t.closest('#qt'))return;const d=t.dataset;
  if(d.qd!=null&&QT.cur){const q=QT.cur;q.disc=QT_DISC.map(x=>x[0]).filter(k=>k===d.qd?t.checked:(q.disc||[]).includes(k));t.closest('label').classList.toggle('on',t.checked);qtRecalc(q);qtLive();}
  else if(d.qs!=null){const q=QT.quotes.find(x=>x.id===d.qs);if(q){q.status=t.value;qtSave('q:'+q.id,q);}}
  else if(d.qf==='vat'||d.qf==='lang'){QT.cur[d.qf]=t.value;qtSaveQ();if(d.qf==='lang')qtRefresh();else qtLive();}
  else if(d.qp!=null&&d.qp.endsWith(':unit')){qtSave('prices',QT.prices);}
  else if(d.qsimg!=null){const F=t.files&&t.files[0];if(F)qtSealPhoto(F);t.value='';}});
async function qtSealPhoto(F){try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('사진을 읽지 못했습니다'));i.src=URL.createObjectURL(F);});
  const z=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*z);c.height=Math.round(im.height*z);const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
  const D=x.getImageData(0,0,c.width,c.height),p=D.data;for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2],red=r-(g+b)/2;const a=Math.max(0,Math.min(255,(red-25)*3.2));p[i]=192;p[i+1]=38;p[i+2]=45;p[i+3]=a;}x.putImageData(D,0,0);
  QT.co.sealImg=c.toDataURL('image/png');QT.co.seal='custom';qtSave('company',QT.co);qtRefresh();toast('도장 사진을 넣었습니다');}catch(err){toast(msgOf(err));}}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-q]');if(!b||!b.closest('#qt'))return;if(e.target.closest('input[type=file]')||e.target.closest('label.btn'))return;const a=b.dataset.q,q=QT.cur;
  if(a!=='del')QT.armDel=null;if(a!=='pdel')QT.armP=null;if(a!=='preset')QT.armPreset=false;
  if(a==='view'){QT.view=b.dataset.v;qtRefresh();}
  else if(a==='new'){QT.cur=qtNew();QT.view='edit';qtSaveQ();qtRefresh();}
  else if(a==='open'){QT.cur=QT.quotes.find(x=>x.id===b.dataset.id)||null;QT.view=QT.cur?'edit':'list';qtRefresh();}
  else if(a==='dup'){const s=QT.quotes.find(x=>x.id===b.dataset.id);if(!s)return;const n=qtNew();QT.cur={...qtClone(s),id:n.id,no:n.no,date:n.date,status:'draft'};QT.view='edit';qtSaveQ();qtRefresh();toast('복사한 새 견적서입니다');}
  else if(a==='del'){const id=b.dataset.id;if(QT.armDel!==id){QT.armDel=id;qtRefresh();return;}QT.armDel=null;QT.quotes=QT.quotes.filter(x=>x.id!==id);if(QT.cur&&QT.cur.id===id)QT.cur=null;qtSave('q:'+id,null);qtRefresh();toast('견적서를 지웠습니다');}
  else if(a==='pdf')run(qtPdf);
  else if(a==='print')run(qtPrint);
  else if(a==='ldel'&&q){q.lines.splice(+b.dataset.i,1);qtSaveQ();qtRefresh();}
  else if(a==='lup'&&q){const i=+b.dataset.i;if(i>0){[q.lines[i-1],q.lines[i]]=[q.lines[i],q.lines[i-1]];qtSaveQ();qtRefresh();}}
  else if(a==='lauto'&&q){const l=q.lines[+b.dataset.i];if(l){l.auto=true;qtAuto(q,l);qtSaveQ();qtRefresh();}}
  else if(a==='ladd'&&q){const s=document.getElementById('qtAddSel'),p=s&&QT.prices.find(x=>x.id===s.value);if(p){q.lines.push(qtLineOf(p,q));qtSaveQ();qtRefresh();}}
  else if(a==='lblank'&&q){q.lines.push({key:'x'+Date.now().toString(36),ko:'',en:'',desc:'',descEn:'',price:0,unit:'ea',qty:1,days:1,disc:0,note:'',on:true,auto:false});qtSaveQ();qtRefresh();}
  else if(a==='padd'){QT.prices.push({id:'p'+Date.now().toString(36),ko:'새 항목',en:'',desc:'',descEn:'',price:0,unit:'once',on:false});qtSave('prices',QT.prices);qtRefresh();}
  else if(a==='pdel'){const i=+b.dataset.i;if(QT.armP!==i){QT.armP=i;qtRefresh();return;}QT.armP=null;QT.prices.splice(i,1);qtSave('prices',QT.prices);qtRefresh();}
  else if(a==='pup'){const i=+b.dataset.i,P=QT.prices;if(i>0){[P[i-1],P[i]]=[P[i],P[i-1]];qtSave('prices',P);qtRefresh();}}
  else if(a==='preset'){if(!QT.armPreset){QT.armPreset=true;qtRefresh();return;}QT.armPreset=false;QT.prices=qtClone(QT_PRICES0);qtSave('prices',QT.prices);qtRefresh();toast('처음 단가로 되돌렸습니다');}
  else if(a==='seal'){const k=b.dataset.k;if(k==='custom'&&!QT.co.sealImg){toast('「사진 올리기」로 도장 사진을 먼저 넣어 주세요');return;}QT.co.seal=k;qtSave('company',QT.co);qtRefresh();}});

/* 둘로 잘못 나뉜 부문을 관리자가 골라 하나로 — 맨 앞 부문 이름으로 합치고 그 부문만 다시 추첨 */
function hdPick(sp,id){HD.pick=HD.pick||[];if(HD.pick.length&&HD.pick[0].sp!==sp)HD.pick=[];const i=HD.pick.findIndex(x=>x.id===id);if(i>=0)HD.pick.splice(i,1);else HD.pick.push({sp,id});}

    G[x.gi].parts[x.pi][x.k]=y.u;G[y.gi].parts[y.pi][y.k]=x.u;[x.gi,y.gi].forEach(i=>G[i].edited=true);R[sp]=hdTidy(G);HD.pick=[];return toast(`「${x.u.name}」과 「${y.u.name}」의 자리를 바꿨습니다`);}
  const take=()=>P.map(p=>{const f=hdFind(G,p.id);if(!f)return null;G[f.gi].parts[f.pi].splice(f.k,1);G[f.gi].edited=true;return f.u;}).filter(Boolean);
  if(a==='hdNewJo'){const f=hdFind(G,P[0].id);if(!f)return;const g=G[f.gi],us=take();g.parts.splice(f.pi+1,0,us);R[sp]=hdTidy(G);HD.pick=[];return toast(`고른 ${us.length}${u}을 「${g.name}」의 새 조로 묶었습니다`);}

function vAdminResults(c){const L=resultsOf(c),coaches=D().users.filter(x=>x.role==='coach');const cf={host:'',title:'',rep:'',date:'',serial:'',...c.cert};

    const {data,error}=await sb.auth.signUp({email:v('sEmail').trim(),password:v('sPw'),options:{data:{name:v('sName').trim(),org:v('sOrg').trim(),phone:v('sPhone').trim(),license:v('sLic').trim(),country:v('sNat')||'KOR'},emailRedirectTo:location.origin+location.pathname}});
    if(error){formErr(f,msgOf(error));return;}
    if(!data.session){f.innerHTML=`<span class="eyebrow">Check your email</span><h2>가입 확인 메일을 보냈습니다</h2><p class="mute">${esc(v('sEmail'))} 메일함에서 「Confirm your signup」 메일의 링크를 누르면 가입이 끝납니다. 그다음 로그인해 주세요.</p><a class="btn gold" href="#login">로그인 화면으로</a>`;return;}
    await reload();go('athletes');toast('가입했습니다. 이제 선수를 등록해 주세요');});
  else if(f.id==='fAth'){const birth=v('aBirth'),ag=age(birth),guard=document.getElementById('aGuardOk');
    if(ag!==null&&ag<14&&!(guard&&guard.checked)){formErr(f,'만 14세 미만 선수는 보호자 동의를 확인해 주세요');return;}
    const data={name:v('aName').trim(),gender:v('aGender'),birth:birth||null,org:v('aOrg').trim()||me().org,weight:Number(v('aWeight'))||null,height:Number(v('aHeight'))||null,guardian:!!(guard&&guard.checked&&ag<14)};if(M.hasNat){data.country=v('aNat')||me().country||'KOR';data.name_en=v('aNameEn').trim();}
    run(async()=>{if(UI.editAth){await q(sb.from('athletes').update(data).eq('id',UI.editAth));toast('선수 정보를 고쳤습니다');}
      else{await q(sb.from('athletes').insert(data));toast(`${data.name} 선수를 등록했습니다`);}
      UI.editAth=null;UI.err='';await reload();});}
  else if(f.id==='fNotice'){const title=v('nTitle').trim();if(!title){formErr(f,'제목을 적어 주세요');return;}const link=v('nLink').trim();if(link&&!/^https?:\/\//i.test(link)){formErr(f,'링크는 https:// 로 시작하는 주소로 넣어 주세요');return;}
    run(async()=>{await q(sb.from('site_notices').insert({title,body:v('nBody').trim(),link,pinned:document.getElementById('nPin').checked}));await reload();toast('공지를 올렸습니다');});}
  else if(f.id==='fPopup'){const on=document.getElementById('pOn').checked,title=v('pTitle').trim(),link=v('pLink').trim();if(on&&!title){formErr(f,'팝업 제목을 적어 주세요');return;}
    if(link&&!/^(https?:\/\/|#)/i.test(link)){formErr(f,'단추 링크는 https:// 또는 # 으로 시작해야 합니다');return;}
    const value={on,title,body:v('pBody').trim(),link,linkText:v('pLinkText').trim(),until:v('pUntil')||'',v:Date.now()};
    run(async()=>{await q(sb.from('site_config').upsert({key:'popup',value,updated_at:new Date().toISOString()},{onConflict:'key'}));await reload();toast(on?'팝업을 켰습니다. 첫 화면에 뜹니다':'팝업을 껐습니다');});}
  else if(f.id==='fComp'){const sports=Object.keys(SPORTS).filter(k=>document.getElementById('cS_'+k).checked),editId=f.dataset.id;
    if(!sports.length){formErr(f,'종목을 하나 이상 골라 주세요');return;}
    if(v('cDead')>v('cDate')){formErr(f,'접수 마감일은 대회일보다 앞이어야 합니다');return;}
    const old=editId?D().comps.find(x=>x.id===editId):null,link=v('cDocUrl').trim(),file=(document.getElementById('cDoc')||{}).files,del=document.getElementById('cDocDel');
    if(link&&!/^https?:\/\//i.test(link)){formErr(f,'요강 링크는 https:// 로 시작하는 주소로 넣어 주세요');return;}
    if(file&&file[0]&&file[0].size>20*1024*1024){formErr(f,'요강 파일은 20MB까지 올릴 수 있습니다');return;}
    const c={name:v('cName').trim(),place:v('cPlace').trim(),date:v('cDate'),deadline:v('cDead'),sports,fee:{...Object.fromEntries(sports.map(k=>[k,Number(v('cF_'+k))||0])),gym:!!(document.getElementById('cO_gym')||{}).checked,team100:!!(document.getElementById('cO_team100')||{}).checked,cls:!!(document.getElementById('cO_cls')||{}).checked,teamW:!!(document.getElementById('cO_teamW')||{}).checked,ctype:((document.querySelector('input[name=cType]:checked')||{}).value==='kta'?'kta':'comm')},account:v('cAcct').trim()||'입금 계좌를 적어 주세요',note:v('cNote').trim(),notice:v('cNotice').trim(),contact:v('cContact').trim()};
    c.host=(document.getElementById('cHost')?v('cHost').trim():'')||(editId?((D().comps.find(x=>x.id===editId)||{}).host||''):'KICKSTART UP');
    if(M.musicOk&&document.getElementById('cMusDue')){const md=v('cMusDue');if(md&&md>v('cDate')){formErr(f,'음원 제출 마감일은 대회일보다 앞이어야 합니다');return;}c.music_due=md||null;}
    run(async()=>{let doc=null;
      if(file&&file[0]){const F=file[0],ext=(F.name.match(/\.[A-Za-z0-9]{1,5}$/)||['.pdf'])[0].toLowerCase(),path=`${editId||'new'}/${Date.now()}${ext}`;
        const {error}=await sb.storage.from('comp-docs').upload(path,F,{upsert:true,contentType:F.type||undefined});if(error){formErr(f,msgOf(error));return;}
        doc={doc_url:sb.storage.from('comp-docs').getPublicUrl(path).data.publicUrl,doc_name:F.name};}
      else if(link)doc={doc_url:link,doc_name:old&&old.docUrl===link?old.docName:'링크'};
      else if(del&&del.checked)doc={doc_url:'',doc_name:''};
      Object.assign(c,doc||{});
      if(editId){await q(sb.from('comps').update(c).eq('id',editId));UI.err='';await reload();toast('대회 정보를 고쳤습니다');}
      else{const r=await q(sb.from('comps').insert(c).select());UI.newComp=false;UI.adminComp=r&&r[0]&&r[0].id;UI.err='';await reload();toast('대회를 만들었습니다. 「대회 일정」에 바로 보입니다');}});}
  else if(f.id==='fLicEdit'){const code=f.dataset.c,l=M.licenses.find(x=>x.code===code);if(!l)return;
    const kind=v('leKind'),starts=v('leStarts');let ends=v('leEnds');if(kind==='life')ends='9999-12-31';
    if(!starts||!ends){formErr(f,'기간을 정해 주세요');return;}if(ends<starts){formErr(f,'끝나는 날이 시작하는 날보다 앞입니다');return;}
    const row={kind,holder:v('leHolder').trim(),contact:v('leContact').trim(),starts,ends,note:v('leNote').trim()};
    if(l.mode!=null){row.app=v('leApp')||'all';row.mode=v('leMode')||'file';row.grace_days=Math.max(0,parseInt(v('leGrace'),10)||0);}
    if(M.ledgerOk&&document.getElementById('lePrice'))row.price=Math.max(0,Number(v('lePrice'))||0);
    run(async()=>{await q(sb.from('licenses').update(row).eq('code',code));UI.licEdit=null;UI.err='';await reload();toast('허가 내용을 고쳤습니다');});}
  else if(f.id==='fLedger'){const kind=(UI.acForm||{}).kind||'out',amt=Number(v('acAmt')),F=(document.getElementById('acRcpt')||{}).files;
    UI.acForm={kind};if(!(amt>0)){formErr(f,'금액을 적어 주세요');return;}if(!v('acDay')){formErr(f,'날짜를 골라 주세요');return;}
    if(F&&F[0]&&F[0].size>10*1024*1024){formErr(f,'영수증은 10MB까지 올릴 수 있습니다');return;}
    run(async()=>{let rc='',rn='';if(F&&F[0]){const ext=(F[0].name.match(/\.[A-Za-z0-9]{2,5}$/)||['.jpg'])[0].toLowerCase();rc=`${v('acDay').slice(0,7)}/${Date.now()}${ext}`;rn=F[0].name;
        const {error}=await sb.storage.from('receipts').upload(rc,F[0],{contentType:F[0].type||undefined});if(error){formErr(f,'영수증을 올리지 못했습니다: '+msgOf(error));return;}}
      await q(sb.from('ledger').insert({kind,category:v('acCat'),amount:amt,day:v('acDay'),comp_id:v('acCompF')||null,memo:v('acMemo').trim(),receipt:rc,receipt_name:rn}));
      UI.err='';await reload();toast(`${kind==='out'?'지출':'수입'} ${won(amt)}을 적었습니다`);});}
  else if(f.id==='fLic'){const fm=UI.licForm||{kind:'event'},holder=v('lcHolder').trim(),starts=v('lcStarts'),ends=v('lcEnds');
    if(!holder){formErr(f,'받는 곳을 적어 주세요');return;}if(!starts||!ends){formErr(f,fm.kind==='event'?'대회 날짜를 골라 주세요':'기간을 정해 주세요');return;}if(ends<starts){formErr(f,'끝나는 날이 시작하는 날보다 앞입니다');return;}
    const row={code:newCode(),kind:fm.kind||'event',holder,contact:v('lcContact').trim(),starts,ends,note:v('lcNote').trim()};
    if(M.plans!==null){row.app=v('lcApp')||'all';row.mode=v('lcMode')||'file';row.grace_days=Math.max(0,parseInt(v('lcGrace'),10)||0);}
    if(M.ledgerOk&&Number(v('lcPrice'))>0)row.price=Number(v('lcPrice'));
    run(async()=>{await q(sb.from('licenses').insert(row));UI.licForm=null;UI.licNew=row.code;UI.err='';await reload();toast('허가 코드를 만들었습니다');});}
  else if(f.id==='fCert'){const c=D().comps.find(x=>x.id===UI.adminComp);if(!c)return;
    const cert=certForm(c);
    if(cert.style==='photo'&&!cert.bg){formErr(f,'배경 사진을 먼저 골라 주세요');return;}
    run(async()=>{await q(sb.from('comps').update({cert}).eq('id',c.id));UI.certBg=undefined;await reload();toast('상장 설정을 저장했습니다');});}
  else if(f.id==='fMe'){const d={name:v('mName').trim(),org:v('mOrg').trim(),phone:v('mPhone').trim(),license:v('mLic').trim()};if(M.hasNat&&v('mNat'))d.country=v('mNat');
    if(!d.name||!d.org||!d.phone){formErr(f,'이름·소속·휴대폰을 모두 적어 주세요');return;}
    run(async()=>{await q(sb.from('profiles').update(d).eq('id',me().id));await reload();toast('내 정보를 저장했습니다');});}
  else if(f.id==='fPw'||f.id==='fPwReset'){const p1=v('pw1'),p2=v('pw2');
    if(p1.length<6){formErr(f,'비밀번호는 6자 이상으로 해 주세요');return;}if(p1!==p2){formErr(f,'두 비밀번호가 서로 다릅니다');return;}
    run(async()=>{const {error}=await sb.auth.updateUser({password:p1});if(error){formErr(f,msgOf(error));return;}
      f.reset();UI.recovery=false;toast('비밀번호를 바꿨습니다. 다음부터 새 비밀번호로 로그인하세요');if(f.id==='fPwReset')go('home');});}
  else if(f.id==='fForgot'){const em=v('fgEmail').trim();
    run(async()=>{const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(error){formErr(f,msgOf(error));return;}
      f.innerHTML=`<b>${esc(em)}</b><span class="mute small">로 비밀번호 재설정 메일을 보냈습니다. 메일의 링크를 누르면 새 비밀번호를 정하는 화면이 열립니다. 메일이 오지 않으면 대회 본부에 임시 비밀번호를 요청해 주세요.</span>`;});}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.contact){UI.contact=null;render();}});
applyDir();render();trTree(document.body);reload();
</script>
</body>
</html>
