<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KICKSTART UP 대회 접수</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Serif+KR:wght@500;600;700;900&family=Nanum+Brush+Script&family=Cinzel:wght@600;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="supabase.js"></script>
<script>/*@@LV*/
/* KICKSTART UP 관람객용 실시간 결과 화면 (현장 와이파이 /view · 접수 홈페이지 #live 공통)
   LV.html(snap, st) → 화면 글.  snap = {v,at,comp,courts:[{court,online,apps:[{app,appName,board,results}]}]} */
(function(){
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const APPN={poomsae:'품새',kyorugi:'겨루기',gyeokpa:'격파',hero:'태권 히어로'};
const MD={1:['금','g'],2:['은','s'],3:['동','b']};
function ago(at,now){if(!at)return '';const s=Math.max(0,Math.round(((now||Date.now())-at)/1000));if(s<10)return '방금';if(s<60)return s+'초 전';if(s<3600)return Math.floor(s/60)+'분 전';return Math.floor(s/3600)+'시간 전';}
function hit(q,...v){if(!q)return false;const t=v.join(' ').toLowerCase().replace(/\s+/g,'');return t.includes(q);}
function mark(s,q){s=String(s||'');if(!q)return E(s);const i=s.toLowerCase().indexOf(q);if(i<0)return E(s);return E(s.slice(0,i))+'<mark>'+E(s.slice(i,i+q.length))+'</mark>'+E(s.slice(i+q.length));}
function person(p,q){return `<span class="lv-p ${p.side?'lv-'+p.side:''}" data-notr>${p.side?'<i></i>':''}<b>${mark(p.name,q)}</b>${p.team?` <small>${mark(p.team,q)}</small>`:''}</span>`;}
function flat(snap){const out=[];(snap&&snap.courts||[]).forEach(c=>(c.apps||[]).forEach(a=>out.push({c,a,b:a.board||null,r:a.results||null})));return out;}
/* 도장 종합: 금 3점 · 은 2점 · 동 1점 */
function teamTable(F){const T=new Map();
  F.forEach(({r})=>(r&&r.divs||[]).forEach(d=>(d.podium||[]).forEach(p=>{if(!p.team||!MD[p.rank])return;const t=T.get(p.team)||{team:p.team,g:0,s:0,b:0};t[MD[p.rank][1]]++;T.set(p.team,t);})));
  return [...T.values()].map(t=>({...t,pt:t.g*3+t.s*2+t.b})).sort((a,b)=>b.pt-a.pt||b.g-a.g||b.s-a.s||a.team.localeCompare(b.team,'ko'));}
function find(F,q){const L=[];if(!q)return L;
  F.forEach(({c,a,b,r})=>{const where=`${c.court?c.court+'코트 · ':''}${a.appName||APPN[a.app]||''}`;
    if(b&&b.now)(b.now.names||[]).forEach(p=>{if(hit(q,p.name,p.team))L.push({k:'now',p,where,div:b.now.div,txt:b.now.status||'경기 중'});});
    if(b)(b.next||[]).forEach((n,i)=>(n.names||[]).forEach(p=>{if(hit(q,p.name,p.team))L.push({k:'next',p,where,div:n.div,txt:i===0?'바로 다음':`${i+1}번째 뒤`});}));
    if(r)(r.divs||[]).forEach(d=>(d.podium||[]).forEach(p=>{if(hit(q,p.name,p.team))L.push({k:'medal',p,where,div:d.div,rank:p.rank});}));});
  const ord={now:0,next:1,medal:2};return L.sort((x,y)=>ord[x.k]-ord[y.k]).slice(0,60);}
function court(c,a,b,q){const off=c.online===false,pr=b&&b.progress,pc=pr&&pr.total?Math.round(pr.done/pr.total*100):0;
  const nx=(b&&b.next||[]).slice(0,5);
  return `<section class="lv-court ${off?'off':''}"><header><span class="lv-c">${E(c.court||'')}</span><b>${E(c.court?c.court+'코트':'코트')}</b><span class="lv-app">${E(a.appName||APPN[a.app]||'')}</span>
      <span class="lv-st ${off?'off':b&&b.now?'on':''}">${off?'연결 끊김':b&&b.now?E(b.now.status||'경기 중'):'대기'}</span></header>
    ${b?`<div class="lv-div"><span data-notr>${E(b.curDiv||'—')}</span>${pr?`<small>${pr.done}/${pr.total}</small>`:''}</div>${pr?`<div class="lv-bar"><i style="width:${pc}%"></i></div>`:''}
    ${b.now?`<div class="lv-now"><small>지금${b.now.label?' · '+E(b.now.label):''}</small>${(b.now.names||[]).map(p=>person(p,q)).join('')}</div>`:'<div class="lv-now lv-mute">아직 시작한 경기가 없습니다</div>'}
    ${nx.length?`<div class="lv-next"><small>다음 순서</small><ol>${nx.map(n=>`<li data-notr>${n.div!==b.curDiv?`<em>${E(n.div)}</em>`:''}${(n.names||[]).map(p=>`<span>${mark(p.name,q)}${p.team?` <small>${mark(p.team,q)}</small>`:''}</span>`).join(' <i>vs</i> ')}</li>`).join('')}</ol></div>`:''}
    ${b.nextDiv&&b.nextDiv!==b.curDiv?`<div class="lv-nd">다음 부문 · <b data-notr>${E(b.nextDiv)}</b></div>`:''}`
    :'<div class="lv-now lv-mute">진행 정보를 기다리는 중</div>'}</section>`;}
function results(F,q){const D=[];F.forEach(({c,a,r})=>(r&&r.divs||[]).forEach(d=>{if((d.podium||[]).length)D.push({c,a,d});}));
  if(!D.length)return '<div class="lv-empty">아직 나온 입상 결과가 없습니다. 부문이 끝나면 여기에 바로 나옵니다.</div>';
  D.sort((x,y)=>(y.d.done?0:1)-(x.d.done?0:1));
  const show=q?D.filter(({d})=>hit(q,d.div)||(d.podium||[]).some(p=>hit(q,p.name,p.team))):D;
  return `<div class="lv-res">${show.map(({c,a,d})=>`<article><header><b data-notr>${mark(d.div,q)}</b><small>${E(a.appName||APPN[a.app]||'')}${c.court?' · '+E(c.court)+'코트':''}${d.done?'':' · 진행 중'}</small></header>
    <ol>${(d.podium||[]).slice().sort((x,y)=>x.rank-y.rank).map(p=>`<li class="${hit(q,p.name,p.team)?'hit':''}"><span class="lv-m ${MD[p.rank]?MD[p.rank][1]:''}" aria-label="${p.rank}위">${p.rank}</span><b data-notr>${mark(p.name,q)}</b><small data-notr>${mark(p.team,q)}</small></li>`).join('')}</ol></article>`).join('')||'<div class="lv-empty">찾는 이름이 결과에 없습니다</div>'}</div>`;}
function html(snap,st){st=st||{};const q=String(st.q||'').toLowerCase().replace(/\s+/g,''),tab=st.tab||'courts',now=st.now||Date.now();
  if(!snap||!(snap.courts||[]).length)return {head:snap&&snap.comp?`<div class="lv-top"><h2>${E(snap.comp)}</h2></div>`:'',body:`<div class="lv-empty lv-wait"><b>경기 소식을 기다리는 중입니다</b><br>대회가 시작되면 코트별 진행 상황과 입상 결과가 여기에 바로 나옵니다.</div>`};
  const F=flat(snap),T=teamTable(F),stale=snap.at&&now-snap.at>60000;
  const found=find(F,q);
  const nRes=F.reduce((n,{r})=>n+((r&&r.divs)||[]).filter(d=>(d.podium||[]).length).length,0);
  return {head:`<div class="lv-top"><div><span class="lv-live ${stale?'stale':''}"><i></i>${stale?'잠시 끊김':'LIVE'}</span> <small>${E(ago(snap.at,now))} 갱신</small></div>${snap.comp?`<h2 data-notr>${E(snap.comp)}</h2>`:''}</div>`,body:`
    ${q?`<section class="lv-found"><h3>「${E(st.q)}」 찾은 곳 <small>${found.length}</small></h3>${found.length?`<ul>${found.map(f=>`<li class="lv-f-${f.k}">${f.k==='medal'?`<span class="lv-m ${MD[f.rank]?MD[f.rank][1]:''}">${f.rank}</span>`:`<span class="lv-tag">${f.k==='now'?'지금':'곧'}</span>`}<div><b data-notr>${mark(f.p.name,q)}</b> <small data-notr>${mark(f.p.team,q)}</small><div class="lv-sub">${E(f.where)} · <span data-notr>${E(f.div||'')}</span>${f.k==='next'?' · '+E(f.txt):f.k==='now'?' · '+E(f.txt):''}</div></div></li>`).join('')}</ul>`:'<div class="lv-empty">지금 진행·다음 순서·입상 결과에 없습니다</div>'}</section>`:''}
    <div class="lv-tabs" role="tablist">${[['courts','코트 현황'],['results',`입상 결과${nRes?` <small>${nRes}</small>`:''}`],['teams','도장 종합']].map(([k,l])=>`<button type="button" role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-lv="tab" data-t="${k}">${l}</button>`).join('')}</div>
    ${tab==='courts'?`<div class="lv-courts">${F.map(({c,a,b})=>court(c,a,b,q)).join('')}</div>`
     :tab==='results'?results(F,q)
     :T.length?`<div class="lv-teams"><table><tr><th>순위</th><th>도장</th><th>금</th><th>은</th><th>동</th><th>점수</th></tr>${T.map((t,i)=>`<tr class="${hit(q,t.team)?'hit':''}"><td>${i&&T[i-1].pt===t.pt?'':i+1}</td><td><b data-notr>${mark(t.team,q)}</b></td><td>${t.g}</td><td>${t.s}</td><td>${t.b}</td><td><b>${t.pt}</b></td></tr>`).join('')}</table><p class="lv-sub">금 3점 · 은 2점 · 동 1점으로 더한 참고 순위입니다. 공식 종합 순위는 대회 본부 발표를 따릅니다.</p></div>`:'<div class="lv-empty">아직 입상한 도장이 없습니다</div>'}`};}
const CSS=`.lv{--g1:#F3DFAE;--g2:#C9A262;--g3:#8E6A30;--bg:#0B0D12;--p1:#14171D;--p2:#1B1F27;--ln:rgba(255,255,255,.09);--tx:#F2EEE6;--mu:#A39C8E;display:flex;flex-direction:column;gap:14px;color:var(--tx);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;word-break:keep-all}
.lv small{color:var(--mu);font-weight:600}
.lv-top{display:flex;flex-direction:column;gap:4px}.lv-top h2{margin:0;font-size:clamp(20px,5vw,28px);line-height:1.25}
.lv-live{display:inline-flex;align-items:center;gap:6px;font:800 12px/1 "Archivo",sans-serif;letter-spacing:.12em;color:#FF5C6C;background:rgba(255,92,108,.12);border:1px solid rgba(255,92,108,.35);border-radius:999px;padding:5px 10px}
.lv-live i{width:8px;height:8px;border-radius:50%;background:#FF5C6C;animation:lvp 1.4s infinite}.lv-live.stale{color:#E3A64A;background:rgba(227,166,74,.12);border-color:rgba(227,166,74,.35)}.lv-live.stale i{background:#E3A64A;animation:none}
@keyframes lvp{50%{opacity:.25}}
.lv-q{display:flex;align-items:center;gap:8px;background:var(--p1);border:1px solid rgba(201,162,98,.45);border-radius:14px;padding:0 14px}.lv-q input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:inherit;font-size:16px;padding:13px 0;outline:none}
.lv mark{background:rgba(243,223,174,.85);color:#1A1306;border-radius:3px;padding:0 1px}
.lv-tabs{display:flex;gap:6px;border-bottom:1px solid var(--ln);overflow-x:auto}.lv-tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font:inherit;font-weight:800;font-size:15px;padding:10px 12px;cursor:pointer;white-space:nowrap}.lv-tabs button.on{color:var(--g1);border-bottom-color:var(--g2)}
.lv-courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lv-court{background:linear-gradient(160deg,var(--p2),var(--p1));border:1px solid var(--ln);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}.lv-court.off{opacity:.6}
.lv-court header{display:flex;align-items:center;gap:8px}.lv-court header b{font-size:18px}
.lv-c{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(180deg,#EBD5A3,#B8904E);color:#1A1306;font:900 16px/1 "Archivo",sans-serif}
.lv-app{font-size:13px;font-weight:800;color:var(--g1);border:1px solid rgba(201,162,98,.4);border-radius:999px;padding:2px 9px}
.lv-st{margin-left:auto;font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.07);color:var(--mu)}.lv-st.on{background:rgba(67,201,133,.16);color:#6BE0A4}.lv-st.off{background:rgba(255,92,108,.14);color:#FF8A96}
.lv-div{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px}.lv-bar{height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}.lv-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g3),var(--g1))}
.lv-now{display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,.25);border:1px solid rgba(201,162,98,.25);border-radius:12px;padding:10px 12px}.lv-now.lv-mute{color:var(--mu);font-size:14px}
.lv-p{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.lv-p b{font-size:22px;font-weight:900}.lv-p i{align-self:center;width:10px;height:10px;border-radius:3px}.lv-blue i{background:#2F6BD6}.lv-red i{background:#D7263D}
.lv-next ol{margin:4px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}.lv-next em{display:block;font-style:normal;font-size:12px;color:var(--g2);font-weight:800}.lv-next i{color:var(--mu);font-style:normal;font-size:12px}
.lv-nd{font-size:13.5px;color:var(--mu)}.lv-nd b{color:var(--tx)}
.lv-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.lv-res article{background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:12px 14px}.lv-res header{display:flex;flex-direction:column;margin-bottom:8px}.lv-res header b{font-size:15.5px}
.lv-res ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.lv-res li{display:flex;align-items:center;gap:10px;padding:4px 6px;border-radius:10px}.lv-res li.hit,.lv-teams tr.hit td{background:rgba(243,223,174,.12)}.lv-res li b{font-size:16px}.lv-res li small{margin-left:auto;text-align:right}
.lv-m{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;font-weight:900;font-size:13px;color:#1A1306;background:#888}.lv-m.g{background:linear-gradient(135deg,#F6E3A6,#B88A2E)}.lv-m.s{background:linear-gradient(135deg,#F1F3F6,#9AA2AD)}.lv-m.b{background:linear-gradient(135deg,#F0C29E,#9A5E33)}
.lv-teams table{width:100%;border-collapse:collapse;font-size:15px}.lv-teams th{text-align:left;color:var(--mu);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--ln)}.lv-teams td{padding:9px 8px;border-bottom:1px solid var(--ln)}.lv-teams td:nth-child(n+3){text-align:center;font-variant-numeric:tabular-nums}.lv-teams th:nth-child(n+3){text-align:center}
.lv-found{background:linear-gradient(160deg,#2A2519,#14110B);border:1px solid rgba(201,162,98,.5);border-radius:16px;padding:12px 14px}.lv-found h3{margin:0 0 8px;font-size:16px}.lv-found ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.lv-found li{display:flex;gap:10px;align-items:flex-start}
.lv-tag{flex:none;font-size:12px;font-weight:900;border-radius:8px;padding:4px 8px;background:#43C985;color:#06210F}.lv-f-next .lv-tag{background:#E3A64A;color:#2A1A02}
.lv-sub{font-size:13px;color:var(--mu)}
.lv-empty{color:var(--mu);text-align:center;padding:26px 12px;border:1px dashed var(--ln);border-radius:16px}.lv-wait b{color:var(--tx);font-size:17px}
@media (max-width:420px){.lv-courts,.lv-res{grid-template-columns:minmax(0,1fr)}.lv-p b{font-size:20px}}`;
/* 화면 붙이기: 찾기 칸은 다시 그리지 않음 (한글 입력이 끊기지 않게) */
function mount(el,st0){const st=Object.assign({q:'',tab:'courts'},st0||{});let snap=null;
  if(!document.getElementById('lv-css')){const c=document.createElement('style');c.id='lv-css';c.textContent=CSS;document.head.appendChild(c);}
  el.innerHTML=`<div class="lv"><div data-lv="head"></div><label class="lv-q"><span aria-hidden="true">🔍</span><input type="search" data-lv="q" placeholder="선수 이름이나 도장 이름 찾기" aria-label="선수·도장 찾기" autocomplete="off" enterkeyhint="search"></label><div data-lv="body"></div></div>`;
  const H=el.querySelector('[data-lv=head]'),B=el.querySelector('[data-lv=body]');el.querySelector('[data-lv=q]').value=st.q||'';
  const draw=()=>{const o=html(snap,st);if(H.innerHTML!==o.head)H.innerHTML=o.head;B.innerHTML=o.body;};
  el.addEventListener('input',e=>{if(e.target.dataset.lv==='q'){st.q=e.target.value;draw();}});
  el.addEventListener('click',e=>{const b=e.target.closest('[data-lv=tab]');if(b){st.tab=b.dataset.t;draw();}});
  const tk=setInterval(()=>{if(!el.isConnected){clearInterval(tk);return;}H.innerHTML=html(snap,st).head;},5000);
  return {set(s){snap=s;draw();},get snap(){return snap;},st,draw};}
window.LV={html,CSS,ago,teamTable,mount};
})();

/*@@LVEND*/</script>
<style>
/* Layout: 검은 경기장 바닥 위 금색 선 — 위는 대회 일정(공지판), 아래는 지도자가 쓰는 접수 작업대. 브랜드가 한 가지 모습(어두운 바탕)이라 다크 한 가지로 고정 */
:root{
  --ink:#0A0B0E; --panel:#121419; --panel2:#181B22; --line:#2A2E37; --line2:#3A3F4B;
  --text:#F2EEE6; --mute:#9EA4AF; --dim:#6E7480;
  --gold:#D8B46E; --gold2:#F3DFAE; --gold3:#8E6A30; --goldInk:#1A1306;
  --blue:#2F6BE6; --red:#D7263D; --ok:#3CC57E; --warn:#F2B84B; --bad:#FF6B76;
  --f-disp:"Archivo","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Archivo",ui-monospace,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-family:var(--f-disp);font-weight:900;font-size:clamp(28px,4.6vw,46px);line-height:1.12}
h2{font-size:21px;font-weight:900}
h3{font-size:17px;font-weight:800}
.mute{color:var(--mute)} .small{font-size:13px} .num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-disp);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}

/* 시험판 띠 */
.demo{background:linear-gradient(90deg,#2A2110,#1A160D);border-bottom:1px solid #4A3B1C;font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:8px}
.demo b{color:var(--gold2)}
.demo .sp{flex:1}

/* 머리 */

er running the step 6 SQL", "Disponible tras ejecutar el SQL del paso 6", "运行第6步SQL后即可使用", "Dùng được sau khi chạy SQL bước 6", "Disponible après le SQL de l’étape 6", "متاح بعد تشغيل SQL للخطوة 6", "Verfügbar nach dem SQL von Schritt 6"], "마지막으로 받은 때 · {s1}": ["Last received · {s1}", "Última recepción · {s1}", "最后接收 · {s1}", "Nhận lần cuối · {s1}", "Dernière réception · {s1}", "آخر استلام · {s1}", "Zuletzt empfangen · {s1}"], "아직 받은 진행 상황이 없습니다": ["Nothing received yet", "Aún no se ha recibido nada", "尚未收到进度", "Chưa nhận được gì", "Rien reçu pour l’instant", "لم يُستلم شيء بعد", "Noch nichts empfangen"], "멈춤": ["Stopped", "Detenido", "已停止", "Đã dừng", "Arrêté", "متوقف", "Gestoppt"], "학부모·선수에게 알려 줄 주소 (로그인 없이 봄)": ["Link for parents and athletes (no login needed)", "Enlace para familias y deportistas (sin iniciar sesión)", "发给家长和选手的链接（无需登录）", "Liên kết cho phụ huynh và VĐV (không cần đăng nhập)", "Lien pour les parents et athlètes (sans connexion)", "رابط لأولياء الأمور واللاعبين (دون تسجيل دخول)", "Link für Eltern und Athleten (ohne Anmeldung)"], "열어 보기": ["Open", "Abrir", "打开", "Mở", "Ouvrir", "فتح", "Öffnen"], "결과 화면 내리기": ["Take results offline", "Retirar resultados", "下线结果页面", "Gỡ trang kết quả", "Retirer les résultats", "إيقاف صفحة النتائج", "Ergebnisse offline nehmen"], "한 번 더 누르면 내림": ["Press again to take offline", "Pulsa otra vez para retirar", "再按一次即下线", "Nhấn lần nữa để gỡ", "Appuyez encore pour retirer", "اضغط مرة أخرى للإيقاف", "Zum Offline-Nehmen erneut tippen"], "관람객 주소를 복사했습니다": ["Spectator link copied", "Enlace copiado", "已复制观众链接", "Đã sao chép liên kết", "Lien copié", "تم نسخ الرابط", "Zuschauer-Link kopiert"], "주소를 복사했습니다. 단체방에 붙여 넣으세요": ["Link copied. Paste it into your group chat", "Enlace copiado. Pégalo en tu grupo", "已复制链接，请粘贴到群聊", "Đã sao chép. Hãy dán vào nhóm chat", "Lien copié. Collez-le dans votre groupe", "تم نسخ الرابط. الصقه في مجموعة الدردشة", "Link kopiert. In den Gruppenchat einfügen"], "실시간 결과 화면을 내렸습니다": ["Live results taken offline", "Resultados en vivo retirados", "已下线实时结果", "Đã gỡ kết quả trực tiếp", "Résultats en direct retirés", "تم إيقاف النتائج المباشرة", "Live-Ergebnisse offline genommen"]};window.__SITE_TRH={"forgot1": ["The organizers (admin) will create a <b>temporary password</b> for you. Log in with it, then set a new password under “My account”.", "La organización (admin) creará una <b>contraseña temporal</b>. Inicia sesión con ella y cámbiala en «Mi cuenta».", "赛事本部（管理员）会为您生成<b>临时密码</b>。用它登录后，请在“我的信息”中设置新密码。", "BTC (quản trị) sẽ tạo <b>mật khẩu tạm</b> cho bạn. Đăng nhập bằng mật khẩu đó rồi đổi ở «Tài khoản».", "Les organisateurs (admin) vous créeront un <b>mot de passe temporaire</b>. Connectez-vous avec, puis changez-le dans « Mon compte ».", "سينشئ المنظمون (المسؤول) <b>كلمة مرور مؤقتة</b> لك. سجّل الدخول بها ثم غيّرها من «حسابي».", "Der Veranstalter (Admin) erstellt ein <b>temporäres Passwort</b>. Damit anmelden und unter „Mein Konto“ ein neues festlegen."], "lic1": ["Without a code the competition apps run in <b>practice mode</b> (up to 20 athletes, “PRACTICE” on scoreboards and certificates). A code created here unlocks everything for its period. Create codes for your own competitions here too.", "Sin código, las apps funcionan en <b>modo práctica</b> (hasta 20 deportistas, «PRÁCTICA» en marcadores y diplomas). Un código creado aquí lo desbloquea todo durante su vigencia. Crea aquí también los de tus competiciones.", "没有授权码时，比赛应用以<b>练习模式</b>运行（最多20名选手，记分屏和奖状显示“练习用”）。在此生成的授权码可在有效期内解锁全部功能。自己的赛事也请在此生成。", "Không có mã, ứng dụng chạy ở <b>chế độ luyện tập</b> (tối đa 20 VĐV, bảng điểm và giấy khen có chữ «LUYỆN TẬP»). Mã tạo ở đây mở khóa toàn bộ trong thời hạn. Hãy tạo mã cho giải của bạn tại đây.", "Sans code, les apps fonctionnent en <b>mode entraînement</b> (20 athlètes max., « PRACTICE » sur les écrans et diplômes). Un code créé ici débloque tout pendant sa validité. Créez aussi ici les codes de vos propres compétitions.", "بدون رمز تعمل التطبيقات في <b>وضع التدريب</b> (حتى 20 لاعبًا، وتظهر كلمة «PRACTICE» على الشاشات والشهادات). الرمز المنشأ هنا يفتح كل شيء طوال مدته. أنشئ هنا أيضًا رموز بطولاتك.", "Ohne Code laufen die Apps im <b>Übungsmodus</b> (max. 20 Athleten, „PRACTICE“ auf Anzeigen und Urkunden). Ein hier erstellter Code schaltet alles für seinen Zeitraum frei. Codes für eigene Wettkämpfe ebenfalls hier erstellen."], "stat1": ["Option 1 · In the app’s “Athletes” screen tap <b>🌐 Import from entry website</b> and log in with this admin account.<br>Option 2 · Download the Excel below and upload it with “📂 Choose file” in the app. Divisions are created automatically by division, event and weight.", "Opción 1 · En «Deportistas» de la app pulsa <b>🌐 Importar desde la web</b> e inicia sesión con esta cuenta de administrador.<br>Opción 2 · Descarga el Excel y súbelo con «📂 Elegir archivo» en la app. Las categorías se crean automáticamente.", "方法1 · 在比赛应用“选手登记”中点击<b>🌐 从报名网站导入</b>，用本管理员账号登录即可导入。<br>方法2 · 下载下方Excel，在应用中通过“📂 选择文件”上传，系统按组别、项目、级别自动生成分组。", "Cách 1 · Trong mục «Nhập VĐV» của ứng dụng, bấm <b>🌐 Lấy từ trang đăng ký</b> và đăng nhập bằng tài khoản quản trị này.<br>Cách 2 · Tải Excel bên dưới và tải lên qua «📂 Chọn tệp». Hạng mục được tạo tự động.", "Option 1 · Dans l’écran « Athlètes » de l’app, touchez <b>🌐 Importer depuis le site</b> et connectez-vous avec ce compte admin.<br>Option 2 · Téléchargez l’Excel ci-dessous et importez-le via « 📂 Choisir un fichier ». Les catégories sont créées automatiquement.", "الطريقة 1 · في شاشة «اللاعبون» بالتطبيق اضغط <b>🌐 الاستيراد من موقع التسجيل</b> وسجّل الدخول بحساب المسؤول هذا.<br>الطريقة 2 · نزّل ملف Excel أدناه وارفعه عبر «📂 اختيار ملف». تُنشأ الفئات تلقائيًا.", "Option 1 · In der App unter „Athleten“ <b>🌐 Von Anmeldeseite importieren</b> tippen und mit diesem Admin-Konto anmelden.<br>Option 2 · Excel unten laden und in der App über „📂 Datei wählen“ hochladen. Klassen werden automatisch erstellt."], "res1": ["In the app’s “Results · Awards” screen tap <b>🌐 Send results to entry website</b> and the medal results arrive here. Check them, then turn on “Publish to coaches” so coaches can download their athletes’ certificates.", "En «Resultados · Premios» de la app pulsa <b>🌐 Enviar resultados a la web</b> y llegarán aquí. Revísalos y activa «Publicar para entrenadores» para que descarguen los diplomas.", "在比赛应用“成绩·颁奖”中点击<b>🌐 将成绩发送到报名网站</b>，获奖成绩会进入这里。确认后开启“向教练公开”，教练即可下载自己选手的奖状。", "Trong màn «Kết quả · Trao giải» của ứng dụng, bấm <b>🌐 Gửi kết quả lên trang đăng ký</b>, kết quả sẽ về đây. Kiểm tra rồi bật «Công bố cho HLV» để HLV tải giấy khen.", "Dans « Résultats · Remises » de l’app, touchez <b>🌐 Envoyer les résultats au site</b> ; ils arrivent ici. Vérifiez puis activez « Publier aux entraîneurs » pour qu’ils téléchargent les diplômes.", "في شاشة «النتائج · الجوائز» بالتطبيق اضغط <b>🌐 إرسال النتائج إلى موقع التسجيل</b> فتصل النتائج هنا. راجعها ثم فعّل «النشر للمدربين» ليتمكنوا من تنزيل الشهادات.", "In der App unter „Ergebnisse · Siegerehrung“ <b>🌐 Ergebnisse an Anmeldeseite senden</b> tippen; die Platzierungen erscheinen hier. Prüfen und „Für Trainer veröffentlichen“ einschalten, damit Trainer die Urkunden laden."], "enter1": ["The {v1} entries already submitted are in <a href=\"#entries\">My entries</a>.", "Las {v1} inscripciones ya enviadas están en <a href=\"#entries\">Mis inscripciones</a>.", "已提交的{v1}项报名见<a href=\"#entries\">我的报名</a>。", "{v1} mục đã đăng ký nằm trong <a href=\"#entries\">Đăng ký của tôi</a>.", "Les {v1} inscriptions déjà envoyées sont dans <a href=\"#entries\">Mes inscriptions</a>.", "التسجيلات ({v1}) المرسلة موجودة في <a href=\"#entries\">تسجيلاتي</a>.", "Die {v1} bereits gesendeten Meldungen stehen unter <a href=\"#entries\">Meine Meldungen</a>."], "entries0": ["You have not entered any competition yet. Pick one under <a href=\"#home\">Competitions</a>.", "Aún no te has inscrito. Elige una en <a href=\"#home\">Competiciones</a>.", "尚未报名任何赛事，请在<a href=\"#home\">赛事日程</a>中选择。", "Chưa đăng ký giải nào. Hãy chọn trong <a href=\"#home\">Lịch thi đấu</a>.", "Aucune inscription. Choisissez une compétition dans <a href=\"#home\">Compétitions</a>.", "لم تسجل بعد. اختر بطولة من <a href=\"#home\">البطولات</a>.", "Noch keine Meldungen. Wettkampf unter <a href=\"#home\">Wettkämpfe</a> wählen."], "cefx1": ["Athlete names use the <b>English name</b> the coach entered under “My athletes”; if there is none, the Korean name is used. Division names are translated word by word where possible and otherwise stay in Korean.", "Los nombres de los deportistas usan el <b>nombre en alfabeto latino</b> que el entrenador escribió en «Mis deportistas»; si no hay, se usa el nombre coreano. Las categorías se traducen cuando se conocen las palabras; si no, quedan en coreano.", "选手姓名使用教练在“我的选手”中填写的<b>英文姓名</b>，没有则使用韩文姓名。组别名称能翻译的词会翻译，无法翻译时保留韩文。", "Tên vận động viên dùng <b>tên tiếng Anh</b> do HLV nhập ở «VĐV của tôi»; nếu không có thì dùng tên tiếng Hàn. Tên hạng mục được dịch các từ đã biết, nếu không thì giữ tiếng Hàn.", "Les noms des athlètes utilisent le <b>nom en alphabet latin</b> saisi par l’entraîneur dans « Mes athlètes » ; sinon, le nom coréen. Les catégories sont traduites mot à mot quand c’est possible, sinon elles restent en coréen.", "تُكتب أسماء اللاعبين <b>بالأحرف اللاتينية</b> كما أدخلها المدرب في «لاعبيّ»؛ وإن لم توجد يُستخدم الاسم الكوري. تُترجم أسماء الفئات حين تكون الكلمات معروفة، وإلا تبقى بالكورية.", "Athletennamen erscheinen mit dem <b>Namen in lateinischer Schrift</b>, den der Trainer unter „Meine Athleten“ eingetragen hat; sonst der koreanische Name. Kategorien werden übersetzt, soweit die Wörter bekannt sind, sonst bleiben sie koreanisch."], "live1": ["On competition day, open the field program on the <b>HQ laptop</b>, press <b>“Send to internet”</b>, log in with this admin account and press “Start sending”. Court progress and medal results then appear at this link every few seconds. On the venue Wi-Fi, spectators can also use “Open spectator screen” without internet.", "El día del torneo, en el <b>portátil de la organización</b> abre el programa de sede, pulsa <b>«Enviar a internet»</b>, inicia sesión con esta cuenta de administrador y pulsa «Empezar a enviar». El progreso de las áreas y los resultados aparecerán en este enlace cada pocos segundos. En el wifi de la sede también se puede usar «Abrir pantalla del público» sin internet.", "比赛当天，在<b>本部电脑</b>的现场程序首页点击<b>“发送到互联网”</b>，用此管理员账号登录后点击“开始发送”。各场地进度和获奖结果每隔几秒就会显示在此链接。在赛场Wi-Fi内，也可以不用互联网，通过“打开观众页面”查看。", "Ngày thi đấu, trên <b>máy tính BTC</b> mở chương trình tại chỗ, bấm <b>«Gửi lên internet»</b>, đăng nhập tài khoản quản trị này rồi bấm «Bắt đầu gửi». Tiến độ các sân và kết quả sẽ hiện ở liên kết này vài giây một lần. Trong wifi nhà thi đấu cũng có thể xem bằng «Mở màn hình khán giả» mà không cần internet.", "Le jour J, sur l’<b>ordinateur de l’organisation</b>, ouvrez le programme sur site, appuyez sur <b>« Envoyer sur internet »</b>, connectez-vous avec ce compte administrateur puis « Commencer l’envoi ». L’avancement des aires et les résultats apparaissent sur ce lien toutes les quelques secondes. Sur le wifi du site, on peut aussi utiliser « Ouvrir l’écran public » sans internet.", "في يوم البطولة، افتح برنامج الموقع على <b>حاسوب اللجنة</b>، واضغط <b>«الإرسال إلى الإنترنت»</b>، وسجّل الدخول بحساب المدير هذا ثم اضغط «بدء الإرسال». ستظهر حالة الملاعب والنتائج على هذا الرابط كل بضع ثوانٍ. وداخل شبكة Wi-Fi في مكان البطولة يمكن أيضًا استخدام «فتح شاشة الجمهور» دون إنترنت.", "Am Turniertag auf dem <b>Organisations-Laptop</b> das Vor-Ort-Programm öffnen, <b>„Ins Internet senden“</b> drücken, mit diesem Admin-Konto anmelden und „Senden starten“ drücken. Der Stand der Flächen und die Ergebnisse erscheinen dann alle paar Sekunden unter diesem Link. Im WLAN der Halle geht es auch ohne Internet über „Zuschauerbildschirm öffnen“."]};</script><script>/* ===== 홈페이지 다국어: 한국어 · English · Español · 中文 · Tiếng Việt · Français · العربية · Deutsch =====
   화면은 한국어로 그린 뒤, 글자를 사전으로 바꿉니다. 사람 이름·도장 이름 같은 자료는 그대로 둡니다. */
const SL=[['ko','한국어'],['en','English'],['es','Español'],['zh','中文'],['vi','Tiếng Việt'],['fr','Français'],['ar','العربية'],['de','Deutsch']];
const SLI={en:0,es:1,zh:2,vi:3,fr:4,ar:5,de:6};
const LOC={ko:'ko-KR',en:'en-US',es:'es-ES',zh:'zh-CN',vi:'vi-VN',fr:'fr-FR',ar:'ar',de:'de-DE'};
let LANG=(()=>{let v=null;try{v=localStorage.getItem('ks_site_lang');}catch(e){}if(SL.some(l=>l[0]===v))return v;const n=(navigator.language||'ko').slice(0,2).toLowerCase();return SL.some(l=>l[0]===n)?n:'ko';})();
const TRD=window.__SITE_TR||{},TRH=window.__SITE_TRH||{};
const HGL=/[가-힣]/,NUMRE=/\d[\d,.]*/g;
/* {s1}·{n1} 칸이 있는 문장은 정규식으로 */
const PAT=Object.keys(TRD).filter(k=>/\{[sn]\d\}/.test(k)).map(k=>{const names=[];const re=new RegExp('^'+k.replace(/[.*+?^$()|[\]\\]/g,'\\$&').replace(/\{([sn]\d)\}/g,(m,n)=>{names.push(n);return n[0]==='s'?'(.+?)':'(\\d[\\d,.]*)';})+'$');return {k,re,names};}).sort((a,b)=>b.k.length-a.k.length);
function trOne(s){const L=SLI[LANG];if(L==null)return null;let e=TRD[s];if(e&&e[L])return e[L];
  for(const p of PAT){const m=s.match(p.re);if(!m)continue;const v=TRD[p.k][L];if(!v)return null;let out=v;p.names.forEach((n,i)=>{let x=m[i+1];if(n[0]==='s'){const t=tr(x);if(t)x=t;}out=out.split('{'+n+'}').join(x);});return out;}
  return null;}
function tr(s){if(LANG==='ko'||!s||!HGL.test(s))return null;const k=s.replace(/\s+/g,' ').trim();if(!k)return null;
  const ed=k.match(/^(.*?)\s*([·:])$/);if(ed&&HGL.test(ed[1])){const x=tr(ed[1]);if(x)return x+' '+ed[2];}
  let t=trOne(k);if(t)return t;
  /* 「·」로 이어진 조각은 조각마다 */
  if(k.includes(' · ')){const parts=k.split(' · ');let any=false;const out=parts.map(p=>{const x=trOne(p)||tr2(p);if(x){any=true;return x;}return p;});if(any)return out.join(' · ');}
  return tr2(k);}
function tr2(k){if(/^\(.*\)$/.test(k)){const x=trOne(k.slice(1,-1));if(x)return '('+x+')';}
  const m=k.match(/^(.*?)\s*\(([^()]*)\)$/);if(m){const a=trOne(m[1]),b=trOne(m[2]);if(a||b)return `${a||m[1]} (${b||m[2]})`;}
  return null;}
const TT=(s)=>tr(s)||s;
/* 바꾼 글자는 원래 글자를 기억해 두고, 언어를 바꾸면 다시 바꿈 */
const ORIG=new WeakMap();
function trNode(n){const o=ORIG.has(n)?ORIG.get(n):n.nodeValue;if(!HGL.test(o)){return;}
  const t=LANG==='ko'?o:tr(o);if(t==null)return;if(!ORIG.has(n))ORIG.set(n,o);
  const lead=o.match(/^\s*/)[0],trail=o.match(/\s*$/)[0],v=LANG==='ko'?o:lead+t+trail;if(n.nodeValue!==v){BUSYTR=true;n.nodeValue=v;BUSYTR=false;}}
const AORIG=new WeakMap();
function trAttrs(el){for(const a of ['placeholder','aria-label','title']){const v=el.getAttribute&&el.getAttribute(a);if(!v)continue;let m=AORIG.get(el);if(!m){m={};AORIG.set(el,m);}
  if(!(a in m)){if(!HGL.test(v))continue;m[a]=v;}const o=m[a];const t=LANG==='ko'?o:(tr(o)||o);if(v!==t)el.setAttribute(a,t);}}
function trHtml(el){const k=el.dataset.trh,o=el.__trhO||(el.__trhO=el.innerHTML);const d=TRH[k],L=SLI[LANG];
  let h=LANG==='ko'||!d||!d[L]?o:d[L];if(d&&d[L]&&LANG!=='ko'){Object.entries(el.dataset).forEach(([a,v])=>{if(/^v\d$/.test(a))h=h.split('{'+a+'}').join(esc(v));});}
  if(el.innerHTML!==h){BUSYTR=true;el.innerHTML=h;BUSYTR=false;}}
let BUSYTR=false;
function trTree(root){if(!root)return;if(root.nodeType===3){if(!root.parentElement||!root.parentElement.closest('[data-notr],script,style,textarea'))trNode(root);return;}
  if(root.nodeType!==1)return;if(root.closest&&root.closest('[data-notr]'))return;
  root.querySelectorAll&&root.querySelectorAll('[data-trh]').forEach(trHtml);if(root.dataset&&root.dataset.trh)trHtml(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1&&(n.hasAttribute('data-notr')||/^(SCRIPT|STYLE)$/.test(n.tagName))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let n=root;while(n){if(n.nodeType===3){if(!n.parentElement||n.parentElement.tagName!=='TEXTAREA')trNode(n);}else trAttrs(n);n=w.nextNode();}}
function applyDir(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';const t=TT('KICKSTART UP 대회 접수');document.title=LANG==='ko'?'KICKSTART UP 대회 접수':t;}
function setLang(l){LANG=l;try{localStorage.setItem('ks_site_lang',l);}catch(e){}applyDir();render();trTree(document.body);}
new MutationObserver(ms=>{if(BUSYTR||LANG==='ko')return;for(const m of ms){if(m.type==='characterData'){if(m.target.parentElement&&!m.target.parentElement.closest('[data-notr]'))trNode(m.target);}else m.addedNodes.forEach(trTree);}})
  .observe(document.documentElement,{subtree:true,childList:true,characterData:true});
/* 날짜·돈: 고른 언어의 형식으로 */
function fmtDateL(s){const d=new Date(s+'T00:00:00');if(LANG==='ko')return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. (${wd[d.getDay()]})`;
  return new Intl.DateTimeFormat(LOC[LANG],{year:'numeric',month:'short',day:'numeric',weekday:'short'}).format(d);}
function weekdayL(d){return LANG==='ko'?wd[d.getDay()]+'요일':new Intl.DateTimeFormat(LOC[LANG],{weekday:'long'}).format(d);}
const LCODE={ko:'KO',en:'EN',es:'ES',zh:'中',vi:'VI',fr:'FR',ar:'AR',de:'DE'};
let LANGOPEN=false;
function langSel(){const cur=SL.find(l=>l[0]===LANG)||SL[0];
  return `<div class="langsel ${LANGOPEN?'open':''}" data-notr><button type="button" class="langbtn" data-a="langOpen" aria-haspopup="listbox" aria-expanded="${LANGOPEN}" aria-label="Language · ${cur[1]}"><span class="lglobe" aria-hidden="true">🌐</span><b>${LCODE[cur[0]]}</b><span class="lname">${cur[1]}</span><span class="lcar" aria-hidden="true">▾</span></button>
    ${LANGOPEN?`<div class="langmenu" role="listbox" aria-label="Language">${SL.map(([k,l])=>`<button type="button" role="option" aria-selected="${k===LANG}" class="${k===LANG?'on':''}" data-a="langPick" data-l="${k}" lang="${k}"><span class="lc">${LCODE[k]}</span><span class="ln">${l}</span>${k===LANG?'<span class="lk" aria-hidden="true">✓</span>':''}</button>`).join('')}</div>`:''}</div>`;}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a]');const a=b&&b.dataset.a;
  if(a==='langOpen'){e.stopImmediatePropagation();LANGOPEN=!LANGOPEN;render();if(LANGOPEN){const f=document.querySelector('.langmenu .on')||document.querySelector('.langmenu button');if(f)f.focus();}return;}
  if(a==='langPick'){e.stopImmediatePropagation();LANGOPEN=false;const l=b.dataset.l;if(l!==LANG)setLang(l);else render();const t=document.querySelector('.langbtn');if(t)t.focus();return;}
  if(LANGOPEN&&!(e.target.closest&&e.target.closest('.langsel'))){LANGOPEN=false;render();}},true);
document.addEventListener('keydown',e=>{if(!LANGOPEN)return;const L=[...document.querySelectorAll('.langmenu button')];const i=L.indexOf(document.activeElement);
  if(e.key==='Escape'){LANGOPEN=false;render();const t=document.querySelector('.langbtn');if(t)t.focus();e.preventDefault();}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=L[(i+(e.key==='ArrowDown'?1:-1)+L.length)%L.length];if(n)n.focus();}},true);
</script><!--@@END-->
<script>
/* ================= 기본 자료 (대회 앱 불러오기 형식과 같은 값) ================= */

const H0=location.hash;let HDONE=false;
function fixAuthHash(session){if(HDONE)return;HDONE=true;
  if(!/access_token=|error_description=|type=recovery/.test(H0))return;
  const P=new URLSearchParams(H0.slice(1));
  if(P.get('error_description')){UI.flash=/expired|invalid/i.test(P.get('error_description'))?'메일 링크가 만료되었거나 이미 사용되었습니다. 로그인해 보시고, 안 되면 대회 본부에 임시 비밀번호를 요청해 주세요':'메일 링크를 처리하지 못했습니다: '+P.get('error_description');history.replaceState(null,'','#login');return;}
  if(P.get('type')==='recovery'||UI.recovery){UI.recovery=true;history.replaceState(null,'','#pwreset');return;}
  history.replaceState(null,'',session?'#home':'#login');if(session)UI.flash='가입 확인이 끝났습니다. 환영합니다!';}
function msgOf(e){const m=String(e&&e.message||e||'');
  if(/Invalid login credentials/i.test(m))return '이메일이나 비밀번호가 맞지 않습니다. 다시 확인해 주세요';
  if(/Email not confirmed/i.test(m))return '가입 확인 메일의 링크를 먼저 눌러 주세요';
  if(/already registered|already been registered/i.test(m))return '이미 가입한 이메일입니다. 로그인해 주세요';
  if(/Password should be at least/i.test(m))return '비밀번호는 6자 이상으로 해 주세요';
  if(/Failed to fetch|NetworkError/i.test(m))return '인터넷 연결을 확인해 주세요';
  if(/rate limit/i.test(m))return '잠시 뒤 다시 시도해 주세요 (요청이 너무 많습니다)';
  if(/sending (confirmation|recovery|magic)|email address not authorized/i.test(m))return '메일을 보내지 못했습니다. 대회 본부에 연락해 주세요 (관리자: Supabase에서 「Confirm email」을 꺼 주세요)';
  if(/different from the old/i.test(m))return '지금 쓰는 비밀번호와 다른 비밀번호로 해 주세요';
  if(/Signups not allowed/i.test(m))return '지금은 회원가입을 받지 않습니다';
  if(/Bucket not found|row-level security.*objects|storage/i.test(m))return '파일 저장소에 올리지 못했습니다. 요강은 「링크」 칸에 주소로 넣어 주세요';
  return m.replace(/^.*?:\s*/,'')||'처리하지 못했습니다';
}

function liveRow(id){return (M.live||[]).find(x=>x.comp_id===id);}
function liveOn(id,min){const r=liveRow(id);return !!r&&Date.now()-new Date(r.updated_at).getTime()<min*60000;}
function liveUrl(id){return location.origin+location.pathname+'#live-'+id;}
function vLive(id){const c=D().comps.find(x=>x.id===id);

    ${!M.liveOk?'<div class="empty">실시간 결과를 아직 쓸 수 없습니다. 대회 본부에 알려 주세요.</div>':''}

function liveMount(id){const el=document.getElementById('lvroot');if(!el)return;
  if(LIVE.id!==id){LIVE.id=id;LIVE.snap=null;LIVE.at='';LIVE.none=false;LIVE.st={q:'',tab:'courts'};}
  LIVE.v=LV.mount(el,LIVE.st);LIVE.st=LIVE.v.st;LIVE.v.set(LIVE.snap||(LIVE.none?{comp:'',courts:[]}:null));if(!LIVE.snap)livePoll(true);}
/* 10초마다: 바뀐 시각만 먼저 묻고, 바뀌었을 때만 내용을 받음 (데이터를 아낌) */
async function livePoll(force){const r=route();if(!r.startsWith('live-')||LIVE.busy||!M.liveOk)return;if(!force&&document.hidden)return;const id=r.slice(5);LIVE.busy=true;
  try{const {data,error}=await sb.from('live_view').select('updated_at').eq('comp_id',id);if(error)throw error;const t=data&&data[0]&&data[0].updated_at;
    if(!t){LIVE.none=true;LIVE.snap=null;if(LIVE.v)LIVE.v.set({comp:'',courts:[]});return;}
    if(t!==LIVE.at||force){const d=await sb.from('live_view').select('data,updated_at').eq('comp_id',id);if(d.error)throw d.error;const row=d.data&&d.data[0];
      if(row){LIVE.at=row.updated_at;LIVE.snap={...row.data,at:new Date(row.updated_at).getTime()};LIVE.none=false;if(LIVE.v&&document.getElementById('lvroot'))LIVE.v.set(LIVE.snap);}}
    else if(LIVE.v&&LIVE.snap)LIVE.v.set({...LIVE.snap,at:new Date(t).getTime()});}
  catch(e){}finally{LIVE.busy=false;}}
setInterval(()=>livePoll(false),10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)livePoll(false);});

let QRLIB=null;
function loadQr(){if(window.qrcode)return Promise.resolve();if(QRLIB)return QRLIB;QRLIB=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=res;s.onerror=()=>{QRLIB=null;rej();};document.head.appendChild(s);});return QRLIB;}
async function liveQr(){const el=document.getElementById('liveQr');if(!el||el.dataset.done)return;try{await loadQr();const q=qrcode(0,'M');q.addData(el.dataset.url,'Byte');q.make();el.innerHTML=q.createSvgTag(4,6);el.dataset.done='1';}catch(e){el.remove();}}

function alertsFor(u){const A=[];if(!u||u.role!=='coach')return A;
  const E=D().entries.filter(e=>e.coachId===u.id&&e.status!=='cancel');
  for(const c of D().comps){const [k]=compState(c);if(dday(c.date)<0)continue;const mine=E.filter(e=>e.compId===c.id),n=dday(c.deadline);
    if(k!=='closed'&&n<=7)A.push({lv:n<=2?'hot':'warn',t:`「${c.name}」 접수 마감 ${n===0?'오늘':'D-'+n} (${fmtDate(c.deadline)})`,s:mine.length?`이 대회에 ${mine.length}건 접수했습니다.`:'아직 접수하지 않았습니다.',a:`<a class="btn sm gold" href="#enter-${c.id}">${mine.length?'선수 더 접수':'접수하기'}</a>`});
    const wait=mine.filter(e=>e.status==='wait');
    if(wait.length)A.push({lv:'warn',t:`「${c.name}」 입금 확인 전 ${wait.length}건 · ${won(wait.reduce((s,e)=>s+e.fee,0))}`,s:`입금 계좌: ${c.account} · 입금자명은 「${u.org}」`,a:`<a class="btn sm" href="#entries">접수 내역</a>`});
    if(mine.length&&c.notice)A.push({lv:'info',t:`「${c.name}」 공지`,s:c.notice,a:''});}
  return A;}

    <span class="small mute" id="aSchool">${a.birth?'학년 추정: '+schoolTxt(a.birth):'생년월일을 넣으면 학년과 부별을 자동으로 맞춥니다.'}</span>
    <label class="check" id="aGuard" ${ag!==null&&ag<14?'':'hidden'}><input type="checkbox" id="aGuardOk" ${a.guardian?'checked':''}><span><b>만 14세 미만 선수: 보호자 동의를 받았습니다 (필수)</b> · 법에 따라 만 14세 미만의 개인정보는 보호자(법정대리인) 동의가 있어야 모을 수 있습니다.</span></label>

/* ---------- 대회 접수 ---------- */
function entryLabel(e){const f=e.f||{};const names=e.athleteIds.map(id=>(D().athletes.find(a=>a.id===id)||{}).name||'(삭제됨)');
  if(e.sport==='poomsae')return {who:f.team?`${f.team} (${names.length}명)`:names.join(' · '),what:`${f.type}${isTeamT(f.type)?'':' '+f.kind} · ${f.div}${f.grade?' '+f.grade:''}`};
  if(e.sport==='kyorugi')return {who:names[0],what:`${f.div}${f.grade?' '+f.grade:''} · ${f.weight}`};
  if(e.sport==='hero'){const a=D().athletes.find(x=>x.id===e.athleteIds[0])||{};return {who:names[0],what:`${f.div} · ${a.gender==='여'?'여자부':'남자부'}`};}
  return {who:names.join(' · '),what:`${f.ev} · ${f.div}${f.weight?' · '+f.weight+'kg':''}${f.height?' · '+f.height+'cm':''}`};}
function entryForm(c,tab,a){const f=UI.form||defaults(tab,a);UI.form=f;const L=myAth(),sport=TABS[tab].sp,fixed=TABS[tab].type;

    if(TT){const n=1+(f.mates||[]).length;
    h=`<div class="grid2"><label class="f"><span>종목</span><input type="text" value="${esc(f.type==='팀대항 종합경연'?'팀 대항 종합경연':f.type)} (단체)" disabled></label>
      <label class="f"><span>팀 이름 <i>*</i> (전광판에 나옵니다)</span><input type="text" id="eTeam" value="${esc(f.team||'')}" placeholder="예: 경민 시범단 A" data-on="ef" data-k="team"></label>
      <label class="f"><span>부별</span>${sel('eDiv',PS_DIV,f.div,'data-on="ef" data-k="div"')}</label>
      <label class="f"><span>학년 (초·중·고)</span>${sel('eGrade',PS_GRADE,f.grade,'data-on="ef" data-k="grade"')}</label></div>
      <div class="stack" style="gap:6px"><span class="small"><b>팀원 고르기</b> · 이 선수 포함 ${TT.min}~${TT.max}명${TT.w?' · 여자 1~2명 이상':''} · 지금 <b>${n}명</b></span>${L.filter(x=>x.id!==a.id).map(x=>`<label class="check"><input type="checkbox" data-on="mate" value="${x.id}" ${(f.mates||[]).includes(x.id)?'checked':''}><span>${esc(x.name)} <span class="small mute">${x.gender} · ${schoolTxt(x.birth)}</span></span></label>`).join('')||'<span class="small mute">팀원으로 고를 선수를 「내 선수」에 먼저 등록하거나, 위쪽 「엑셀로 한꺼번에 접수」를 쓰세요.</span>'}</div>`;
    }else
    h=`<div class="grid2"><label class="f"><span>구분</span>${sel('eType',['공인','자유'],f.type,'data-on="ef" data-k="type"')}</label>

      <label class="f"><span>부별</span>${sel('eDiv',PS_DIV,f.div,'data-on="ef" data-k="div"')}</label>
      <label class="f"><span>학년 (초·중·고)</span>${sel('eGrade',PS_GRADE,f.grade,'data-on="ef" data-k="grade"')}</label></div>
      ${need>1?`<div class="stack" style="gap:6px"><span class="small"><b>함께 나갈 팀원 ${need-1}명</b> (복식 2명 · 단체 3명)</span>${L.filter(x=>x.id!==a.id).map(x=>`<label class="check"><input type="checkbox" data-on="mate" value="${x.id}" ${(f.mates||[]).includes(x.id)?'checked':''}><span>${esc(x.name)} <span class="small mute">${x.gender} · ${schoolTxt(x.birth)}</span></span></label>`).join('')||'<span class="small mute">팀원으로 고를 선수가 더 필요합니다.</span>'}</div>`:''}`;
  }else if(sport==='kyorugi'){
    const named=['초등부','중등부','고등부'].includes(f.div),WL=kyW(f.div,f.grade,a.gender),list=[{v:'',l:WL.length?'체급 고르기':f.div==='초등부'?'학년을 먼저 고르세요':'체급 고르기'},...WL];
    h=`<div class="grid3"><label class="f"><span>부별</span>${sel('eDiv',KY_DIV,f.div,'data-on="ef" data-k="div"')}</label>
      <label class="f"><span>학년${f.div==='초등부'?' <i>*</i>':''}</span>${sel('eGrade',['','1학년','2학년','3학년','4학년','5학년','6학년'],f.grade,'data-on="ef" data-k="grade"')}</label>
      <label class="f"><span>체급 <i>*</i></span>${sel('eWeight',list,f.weight,'data-on="ef" data-k="weight"')}</label></div>
      <span class="small mute"><span>2026 겨루기 경기규칙 제5조 · ${f.div}${f.div==='초등부'?' '+({초저:'저학년부(1·2학년)',초중:'중학년부(3·4학년)'}[kyKey(f.div,f.grade,a.gender)]||'고학년부(5·6학년)'):''} ${a.gender}자 체급입니다.</span> <span>${a.weight?`등록 체중 ${a.weight}kg${kyGuess(WL,a.weight)?` → ${kyGuess(WL,a.weight)} 추천`:''}`:''}</span></span>`;
  }else if(sport==='hero'){
    h=`<div class="grid2"><label class="f"><span>부별 <i>*</i></span>${sel('eDiv',HR_DIV,f.div,'data-on="ef" data-k="div"')}</label>
      <label class="f"><span>성별 (선수 정보)</span><input type="text" value="${esc(a.gender)}자부" disabled></label></div>
      <span class="small mute">유아 장애물 스피드 경기입니다. 부별(반 이름 기준 나이)과 성별로 부문이 나뉩니다. 생년월일로 미리 맞춰 두었으니 확인만 해 주세요.</span>`;
  }else{
    const ev=GP_EV.find(x=>x.n===f.ev)||GP_EV[3];const lv=ev.k==='power'||ev.k==='team'?['대학부',...GP_LV]:GP_LV;

      ${ev.k==='height'?`<label class="f"><span>신장 cm <i>*</i></span><input type="number" id="eH" step="0.1" value="${esc(f.height||'')}" data-on="ef" data-k="height"></label>`:''}</div>

  }
  return `<div class="form"><div class="row between"><h3>${esc(a.name)} <span class="small mute">${a.gender} · ${schoolTxt(a.birth)}</span></h3><button class="btn sm ghost" type="button" data-a="pickClose">닫기</button></div>
    ${h}${UI.err?`<span class="err">${esc(UI.err)}</span>`:''}
    <div class="row between"><span class="small mute">참가비 ${won(c.fee[sport])}${fixed?' (1팀)':''}</span><button class="btn gold" type="button" data-a="addEntry">접수 목록에 넣기</button></div></div>`;}
function vEnter(id){const c=D().comps.find(x=>x.id===id);if(!c)return '<div class="empty">대회를 찾지 못했습니다.</div>';
  if(compState(c)[0]==='closed')return `<div class="empty">접수가 끝난 대회입니다. <a href="#home">대회 일정</a></div>`;
  if(!offers(c,UI.tab))UI.tab=tabsOf(c)[0];
  const u=me(),L=myAth(),sport=UI.tab;
  const mine=D().entries.filter(e=>e.compId===c.id&&e.coachId===u.id&&e.status!=='cancel');
  const cart=(UI.cart||[]).filter(e=>e.compId===c.id);
  const inSport=new Set([...mine,...cart].filter(e=>tabOfEntry(e)===sport).flatMap(e=>e.athleteIds));
  const total=cart.reduce((s,e)=>s+e.fee,0);

    <div><span class="eyebrow">Entry</span><h1>${esc(c.name)}</h1><p class="mute" style="margin:6px 0 0">${fmtDate(c.date)} · ${esc(c.place)} · 마감 ${fmtDate(c.deadline)}</p></div>
    ${bulkCard(c)}
    <div class="desk"><div class="stack">
      <div class="tabs">${tabsOf(c).map(s=>`<button type="button" class="${s===sport?'on':''}" data-a="tab" data-s="${s}">${TABS[s].n}</button>`).join('')}</div>
      <p class="small mute" style="margin:0">${TABS[sport].type?`팀 대표 선수 한 명을 누르고, 팀 이름과 팀원을 고르세요. ${sport==='gym'?'태권체조는 7~9명':'팀 대항 종합경연은 9~13명(여자 1~2명 이상)'}입니다.`:`선수를 누르면 ${TABS[sport].n} 접수 칸이 열립니다. 부별·학년은 생년월일로 미리 맞춰 두었으니 확인만 해 주세요.`}</p>
      ${L.length?L.map(a=>{const done=inSport.has(a.id);return `<div class="ath ${UI.pick===a.id?'picked':''}"><div><span class="nm">${esc(a.name)}</span> <span class="small mute">${a.gender} · ${schoolTxt(a.birth)}${a.weight?' · '+a.weight+'kg':''}</span></div>
        ${done?'<span class="chip open">접수함</span>':`<button class="btn sm ${UI.pick===a.id?'':'gold'}" type="button" data-a="pick" data-id="${a.id}">${UI.pick===a.id?'작성 중':TABS[sport].type?'이 선수로 팀 만들기':'접수'}</button>`}</div>
        ${UI.pick===a.id?entryForm(c,sport,a):''}`;}).join(''):'<div class="empty">먼저 「내 선수」에서 선수를 등록해 주세요. <a href="#athletes">선수 등록하러 가기</a></div>'}
    </div>

      ${cart.length?cart.map((e,i)=>{const l=entryLabel(e),T=TABS[tabOfEntry(e)];return `<div class="line"><div><span class="chip ${T.c}">${T.n}</span> <b>${esc(l.who)}</b><div class="small mute">${esc(l.what)}</div></div>
        <div style="text-align:right"><span class="num">${won(e.fee)}</span><br><button class="btn sm ghost" type="button" data-a="cartDel" data-i="${i}">빼기</button></div></div>`;}).join(''):'<span class="small mute">아직 넣은 선수가 없습니다.</span>'}

/* ---------- 엑셀 일괄 접수 (지도자) ----------

  if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];if(y<1930||y>YEAR||mo<1||mo>12||d<1||d>31)return null;return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

function bulkParse(wb,c){
  const u=me(),errs=[],ents=[],P=new Map(),mine=myAth(),newA=[];
  const done=new Set([...D().entries.filter(e=>e.compId===c.id&&e.coachId===u.id&&e.status!=='cancel'),...(UI.cart||[]).filter(e=>e.compId===c.id)]
    .flatMap(e=>e.athleteIds.map(id=>e.sport+'|'+(e.sport==='poomsae'?(e.f.type||'공인'):e.sport==='gyeokpa'?e.f.ev:'')+'|'+id)));
  const person=(r,sh,ri)=>{const name=String(r.name||'').trim(),gender=normG(r.gender),birth=normBirth(r.birth);
    if(!gender){errs.push([sh,ri,`${name}: 성별(남/여)을 확인해 주세요`]);return null;}
    if(birth===null){errs.push([sh,ri,`${name}: 생년월일을 2014-03-05 처럼 적어 주세요`]);return null;}
    const key=name+'|'+(birth||gender);if(P.has(key))return P.get(key);

    if(!ex)newA.push(p);P.set(key,p);return p;};
  let rowsN=0;const groups=new Map();
  for(const sh of wb.SheetNames){const meta=BULK_SH[sh.replace(/\s+$/,'')];if(!meta)continue;
    const A=XLSX.utils.sheet_to_json(wb.Sheets[sh],{header:1,defval:'',raw:true});if(!A.length)continue;
    const H=A[0].map(x=>String(x).replace(/[*★]/g,'').replace(/\(.*?\)/g,'').trim());
    const col=(...ks)=>{for(const k of ks){const i=H.findIndex(h=>h===k);if(i>=0)return i;}for(const k of ks){const i=H.findIndex(h=>h.startsWith(k));if(i>=0)return i;}return -1;};
    const ix={name:col('이름'),gender:col('성별'),birth:col('생년월일'),org:col('소속'),kind:col('종목'),div:col('부별'),grade:col('학년'),team:col('팀 이름','팀이름','팀명'),weight:col('체급'),kg:col('체중'),height:col('신장')};
    if(ix.name<0){errs.push([sh,1,'「이름」 칸을 찾지 못했습니다']);continue;}
    if(!c.sports.includes(meta.sp)){if(A.slice(1).some(r=>String(r[ix.name]||'').trim()&&!/\(예시\)/.test(r[ix.name])))errs.push([sh,'',`이 대회에는 ${SPORTS[meta.sp].n} 종목이 없습니다. 이 시트는 접수하지 않습니다`]);continue;}
    for(let i=1;i<A.length;i++){const R=A[i],g=k=>ix[k]>=0?R[ix[k]]:'';const nm=String(g('name')||'').trim();if(!nm||/\(예시\)/.test(nm))continue;rowsN++;
      const ri=i+1,r={name:nm,gender:g('gender'),birth:g('birth'),org:g('org'),weight:meta.sp==='kyorugi'||meta.sp==='gyeokpa'?g('kg'):'',height:g('height')};
      const div=String(g('div')||'').trim(),grade=String(g('grade')||'').trim(),team=String(g('team')||'').trim();
      if(!div){errs.push([sh,ri,`${nm}: 부별을 골라 주세요`]);continue;}

        if(kind==='개인')ents.push({sp:'poomsae',f:{type:meta.type,kind,div,grade},P:[p],rows:[ri],sh});
        else{if(!team){errs.push([sh,ri,`${nm}: ${TT?meta.type:kind}은(는) 「팀 이름」을 적어 주세요`]);continue;}
          const k=sh+'|'+team;if(!groups.has(k))groups.set(k,{sp:'poomsae',f:{type:meta.type,kind,div,grade,team},P:[],rows:[],sh});const G=groups.get(k);
          if(G.f.kind!==kind){errs.push([sh,ri,`${nm}: 같은 팀(${team})인데 종목이 다릅니다`]);continue;}if(!G.P.includes(p)){G.P.push(p);G.rows.push(ri);}}}
      else if(meta.sp==='kyorugi'){const w=String(g('weight')||'').trim();if(!w){errs.push([sh,ri,`${nm}: 체급을 골라 주세요`]);continue;}
        if(!KY_DIV.includes(div)){errs.push([sh,ri,`${nm}: 「${div}」는 겨루기 부별 목록에 없습니다`]);continue;}

      else{const ev=GP_EV.find(x=>x.n===String(g('kind')||'').trim());if(!ev){errs.push([sh,ri,`${nm}: 격파 종목을 목록에서 골라 주세요`]);continue;}
        const kg=g('kg'),cm=g('height');if(ev.k==='power'&&!Number(kg)){errs.push([sh,ri,`${nm}: 위력격파는 체중을 적어 주세요`]);continue;}if(ev.k==='height'&&!Number(cm)){errs.push([sh,ri,`${nm}: 높이 뛰어차기는 신장을 적어 주세요`]);continue;}
        const f={ev:ev.n,div,weight:kg?String(kg):'',height:cm?String(cm):''};
        if(ev.k==='team'){const k=sh+'|'+(team||'팀');if(!groups.has(k))groups.set(k,{sp:'gyeokpa',f:{...f,team:team||''},P:[],rows:[],sh});const G=groups.get(k);if(!G.P.includes(p)){G.P.push(p);G.rows.push(ri);}}
        else ents.push({sp:'gyeokpa',f,P:[p],rows:[ri],sh});}}}
  for(const G of groups.values()){const T=TEAM_T[G.f.type],n=G.P.length,rr=G.rows.join(', ');
    if(G.sp==='poomsae'&&T){if(n<T.min||n>T.max){errs.push([G.sh,rr,`「${G.f.team}」 팀은 ${n}명입니다. ${G.f.type}은(는) ${T.min}~${T.max}명입니다`]);continue;}
      if(T.w&&!G.P.some(p=>p.gender==='여')){errs.push([G.sh,rr,`「${G.f.team}」 팀에 여자 선수가 없습니다 (여자 1~2명 이상)`]);continue;}}

async function saveXlsx(rows,name,sheet,okMsg){
  if(!window.XLSX){toast('엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요');return;}
  const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map(h=>({wch:Math.max(8,String(h).length*2+4)}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sheet);
  return saveBytes(new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'})),name.replace(/[\\/:*?"<>|]/g,''),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',okMsg);
}
async function saveBytes(data,name,mime,okMsg){
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data});toast(okMsg);return;}}}catch(e){if(e&&e.code==='declined')return;}
  try{const u=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},3000);toast(okMsg);}
  catch(e){toast('이 화면에서는 파일을 내려받을 수 없습니다');}
}

  rows[0]=[...rows[0],'나라','English Name'];E.forEach((e,i)=>{if(!rows[i+1])return;const A=e.athleteIds.map(ath),co=coachOf(e.coachId);
    rows[i+1]=[...rows[i+1],[...new Set(A.map(a=>a.country||co.country||'KOR'))].join(','),A.map(a=>a.nameEn||'').filter(Boolean).join(',')];});return rows;}

  else if(a==='delComp'){const id=b.dataset.id;if(UI.delCompArm!==id){UI.delCompArm=id;render();setTimeout(()=>{if(UI.delCompArm===id){UI.delCompArm=null;render();}},5000);return;}
    run(async()=>{const c=S.comps.find(x=>x.id===id);await q(sb.from('comps').delete().eq('id',id));UI.delCompArm=null;UI.adminComp=null;UI.atab='status';await reload();toast(`「${c?c.name:'대회'}」를 지웠습니다`);});}
});
document.addEventListener('change',e=>{
  const t=e.target,on=t.dataset&&t.dataset.on;
  if(on==='ef'&&t.type==='number'){UI.form={...UI.form,[t.dataset.k]:t.value};return;}
  if(on==='ef'&&t.dataset.k==='team'){UI.form={...UI.form,team:t.value};return;}
  if(on==='ef'){UI.form={...UI.form,[t.dataset.k]:t.value};if((t.dataset.k==='div'||t.dataset.k==='grade')&&UI.tab==='kyorugi'){const a=D().athletes.find(x=>x.id===UI.pick)||{};const WL=kyW(UI.form.div,UI.form.grade,a.gender);if(!WL.some(x=>x.v===UI.form.weight))UI.form.weight=kyGuess(WL,a.weight);}
    if(t.dataset.k==='type'&&isTeamT(t.value))UI.form.kind='단체';
    if(t.dataset.k==='ev'){const ev=GP_EV.find(x=>x.n===t.value);if((ev.k==='power'||ev.k==='team')&&!['대학부',...GP_LV].includes(UI.form.div))UI.form.div='대학부';}
    UI.err='';render();}
  else if(on==='mate'){const s=new Set(UI.form.mates||[]);t.checked?s.add(t.value):s.delete(t.value);const tm=(document.getElementById('eTeam')||{}).value;UI.form={...UI.form,mates:[...s],...(tm!=null?{team:tm}:{})};if(isTeamT(UI.form.type))render();}
  else if(on==='bulk'){const F=t.files&&t.files[0];t.value='';if(F)bulkRead(F);}
  else if(on==='bulkGuard'){UI.bulkOk=t.checked;}
  else if(on==='fieldBase'){let v=t.value.trim();if(v&&!/^https?:\/\//.test(v))v='http://'+v;try{localStorage.setItem('ks_field_base',v||'http://localhost:8080');}catch(e){}t.value=v||'http://localhost:8080';}
  else if(on==='adComp'){UI.adminComp=t.value;render();}
  else if(on==='ceOrient'){document.querySelectorAll('.seg2 label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));certPreview();}
  else if(on==='ceBg'){const F=t.files&&t.files[0];if(!F)return;run(async()=>{UI.certBg=await uploadCertBg(F);toast('배경 사진을 올렸습니다. 「상장 설정 저장」을 눌러 주세요');certPreview();});}
  else if(on==='ceLang'){document.querySelectorAll('.seg2 label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));const fx=document.getElementById('ceFx');if(fx)fx.hidden=t.value==='ko';certPreview();}
  else if(on==='ceFlang'){certPreview();}
  else if(on==='ceStyle'){document.querySelectorAll('.stylepick .sp').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));const pz=document.getElementById('cePhoto');if(pz)pz.hidden=t.value!=='photo';certPreview();}
  else if(on==='licDate'){const d=t.value;UI.licForm={...(UI.licForm||{kind:'event'}),date:d,starts:'',ends:'',holder:(document.getElementById('lcHolder')||{}).value||'',contact:(document.getElementById('lcContact')||{}).value||'',note:(document.getElementById('lcNote')||{}).value||''};render();}
  else if(on==='resOpen'){const c=UI.adminComp,v=t.checked;run(async()=>{await q(sb.from('comps').update({results_open:v}).eq('id',c));await reload();toast(v?'지도자에게 결과·상장을 공개했습니다':'결과·상장을 비공개로 바꿨습니다');});}
  else if(on==='resCoach'){const id=t.dataset.id,v=t.value||null;run(async()=>{await q(sb.from('results').update({coach_id:v}).eq('id',id));await reload();toast(v?'지도자를 연결했습니다':'연결을 풀었습니다');});}
  else if(on==='birth'){const g=document.getElementById('aGuard'),s=document.getElementById('aSchool'),ag=age(t.value);if(g)g.hidden=!(ag!==null&&ag<14);if(s)s.textContent=t.value?'학년 추정: '+schoolTxt(t.value):'';}
});
let PREVT=0;
/* 엑셀 파일 끌어다 놓기 */
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#bulkDrop');if(!d)return;e.preventDefault();d.classList.add('over');}));
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#bulkDrop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#bulkDrop');if(!d)return;e.preventDefault();d.classList.remove('over');const F=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(F)bulkRead(F);});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='ctText'&&UI.contact){UI.contact.text=t.value;const a=document.getElementById('ctSms');if(a)a.href=smsHref(coachOf(UI.contact.id).phone,t.value);return;}
  if(/^ce(Host|Title|Rep|Date)$/.test(t.id)){clearTimeout(PREVT);PREVT=setTimeout(certPreview,250);return;}
  if(t.id==='memQ'){const v=t.value.trim().toLowerCase();document.querySelectorAll('#memT tr[data-q]').forEach(r=>{r.hidden=!!v&&!r.dataset.q.includes(v);});return;}if(t.dataset&&t.dataset.on==='ef'&&t.type==='number'){UI.form={...UI.form,[t.dataset.k]:t.value};}});
function formErr(f,m){let el=f.querySelector('.err');if(!el){el=document.createElement('span');el.className='err';const btn=f.querySelector('button[type=submit]');(btn&&btn.closest('.row')||btn||f).before(el);}el.textContent=m;el.setAttribute('role','alert');}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=id=>(document.getElementById(id)||{}).value||'';
  if(f.id==='fLogin')run(async()=>{const {data,error}=await sb.auth.signInWithPassword({email:v('lEmail').trim(),password:v('lPw')});
    if(error){formErr(f,msgOf(error));return;}await reload();const u=me();go(u&&u.role==='admin'?'admin':'home');toast(`${u?u.name:''}님, 반갑습니다`);});
  else if(f.id==='fSignup')run(async()=>{
    if(v('sPw').length<6){formErr(f,'비밀번호는 6자 이상으로 해 주세요');return;}
    const {data,error}=await sb.auth.signUp({email:v('sEmail').trim(),password:v('sPw'),options:{data:{name:v('sName').trim(),org:v('sOrg').trim(),phone:v('sPhone').trim(),license:v('sLic').trim(),country:v('sNat')||'KOR'},emailRedirectTo:location.origin+location.pathname}});
    if(error){formErr(f,msgOf(error));return;}
    if(!data.session){f.innerHTML=`<span class="eyebrow">Check your email</span><h2>가입 확인 메일을 보냈습니다</h2><p class="mute">${esc(v('sEmail'))} 메일함에서 「Confirm your signup」 메일의 링크를 누르면 가입이 끝납니다. 그다음 로그인해 주세요.</p><a class="btn gold" href="#login">로그인 화면으로</a>`;return;}
    await reload();go('athletes');toast('가입했습니다. 이제 선수를 등록해 주세요');});
  else if(f.id==='fAth'){const birth=v('aBirth'),ag=age(birth),guard=document.getElementById('aGuardOk');
    if(ag!==null&&ag<14&&!(guard&&guard.checked)){formErr(f,'만 14세 미만 선수는 보호자 동의를 확인해 주세요');return;}
    const data={name:v('aName').trim(),gender:v('aGender'),birth:birth||null,org:v('aOrg').trim()||me().org,weight:Number(v('aWeight'))||null,height:Number(v('aHeight'))||null,guardian:!!(guard&&guard.checked&&ag<14)};if(M.hasNat){data.country=v('aNat')||me().country||'KOR';data.name_en=v('aNameEn').trim();}
    run(async()=>{if(UI.editAth){await q(sb.from('athletes').update(data).eq('id',UI.editAth));toast('선수 정보를 고쳤습니다');}
      else{await q(sb.from('athletes').insert(data));toast(`${data.name} 선수를 등록했습니다`);}
      UI.editAth=null;UI.err='';await reload();});}
  else if(f.id==='fComp'){const sports=Object.keys(SPORTS).filter(k=>document.getElementById('cS_'+k).checked),editId=f.dataset.id;
    if(!sports.length){formErr(f,'종목을 하나 이상 골라 주세요');return;}
    if(v('cDead')>v('cDate')){formErr(f,'접수 마감일은 대회일보다 앞이어야 합니다');return;}
    const old=editId?D().comps.find(x=>x.id===editId):null,link=v('cDocUrl').trim(),file=(document.getElementById('cDoc')||{}).files,del=document.getElementById('cDocDel');
    if(link&&!/^https?:\/\//i.test(link)){formErr(f,'요강 링크는 https:// 로 시작하는 주소로 넣어 주세요');return;}
    if(file&&file[0]&&file[0].size>20*1024*1024){formErr(f,'요강 파일은 20MB까지 올릴 수 있습니다');return;}
    const c={name:v('cName').trim(),place:v('cPlace').trim(),date:v('cDate'),deadline:v('cDead'),sports,fee:{...Object.fromEntries(sports.map(k=>[k,Number(v('cF_'+k))||0])),gym:!!(document.getElementById('cO_gym')||{}).checked,team100:!!(document.getElementById('cO_team100')||{}).checked},account:v('cAcct').trim()||'입금 계좌를 적어 주세요',note:v('cNote').trim(),notice:v('cNotice').trim(),contact:v('cContact').trim()};
    if(!editId)c.host='KICKSTART UP';
    run(async()=>{let doc=null;
      if(file&&file[0]){const F=file[0],ext=(F.name.match(/\.[A-Za-z0-9]{1,5}$/)||['.pdf'])[0].toLowerCase(),path=`${editId||'new'}/${Date.now()}${ext}`;
        const {error}=await sb.storage.from('comp-docs').upload(path,F,{upsert:true,contentType:F.type||undefined});if(error){formErr(f,msgOf(error));return;}
        doc={doc_url:sb.storage.from('comp-docs').getPublicUrl(path).data.publicUrl,doc_name:F.name};}
      else if(link)doc={doc_url:link,doc_name:old&&old.docUrl===link?old.docName:'링크'};
      else if(del&&del.checked)doc={doc_url:'',doc_name:''};
      Object.assign(c,doc||{});
      if(editId){await q(sb.from('comps').update(c).eq('id',editId));UI.err='';await reload();toast('대회 정보를 고쳤습니다');}
      else{const r=await q(sb.from('comps').insert(c).select());UI.newComp=false;UI.adminComp=r&&r[0]&&r[0].id;UI.err='';await reload();toast('대회를 만들었습니다. 「대회 일정」에 바로 보입니다');}});}
  else if(f.id==='fLic'){const fm=UI.licForm||{kind:'event'},holder=v('lcHolder').trim(),starts=v('lcStarts'),ends=v('lcEnds');
    if(!holder){formErr(f,'받는 곳을 적어 주세요');return;}if(!starts||!ends){formErr(f,fm.kind==='event'?'대회 날짜를 골라 주세요':'기간을 정해 주세요');return;}if(ends<starts){formErr(f,'끝나는 날이 시작하는 날보다 앞입니다');return;}
    const row={code:newCode(),kind:fm.kind||'event',holder,contact:v('lcContact').trim(),starts,ends,note:v('lcNote').trim()};
    run(async()=>{await q(sb.from('licenses').insert(row));UI.licForm=null;UI.licNew=row.code;UI.err='';await reload();toast('허가 코드를 만들었습니다');});}
  else if(f.id==='fCert'){const c=D().comps.find(x=>x.id===UI.adminComp);if(!c)return;
    const cert=certForm(c);
    if(cert.style==='photo'&&!cert.bg){formErr(f,'배경 사진을 먼저 골라 주세요');return;}
    run(async()=>{await q(sb.from('comps').update({cert}).eq('id',c.id));UI.certBg=undefined;await reload();toast('상장 설정을 저장했습니다');});}
  else if(f.id==='fMe'){const d={name:v('mName').trim(),org:v('mOrg').trim(),phone:v('mPhone').trim(),license:v('mLic').trim()};if(M.hasNat&&v('mNat'))d.country=v('mNat');
    if(!d.name||!d.org||!d.phone){formErr(f,'이름·소속·휴대폰을 모두 적어 주세요');return;}
    run(async()=>{await q(sb.from('profiles').update(d).eq('id',me().id));await reload();toast('내 정보를 저장했습니다');});}
  else if(f.id==='fPw'||f.id==='fPwReset'){const p1=v('pw1'),p2=v('pw2');
    if(p1.length<6){formErr(f,'비밀번호는 6자 이상으로 해 주세요');return;}if(p1!==p2){formErr(f,'두 비밀번호가 서로 다릅니다');return;}
    run(async()=>{const {error}=await sb.auth.updateUser({password:p1});if(error){formErr(f,msgOf(error));return;}
      f.reset();UI.recovery=false;toast('비밀번호를 바꿨습니다. 다음부터 새 비밀번호로 로그인하세요');if(f.id==='fPwReset')go('home');});}
  else if(f.id==='fForgot'){const em=v('fgEmail').trim();
    run(async()=>{const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(error){formErr(f,msgOf(error));return;}
      f.innerHTML=`<b>${esc(em)}</b><span class="mute small">로 비밀번호 재설정 메일을 보냈습니다. 메일의 링크를 누르면 새 비밀번호를 정하는 화면이 열립니다. 메일이 오지 않으면 대회 본부에 임시 비밀번호를 요청해 주세요.</span>`;});}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.contact){UI.contact=null;render();}});
applyDir();render();trTree(document.body);reload();
</script>
