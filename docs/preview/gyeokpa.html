<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>격파 앱 미리보기</title>
<style>body{margin:0;font:16px -apple-system,"Noto Sans KR",sans-serif;background:#0B0D12;color:#EEE;display:grid;place-items:center;min-height:100vh}</style></head>
<body><div id="msg">격파 앱을 불러오는 중…</div>
<script>
/* 개발 확인용 미리보기: GitHub 저장소의 최신 경기 앱을 그대로 불러와 엽니다 (현장 프로그램과 같은 파일).
   여기서 넣은 데이터는 이 기기(브라우저)에만 저장되고, 실제 대회 데이터와 섞이지 않습니다. */
(async function(){
  const src='https://raw.githubusercontent.com/liketkd-jpg/kickstart-field/main/server/assets/apps/gyeokpa.html';
  try{const r=await fetch(src+'?t='+Math.floor(Date.now()/60000),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    let h=await r.text();
    const tag='<div style="position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:99999;background:#7A4B00;color:#FFE7B8;font:700 12px/1.4 sans-serif;padding:4px 12px;border-radius:999px;pointer-events:none;opacity:.92">미리보기 · 이 기기에만 저장</div>';
    h=h.replace(/<\/body>/i,tag+'</body>');if(!/미리보기 · 이 기기에만/.test(h))h+=tag;
    document.open();document.write(h);document.close();
  }catch(e){document.getElementById('msg').textContent='불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요. ('+e.message+')';}
})();
</script></body></html>
