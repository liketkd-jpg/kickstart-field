      s2:['Top bar: lane, hero and division; a green dot means connected.','FINISH!: tap when the child arrives.','Penalties: + / − per station.','Undo finish.'],tip:'Phone entries go straight to the operator laptop. Refresh the phone if it shows an old screen.'}},
 {id:'faq',img:[],
  ko:{t:'자주 묻는 문제',lead:'',faq:[['무선 버튼을 눌러도 기록이 안 찍혀요','위쪽 「버튼 입력 준비됨」이 초록인지 보세요. 회색이면 운영 화면을 한 번 클릭하세요. 전광판 창이 앞에 있으면 운영 창을 클릭해야 합니다.'],['화면에 「연습용 · PRACTICE」가 보여요','허가 코드를 넣지 않은 연습 모드입니다. 위쪽 「허가 코드」에서 코드를 넣으세요.'],['선수가 20명 이상 안 들어가요','연습 모드는 20명까지입니다. 허가 코드를 넣으면 풀립니다.'],['전광판 새 창이 안 열려요','크롬 주소창 오른쪽의 팝업 차단 표시를 눌러 허용하거나, 「전광판」 탭을 쓰세요.'],['심판 폰이 연결이 안 돼요','운영 노트북과 같은 와이파이인지, 연결 창이 초록인지 확인하고 휴대폰을 새로고침하세요.'],['결과를 잘못 확정했어요','조 목록에서 그 조를 누르고 「이 조 다시 하기」를 두 번 누르면 다시 뛸 수 있습니다.'],['영어로 진행하고 싶어요','위쪽 EN을 누르세요. 대회 이름 영어 칸과 선수 영문 이름 칸을 채우면 전광판도 영어로 나옵니다.']]},
  en:{t:'FAQ',lead:'',faq:[['Wireless buttons don’t record','Check that “Buttons ready” at the top is green. If grey, click the operator screen once (also after using the scoreboard window).'],['The board says “PRACTICE”','Practice mode: enter a license code at the top.'],['Can’t add more than 20 runners','Practice mode limit. A license code removes it.'],['The scoreboard window won’t open','Allow pop-ups in Chrome’s address bar, or use the Scoreboard tab.'],['A judge phone won’t connect','Same Wi-Fi as the laptop, connection window green, then refresh the phone.'],['I confirmed a heat by mistake','Open that heat in the heat list and press “Rerun this heat” twice.'],['Run the event in English','Press EN. Fill the English event name and English runner names for the board.']]}}];
let MAN=null;
function manOpen(id){MAN={id:id||(MAN&&MAN.id)||'start'};manDraw()}
function manClose(){const b=document.querySelector('.manov');if(b)b.remove();MAN=null}
function manDraw(){if(!MAN)return;let ov=document.querySelector('.manov');if(!ov){ov=document.createElement('div');ov.className='licov manov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');document.body.appendChild(ov)}
  const L=S.lang==='en'?'en':'ko',sec=HMAN.find(x=>x.id===MAN.id)||HMAN[0],c=sec[L],I=window.HMAN_IMG||{};
  const ol=a=>a&&a.length?`<ol class="mansteps">${a.map((x,i)=>`<li><i>${i+1}</i><span>${esc(x)}</span></li>`).join('')}</ol>`:'';
  const fig=k=>I[k]?`<figure class="${k==='phone'?'ph':''}"><img src="${I[k]}" alt="${esc(c.t)}" loading="lazy"></figure>`:'';
  let body='';
  if(c.faq)body=`<div class="manfaq">${c.faq.map(([q,a])=>`<details open><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div>`;
  else if(sec.img.length===2&&c.s2)body=sec.id==='judge'?`<div class="man2">${fig(sec.img[0])}<div>${ol(c.s)}</div></div><div class="man2 ph2">${fig(sec.img[1])}<div>${ol(c.s2)}</div></div>`:`${fig(sec.img[0])}${ol(c.s)}${fig(sec.img[1])}${ol(c.s2)}`;
  else body=sec.img.map(fig).join('')+ol(c.s);
  const ix=HMAN.indexOf(sec),prev=HMAN[ix-1],next=HMAN[ix+1];
  ov.innerHTML=`<div class="licbox manbox"><div class="manhd"><b>📖 ${esc(t('manTitle'))}</b><button class="btn" data-act="manClose" aria-label="close">✕</button></div>
   <div class="manwrap"><nav class="mannav">${HMAN.map((x,i)=>`<button data-act="manGo" data-v="${x.id}" aria-pressed="${x.id===sec.id}"><i>${i+1}</i>${esc(x[L].t)}</button>`).join('')}</nav>
   <article class="manbody"><h3>${ix+1}. ${esc(c.t)}</h3>${c.lead?`<p class="manlead">${esc(c.lead)}</p>`:''}${body}${c.tip?`<p class="mantip">💡 ${esc(c.tip)}</p>`:''}
   <div class="manpn">${prev?`<button class="btn" data-act="manGo" data-v="${prev.id}">← ${esc(prev[L].t)}</button>`:'<span></span>'}${next?`<button class="btn gold" data-act="manGo" data-v="${next.id}">${esc(next[L].t)} →</button>`:''}</div></article></div></div>`;
  const a=ov.querySelector('.manbody');if(a)a.scrollTop=0}

/* ================= events ================= */
let toastT;
function toast(msg){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200)}
function resultsText(){
  stashDiv();const keep=S.dkey;const lines=[`${S.ev.name} — ${S.ev.div}`];
  divKeys().forEach(k=>{loadDiv(k);lines.push('',`■ ${k}`);
  S.rounds.forEach((r,ri)=>{lines.push(`[${roundLabel(ri)}]`);
    if(r.kind==='cut'){entries(r).forEach((x,ix)=>{const p=P(x.pid)||{};lines.push(`${x.tot!=null&&isFinite(x.tot)?ix+1:'-'}\t${p.name}\t${p.team}\t${x.dnf?'DNF':fmt(x.raw)}\t+${x.pen}\t${x.tot!=null&&isFinite(x.tot)?fmt(x.tot):''}`)})}
    else r.heats.forEach((h,hi)=>{lines.push(heatLabel(hi));heatOrder(h).concat([0,1,2,3].filter(i=>h.lanes[i]!=null&&total(h,i)==null)).forEach((i,k2)=>{const p=P(h.lanes[i])||{};lines.push(`  ${h.dnf[i]||total(h,i)==null?'-':k2+1}\t${p.name}\t${p.team}\t${h.dnf[i]?'DNF':fmt(h.time[i])}\t+${penSec(h,i)}\t${h.dnf[i]?'':fmt(total(h,i))}`)})})});
  if(S.champ)lines.push(`CHAMPION: ${P(S.champ.order[0])?.name||''}`);});
  if(keep)loadDiv(keep);
  return lines.join('\n');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;ac();
  if(ROLE==='judge'){judgeClick(a,b);return}
  if(a!=='arm'&&armed){armed=null}
  switch(a){
    case'tab':setTab(v);break;
    case'licOpen':licOpen();break;
    case'manOpen':manOpen();break;case'manClose':manClose();break;case'manGo':manOpen(v);break;
    case'cheerOpen':cheerOpen();break;case'cheerClose':cheerClose();break;
    case'cheerLane':cheerLane(+v).then(cheerDraw);cheerDraw();break;case'cheerAuto':cheerAuto().then(cheerDraw);cheerDraw();break;case'cheerWin':cheerWin();break;
    case'fxT':S.cfg.fx[v]=!S.cfg.fx[v];if(v==='cam'&&!S.cfg.fx.cam)camStop();commit();break;
    case'camOn':camStart();break;case'camOff':camStop();render();break;
    case'pwup':S.board='live';commit();fx('powerup');break;
    case'linkOpen':linkOpen();break;
    case'linkClose':linkClose();break;
    case'linkCopy':copyTxt(b.dataset.v);break;
    case'linkMode':S.cfg.link=v;commit();netRestart();break;
    case'licClose':licClose();break;
    case'licRe':licRecheck(true);break;
    case'licDel':lic=null;licSave();LICS.err='';licClose();render();send({t:'sync',S,R,L:licOk()});break;
    case'tpl':downloadTemplate();break;
    case'impReplace':addRoster(ui.importRows,true);ui.importRows=null;commit();toast(t('impDone'));break;
    case'impAppend':addRoster(ui.importRows,false);ui.importRows=null;commit();toast(t('impDone'));break;
    case'impCancel':ui.importRows=null;render();break;
    case'delP':S.roster=S.roster.filter(a=>a.id!==v);S.sampleRoster=false;commit();break;
    case'addP':{const g=id=>(document.getElementById(id)||{}).value||'';const name=g('addName').trim();if(!name){toast(t('needName'));break}
      ui.addG=g('addG');ui.addDiv=g('addDiv');addRoster([{name,team:g('addTeam').trim(),coach:g('addCoach').trim(),gender:ui.addG,div:ui.addDiv}],false);commit();
      setTimeout(()=>{const n=document.getElementById('addName');if(n)n.focus()},0);}break;
    case'pickDiv':pickDiv(v);break;
    case'stopFlow':clearFlow();render();break;
    case'openBoard':{const t0=Date.now();setTimeout(()=>{if(boardSeen<t0){toast(t('noWin'));setTab('board')}},2500)}break;

document.addEventListener('submit',async e=>{if(!e.target||e.target.id!=='rgLogin')return;e.preventDefault();e.stopPropagation();
  S.email=document.getElementById('rgE').value.trim();const pw=document.getElementById('rgP').value;S.busy=true;S.err='';draw();try{await login(S.email,pw);S.busy=false;S.step='list';await loadList();}
  catch(err){S.busy=false;S.err=err.message;draw();}},true);
document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-rgact]');if(!b)return;const a=b.dataset.rgact;
  if(a==='open'){e.preventDefault();open_();return;}
  if(a==='sendRes'){e.preventDefault();open_('send');return;}
  if(a!=='paidOnly'){e.preventDefault();e.stopPropagation();}
  if(a==='x')close_();
  else if(a==='logout'){A=null;saveA();S.step='login';S.err='';draw();}
  else if(a==='back'){S.step='list';S.E=null;S.sent=null;S.err='';draw();}
  else if(a==='paidOnly'){S.paidOnly=b.checked;draw();}
  else if(a==='pick'&&S.mode==='send'){S.comp=S.L.find(c=>c.id===b.dataset.id);S.sent=null;S.err='';
    try{S.res=window.AW&&AW.results?AW.results():{rows:[]};}catch(err){S.res={rows:[]};}S.step='send';draw();}
  else if(a==='send'){S.busy=true;S.err='';draw();
    try{S.sent=await publish(S.comp.id,S.res);say(`결과 ${S.sent.rows}건을 접수 홈페이지로 보냈습니다`);}catch(err){S.err=/관리자/.test(err.message)?'대회 본부(관리자) 계정만 결과를 보낼 수 있습니다.':/publish_results|function/i.test(err.message)?'홈페이지 데이터베이스에 결과 기능이 아직 없습니다. Supabase에서 3단계 SQL을 실행해 주세요.':err.message;}
    S.busy=false;draw();}
  else if(a==='pick'){S.comp=S.L.find(c=>c.id===b.dataset.id);S.busy=true;S.err='';draw();
    try{S.E=await roster(S.comp.id);S.step='preview';}catch(err){S.err=/관리자/.test(err.message)?'대회 본부(관리자) 계정만 명단을 가져올 수 있습니다. 관리자 계정으로 다시 로그인해 주세요.':err.message;if(!A)S.step='login';}
    S.busy=false;draw();}
  else if(a==='go'){const E=S.paidOnly?S.E.filter(x=>x.status==='paid'):S.E;S.busy=true;draw();
    try{const f=toFile(rows(sport(),E),`${S.comp.name}_${SP[sport()]}_접수명단.xlsx`);close_();await feed(f);say(`접수 홈페이지에서 ${E.length}건을 가져왔습니다`);}
    catch(err){S.busy=false;S.err=err.message;draw();}}
},true);

function attach(){document.querySelectorAll('.rpick:not([data-rg])').forEach(p=>{p.dataset.rg='1';const row=p.querySelector('.rprow');const d=document.createElement('div');d.className='rgline';
  d.innerHTML=`<button type="button" class="btn rgopen" data-rgact="open">🌐 접수 홈페이지에서 가져오기</button><span class="small muted">온라인 접수 명단을 바로 불러옵니다</span>`;(row||p).after(d);});}
new MutationObserver(()=>attach()).observe(document.documentElement,{childList:true,subtree:true});attach();
const css=document.createElement('style');css.textContent=`.rgline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rgopen{min-height:40px;padding:8px 14px;font-size:14px}
.rgsend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 4px;padding:10px 12px;border:1px dashed var(--line,#ddd);border-radius:12px}
.rgov{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.rgbox{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface,#fff);color:var(--ink,#111);border:1px solid var(--line,#ddd);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.rghd{display:flex;justify-content:space-between;align-items:center;gap:10px}.rghd b{font-size:17px}.rghd .btn{padding:6px 10px}
.rgf{display:flex;flex-direction:column;gap:10px}.rgf label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.rgf input{border:1px solid var(--line,#ccc);border-radius:10px;padding:10px;font:inherit;font-size:15px;background:var(--sunk,#fafafa);color:inherit}
.rgl{display:flex;flex-direction:column;gap:8px}
.rgc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line,#ddd);background:var(--sunk,#f7f7f7);color:inherit;border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit}
.rgc:hover{border-color:var(--green,#00B25B)}
.rgk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rgk div{border:1px solid var(--line,#ddd);border-radius:12px;padding:10px;background:var(--sunk,#f7f7f7)}
.rgk b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}.rgk span{font-size:12px;color:var(--muted,#777);font-weight:700}
.rgchk{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
.rgrow{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.rgerr{background:#FDECEC;color:#B3261E;border:1px solid #F3B8B8;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
.rgft{border-top:1px solid var(--line,#eee);padding-top:10px}.rglink{background:none;border:none;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}`;
(document.head||document.documentElement).appendChild(css);
