<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#07041a"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>태권 히어로 2 갤럭시</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@600;800&family=Black+Han+Sans&family=Jua&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: comic-book night city. Operator console (tabs) on top; the scoreboard is a full-bleed stage with four hero lanes. */
:root{
  --night:#07041a; --panel:#130b33; --panel2:#1e1450; --line:#3a2a8a; --ink:#020010;
  --paper:#eef4ff; --muted:#a9a2e0; --gold:#ffd23f; --neon:#38f2ff;
  --red:#ff3fd1; --blue:#22e5ff; --green:#b6ff3b; --yellow:#ff9a2e;
  --bad:#ff5d73; --good:#3be3a0; --silver:#d4dbef; --bronze:#e0894a;
  --f-hero:"Audiowide","Orbitron","Black Han Sans",Impact,sans-serif;
  --f-disp:"Black Han Sans","Bangers","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-num:"Orbitron",Consolas,ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(1.2px 1.2px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 60%,#fff6,transparent),radial-gradient(1.4px 1.4px at 45% 80%,#38f2ff99,transparent),radial-gradient(1px 1px at 85% 15%,#ff3fd199,transparent),linear-gradient(180deg,#07041a,#120a3a 60%,#1a0b40);background-size:180px 180px,240px 240px,300px 300px,210px 210px,100% 100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
kbd{font-family:var(--f-num);background:var(--ink);border:2px solid var(--line);border-radius:6px;padding:0 .4em;font-size:.85em}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);border-bottom:4px solid var(--gold);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{width:38px;height:38px;flex:none}
.logo b{font-family:var(--f-disp);font-weight:400;font-size:1.5rem;letter-spacing:.02em;color:var(--gold);text-shadow:2px 2px 0 var(--red);white-space:nowrap}
.logo small{display:block;font-size:.78rem;color:var(--muted);line-height:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:10px;padding:6px 14px;font-family:var(--f-disp);font-size:1rem}
.tabs button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.topright{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.focus{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.focus i{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}
.focus.on i{background:var(--good);box-shadow:0 0 8px var(--good)}
.lang{display:flex;border:3px solid var(--ink);border-radius:10px;overflow:hidden}
.lang button{background:var(--panel);border:0;padding:4px 10px;font-family:var(--f-num);font-weight:700}
.lang button[aria-pressed="true"]{background:var(--blue);color:var(--paper)}
.link{color:var(--gold);font-size:.9rem;text-decoration:none;border-bottom:2px dashed var(--gold)}

/* ---------- page ---------- */
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;max-width:1500px;margin:0 auto;display:grid;gap:18px}
.card{background:var(--panel);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:16px;padding:16px;min-width:0}
.card h2{margin:0 0 10px;font-family:var(--f-disp);font-weight:400;font-size:1.3rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px;text-wrap:balance}
.card h2 .tag{font-family:var(--f-hero);background:var(--red);color:var(--paper);padding:0 8px;border-radius:6px;transform:skew(-8deg);font-size:1rem;letter-spacing:.06em}
.help{color:var(--muted);font-size:.9rem;margin:0 0 10px;max-width:65ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
label.f{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
input[type=text],input[type=number],textarea,select{background:var(--night);border:2px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--paper);min-width:0;width:100%;box-sizing:border-box}
textarea{min-height:220px;resize:vertical;font-family:var(--f-body);line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--panel2);color:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:12px;padding:8px 14px;font-family:var(--f-disp);font-size:1rem;transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.red{color:var(--paper)}
.banner .btn,.flowpill .btn{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.banner .btn.red{background:var(--red)}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none}
.btn.armed{background:var(--bad);animation:pulse .5s infinite alternate}
.btn:disabled{opacity:.4;cursor:not-allowed}
@keyframes pulse{to{filter:brightness(1.3)}}
.modes{display:grid;gap:8px}
.mode{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;background:var(--night);border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
.mode input{margin-top:5px;accent-color:var(--gold)}
.mode b{font-family:var(--f-disp);font-weight:400}
.mode span{grid-column:2;color:var(--muted);font-size:.85rem}
.mode:has(input:checked){border-color:var(--gold)}
.sttable{display:grid;gap:8px}
.st{display:grid;grid-template-columns:2rem minmax(0,1.3fr) minmax(0,1.2fr) 6.5rem auto;gap:8px;align-items:center}
.st .n{font-family:var(--f-hero);font-size:1.4rem;color:var(--gold);text-align:center}
.st .tools{display:flex;gap:4px}
.st .tools button{background:var(--night);border:2px solid var(--line);border-radius:8px;width:32px;height:32px}
.st.hd{color:var(--muted);font-size:.8rem}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.keyslot{background:var(--night);border:3px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:6px;justify-items:start}
.keyslot .k{font-family:var(--f-num);font-size:1.6rem;font-weight:700}
.keyslot.learning{border-color:var(--gold);animation:pulse .5s infinite alternate}
.chk{display:flex;gap:8px;align-items:center}
.chk input{accent-color:var(--gold);width:18px;height:18px}

/* ---------- run view ---------- */
.runhead{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center}
.runhead .lbl{font-family:var(--f-disp);font-size:1.5rem;text-wrap:balance}
.runhead .lbl small{display:block;font-family:var(--f-body);font-size:.9rem;color:var(--muted)}
.clock{font-family:var(--f-num);font-weight:700;font-size:clamp(2.4rem,6vw,4rem);font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:3px 3px 0 var(--ink);min-width:5ch;text-align:right}
.go{font-family:var(--f-hero);font-size:2rem;letter-spacing:.06em;padding:10px 28px;border-radius:16px;background:var(--red);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);color:var(--paper)}
.go small{display:block;font-family:var(--f-body);font-size:.8rem;letter-spacing:0}
.go:disabled{opacity:.35}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.lanes{grid-template-columns:minmax(0,1fr)}.runhead{grid-template-columns:1fr}.clock{text-align:left}}
.lane{background:var(--panel);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:16px;overflow:hidden;display:grid;align-content:start;min-width:0}
.lane-top{background:var(--c);color:var(--ink);display:flex;align-items:center;gap:8px;padding:6px 10px;font-family:var(--f-disp);font-size:1rem}
.lane-top svg{width:24px;height:24px}
.lane-top kbd{margin-left:auto;background:var(--ink);color:var(--paper)}
.lane-body{padding:12px;display:grid;gap:10px}
.pwho{display:flex;align-items:center;gap:10px;min-width:0}
.lhero{flex:none;width:78px;height:100px;background:color-mix(in srgb,var(--c) 22%,var(--night));border:2px solid var(--ink);border-radius:12px;display:grid;place-items:center;overflow:hidden}
.lhero svg{width:100%;height:100%}
.pname{min-width:0;font-family:var(--f-disp);font-size:1.45rem;line-height:1.15;overflow-wrap:anywhere}
.pname small{display:block;font-family:var(--f-body);font-size:.85rem;color:var(--muted)}
.ltime{font-family:var(--f-num);font-weight:700;font-size:2rem;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ltime .tot{font-size:1rem;color:var(--gold)}
.ltime input{width:7.5rem;font-size:1.1rem}
.medal{display:inline-block;width:2.4rem;height:3rem;background:none!important;border:0!important;color:var(--ink);font-family:var(--f-hero);font-size:1.3rem;border:3px solid var(--ink)}
.finish{width:100%;padding:14px;font-family:var(--f-hero);font-size:1.6rem;letter-spacing:.05em;background:var(--c);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.finish:disabled{opacity:.35}
.pens{display:grid;gap:6px}
.pen{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;gap:6px;background:var(--night);border-radius:10px;padding:4px}
.pen button{height:32px;border-radius:8px;border:2px solid var(--line);background:var(--panel2);font-weight:700}
.pen button.plus{background:var(--bad);border-color:var(--ink)}
.pen span{font-size:.85rem;text-align:center;line-height:1.2}
.pen span{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}
.pen span i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pen span em{font-style:normal;font-family:var(--f-num);font-weight:700;color:var(--bad);flex:none}
.pen span b{color:var(--gold);font-family:var(--f-num);flex:none}
.pen.has{outline:2px solid var(--bad)}
.lane-actions{display:flex;gap:6px}
.lane-actions .btn{flex:1;font-size:.85rem;padding:6px}
.lane.emptyl{opacity:.45}
.lane.dnf .ltime{color:var(--bad)}
.runfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{color:var(--muted);font-size:.9rem}
.heats{display:flex;flex-wrap:wrap;gap:8px}
.heatchip{background:var(--night);border:2px solid var(--line);border-radius:12px;padding:6px 10px;text-align:left;font-size:.85rem;max-width:260px}
.heatchip b{font-family:var(--f-disp);font-weight:400;display:block;font-size:1rem}
.heatchip.cur{border-color:var(--gold);background:var(--panel2)}
.heatchip.done b::after{content:" ✓";color:var(--good)}
.screens{display:flex;flex-wrap:wrap;gap:6px}
.screens button{background:var(--night);border:2px solid var(--line);border-radius:999px;padding:5px 14px}
.screens button[aria-pressed="true"]{background:var(--blue);border-color:var(--ink)}
.banner{background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:12px 16px;font-family:var(--f-disp);display:flex;flex-wrap:wrap;gap:12px;align-items:center;box-shadow:4px 4px 0 var(--ink)}
.banner .btn{font-size:1rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--good);color:var(--ink);padding:8px 18px;border-radius:999px;border:3px solid var(--ink);font-family:var(--f-disp);z-index:200}

/* ---------- BOARD (scoreboard stage) ---------- */
.board{position:fixed;inset:0;z-index:60;background:var(--night);overflow:hidden;display:grid;grid-template-rows:auto 1fr;
  padding:max(1.2vh,env(safe-area-inset-top,0px)) max(1.6vw,env(safe-area-inset-right,0px)) max(1.6vh,env(safe-area-inset-bottom,0px)) max(1.6vw,env(safe-area-inset-left,0px));
  background-image:
    linear-gradient(180deg,transparent 62%,rgba(56,242,255,.10) 62.2%,transparent 63%),
    repeating-linear-gradient(90deg,rgba(56,242,255,.09) 0 1px,transparent 1px 5vw),
    radial-gradient(ellipse at 50% 115%,rgba(255,63,209,.35),transparent 55%),
    radial-gradient(1.4px 1.4px at 20% 25%,#fff,transparent),radial-gradient(1px 1px at 65% 40%,#fffa,transparent),radial-gradient(1.6px 1.6px at 85% 12%,#38f2ff,transparent),radial-gradient(1px 1px at 40% 8%,#ff3fd1,transparent),
    linear-gradient(180deg,#05021a,#130a3d 55%,#250c4f);
  background-size:100% 100%,100% 100%,100% 100%,170px 170px,230px 230px,310px 310px,260px 260px,100% 100%}
.board::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22vh;pointer-events:none;opacity:.5;
  background:linear-gradient(transparent,rgba(56,242,255,.12)),repeating-linear-gradient(90deg,transparent 0 3vw,rgba(20,10,60,.9) 3vw 5vw,transparent 5vw 7vw,rgba(20,10,60,.9) 7vw 8vw,transparent 8vw 11vw);
  -webkit-mask:linear-gradient(transparent,#000 40%);mask:linear-gradient(transparent,#000 40%)}
.board.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-12px,6px)}40%{transform:translate(10px,-8px)}60%{transform:translate(-8px,4px)}80%{transform:translate(6px,-3px)}}
.bhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2vw}
.blogo{font-family:var(--f-hero);font-size:3.4vw;line-height:.9;color:var(--gold);-webkit-text-stroke:.15vw var(--ink);text-shadow:.35vw .35vw 0 var(--red);transform:skew(-6deg);letter-spacing:.04em}
.bev{text-align:center;min-width:0}
.bev b{display:block;font-family:var(--f-disp);font-size:2.4vw;line-height:1.1;text-wrap:balance}
.bev span{color:var(--muted);font-size:1.4vw}
.bround{font-family:var(--f-disp);font-weight:400;font-size:1.7vw;background:var(--red);border:.3vw solid var(--ink);box-shadow:.4vw .4vw 0 var(--ink);padding:.3vw 1.2vw;border-radius:1vw;transform:skew(-8deg);white-space:nowrap}
.bmain{min-height:0;position:relative;display:grid;margin-top:1.4vh}
.bevbig{justify-self:center;text-align:center;font-family:var(--f-disp);font-size:3.4vw;line-height:1.05;color:var(--gold);-webkit-text-stroke:.08vw var(--ink);text-shadow:.3vw .3vw 0 var(--red);text-wrap:balance;max-width:90%}
.board.live .bev b{display:block}.board.live .bev span{font-size:1.9vw;font-family:var(--f-disp);color:var(--paper)}
.blive{display:grid;grid-template-rows:auto auto 1fr;gap:1.2vh;min-height:0}
.bclock{justify-self:center;font-family:var(--f-num);font-weight:700;font-size:5vw;line-height:1;font-variant-numeric:tabular-nums;color:var(--paper);text-shadow:.35vw .35vw 0 var(--ink),0 0 2vw color-mix(in srgb,var(--blue) 70%,transparent)}
.blanes{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:1.4vw;min-height:0}
.bl{position:relative;background:linear-gradient(to bottom,color-mix(in srgb,var(--c) 40%,var(--panel)) 0%,var(--panel) 55%);border:.35vw solid var(--ink);border-radius:1.6vw;box-shadow:.5vw .5vw 0 var(--ink);display:grid;grid-template-rows:minmax(0,1fr) auto auto auto auto;justify-items:center;padding:1vh 1vw 1.6vh;min-height:0;overflow:hidden;transition:transform .3s}
.bl::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 45%,transparent),transparent 60%);pointer-events:none}
.bl .hero{width:100%;height:100%;min-height:0;display:grid;place-items:center;position:relative}
.bl .hero svg{height:100%;max-height:36vh;width:auto;filter:drop-shadow(.4vw .4vw 0 var(--ink))}
.bl .htag{position:relative;font-family:var(--f-hero);font-size:1.6vw;letter-spacing:.06em;background:var(--c);color:var(--ink);padding:0 1vw;border-radius:.6vw;border:.25vw solid var(--ink);transform:skew(-8deg) translateY(-1vh)}
.bl .bn{position:relative;font-family:var(--f-disp);font-size:3.2vw;line-height:1.1;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.bl .bt{position:relative;color:var(--muted);font-size:1.3vw}
.bl .btime{position:relative;font-family:var(--f-num);font-weight:700;font-size:3.6vw;font-variant-numeric:tabular-nums;line-height:1.1}
.bl .bpen{position:relative;display:flex;flex-wrap:wrap;gap:.4vw;justify-content:center;min-height:2.4vw}
.bl .bpen span{background:var(--bad);color:var(--ink);font-family:var(--f-num);font-weight:700;font-size:1.2vw;padding:.1vw .6vw;border-radius:.5vw;border:.2vw solid var(--ink)}
.bl .bplace{position:absolute;top:1vh;right:1vw;width:6vw;height:6vw;border-radius:50%;display:grid;place-items:center;font-family:var(--f-hero);font-size:3.6vw;background:var(--paper);color:var(--ink);border:.35vw solid var(--ink);box-shadow:.3vw .3vw 0 var(--ink);animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
.bl .bplace{background:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;width:6vw!important;height:7.5vw!important;filter:drop-shadow(.3vw .3vw 0 var(--ink))}
.bl .bplace.p1{width:8vw!important;height:10vw!important}
.bl.win{transform:translateY(-1vh) scale(1.02);box-shadow:0 0 0 .4vw var(--gold),0 0 4vw var(--gold)}
.bl.dnf .btime{color:var(--bad)}
.bl.emptyb{opacity:.25}
.bl.fin .btime{color:var(--gold)}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.cd{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none}
.cd b{font-family:var(--f-hero);font-size:30vh;line-height:1;color:var(--gold);-webkit-text-stroke:.5vh var(--ink);text-shadow:1.4vh 1.4vh 0 var(--red);animation:cdpop .9s ease-out both}
.cd b.gotxt{color:var(--good)}
@keyframes cdpop{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.9}}

/* slides */
.slide{display:grid;place-items:center;min-height:0;animation:slidein .7s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(4vw)}}
.splash{text-align:center;display:grid;gap:2vh;justify-items:center}
.splash .big{font-family:var(--f-hero);font-size:11vw;line-height:.85;color:var(--gold);-webkit-text-stroke:.35vw var(--ink);text-shadow:.9vw .9vw 0 var(--red);transform:skew(-6deg);letter-spacing:.03em}
.splash .ko{font-family:var(--f-disp);font-size:4vw}
.splash .div{font-size:2vw;background:var(--blue);border:.3vw solid var(--ink);padding:.4vw 2vw;border-radius:2vw}
.squad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2vw;width:100%;align-self:stretch}
.squad > div{display:grid;grid-template-rows:minmax(0,1fr) auto auto;justify-items:center;background:color-mix(in srgb,var(--c) 22%,var(--panel));border:.35vw solid var(--ink);border-radius:1.6vw;box-shadow:.5vw .5vw 0 var(--ink);padding:2vh 1vw;min-height:0}
.squad svg{height:100%;max-height:44vh;width:auto;filter:drop-shadow(.4vw .4vw 0 var(--ink))}
.squad b{white-space:nowrap;font-family:var(--f-hero);font-size:2.2vw;color:var(--c);-webkit-text-stroke:.1vw var(--ink);letter-spacing:.04em}
.squad span{font-family:var(--f-disp);font-size:1.8vw}
.stitle{font-family:var(--f-disp);font-size:3.2vw;text-align:center;text-shadow:.3vw .3vw 0 var(--ink)}
.slidewrap{display:grid;grid-template-rows:auto 1fr;gap:2vh;width:100%;height:100%;min-height:0}
.cmap{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1vw;align-self:center}
.cnode{display:grid;justify-items:center;gap:.6vh;width:13vw}
.cnode .ic{width:9vw;height:9vw;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:.35vw solid var(--ink);box-shadow:.4vw .4vw 0 var(--ink)}
.cnode .ic svg{width:6vw;height:6vw}
.cnode b{font-family:var(--f-disp);font-size:1.8vw;text-align:center;line-height:1.1}
.cnode span{font-family:var(--f-num);font-size:1.3vw;color:var(--bad);font-weight:700}
.carrow{font-family:var(--f-hero);font-size:3vw;color:var(--gold)}
.nextup{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.6vw;width:100%}
.nextup{align-self:stretch;min-height:0}
.nextup > div{background:linear-gradient(to bottom,color-mix(in srgb,var(--c) 30%,var(--panel)),var(--panel) 60%);border:.35vw solid var(--ink);border-top:1.2vh solid var(--c);border-radius:1.4vw;padding:1.6vh 1vw 2.4vh;text-align:center;box-shadow:.5vw .5vw 0 var(--ink);display:grid;grid-template-rows:minmax(0,1fr) auto auto auto;justify-items:center;min-height:0}
.nextup .nf{min-height:0;height:100%;display:grid;place-items:center}
.nextup .nf svg{height:100%;max-height:40vh;width:auto;filter:drop-shadow(.4vw .4vw 0 var(--ink))}
.nextup b{display:block;font-family:var(--f-disp);font-size:3vw;overflow-wrap:anywhere}
.nextup span{color:var(--muted);font-size:1.4vw}
.nextup i{display:block;font-style:normal;font-family:var(--f-hero);font-size:1.6vw;color:var(--c);letter-spacing:.05em}

/* standings */
.stand{display:grid;grid-template-rows:auto 1fr;gap:1.6vh;min-height:0}
.stcols{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:0 2vw;align-content:start;min-height:0}
.srow{display:grid;grid-template-columns:4.2vw minmax(0,1fr) 9vw 7vw 10vw;align-items:center;gap:1vw;padding:.55vh 1vw;border-bottom:.2vh solid var(--line);font-size:var(--fs,1.9vw);animation:slidein .5s both}
.srow .r{font-family:var(--f-hero);font-size:1.25em;text-align:center}
.srow .nm{font-family:var(--f-disp);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .nm small{font-family:var(--f-body);color:var(--muted);font-size:.65em;margin-left:.6em}
.srow .num{font-family:var(--f-num);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.srow .pn{color:var(--bad)}
.srow .tt{color:var(--gold)}
.srow.top1 .r{color:var(--gold)}.srow.top2 .r{color:#d9e1ff}.srow.top3 .r{color:#ff9f5a}
.srow.head{font-size:1.2vw;color:var(--muted);border-bottom:.3vh solid var(--gold);animation:none}
.srow.wait{opacity:.45}
.cutline{grid-column:1/-1;display:flex;align-items:center;gap:1vw;color:var(--gold);font-family:var(--f-hero);font-size:1.6vw;letter-spacing:.06em}
.cutline::before,.cutline::after{content:"";flex:1;border-top:.35vh dashed var(--gold)}

/* bracket */
.brk{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2vw;min-height:0;height:100%}
.bcol{display:grid;grid-template-rows:auto 1fr;gap:1vh;min-height:0}
.bcol h3{margin:0;text-align:center;font-family:var(--f-disp);font-weight:400;font-size:1.9vw;background:var(--panel2);border:.3vw solid var(--ink);border-radius:1vw;padding:.4vh 0}
.bcol.fin h3{background:var(--gold);color:var(--ink)}
.bheats{display:flex;flex-direction:column;justify-content:space-around;gap:1vh;min-height:0}
.bheat{background:var(--panel);border:.3vw solid var(--ink);border-radius:1vw;box-shadow:.35vw .35vw 0 var(--ink);overflow:hidden;font-size:var(--bfs,1.3vw)}
.bheat .hh{background:var(--ink);color:var(--muted);font-size:.8em;padding:.2vh .8vw;display:flex;justify-content:space-between}
.bheat.curh{box-shadow:0 0 0 .3vw var(--gold)}
.bslot{display:grid;grid-template-columns:.7vw minmax(0,1fr) auto auto;gap:.6vw;align-items:center;padding:.25vh .8vw .25vh 0;border-top:.15vh solid var(--line)}
.bslot:first-of-type{border-top:0}
.bslot i{align-self:stretch;background:var(--c)}
.bslot .nm{font-family:var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bslot .tm{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;font-size:.9em;color:var(--muted)}
.bslot .rk{font-family:var(--f-hero);min-width:1.4em;text-align:center}
.bslot.adv{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.bslot.adv .rk{color:var(--gold)}
.bslot.out{opacity:.45}
.bheat.ph .bslot .nm{color:var(--muted)}

/* champion */
.champ{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);align-items:end;gap:2vw;min-height:0;height:100%}
.podium{display:grid;grid-template-rows:minmax(0,1fr) auto auto;justify-items:center;min-height:0;height:100%;text-align:center}
.podium .fig{min-height:0;height:100%;width:100%;display:grid;place-items:end center}
.podium svg{height:100%;width:auto;max-height:40vh;filter:drop-shadow(.5vw .5vw 0 var(--ink))}
.podium b{font-family:var(--f-disp);font-size:2.8vw;line-height:1.1}
.podium .blk{width:100%;border:.35vw solid var(--ink);border-radius:1.2vw 1.2vw 0 0;display:grid;place-items:center;font-family:var(--f-hero);font-size:5vw;background:var(--panel2);box-shadow:.5vw .5vw 0 var(--ink)}
.podium.p1 svg{max-height:50vh}
.podium.p1 .blk{height:18vh;background:var(--gold);color:var(--ink)}
.podium.p2 .blk{height:12vh}
.podium.p3 .blk{height:9vh;background:color-mix(in srgb,var(--bronze) 55%,var(--panel2))}
.podium.p4 .blk{height:7vh;background:color-mix(in srgb,var(--bronze) 40%,var(--panel2))}
.podium.p2 .blk{background:color-mix(in srgb,var(--silver) 45%,var(--panel2))}
.podium .blk{display:flex!important;align-items:center;justify-content:center;gap:.8vw;font-size:3vw!important;color:var(--ink)}
.podium .blk .pm{width:3.6vw;height:4.5vw;filter:drop-shadow(.2vw .2vw 0 var(--ink))}
.podium.p1 .blk .pm{width:5vw;height:6.2vw}
.podium .tm{margin-bottom:.6vh}
.podium.p4 svg.rig{max-height:34vh}
.podium.p1 b{font-size:4.2vw;color:var(--gold);text-shadow:.3vw .3vw 0 var(--ink)}
.podium small{color:var(--muted);font-size:1.4vw}
.podium .tm{font-family:var(--f-num);font-weight:700;font-size:1.8vw}
@keyframes float{50%{transform:translateY(-2vh)}}
.champtitle{position:absolute;left:0;right:0;top:0;text-align:center;font-family:var(--f-hero);font-size:6vw;letter-spacing:.04em;color:var(--gold);-webkit-text-stroke:.25vw var(--ink);text-shadow:.6vw .6vw 0 var(--red);transform:skew(-6deg);z-index:2;pointer-events:none}
.champwrap{position:relative;display:grid;grid-template-rows:9vw 1fr auto;min-height:0;height:100%}
.restline{text-align:center;font-family:var(--f-disp);font-size:1.8vw;color:var(--muted);padding-top:1vh}
.empty{display:grid;place-items:center;text-align:center;font-family:var(--f-disp);font-size:2.6vw;color:var(--muted)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:150}
.flash{position:fixed;inset:0;background:#fff;z-index:140;pointer-events:none;animation:flash .5s ease-out forwards}
@keyframes flash{0%{opacity:.95}30%{opacity:.2}45%{opacity:.8}100%{opacity:0}}
.dock{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:120;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:min(92vw,720px);opacity:.25;transition:opacity .2s}
.dock:hover,.dock:focus-within{opacity:1}
.dock .btn{font-size:.85rem;padding:5px 10px}
.gate{position:fixed;inset:0;z-index:180;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 85%,transparent);text-align:center;font-family:var(--f-disp);font-size:2rem;cursor:pointer;padding:16px}
.gate b{display:block;font-family:var(--f-hero);font-size:4rem;color:var(--gold)}

/* hero motion */
.hf .bd,.hf .lg,.hf .ag,.hf .cp,.hf .tail,.hf .dust ellipse,.hf .spark path{transform-box:view-box}
.hf .bd{transform-origin:60px 150px}
.hf .lg{transform-origin:60px 104px}
.hf .a1{transform-origin:40px 66px}.hf .a2{transform-origin:80px 66px}
.hf .cp{transform-origin:60px 56px}.hf .tail{transform-origin:38px 36px}
.hf.stand .bd{animation:breathe 2.6s ease-in-out infinite}
.hf.run .bd{animation:bob .18s ease-in-out infinite alternate}
.hf.run .l1{animation:legswing .36s ease-in-out infinite alternate}
.hf.run .l2{animation:legswing .36s ease-in-out infinite alternate-reverse}
.hf.run .a1{animation:armswing .36s ease-in-out infinite alternate-reverse}
.hf.run .a2{animation:armswing .36s ease-in-out infinite alternate}
.hf.run .cp{animation:flap .22s ease-in-out infinite alternate}
.hf.run .tail{animation:flap .16s ease-in-out infinite alternate}
.hf.run .dust ellipse{transform-origin:60px 152px;animation:puff .36s ease-out infinite}
.hf.run .dust ellipse:nth-child(2n){animation-delay:.18s}
.hf.win .bd{animation:hop .5s cubic-bezier(.3,1.5,.5,1) infinite alternate}
.hf.win .a1{animation:wave .4s ease-in-out infinite alternate}
.hf.win .a2{animation:wave .4s ease-in-out infinite alternate-reverse}
.hf.win .cp{animation:flap .5s ease-in-out infinite alternate}
.rig .spark path{transform-box:view-box;transform-origin:80px 40px;animation:twinkle .6s ease-in-out infinite alternate}
.hf.win .spark path{transform-origin:60px 20px;animation:twinkle .6s ease-in-out infinite alternate}
@keyframes breathe{50%{transform:translateY(-2px) scaleY(1.01)}}
@keyframes bob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-5px) rotate(1deg)}}
@keyframes legswing{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes armswing{from{transform:rotate(-38deg)}to{transform:rotate(38deg)}}
@keyframes flap{from{transform:skewX(-7deg) scaleY(.95)}to{transform:skewX(8deg) scaleY(1.03)}}
@keyframes puff{0%{opacity:.7;transform:scale(.4)}100%{opacity:0;transform:scale(1.6) translateY(-4px)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes twinkle{from{transform:scale(.6);opacity:.6}to{transform:scale(1.15);opacity:1}}

/* ---- one-screen operator layout (fits a 13" laptop) ---- */
body{display:flex;flex-direction:column}
.top{flex:none}
main.wrap{flex:1 1 auto;min-height:0;width:100%;box-sizing:border-box}
main.wrap.runmode{max-width:none;padding-block:10px;display:flex;flex-direction:column;gap:0;overflow:auto}
.runview{flex:1;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px}
.runview>.banner{padding:6px 12px}
.flowpill{display:flex;align-items:center;gap:8px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:3px 4px 3px 14px;font-family:var(--f-disp);animation:pulse .6s infinite alternate}
.flowpill .btn{padding:2px 10px;font-size:.85rem;box-shadow:none}
.medalsvg{display:block;width:100%;height:100%;overflow:visible}
.runbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:14px;align-items:center;padding:8px 14px}
.runbar .lbl{font-family:var(--f-disp);font-size:1.3rem;line-height:1.15}
.runbar .lbl small{display:block;font-family:var(--f-body);font-size:.85rem;color:var(--muted)}
.runbar .clock{font-size:clamp(2rem,6.5vh,3.4rem)}
.runbar .go{font-size:1.6rem;padding:6px 22px;display:flex;align-items:center;gap:10px}
.runbar .go kbd{font-size:.8rem;letter-spacing:0}
.runmode .lanes{min-height:0;gap:10px}
.runmode .lane{min-height:0;display:flex;flex-direction:column}
.runmode .lane-top{padding:4px 10px;font-size:.95rem}
.runmode .lane-body{padding:8px;gap:6px;min-height:0;overflow:auto;flex:1;align-content:start}
.runmode .lhero{width:clamp(56px,10vh,92px);height:clamp(56px,10vh,92px)}
.runmode .pname{font-size:1.2rem}
.runmode .ltime{font-size:clamp(1.3rem,3.6vh,1.9rem)}
.runmode .medal{width:1.9rem;height:2.4rem}
.runmode .finish{padding:clamp(4px,1.1vh,12px);font-size:1.35rem}
.runmode .pens{grid-template-columns:1fr 1fr;gap:4px}
.runmode .pen{grid-template-columns:24px 1fr 24px;gap:3px;padding:2px}
.runmode .pen button{height:24px;font-size:.85rem;padding:0}
.runmode .pen span{font-size:.72rem}
.runmode .lane-actions .btn{padding:3px 6px;font-size:.8rem;box-shadow:none}
.runfoot{padding:8px 12px;display:grid;gap:8px}
.runfoot .row{gap:8px}
.runfoot .sp{flex:1}
.runfoot .btn{padding:5px 12px;font-size:.95rem}
.runfoot .screens button{padding:3px 10px;font-size:.85rem}
.runfoot .heats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.runfoot .heatchip{flex:none;padding:3px 10px;font-size:.78rem;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runfoot .heatchip b{display:inline;margin-right:6px;font-size:.9rem}
.rchip{background:var(--panel2)}
@media (max-width:1100px){main.wrap.runmode{overflow:auto}.runview{display:flex;flex-direction:column}}
@media (max-width:620px){.runbar{grid-template-columns:1fr}}
.lhero{background:color-mix(in srgb,var(--c) 22%,var(--night))}
.board b,.heatchip b,.mode b,.runbar .lbl,.pname{font-weight:400}
/* roster */
.rostercard .cnt{font-family:var(--f-body);color:var(--muted);font-size:.9rem}
.filebtn{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.addrow{display:grid;grid-template-columns:1.2fr 1.3fr 1fr .7fr 1fr auto;gap:6px;margin-top:12px}
@media (max-width:620px){.addrow{grid-template-columns:1fr 1fr}}
.addrow select{background:var(--night);border:2px solid var(--line);border-radius:10px;padding:8px;color:var(--paper)}
.divchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.dchip{background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.85rem}
.dchip b{color:var(--gold);font-family:var(--f-num)}
.rtable{max-height:320px;overflow:auto;border:2px solid var(--line);border-radius:12px}
.rtable table{width:100%;border-collapse:collapse;font-size:.9rem}
.rtable th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:400;color:var(--muted);padding:6px 8px;font-size:.8rem}
.rtable td{padding:4px 8px;border-top:1px solid var(--line)}
.rtable td.num{font-family:var(--f-num);color:var(--muted);width:2.5rem}
.rtable td b{font-weight:400;font-family:var(--f-disp)}
.rtable select{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--paper);padding:2px 4px}
.xbtn{background:transparent;border:0;color:var(--muted);font-size:1rem}
.xbtn:hover{color:var(--bad)}
.impbox{margin-top:12px;border:3px solid var(--gold);border-radius:14px;padding:12px;display:grid;gap:8px;background:color-mix(in srgb,var(--gold) 8%,var(--night))}
.flowpill[hidden]{display:none!important}
.divsel{width:auto!important;max-width:min(100%,24rem)!important;font-family:var(--f-disp);font-size:1.05rem;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:2px 8px;margin-right:6px;max-width:100%}

/* 접수 홈페이지 창: 히어로 화면 색에 맞춤 */
.rgbox{background:var(--panel)!important;color:var(--paper)!important;border:3px solid var(--ink)!important;box-shadow:6px 6px 0 var(--ink)!important}
.rgbox .btn{background:var(--panel2);color:var(--paper)}.rgbox .btn.primary{background:var(--gold);color:var(--ink)}
.rgf input{background:var(--night)!important;color:var(--paper)!important;border-color:var(--line)!important}
.rgc,.rgk div{background:var(--night)!important;border-color:var(--line)!important;color:var(--paper)!important}.rgc:hover{border-color:var(--gold)!important}
.rgk span,.rgbox .muted{color:var(--muted)!important}.rgbox a{color:var(--gold)}

/* ---- brand: KICKSTART UP mark + shining hero logo ---- */
.ks{display:inline-flex;align-items:center;gap:8px}.ks svg{width:34px;height:34px;flex:none}
.ksw{font-family:"Archivo Black","Black Han Sans",Impact,sans-serif;letter-spacing:.18em;font-size:1rem;color:#F3E9D2}.ks .ksw b{color:#D6B36E;margin-left:.35em;font-weight:400;font-size:inherit;font-family:inherit;text-shadow:none;letter-spacing:inherit}
.hlogo{display:flex;align-items:center;gap:10px;justify-self:center;min-width:0}
.hlogo svg{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--gold) 55%,transparent))}
.hlogo b{font-family:var(--f-disp);font-weight:400;font-size:1.9rem;line-height:1;white-space:nowrap}
.hlogo small{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.shine{position:relative;color:#fff;text-shadow:0 0 6px var(--neon),0 0 18px var(--red),2px 2px 0 var(--red)}
.shine::after{content:attr(data-txt);position:absolute;left:0;top:0;color:transparent;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.95) 45%,rgba(255,250,210,.6) 52%,transparent 66%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 3.2s linear infinite;text-shadow:none}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
.hlogo .tw{animation:twk 1.6s ease-in-out infinite alternate}
@keyframes twk{to{opacity:.35}}
.runbar .hlogo.mid{grid-column:2}
@media (max-width:900px){.runbar .hlogo.mid{display:none}}
/* footer: next heat */
.runfoot .sp{display:flex;justify-content:center;min-width:0}
.nxt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--night);border:2px dashed var(--line);border-radius:999px;padding:4px 12px}
.nxt .nl{font-family:var(--f-disp);color:var(--gold);font-size:.9rem;margin-right:4px}
.nxt .nc{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;background:color-mix(in srgb,var(--c) 22%,var(--panel));border:2px solid var(--c);border-radius:999px;padding:1px 8px 1px 4px}
.nxt.deco{gap:14px;opacity:.6;border-style:solid}.nxt.deco svg{animation:twk 1.4s ease-in-out infinite alternate}.nxt.deco svg:nth-child(2n){animation-delay:.7s}
/* ---- scoreboard: bigger names, heroes and text ---- */
.bks .ks svg{width:4.2vw;height:4.2vw}.bks .ksw{font-size:1.5vw}
.bev b{font-size:var(--bnfs,2.6vw)!important}.bev span{font-size:1.9vw!important;color:var(--paper)!important;font-family:var(--f-disp)}
.bround{font-size:2.1vw!important}
.bevbig{margin-top:-.4vh}
.bevbig .hlogo svg{width:5.6vw;height:5.6vw}
.bevbig .hlogo b{font-size:5vw}.bevbig .hlogo small{font-size:1.4vw;text-align:center;text-shadow:none;-webkit-text-stroke:0;color:var(--paper);font-family:var(--f-body);letter-spacing:.08em}
.blive{gap:.6vh!important}
.bclock{font-size:5.4vw!important}
.blanes{gap:1vw!important}
.bl{padding:.6vh .6vw 1.2vh!important}
.bl .hero svg{max-height:44vh!important}
.bl .htag{font-size:2vw!important}
.bl .bn{font-size:4.6vw!important;line-height:1.05!important}
.bl .bt{font-size:1.7vw!important}
.bl .btime{font-size:4.4vw!important}
.bl .bpen span{font-size:1.5vw!important}
.srow{font-size:var(--fs,2.2vw)}
.nextup b{font-size:3.8vw!important}.nextup span{font-size:1.8vw!important}.nextup i{font-size:2vw!important}
.squad b{font-size:var(--bnfs,2.6vw)!important}.squad span{font-size:2.1vw!important}
.stitle{font-size:3.6vw!important}
.podium b{font-size:3.2vw!important}.podium.p1 b{font-size:4.8vw!important}.podium small{font-size:1.7vw!important}.podium .tm{font-size:2.2vw!important}
.bheat{font-size:calc(var(--bfs,1.3vw)*1.15)!important}
.bcol h3{font-size:2.2vw!important}
/* license */
.licchip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.8rem;color:var(--paper);max-width:22rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.licchip.ok{border-color:var(--good)}
.licov{position:fixed;inset:0;z-index:300;background:color-mix(in srgb,var(--ink) 75%,transparent);display:grid;place-items:center;padding:16px}
.licbox{width:min(520px,100%);background:var(--panel);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:16px;padding:18px;display:grid;gap:12px}
.licbox .lt{font-family:var(--f-disp);font-weight:400;font-size:1.2rem}
.licst{background:var(--night);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-family:var(--f-disp)}.licst.ok{border-color:var(--good)}
.licerr{background:color-mix(in srgb,var(--bad) 20%,var(--night));border:2px solid var(--bad);border-radius:10px;padding:8px 12px}
.wm{position:fixed;inset:0;z-index:90;pointer-events:none;display:grid;place-items:center}
.wm span{transform:rotate(-18deg);font-family:var(--f-hero);font-size:9vw;letter-spacing:.08em;color:transparent;-webkit-text-stroke:.25vw color-mix(in srgb,var(--paper) 22%,transparent)}
/* link / QR */
.linkbox{width:min(900px,100%)}
.qrgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.qrgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qrc{background:var(--night);border:3px solid var(--c);border-radius:14px;padding:8px;display:grid;gap:6px;justify-items:center;text-align:center}
.qrc.dim{opacity:.45}
.qh{display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-size:.95rem;width:100%;justify-content:center}
.qimg{background:#fff;border-radius:8px;padding:4px;width:100%;aspect-ratio:1;max-width:100%}.qimg svg{width:100%;height:100%;display:block}
.qn{font-size:.85rem;min-height:1.2em}
.qrc .btn{font-size:.8rem;padding:3px 8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
/* judge phone */
.judge{position:fixed;inset:0;background:var(--night);display:grid;grid-template-rows:auto auto auto auto 1fr auto;gap:12px;padding:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow:auto}
.jtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--c);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 12px}
.jtop b{font-family:var(--f-disp);font-weight:400;font-size:1.2rem}.jsub{font-size:.8rem;flex:1}.jtop .dot{border:2px solid var(--ink)}
.jkid{display:flex;align-items:center;gap:12px}.jfig{width:96px;height:110px;background:color-mix(in srgb,var(--c) 25%,var(--panel));border:3px solid var(--ink);border-radius:14px;overflow:hidden}.jfig svg{width:100%;height:100%}
.jkid b{display:block;font-family:var(--f-disp);font-weight:400;font-size:2rem;line-height:1.1}.jkid small{color:var(--muted)}
.jtime{display:flex;align-items:center;gap:10px;font-family:var(--f-num);font-weight:700;font-size:2.4rem;font-variant-numeric:tabular-nums}.jtime small{font-size:1rem;color:var(--gold)}.jpl{width:2.2rem;height:2.8rem;display:inline-block}
.jfin{min-height:28vh;border:4px solid var(--ink);border-radius:22px;background:var(--c);color:var(--ink);font-family:var(--f-hero);font-size:3.4rem;letter-spacing:.05em;box-shadow:6px 6px 0 var(--ink)}
.jfin:disabled{opacity:.35}.jfin:active:not(:disabled){transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.jpens{display:grid;grid-template-columns:1fr;gap:8px;align-content:start}
.jpen{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px}
.jpen.has{border-color:var(--bad)}.jpen button{height:52px;border-radius:12px;border:3px solid var(--ink);background:var(--panel2);color:var(--paper);font-size:1.6rem;font-weight:700}
.jpen button.plus{background:var(--bad)}.jpen button:disabled{opacity:.35}
.jpen span{text-align:center;font-family:var(--f-disp);font-size:1.05rem;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}.jpen em{font-style:normal;color:var(--bad);font-family:var(--f-num)}.jpen b{color:var(--gold);font-family:var(--f-num)}
.jundo{justify-self:center}
.jwait{display:grid;place-items:center;text-align:center;font-family:var(--f-disp);font-size:1.4rem;color:var(--muted);padding:40px 10px}
/* final power-up */
.rig.pw .aura{transform-box:fill-box;transform-origin:center;animation:aura 1.6s ease-in-out infinite alternate}
@keyframes aura{from{opacity:.55;transform:scale(.92)}to{opacity:1;transform:scale(1.06)}}
.rig.pw .arcs path{animation:arc .22s steps(2) infinite}.rig.pw .arcs path:nth-child(2n){animation-delay:.11s}
@keyframes arc{50%{opacity:.1}}
.rig.pw .gbelt{filter:drop-shadow(0 0 4px #ffc83d)}
.rig.pw{filter:drop-shadow(0 0 1vw color-mix(in srgb,var(--gold) 60%,transparent)) drop-shadow(.4vw .4vw 0 var(--ink))!important}
.board.pwup .bl .hero svg{animation:pwin 1.6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pwin{0%{transform:scale(.2);filter:brightness(6) blur(6px)}50%{filter:brightness(3)}100%{transform:scale(1);filter:none}}
.pwov{position:fixed;inset:0;z-index:145;pointer-events:none;display:grid;place-items:center;animation:pwov 3.2s ease-out forwards}
@keyframes pwov{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
.pwov .rays{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg,rgba(255,200,61,.38) 0 8deg,transparent 8deg 18deg);animation:spin 3.2s linear}
@keyframes spin{to{transform:rotate(60deg)}}
.pwt{position:relative;text-align:center;animation:pwt .9s cubic-bezier(.2,1.8,.4,1) both}
.pwt b{display:block;font-family:var(--f-hero);font-size:13vw;line-height:.9;color:var(--gold);-webkit-text-stroke:.4vw var(--ink);text-shadow:1vw 1vw 0 var(--red),0 0 4vw #fff3b0;letter-spacing:.04em}
.pwt span{font-family:var(--f-disp);font-size:4vw;color:#fff;text-shadow:.3vw .3vw 0 var(--ink)}
@keyframes pwt{from{transform:scale(3) rotate(-8deg);opacity:0}}
/* show effects */
.fxlist{display:grid;gap:8px}.fxrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}.fxrow b{font-family:var(--f-disp);font-weight:400;display:block}
.tgl{width:46px;height:26px;border-radius:999px;border:2px solid var(--line);background:var(--night);position:relative;margin-top:2px}.tgl i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:left .15s}
.tgl.on{background:var(--good);border-color:var(--ink)}.tgl.on i{left:22px;background:#fff}
.camset{display:grid;gap:8px;margin-top:8px;padding:10px;border:2px dashed var(--line);border-radius:12px}.camset select{width:auto;flex:1}
.campv{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;overflow:hidden;display:grid;place-items:center}.camv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lanes4{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);pointer-events:none}.lanes4 i{border-right:2px dashed rgba(255,255,255,.5);font-style:normal;font-family:var(--f-hero);color:var(--c);font-size:1.6rem;padding:4px 8px;text-shadow:1px 1px 0 #000}
.bbest{justify-self:center;font-family:var(--f-disp);font-size:1.6vw;background:color-mix(in srgb,var(--gold) 18%,var(--panel));border:.2vw solid var(--gold);border-radius:999px;padding:.2vh 1.4vw}.bbest b{font-family:var(--f-num);color:var(--gold)}
.introv{position:absolute;inset:0;z-index:6;display:grid;grid-template-columns:1fr 1.2fr;align-items:center;gap:2vw;background:radial-gradient(circle at 30% 50%,color-mix(in srgb,var(--c) 55%,transparent),var(--night) 70%);animation:fadein .3s}
.ifig{height:70vh;display:grid;place-items:center;animation:flyin .7s cubic-bezier(.2,1.5,.4,1) both}.ifig svg{height:100%;width:auto;filter:drop-shadow(.6vw .6vw 0 var(--ink)) drop-shadow(0 0 2vw var(--c))}
.itx{display:grid;gap:1vh;animation:slidein .6s .15s both}.ilane{font-family:var(--f-hero);font-size:4vw;color:var(--c);-webkit-text-stroke:.15vw var(--ink)}.ihero{font-family:var(--f-hero);font-weight:400;font-size:6vw;line-height:.9;color:var(--gold);-webkit-text-stroke:.2vw var(--ink);text-shadow:.5vw .5vw 0 var(--c)}
.iname{font-family:var(--f-disp);font-weight:400;font-size:8vw;line-height:1}.iteam{font-size:2.6vw;color:var(--muted)}
.introv.all{grid-template-columns:1fr;grid-template-rows:1fr auto;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 30%,transparent),var(--night) 70%)}
.iall{display:flex;justify-content:center;align-items:end;gap:2vw;height:60vh}.iall div{display:grid;justify-items:center;height:100%;grid-template-rows:1fr auto;animation:flyin .6s cubic-bezier(.2,1.5,.4,1) both}.iall div:nth-child(2){animation-delay:.1s}.iall div:nth-child(3){animation-delay:.2s}.iall div:nth-child(4){animation-delay:.3s}
.iall svg{height:100%;width:auto;filter:drop-shadow(.4vw .4vw 0 var(--ink))}.iall b{font-family:var(--f-disp);font-weight:400;font-size:3.4vw;color:var(--c)}
.iready{text-align:center;font-family:var(--f-hero);font-size:9vw;color:var(--gold);-webkit-text-stroke:.3vw var(--ink);text-shadow:.8vw .8vw 0 var(--red);animation:cdpop .8s both}
@keyframes flyin{from{transform:translateX(-60vw) rotate(-20deg) scale(.6);opacity:0}}@keyframes fadein{from{opacity:0}}
.recov{position:fixed;inset:0;z-index:146;pointer-events:none;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,200,61,.35),transparent 60%);animation:pwov 3.2s ease-out forwards}
.rect{text-align:center;display:grid;gap:1vh;animation:pwt .8s cubic-bezier(.2,1.8,.4,1) both}.rect b{font-family:var(--f-hero);font-weight:400;font-size:11vw;line-height:.9;color:#fff;-webkit-text-stroke:.35vw var(--ink);text-shadow:.9vw .9vw 0 var(--red),0 0 3vw var(--gold)}
.rect span{font-family:var(--f-disp);font-size:3vw;color:var(--gold);text-shadow:.3vw .3vw 0 var(--ink)}.rect i{font-style:normal;font-family:var(--f-disp);font-size:4.4vw;color:#fff;background:var(--c);border:.3vw solid var(--ink);border-radius:2vw;padding:.4vh 2vw;color:var(--ink)}.rect small{font-size:1.8vw;color:#fff;text-shadow:.2vw .2vw 0 var(--ink)}
.cheer{display:grid;grid-template-rows:auto 1fr;gap:2vh;min-height:0;height:100%}.ccall{color:var(--gold)}
.cgrid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2vw;min-height:0}
.ccol{display:grid;grid-template-rows:minmax(0,1fr) 30vh auto auto;justify-items:center;gap:1vh;background:color-mix(in srgb,var(--c) 18%,var(--panel));border:.35vw solid var(--ink);border-radius:1.6vw;padding:1vh 1vw;min-height:0}
.ccol.act{box-shadow:0 0 0 .4vw var(--c),0 0 3vw var(--c)}.ccol.win{box-shadow:0 0 0 .5vw var(--gold),0 0 5vw var(--gold)}
.cfig{min-height:0;height:100%;display:grid;place-items:center}.cfig svg{height:100%;width:auto}
.cbar{width:5vw;height:100%;background:var(--night);border:.3vw solid var(--ink);border-radius:1vw;position:relative;overflow:hidden}.cbar i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--v,0)*1%);background:linear-gradient(to top,var(--c),var(--gold));transition:height .08s}
.ccol b{font-family:var(--f-num);font-size:3.6vw}.ccol span{font-family:var(--f-disp);font-size:2.2vw}
.repov{position:fixed;inset:0;z-index:147;background:#000;display:grid;place-items:center;animation:fadein .3s}.repov canvas{width:100%;height:100%;object-fit:contain}.repov.out{opacity:0;transition:opacity .4s}
.rtag{position:absolute;top:3vh;left:3vw;font-family:var(--f-hero);font-size:3vw;color:#fff;background:var(--red);border:.3vw solid var(--ink);padding:.2vh 1.4vw;border-radius:1vw;letter-spacing:.06em;animation:pulse .6s infinite alternate}
.rname{position:absolute;bottom:4vh;left:50%;transform:translateX(-50%);font-family:var(--f-disp);font-size:4vw;background:var(--c);color:var(--ink);border:.35vw solid var(--ink);border-radius:1.4vw;padding:.4vh 2vw;white-space:nowrap}

.blive.boss .bl .hero svg{max-height:26vh}

const CH={stream:null,an:null,buf:null,busy:false};
async function micOn(){if(CH.an)return true;try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});const a=ac();const src=a.createMediaStreamSource(st);const an=a.createAnalyser();an.fftSize=1024;src.connect(an);CH.stream=st;CH.an=an;CH.buf=new Float32Array(an.fftSize);return true}catch(e){toast(t('micNo'));return false}}
function micLevel(){if(!CH.an)return 0;CH.an.getFloatTimeDomainData(CH.buf);let s=0;for(const x of CH.buf)s+=x*x;const db=20*Math.log10(Math.sqrt(s/CH.buf.length)+1e-6);return Math.max(0,Math.min(100,(db+55)*2.2))}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function cheerLane(k){if(CH.busy)return;if(!(await micOn()))return;CH.busy=true;const ch=S.ch&&S.ch.heat===heatKey()?S.ch:{heat:heatKey(),vals:[null,null,null,null],win:-1};
  S.ch={...ch,lane:k,step:'call',win:-1};S.board='cheer';commit();sfx('whoosh');await wait(2000);
  S.ch.step='meas';commit();let peak=0,sm=0;const t0=Date.now();
  while(Date.now()-t0<4000){sm=sm*.7+micLevel()*.3;peak=Math.max(peak,sm);send({t:'cheer',lane:k,lv:Math.round(sm)});document.querySelectorAll(`[data-chl="${k}"]`).forEach(el=>el.style.setProperty('--v',sm));await wait(60)}
  S.ch.vals[k]=Math.round(peak);S.ch.step='done';CH.busy=false;commit();cheerDraw()}

/* ---- 결승선 카메라: 1등 도착 앞뒤 3초를 슬로모션으로 ---- */
const CAM={stream:null,video:null,cv:null,frames:[],timer:null,err:''};let CLIP=null;let CLIP_PEND=null;
async function camList(){try{return (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch(e){return[]}}
async function camStart(){camStop();try{const id=S.cfg.fx.camId;CAM.stream=await navigator.mediaDevices.getUserMedia({video:{...(id?{deviceId:{exact:id}}:{}),width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},audio:false});
    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.srcObject=CAM.stream;await v.play();CAM.video=v;CAM.cv=document.createElement('canvas');CAM.cv.width=1280;CAM.cv.height=720;CAM.err='';
    CAM.timer=setInterval(camGrab,66);render()}catch(e){CAM.err=t('camNo');render()}}
function camStop(){clearInterval(CAM.timer);CAM.timer=null;if(CAM.stream)CAM.stream.getTracks().forEach(x=>x.stop());CAM.stream=null;CAM.video=null;CAM.frames.forEach(f=>f.url&&URL.revokeObjectURL(f.url));CAM.frames=[]}
function camGrab(){const v=CAM.video;if(!v||v.readyState<2)return;const g=CAM.cv.getContext('2d');g.drawImage(v,0,0,CAM.cv.width,CAM.cv.height);const at=Date.now();
  CAM.cv.toBlob(b=>{if(!b)return;CAM.frames.push({t:at,blob:b});const cut=Date.now()-9000;while(CAM.frames.length&&CAM.frames[0].t<cut){CAM.frames.shift()}},'image/jpeg',.72)}
function onFirstFinish(lane){if(!S.cfg.fx.cam||!CAM.stream)return;const ft=Date.now(),hk=heatKey(),h=curHeat(),p=P(h.lanes[lane])||{},tm=h.time[lane];
  CLIP_PEND=hk;setTimeout(()=>{const fr=CAM.frames.filter(f=>f.t>=ft-3000&&f.t<=ft+3000).map(f=>f.blob);if(fr.length>5)CLIP={heat:hk,lane,name:pn(p),time:tm,frames:fr};CLIP_PEND=null},3200)}
function cropFor(lane,W,H){if(!S.cfg.fx.camZoom)return [0,0,W,H];const pos=S.cfg.fx.camRev?3-lane:lane;const cw=W*.46,chh=cw*9/16;let x=(pos+.5)/4*W-cw/2,y=H*.52-chh/2;x=Math.max(0,Math.min(W-cw,x));y=Math.max(0,Math.min(H-chh,y));return [x,y,cw,chh]}
function playReplay(clip,done){const dur=Math.round(clip.frames.length*66/0.5);
  if(ROLE==='ctrl')try{BC&&BC.postMessage({t:'replay',clip})}catch(e){}
  showReplay(clip,done);return dur}
async function showReplay(clip,done){if(!boardVisible()){done&&setTimeout(done,clip.frames.length*132);return}
  const o=document.createElement('div');o.className='repov';o.innerHTML=`<canvas width="1280" height="720"></canvas><div class="rtag">⏪ REPLAY · ${esc(t('slowmo'))}</div><div class="rname" style="--c:var(${HEROES[clip.lane].v})">🥇 ${esc(clip.name)} · ${fmt(clip.time)}</div>`;document.body.appendChild(o);
  const cv=o.querySelector('canvas'),g=cv.getContext('2d');playLocal('whoosh');
  for(const b of clip.frames){let bm;try{bm=await createImageBitmap(b)}catch(e){continue}const [x,y,w,h]=cropFor(clip.lane,bm.width,bm.height);g.drawImage(bm,x,y,w,h,0,0,1280,720);bm.close&&bm.close();await wait(132)}
  o.classList.add('out');setTimeout(()=>{o.remove();done&&done()},400)}

/* ================= sound ================= */
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function playsHere(){return S.cfg.sound&&((ROLE==='ctrl')===(S.cfg.soundAt!=='board'))}
function tone(f,d,type='square',vol=.16,when=0,slide){const a=AC;if(!a)return;const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+when;o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.05)}
function noise(d,vol=.5,freq=500,when=0){const a=AC;if(!a)return;const len=Math.floor(a.sampleRate*d),b=a.createBuffer(1,len,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+when)}
function sfx(name,arg){if(ROLE==='ctrl')send({t:'sfx',name,arg});playLocal(name,arg)}
function playLocal(name,arg){
  if(!playsHere())return;ac();if(!AC)return;
  const N=[523,659,784,988];
  if(name==='beep')tone(660,.18,'square',.2);
  if(name==='go'){tone(1320,.7,'square',.22);tone(660,.7,'sawtooth',.08)}
  if(name==='finish'){tone(N[arg||0],.12,'square',.18);tone(N[arg||0]*1.5,.25,'square',.16,.1)}
  if(name==='pen')tone(220,.22,'sawtooth',.16,0,110);
  if(name==='intro'){noise(.35,.25,2200);tone(330,.18,'square',.14,.05,660);tone(660,.3,'square',.14,.22,990)}
  if(name==='whoosh')noise(.6,.35,1800);
  if(name==='touch'){tone(880,.08,'square',.18);tone(1320,.14,'square',.16,.07)}
  if(name==='kick'){noise(.12,.55,900);tone(160+(arg||0)*30,.1,'square',.14,0,80)}
  if(name==='gong'){tone(196,1.4,'sawtooth',.12,0,150);tone(392,1.2,'square',.08);noise(.4,.4,600)}
  if(name==='bossdown'){noise(1.2,.8,500);[392,523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.14,.3+i*.1))}
  if(name==='lvup'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.16,'triangle',.18,i*.09));tone(1568,.5,'square',.1,.5)}
  if(name==='thunder'){noise(1.8,.9,420);noise(.25,.6,3000);tone(90,1.2,'sawtooth',.12,0,40)}
  if(name==='fanfare'){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'square',.15,i*.13));tone(1047,1,'square',.15,.55);tone(784,1,'square',.1,.55);tone(659,1,'square',.08,.55)}
}

let BC=null;try{BC=new BroadcastChannel('tkhero2-board')}catch(e){}
function send(m){try{BC&&BC.postMessage(m.t==='replay'?m:JSON.parse(JSON.stringify(m)))}catch(e){}if(ROLE==='ctrl'&&m&&(m.t==='sync'||m.t==='fx'||m.t==='sfx'))netOut(m)}
if(BC)BC.onmessage=ev=>{const m=ev.data||{};
  if(ROLE==='ctrl'){
    if(m.t==='hello'){boardSeen=Date.now();send({t:'sync',S,R,L:licOk()})}
    if(m.t==='key')handleKey(m.key);
  }else{
    remoteMsg(m);
  }};
function remoteMsg(m){if(!m)return;
  if(m.t==='replay'&&ROLE==='board'){showReplay(m.clip);return}
  if(m.t==='cheer'&&ROLE==='board'){document.querySelectorAll(`[data-chl="${m.lane}"]`).forEach(el=>el.style.setProperty('--v',m.lv));return}
  if(m.t==='fx'&&m.name==='record'&&ROLE==='board'){showRecord(m.arg);return}
  if(m.t==='sync'){if(m.now)OFF=m.now-Date.now();const keepRoster=S&&S.roster;S={...m.S,roster:m.S.roster||keepRoster||[],divs:m.S.divs||{}};R=m.R;BOARD_LIC=!!m.L;linked=true;if(ROLE==='judge')renderJudge();else renderBoard();}

function fmt(ms){if(ms==null)return'—';if(!isFinite(ms))return t('dnf');if(ms<0){const n=Math.floor(-ms/1000);return S.lang==='en'?n+(n===1?' kick':' kicks'):n+'회'}const s=ms/1000;if(s<60)return s.toFixed(2);const m=Math.floor(s/60);return m+':'+(s-m*60).toFixed(2).padStart(5,'0')}
function boardHref(){try{return location.href.split('#')[0]+'#board'}catch(e){return'#board'}}
function renderTop(){
  document.getElementById('top').innerHTML=`
  <div class="logo">${KSLOGO}</div>
  <nav class="tabs" aria-label="views" style="margin-left:auto">
    ${['setup','run','board'].map(k=>`<button data-act="tab" data-v="${k}" aria-pressed="${tab===k}">${esc(t(k==='setup'?'tSetup':k==='run'?'tRun':'tBoard'))}</button>`).join('')}
  </nav>
  <div class="topright" style="margin-left:0">
    <button class="licchip ${licOk()?'ok':''}" data-act="licOpen">${esc(licLabel())}</button>
    <div id="focusInd" class="focus"><i></i><span></span></div>
    <button class="licchip" data-act="linkOpen">📱 ${esc(t('lkBtn'))}</button>
    <a class="link" data-act="openBoard" href="${esc(boardHref())}" target="_blank" rel="noopener">${esc(t('openBoard'))} ↗</a>
    <div class="lang" role="group" aria-label="language">
      <button data-act="lang" data-v="ko" aria-pressed="${S.lang==='ko'}">KO</button><button data-act="lang" data-v="en" aria-pressed="${S.lang==='en'}">EN</button>
    </div>
  </div>`;
  focusState();
}
function setTab(k){tab=k;learn=null;render();if(k==='board')goFull()}
function goFull(){keepAwake();try{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{})}catch(e){}}

function camPreview(){const pv=document.getElementById('camPv');if(pv&&CAM.video&&!pv.contains(CAM.video)){CAM.video.className='camv';pv.prepend(CAM.video)}
  if(S.cfg.fx.cam&&!window.__camsAsked){window.__camsAsked=1;camList().then(l=>{window.__cams=l;if(tab==='setup')render()})}}
function render(){
  if(ROLE==='judge'){renderJudge();return}
  setTimeout(camPreview,0);
  if(ROLE==='board'){renderBoard();return}
  renderTop();
  const app=document.getElementById('app');
  app.classList.toggle('runmode',tab==='run');
  if(tab==='setup')app.innerHTML=viewSetup();
  else if(tab==='run')app.innerHTML=viewRun();
  else app.innerHTML='';
  renderBoard();
  mpDraw();
}

function legDots(h,i,big){if(!isRelay()||h.lanes[i]==null)return'';const n=relayN(h,i),L=legOf(h,i),fin=h.time[i]!=null;
  return`<span class="legs ${big?'big':''}" aria-label="${L.length+(fin?1:0)}/${n}">${Array.from({length:n},(_,k)=>`<i class="${k<L.length||fin?'d':k===L.length&&R.phase==='running'?'c':''}"></i>`).join('')}</span>`}
function finLabel(h,i){if(isRelay()){const L=legOf(h,i),n=relayN(h,i);if(L.length<n-1)return `${t('touch')} ${L.length+1}→${L.length+2}`}return t('finish')}
const gameIc=()=>({race:'🏃',relay:'🤝',family:'👨‍👧',boss:'👾'}[S.game]||'🏃');
function clockVal(h){if(isBoss()){if(R.phase==='running')return fmt(Math.max(0,R.end-nowT()));if(R.phase==='countdown'||R.phase==='idle'&&!h.time.some(x=>x!=null))return fmt(Math.max(5,+S.cfg.bossSec||20)*1000);return fmt(0)}
  return fmt(h.time.some(x=>x!=null&&x>0)?Math.max(...h.time.filter(x=>x!=null)):0)}
/* ================= run view ================= */
function viewRun(){
  const r=curRound(),h=curHeat();
  if(!r||!h)return`<section class="card"><p class="help">${esc(t('noDraw'))}</p><button class="btn gold" data-act="tab" data-v="setup">${esc(t('tSetup'))}</button></section>`;
  const live=R.phase==='running'||R.phase==='countdown';
  const complete=heatComplete(h);
  let banner='';
  const nd=divKeys().find(k=>k!==S.dkey&&!divDone(S.divs[k]));
  if(S.champ&&roundDone(r)&&(r.final||r.kind==='cut'&&S.mode==='cut'))banner=`<div class="banner">🏆 ${esc(t('allDone'))} <button class="btn" data-act="screen" data-v="champion">${esc(t('sChamp'))}</button>${nd?`<button class="btn red" data-act="pickDiv" data-v="${esc(nd)}">${esc(t('nextDiv',{d:divLabel(nd)}))} →</button>`:''}</div>`;
  else if(roundDone(r)){
    const canNext=(r.kind==='cut'&&S.mode==='both')||(r.kind==='tour'&&!r.final);
    banner=`<div class="banner">${esc(t('roundDone'))} ${canNext?`<button class="btn red" data-act="nextRound">${esc(r.kind==='cut'?t('startTour',{n:Math.min(S.advN,S.players.length)}):t('nextRound'))}</button>`:''}</div>`;
  }
  return`<div class="runview">
  ${banner}
  <section class="card runbar">

function boardBracket(){

function makeBolt(x,H){const pts=[[x+(Math.random()-.5)*80,0]];let y=0,cxp=pts[0][0];while(y<H*.92){y+=H*(.04+Math.random()*.06);cxp+=(Math.random()-.5)*H*.12;pts.push([cxp,y])}
  const br=[];for(let i=2;i<pts.length-2;i+=3){if(Math.random()<.6){let [bx,by]=pts[i];const b=[[bx,by]];for(let j=0;j<4;j++){bx+=(Math.random()-.3)*H*.08;by+=H*.05;b.push([bx,by])}br.push(b)}}
  return{pts,br,life:1}}
function confetti(n,lane){const W=cv.width,H=cv.height;const cols=['#ff4545','#3b8cff','#22d17d','#ffd93b','#ffffff','#ffc83d'];
  for(let i=0;i<n;i++)parts.push({x:lane!=null?W*(.12+.25*lane)+(Math.random()-.5)*W*.2:Math.random()*W,y:-20-Math.random()*H*.3,vx:(Math.random()-.5)*6,vy:2+Math.random()*5,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,s:(6+Math.random()*10)*devicePixelRatio,c:cols[i%cols.length],star:Math.random()<.3,life:1});}
function drawFx(){
  cx.clearRect(0,0,cv.width,cv.height);
  bolts.forEach(b=>{b.life-=.035;const a=Math.max(0,b.life);
    const path=pts=>{cx.beginPath();pts.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.stroke()};
    cx.lineCap='round';cx.lineJoin='round';
    cx.strokeStyle=`rgba(255,215,60,${a*.55})`;cx.lineWidth=26*devicePixelRatio;cx.shadowColor='#ffd93b';cx.shadowBlur=40;path(b.pts);
    cx.strokeStyle=`rgba(255,255,255,${a})`;cx.lineWidth=7*devicePixelRatio;cx.shadowBlur=20;path(b.pts);
    cx.lineWidth=3*devicePixelRatio;b.br.forEach(path);cx.shadowBlur=0});
  bolts=bolts.filter(b=>b.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.r+=p.vr;if(p.y>cv.height+40)p.life=0;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.star){cx.beginPath();for(let k=0;k<10;k++){const rr=k%2?p.s*.45:p.s;const an=k*Math.PI/5;cx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}cx.fill()}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    cx.restore()});
  parts=parts.filter(p=>p.life>0);
  if(bolts.length||parts.length)requestAnimationFrame(drawFx);else{fxOn=false;cx.clearRect(0,0,cv.width,cv.height)}
}
