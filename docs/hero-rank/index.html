<style>
:root{

*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.5;

button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--neon)}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.08em;font-size:.82rem}
.brand svg{width:30px;height:30px}
.brand span{color:var(--gold)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:4px 12px;font-size:.8rem;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--card2);color:var(--text)}
.hero{text-align:center;padding:18px 0 22px}
.hero h1{margin:0;font-weight:900;letter-spacing:.06em;font-size:clamp(1.6rem,4.6vw,2.8rem);line-height:1.1}
.hero h1 b{background:linear-gradient(90deg,var(--neon),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:6px 0 0;color:var(--muted)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.filters label,.field{display:grid;gap:4px;font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
select,input[type=text],input[type=email],input[type=password],input[type=number],textarea{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%;font-size:.95rem}
textarea{resize:vertical;min-height:4.5em}
.courseinfo{margin:10px 2px 0;font-size:.85rem;color:var(--muted)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.pod{border-radius:var(--r);padding:14px 12px;text-align:center;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
.pod::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c)}
.pod .m{font-family:var(--num);font-weight:800;font-size:.8rem;color:var(--c);letter-spacing:.1em}
.pod .n{font-weight:900;font-size:1.25rem;margin-top:4px;overflow-wrap:anywhere}
.pod .d{font-size:.8rem;color:var(--muted)}
.pod .t{font-family:var(--num);font-weight:800;font-size:1.6rem;margin-top:6px}
.pod.p1{--c:var(--gold)}.pod.p2{--c:var(--silver)}.pod.p3{--c:var(--bronze)}
.pod.p1{order:2;transform:translateY(-8px)}.pod.p2{order:1}.pod.p3{order:3}
table{width:100%;border-collapse:collapse}
.rank th{font-size:.72rem;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.rank td{padding:10px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:middle}
.rank tr:last-child td{border-bottom:0}
.rank .r{font-family:var(--num);font-weight:800;width:3.2rem;color:var(--muted)}
.rank .nm b{font-weight:900}.rank .nm small{display:block;font-family:var(--num);font-size:.68rem;color:var(--neon);letter-spacing:.06em}
.rank .tm{font-family:var(--num);font-weight:800;text-align:right;white-space:nowrap}
.rank .tm small{display:block;font-family:var(--f);font-weight:500;font-size:.7rem;color:var(--muted)}
.rank .dj{color:var(--muted);font-size:.88rem}
.flag{font-size:1.15em;margin-right:4px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:36px 10px}

.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1300}
.btn.danger{background:none;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.8rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{background:color-mix(in srgb,var(--bad) 18%,transparent);border:1px solid var(--bad);color:#ffd6dc;border-radius:12px;padding:10px 12px}
.ok{background:color-mix(in srgb,var(--good) 15%,transparent);border:1px solid var(--good);border-radius:12px;padding:12px}
footer{margin-top:28px;text-align:center;font-size:.78rem;color:var(--muted)}

.consent{max-width:560px;margin:0 auto;display:grid;gap:14px}
.kid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.kid .av{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--neon),var(--pink));display:grid;place-items:center;font-weight:900;font-size:1.6rem;color:var(--ink)}
.kid b{font-size:1.3rem;font-weight:900}.kid small{display:block;color:var(--muted)}
.kid .id{display:block;font-family:var(--num);color:var(--neon);font-size:.8rem;letter-spacing:.06em}
dl.pi{margin:0;display:grid;grid-template-columns:7.5em 1fr;gap:8px 12px;font-size:.9rem}
dl.pi dt{color:var(--muted);font-weight:700}dl.pi dd{margin:0}
.check{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.92rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--gold)}
.consent h2{margin:0;font-size:1.05rem}
/* 관리 */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--card2);color:var(--text);border-color:var(--neon)}
.adm td,.adm th{padding:8px;border-bottom:1px solid var(--line);font-size:.86rem;text-align:left;vertical-align:top}
.adm th{color:var(--muted);font-size:.72rem;letter-spacing:.06em}
.pill{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.approved,.pill.given,.pill.on{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.pill.pending{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.pill.rejected,.pill.suspended,.pill.withdrawn,.pill.off{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.stlist{display:grid;gap:6px}
.stlist .st{display:grid;grid-template-columns:2rem 1fr 6rem auto;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scroll{overflow:auto}
@media (max-width:720px){
  .filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}
  .podium{gap:8px}.pod .t{font-size:1.15rem}.pod .n{font-size:1rem}
  .rank .dj{display:none}.rank .r{width:2.4rem}
  .grid2{grid-template-columns:1fr}

@media (prefers-reduced-motion:no-preference){.pod,.card{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>

document.addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(b){LANG=b.dataset.lang;try{localStorage.setItem('tkrank.lang',LANG)}catch(x){}route()}});
window.addEventListener('hashchange',route);

/* ================= 공개 세계 랭킹 ================= */
const RF={course:'',year:'',g:'',c:''};let COURSES=null;
async function rankView(){
  $app.innerHTML=`<section class="hero"><h1>${t('title')}</h1><p>${esc(t('sub'))}</p></section><div class="card"><p class="empty">${esc(t('loading'))}</p></div>`;
  try{if(!COURSES)COURSES=await rpc('hero_courses_list',{});}catch(e){$app.querySelector('.card').innerHTML=`<p class="empty">${esc(e.message)}</p>`;return}
  if(!COURSES.length){$app.querySelector('.card').innerHTML=`<p class="empty">${esc(t('noCourse'))}</p>`;return}
  if(!RF.course||!COURSES.find(c=>c.code===RF.course))RF.course=COURSES[0].code;
  await loadRank()}
async function loadRank(){const cur=COURSES.find(c=>c.code===RF.course);let j;
  try{j=await rpc('hero_ranking',{p_course:RF.course,p_birth_year:RF.year?+RF.year:null,p_gender:RF.g||null,p_country:RF.c||null,p_limit:200})}
  catch(e){$app.innerHTML=`<section class="hero"><h1>${t('title')}</h1></section><div class="card"><p class="empty">${esc(e.message)}</p></div>`;return}
  let all=RF._all;if(!RF.year&&!RF.g&&!RF.c)all=RF._all={years:j.years||[],countries:j.countries||[]};all=all||{years:j.years||[],countries:j.countries||[]};
  const yr=new Date().getFullYear(),rows=j.rows||[],top=rows.slice(0,3);
  const cn=c=>LANG==='en'&&c.name_en?c.name_en:c.name;
  $app.innerHTML=`<section class="hero"><h1>${t('title')}</h1><p>${esc(t('sub'))}</p></section>
   <div class="card"><div class="filters">
    <label>${esc(t('course'))}<select data-f="course">${COURSES.map(c=>`<option value="${esc(c.code)}" ${c.code===RF.course?'selected':''}>${esc(cn(c))}</option>`).join('')}</select></label>
    <label>${esc(t('age'))}<select data-f="year"><option value="">${esc(t('all'))}</option>${[...new Set([...(all.years||[]),...(RF.year?[+RF.year]:[])])].sort((a,b)=>b-a).map(y=>`<option value="${y}" ${+RF.year===y?'selected':''}>${esc(t('ageOpt',{a:yr-y,y}))}</option>`).join('')}</select></label>
    <label>${esc(t('gender'))}<select data-f="g"><option value="">${esc(t('all'))}</option><option value="M" ${RF.g==='M'?'selected':''}>${esc(t('boys'))}</option><option value="F" ${RF.g==='F'?'selected':''}>${esc(t('girls'))}</option></select></label>
    <label>${esc(t('country'))}<select data-f="c"><option value="">${esc(t('all'))}</option>${[...new Set([...(all.countries||[]),...(RF.c?[RF.c]:[])])].sort().map(c=>`<option value="${c}" ${RF.c===c?'selected':''}>${flag(c)} ${esc(cname(c))}</option>`).join('')}</select></label>
   </div>${cur&&cur.setup?`<p class="courseinfo">${esc(t('setup'))} · ${esc(cur.setup)}</p>`:''}</div>
   ${top.length?`<div class="podium">${top.map((r,i)=>`<div class="pod p${r.rank<=3?r.rank:i+1}"><div class="m">#${r.rank}</div><div class="n">${flag(r.country)} ${esc(r.nickname)}</div><div class="d">${esc(r.dojang)} · ${esc(t('ageOpt',{a:r.age,y:r.birth_year}))}</div><div class="t">${fmt(r.total_ms)}</div></div>`).join('')}</div>`:''}
   <div class="card scroll">${rows.length?`<table class="rank"><thead><tr><th>${esc(t('rank'))}</th><th>${esc(t('hero'))}</th><th class="dj">${esc(t('dojang'))}</th><th>${esc(t('age'))}</th><th style="text-align:right">${esc(t('time'))}</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="r">${r.rank}</td><td class="nm"><b>${flag(r.country)} ${esc(r.nickname)}</b><small>${esc(r.hero_id)}</small></td><td class="dj">${esc(r.dojang)}</td><td>${r.age} <span class="muted">${esc(t(r.gender))}</span></td><td class="tm">${fmt(r.total_ms)}${r.pen_ms?`<small>${esc(t('pen',{p:r.pen_ms/1000}))}</small>`:''}<small>${esc(day(r.at))}</small></td></tr>`).join('')}
    </tbody></table><p class="muted" style="margin:10px 2px 0;font-size:.8rem">${esc(t('total',{n:j.total}))}</p>`:`<p class="empty">${esc(t('empty'))}</p>`}</div>`;
  $app.querySelectorAll('[data-f]').forEach(s=>s.addEventListener('change',()=>{RF[s.dataset.f]=s.value;if(s.dataset.f==='course'){RF.year='';RF.g='';RF.c='';RF._all=null}loadRank()}))}

/* ================= 부모 동의 ================= */
async function consentView(tok){$app.innerHTML=`<div class="consent"><div class="card"><p class="empty">${esc(t('loading'))}</p></div></div>`;let j;
  try{j=await rpc('hero_consent_info',{p_token:tok})}catch(e){$app.innerHTML=`<div class="consent"><div class="err">${esc(e.message)}</div></div>`;return}
  drawConsent(tok,j,'')}
function drawConsent(tok,j,err){
  if(!j.ok){$app.innerHTML=`<div class="consent"><div class="err">${esc(t('notFound'))}</div></div>`;return}
  const kid=`<div class="card kid"><div class="av" aria-hidden="true">${esc([...j.nickname][0]||'H')}</div><div><b>${esc(j.nickname)}</b><span class="id">${esc(j.hero_id)}</span><small>${flag(j.country)} ${esc(j.dojang)}${j.city?' · '+esc(j.city):''} · ${esc(t('born',{y:j.birth_year}))}</small></div></div>`;
  const info=`<div class="card"><dl class="pi">${[['cWhat','cWhatV'],['cPub','cPubV'],['cProof','cProofV'],['cWhy','cWhyV'],['cKeep','cKeepV'],['cNo','cNoV'],['cWho','cWhoV']].map(([a,b])=>`<dt>${esc(t(a))}</dt><dd>${esc(t(b))}</dd>`).join('')}</dl></div>`;
  let main;
  if(j.status==='given')main=`<div class="ok"><b>${esc(t('given'))}</b><div class="muted" style="font-size:.88rem">${esc(t('givenAt',{d:day(j.consent_at)}))} · ${esc(t('records',{n:j.records}))}</div></div>
    <div class="row"><a class="btn" href="./">${esc(t('viewRank'))} →</a><button class="btn danger" id="wd">${esc(t('withdraw'))}</button></div>`;
  else if(j.status==='withdrawn')main=`<div class="err">${esc(t('withdrawn'))}<br>${esc(t('again'))}</div>`;
  else main=`<form class="card" id="cf" style="display:grid;gap:12px">
     <div class="grid2"><label class="field">${esc(t('gName'))}<input type="text" name="g" required minlength="2" maxlength="40" autocomplete="name"></label>
      <label class="field">${esc(t('gRel'))}<select name="r" required><option value="">—</option><option value="mother">${esc(t('mother'))}</option><option value="father">${esc(t('father'))}</option><option value="guardian">${esc(t('guardian'))}</option></select></label></div>
     <label class="check"><input type="checkbox" name="c1" required><span>${esc(t('chk1'))}</span></label>
     <label class="check"><input type="checkbox" name="c2" required><span>${esc(t('chk2'))}</span></label>
     <button class="btn gold" type="submit">${esc(t('agree'))}</button></form>`;
  $app.innerHTML=`<div class="consent"><h1 style="margin:0;font-size:1.4rem;font-weight:900">${esc(t('cTitle'))}</h1>${j.status==='pending'?`<p class="muted" style="margin:0">${esc(t('cIntro',{d:j.dojang}))}</p>`:''}${kid}${err?`<div class="err" role="alert">${esc(err)}</div>`:''}${j.status==='pending'?info:''}${main}</div>`;
  const f=document.getElementById('cf');
  if(f)f.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(f);f.querySelector('button').disabled=true;
    try{const r=await rpc('hero_consent_set',{p_token:tok,p_agree:true,p_guardian:fd.get('g'),p_relation:fd.get('r'),p_version:CONSENT_VERSION});
      drawConsent(tok,r.ok?r:j,r.ok?'':t('e_'+r.reason))}catch(x){drawConsent(tok,j,x.message)}});
  const w=document.getElementById('wd');
  if(w)w.addEventListener('click',async()=>{if(!confirm(t('wConfirm')))return;w.disabled=true;
    try{const r=await rpc('hero_consent_set',{p_token:tok,p_agree:false});drawConsent(tok,r,'')}catch(x){drawConsent(tok,j,x.message)}})}

/* ================= 본사 관리 ================= */
let sb=null,ATAB='d',ACOURSE=null;
async function sbc(){if(sb)return sb;if(!window.supabase)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='../supabase.js';s.onload=ok;s.onerror=()=>no(new Error(t('net')));document.head.appendChild(s)});
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});return sb}
async function adminView(msg){$app.innerHTML=`<div class="card"><p class="empty">${esc(t('loading'))}</p></div>`;
  try{await sbc()}catch(e){$app.innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$app.innerHTML=`<section class="hero"><h1 style="font-size:1.6rem">${esc(t('aTitle'))}</h1><p>${esc(t('aLogin'))}</p></section>
    <form class="card" id="lf" style="max-width:420px;margin:0 auto;display:grid;gap:10px">${msg?`<div class="err">${esc(msg)}</div>`:''}
     <label class="field">${esc(t('email'))}<input type="email" name="e" required autocomplete="username"></label><label class="field">${esc(t('pw'))}<input type="password" name="p" required autocomplete="current-password"></label>
     <button class="btn gold">${esc(t('login'))}</button></form>`;
    document.getElementById('lf').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);const {error}=await sb.auth.signInWithPassword({email:fd.get('e'),password:fd.get('p')});adminView(error?error.message:'')});return}
  const {data:me}=await sb.from('profiles').select('role,name').eq('id',session.user.id).maybeSingle();
  if(!me||!['admin','manager'].includes(me.role)){$app.innerHTML=`<div class="err">${esc(t('noAuth'))}</div><p><button class="btn" id="lo">${esc(t('logout'))}</button></p>`;document.getElementById('lo').onclick=async()=>{await sb.auth.signOut();adminView()};return}
  $app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><h1 style="margin:0;font-size:1.3rem;font-weight:900">${esc(t('aTitle'))}</h1><div class="row"><span class="muted">${esc(me.name||session.user.email)}</span><button class="btn sm" id="lo">${esc(t('logout'))}</button></div></div>
   <nav class="tabs">${[['d','tD'],['c','tC'],['k','tK']].map(([k,l])=>`<button data-at="${k}" aria-pressed="${ATAB===k}">${esc(t(l))}</button>`).join('')}</nav><div id="ab"></div>`;
  document.getElementById('lo').onclick=async()=>{await sb.auth.signOut();adminView()};
  $app.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{ATAB=b.dataset.at;adminView()});
  const ab=document.getElementById('ab');try{await (ATAB==='d'?admDojangs:ATAB==='c'?admCourses:admKids)(ab)}catch(e){ab.innerHTML=`<div class="err">${esc(e.message||e)}</div>`}}
const chk=r=>{if(r.error)throw new Error(r.error.message);return r.data};
async function admDojangs(el){const rows=chk(await sb.from('hero_dojangs').select('*').order('status').order('created_at',{ascending:false}));
  el.innerHTML=`<div class="card scroll"><table class="adm"><thead><tr><th>${esc(t('dojang'))}</th><th>${esc(t('country'))}</th><th>${esc(t('lic'))}</th><th>${esc(t('created'))}</th><th></th><th></th></tr></thead><tbody>
   ${rows.map(d=>`<tr><td><b>${esc(d.name)}</b><div class="muted">${esc(d.coach)}</div>${d.note?`<div class="muted">📝 ${esc(d.note)}</div>`:''}</td><td>${flag(d.country)} ${esc(d.country)} ${esc(d.city)}</td><td style="font-family:var(--num);font-size:.75rem">${esc(d.license_code)}</td><td>${esc(day(d.created_at))}</td>
    <td><span class="pill ${d.status}">${esc(t('st_'+d.status))}</span></td><td><div class="row">${d.status!=='approved'?`<button class="btn sm gold" data-ds="approved" data-id="${d.id}">${esc(d.status==='suspended'?t('restore'):t('approve'))}</button>`:''}${d.status==='pending'?`<button class="btn sm" data-ds="rejected" data-id="${d.id}">${esc(t('reject'))}</button>`:''}${d.status==='approved'?`<button class="btn sm danger" data-ds="suspended" data-id="${d.id}">${esc(t('suspend'))}</button>`:''}</div></td></tr>`).join('')||`<tr><td colspan="6" class="empty">—</td></tr>`}
   </tbody></table></div>`;
  el.querySelectorAll('[data-ds]').forEach(b=>b.onclick=async()=>{const s=b.dataset.ds;let note='';if(s!=='approved'){note=prompt(t('reason'),'');if(note===null)return}
    chk(await sb.from('hero_dojangs').update({status:s,note,decided_at:new Date().toISOString()}).eq('id',b.dataset.id));admDojangs(el)})}
async function admCourses(el){const rows=chk(await sb.from('hero_courses').select('*').order('created_at'));
  const ed=ACOURSE;const isNew=ed&&ed._new;
  el.innerHTML=`<div class="card scroll" style="margin-bottom:12px"><table class="adm"><thead><tr><th>${esc(t('code'))}</th><th>${esc(t('course'))}</th><th></th><th></th></tr></thead><tbody>
   ${rows.map(c=>`<tr><td style="font-family:var(--num);font-size:.8rem">${esc(c.code)}</td><td><b>${esc(c.name)}</b><div class="muted">${esc(c.name_en)} · ${c.stations.map(s=>esc(s.ko)).join(' → ')}</div></td><td><span class="pill ${c.active?'on':'off'}">${esc(c.active?t('active'):t('off'))}</span></td><td><button class="btn sm" data-ce="${esc(c.code)}">✏️</button></td></tr>`).join('')}
   </tbody></table><div class="row" style="margin-top:10px"><button class="btn gold sm" id="cn">+ ${esc(t('newCourse'))}</button></div></div>
   ${ed?`<form class="card" id="cfm" style="display:grid;gap:10px"><div class="grid2">
     <label class="field">${esc(t('code'))}<input type="text" name="code" required pattern="[A-Z0-9-]{3,20}" value="${esc(ed.code)}" ${isNew?'':'readonly'} placeholder="HERO-STD-2"></label>
     <label class="field">${esc(t('active'))}<select name="active"><option value="1" ${ed.active?'selected':''}>${esc(t('active'))}</option><option value="0" ${ed.active?'':'selected'}>${esc(t('off'))}</option></select></label>
     <label class="field">${esc(t('nameKo'))}<input type="text" name="name" required value="${esc(ed.name)}"></label><label class="field">${esc(t('nameEn'))}<input type="text" name="name_en" value="${esc(ed.name_en)}"></label></div>
     <label class="field">${esc(t('setup'))}<textarea name="setup">${esc(ed.setup)}</textarea></label>
     ${isNew?`<div class="stlist">${ed.stations.map((s,i)=>`<div class="st"><b>${i+1}</b><select data-si="${i}">${STATIONS.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.ko)} · ${esc(x.en)}</option>`).join('')}</select><input type="number" min="0" max="60" step="0.5" data-sp="${i}" value="${s.pen}" aria-label="penalty"><span class="row"><button type="button" class="btn sm" data-mv="${i}" ${i?'':'disabled'}>↑</button><button type="button" class="btn sm danger" data-rm="${i}">✕</button></span></div>`).join('')}
       <div><button type="button" class="btn sm" id="as">+ ${esc(t('addSt'))}</button></div></div>`:`<p class="muted" style="margin:0">${ed.stations.map(s=>esc(s.ko)+' +'+s.pen+'s').join(' → ')}</p><p class="muted" style="margin:0;font-size:.8rem">${esc(t('stLocked'))}</p>`}
     <div class="row"><button class="btn gold">${esc(t('save'))}</button><span id="cmsg" class="muted"></span></div></form>`:''}`;
  el.querySelector('#cn').onclick=()=>{ACOURSE={_new:true,code:'',name:'',name_en:'',setup:'',active:true,stations:STATIONS.map(s=>({...s}))};admCourses(el)};
  el.querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>{const c=rows.find(x=>x.code===b.dataset.ce);ACOURSE={...c};admCourses(el)});
  const f=el.querySelector('#cfm');if(!f)return;
  const sync=()=>{const fd=new FormData(f);['code','name','name_en','setup'].forEach(k=>ACOURSE[k]=fd.get(k)??ACOURSE[k]);ACOURSE.active=fd.get('active')==='1'};
  f.querySelectorAll('[data-si]').forEach(s=>s.onchange=()=>{const x=STATIONS.find(y=>y.id===s.value);ACOURSE.stations[+s.dataset.si]={...x,pen:ACOURSE.stations[+s.dataset.si].pen}});
  f.querySelectorAll('[data-sp]').forEach(s=>s.oninput=()=>{ACOURSE.stations[+s.dataset.sp].pen=+s.value||0});
  f.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{sync();const i=+b.dataset.mv,a=ACOURSE.stations;[a[i-1],a[i]]=[a[i],a[i-1]];admCourses(el)});
  f.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{sync();ACOURSE.stations.splice(+b.dataset.rm,1);admCourses(el)});
  const as=f.querySelector('#as');if(as)as.onclick=()=>{sync();ACOURSE.stations.push({...STATIONS[0]});admCourses(el)};
  f.addEventListener('submit',async e=>{e.preventDefault();sync();const c=ACOURSE;
    const st=c.stations.map((s,i)=>({id:'s'+(i+1),ko:s.ko,en:s.en,pen:+s.pen||0,ic:s.ic}));
    const row={code:String(c.code).toUpperCase().trim(),name:c.name.trim(),name_en:(c.name_en||'').trim(),setup:(c.setup||'').trim(),active:c.active,updated_at:new Date().toISOString()};
    try{if(c._new)chk(await sb.from('hero_courses').insert({...row,stations:st}));else chk(await sb.from('hero_courses').update(row).eq('code',row.code));
      ACOURSE=null;await admCourses(el)}catch(x){f.querySelector('#cmsg').textContent=x.message}})}
async function admKids(el){const [kids,recs]=await Promise.all([sb.from('hero_kids').select('hero_id,nickname,birth_year,gender,consent_status,guardian_name,guardian_relation,consent_at,hidden,created_at,hero_dojangs(name,country)').order('created_at',{ascending:false}).limit(300),
    sb.from('hero_records').select('id,hero_id,course_code,total_ms,pen_ms,event_name,recorded_at,hidden,hero_kids(nickname)').order('recorded_at',{ascending:false}).limit(200)]).then(a=>a.map(chk));
  el.innerHTML=`<h2 style="font-size:1rem">${esc(t('recent'))}</h2><div class="card scroll" style="margin-bottom:14px"><table class="adm"><tbody>
    ${recs.map(r=>`<tr><td>${esc(day(r.recorded_at))}</td><td><b>${esc(r.hero_kids?r.hero_kids.nickname:'')}</b><div class="muted" style="font-family:var(--num);font-size:.72rem">${esc(r.hero_id)}</div></td><td>${esc(r.course_code)}</td><td style="font-family:var(--num)">${fmt(r.total_ms)}</td><td class="muted">${esc(r.event_name)}</td><td><button class="btn sm ${r.hidden?'':'danger'}" data-rh="${r.id}" data-v="${r.hidden?0:1}">${esc(r.hidden?t('show'):t('hide'))}</button></td></tr>`).join('')||'<tr><td class="empty">—</td></tr>'}
   </tbody></table></div><h2 style="font-size:1rem">${esc(t('kids'))}</h2><div class="card scroll"><table class="adm"><tbody>
    ${kids.map(k=>`<tr><td style="font-family:var(--num);font-size:.75rem">${esc(k.hero_id)}</td><td><b>${esc(k.nickname)}</b><div class="muted">${esc(k.birth_year)} · ${esc(t(k.gender))}</div></td><td>${k.hero_dojangs?flag(k.hero_dojangs.country)+' '+esc(k.hero_dojangs.name):''}</td><td><span class="pill ${k.consent_status}">${esc(t('ks_'+k.consent_status))}</span>${k.consent_at&&k.consent_status==='given'?`<div class="muted" style="font-size:.75rem">${esc(k.guardian_name)} (${esc(t(k.guardian_relation)||'')}) · ${esc(new Date(k.consent_at).toLocaleString())}</div>`:''}</td><td><button class="btn sm ${k.hidden?'':'danger'}" data-kh="${esc(k.hero_id)}" data-v="${k.hidden?0:1}">${esc(k.hidden?t('show'):t('hide'))}</button></td></tr>`).join('')||'<tr><td class="empty">—</td></tr>'}
   </tbody></table></div>`;
  el.querySelectorAll('[data-rh]').forEach(b=>b.onclick=async()=>{chk(await sb.from('hero_records').update({hidden:b.dataset.v==='1'}).eq('id',b.dataset.rh));admKids(el)});
  el.querySelectorAll('[data-kh]').forEach(b=>b.onclick=async()=>{chk(await sb.from('hero_kids').update({hidden:b.dataset.v==='1'}).eq('hero_id',b.dataset.kh));admKids(el)})}
route();
</script>
