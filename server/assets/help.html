<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🆘 돌발 상황 도움말 · KICKSTART UP</title>
<style>
:root{--bg:#0B0D12;--card:#141a26;--line:#2a3350;--gold:#E8B04A;--gold2:#FFD27A;--txt:#EEF1F7;--mut:#9aa3b5;--red:#FF3B30;--ok:#2fbf71}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 "Noto Sans KR","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0B0D12 85%,rgba(11,13,18,.0));padding:14px 18px 10px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;font-weight:900}.top h1 small{display:block;font-size:12px;letter-spacing:.16em;color:var(--gold);font-weight:800}
.top .links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.top .links a{color:var(--txt);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:700;background:#151c2e}
.q{margin-top:10px;display:flex;gap:10px}
.q input{flex:1;font-size:22px;padding:12px 16px;border-radius:14px;border:2px solid var(--gold);background:#0f1522;color:#fff;outline:none}
.q input::placeholder{color:#6f7a90}
.q button{font-size:18px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:#151c2e;color:var(--txt);cursor:pointer}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cats button{font-size:15px;font-weight:800;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#151c2e;color:var(--txt);cursor:pointer}
.cats button.on{background:var(--gold);color:#1a1205;border-color:var(--gold)}
.cats button i{font-style:normal;opacity:.7;font-weight:600;margin-left:4px;font-size:13px}
.rule{margin:6px 18px 0;padding:10px 14px;border-radius:12px;background:#3a1714;border:1px solid #7a2a22;color:#FFD6CF;font-size:15px}
.rule b{color:#fff}
main{padding:10px 18px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.card:hover{border-color:var(--gold)}
.card .c{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.04em}
.card h3{margin:0;font-size:19px;line-height:1.35}
.card p{margin:0;color:var(--mut);font-size:14px}
.card .pic{font-size:12px;color:#8fd3ff;font-weight:700}
.none{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0;font-size:18px}
/* 자세히 */
#dlg{position:fixed;inset:0;z-index:20;background:rgba(5,7,12,.82);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
#dlg.on{display:flex}
.box{width:min(1080px,100%);background:#10151f;border:1px solid var(--line);border-radius:20px;padding:22px 24px;position:relative}
.box .x{position:absolute;right:14px;top:12px;font-size:26px;background:none;border:0;color:var(--txt);cursor:pointer;padding:4px 10px}
.box .c{font-size:13px;font-weight:800;color:var(--gold)}
.box h2{margin:4px 0 12px;font-size:27px;line-height:1.3;padding-right:40px}
.grid4{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:18px}
.grid4 dt{color:var(--gold2);font-weight:800}
.grid4 dd{margin:0}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:10px;margin:0 0 8px}
ol.steps li i{font-style:normal;color:#FF8A80;font-weight:800}
ol.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;display:grid;place-items:center;font-size:15px;margin-top:2px}
.lim{display:inline-block;background:#3a2a08;border:1px solid var(--gold);color:var(--gold2);border-radius:10px;padding:2px 10px;font-weight:800}
.fb{color:#FFD6CF}
.shots{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.shots figure{margin:0}.shots img{max-width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.shots figcaption{font-size:14px;color:var(--mut);margin-top:6px}
.rel{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.rel button{font-size:14px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:#151c2e;color:var(--txt);cursor:pointer}
mark{background:#E8B04A;color:#1a1205;border-radius:3px;padding:0 2px}
@media (max-width:640px){.grid4{grid-template-columns:1fr}.grid4 dt{margin-top:6px}.box h2{font-size:22px}}
</style></head><body>
<header>
  <div class="top"><h1><small>KICKSTART UP · 대회 당일</small>🆘 돌발 상황 도움말</h1>
    <div class="links"><a href="/emergency" target="_blank">🖨 비상 안내(인쇄)</a><a href="/staff" target="_blank">👥 진행요원 안내</a><a href="#" id="toPaper">📄 종이 채점지</a></div></div>
  <div class="q"><input id="q" type="search" placeholder="무슨 일이 생겼나요?  예: 다시 채점 · 심판 점수 · 소리 · 기권 · 음악" autocomplete="off" autofocus><button id="qx" title="지우기">✕</button></div>
  <div class="cats" id="cats"></div>
</header>
<div class="rule">⏱ <b>5분 규칙</b> — 프로그램 문제로 <b>5분 안에 안 풀리면 고치지 말고</b> 그 코트는 <b>종이 채점지</b>로 넘어가고 본부에 알립니다. 점수는 노트북·본부에 남아 있어 나중에 옮겨 적으면 됩니다.</div>
<main id="list"></main>
<div id="dlg"><div class="box" id="box"></div></div>
<script>
/* 사람(맡은 자리)별 갈래 */
const CATS=[['all','전체'],['hq','🖥 본부'],['op','💻 코트 운영석'],['judge','⚖️ 심판'],['room','🚪 대기실'],['award','🏅 시상식'],['emer','🆘 비상(전기·연결)'],['roster','📋 명단·대진'],['rule','📐 규칙·판정'],['music','🎵 음악'],['pace','⏱ 진행 속도'],['coach','📱 지도자·학부모']];
const CN=Object.fromEntries(CATS);
/* 상황: t 제목 · k 찾는 말 · who 누가 · where 어디서 · s 순서 · lim 몇 분 규칙 · fb 그래도 안 되면 · img 그림 · rel 함께 보기 */
const H=[
/* ---------- 본부 ---------- */
{id:'hq-court',c:'hq',t:'코트 노트북이 본부에 안 보여요 (연결 끊김)',k:'연결 끊김 코트 안보임 안 나타남 사라짐 주소로 추가 다시 찾기',who:'본부',where:'본부 운영 → 🖥️ 코트 연결',
 s:['그 코트 노트북이 <b>대회 공유기 와이파이</b>에 연결돼 있는지 확인합니다.','코트 노트북의 <b>검은 창(현장 프로그램)</b>이 켜져 있고 <b>운영석 화면이 열려</b> 있는지 봅니다.','본부 🖥️ 코트 연결에서 <b>🔎 지금 다시 찾기</b>를 누릅니다.','그래도 안 보이면 코트 노트북 검은 창에 보이는 주소(예: 192.168.0.12:8080)를 <b>주소로 추가</b>에 넣습니다.'],
 lim:'3분',fb:'연결이 안 돼도 그 코트는 경기를 계속할 수 있습니다. 점수는 코트 노트북에 저장되고, 다시 붙으면 본부로 모입니다.',img:[['hq_tiles','④ 코트 연결 타일']],rel:['emer-wifi','op-off']},
{id:'hq-ver',c:'hq',t:'「버전 다름」 경고가 떠요',k:'버전 다름 업데이트 옛 버전 판',who:'본부',where:'본부 운영 → 🖥️ 코트 연결',
 s:['경고가 뜬 코트를 확인합니다.','그 코트가 <b>부문과 부문 사이</b>일 때 현장 프로그램(검은 창)을 닫았다가 다시 켭니다. 인터넷이 되면 최신판으로 저절로 바뀝니다.','다시 켠 뒤 같은 코트 글자(A~E)를 고르고 운영석을 엽니다. 경기는 멈춘 곳부터 이어집니다.'],
 lim:'경기 중이면 끝나고',fb:'인터넷이 없으면 그대로 진행해도 됩니다. 대회 날 아침에 모든 노트북 버전을 맞춰 두세요.',rel:['hq-court']},
{id:'hq-web',c:'hq',t:'결과가 홈페이지에 안 올라가요',k:'홈페이지 결과 안 올라감 안보임 인터넷 보내기 지도자 결과',who:'본부',where:'본부 운영 → 📱 지도자용 진행 상황',
 s:['본부 노트북이 <b>인터넷</b>에 연결돼 있는지 확인합니다 (휴대폰 테더링·에그).','📱 지도자용 진행 상황 → 관리자 로그인 → 대회 고르기 → <b>▶ 인터넷으로 보내기 시작</b>.','같은 칸의 <b>🏅 경기 결과 → 홈페이지</b>가 「자동으로 보내는 중」이면 정상입니다. 급하면 <b>지금 결과 보내기</b>.','「옛 버전 코트」 알림이 뜨면 그 코트 노트북을 다시 켜서 최신판으로 맞춥니다.'],
 lim:'5분',fb:'인터넷이 끊겨도 결과는 본부에 쌓여 있다가 연결되면 저절로 다시 보냅니다. 코트에서 따로 보낼 필요가 없습니다.',img:[['hq_tiles','③ 지도자용 진행 상황 타일']],rel:['coach-when','coach-cert']},
{id:'hq-sound',c:'hq',t:'방송(호출) 소리가 안 나요',k:'방송 소리 안남 호출 음성 스피커 안 들려 목소리',who:'본부',where:'본부 모니터(전광판) 창',
 s:['방송 소리는 <b>본부 모니터(전광판) 창</b>에서만 나옵니다. 그 창이 열려 있는지 봅니다 (본부 운영 → 📺 본부 모니터).','본부 모니터 화면을 <b>마우스로 한 번 누릅니다</b>. 한 번도 누르지 않으면 인터넷 창이 소리를 막습니다.','노트북 소리 크기·음소거, 스피커 선과 볼륨을 확인합니다.','여러 방송이 한꺼번에 오면 <b>차례로</b> 읽으므로 몇 초 늦게 나올 수 있습니다.'],
 lim:'2분',fb:'급하면 방송 문구를 마이크로 직접 읽습니다.',img:[['hq_tiles','⑦ 본부 모니터 타일 · ① 호출·대기·공지']],rel:['award-call','pace-notice']},
{id:'hq-swap',c:'hq',t:'본부 노트북이 고장 났어요 (다른 노트북을 본부로)',k:'본부 고장 본부 교체 바꾸기 본부 노트북 꺼짐',who:'본부 대표·기술 담당',where:'예비 노트북 → 현장 프로그램 첫 화면',
 s:['예비 노트북을 대회 공유기 와이파이에 연결하고 현장 프로그램을 켭니다.','첫 화면에서 <b>본부</b>를 고르고, 접수 홈페이지 <b>운영자(대표·관리자) 계정으로 로그인</b>합니다 (로그인할 때만 인터넷 필요 · 휴대폰 테더링).','본부 운영을 열면 코트들이 저절로 나타납니다. 📺 본부 모니터를 다시 열고 화면을 한 번 누릅니다.'],
 lim:'10분',fb:'본부가 없어도 <b>코트들은 각자 경기를 계속</b>할 수 있습니다. 당황하지 말고 코트는 그대로 진행시킵니다.',rel:['hq-court','hq-sound']},
{id:'hq-stop',c:'hq',t:'「○코트가 몇 분째 멈춰 있습니다」 알림이 떠요',k:'멈춤 분째 멈춰 진행 안됨 느림 알림',who:'본부 → 그 코트',where:'본부 운영 맨 위 알림',

{id:'hq-print',c:'hq',t:'상장이 안 나와요 (본부 자동 출력)',k:'상장 인쇄 프린터 출력 안됨 용지',who:'본부',where:'본부 운영 → 🖨️ 상장 자동 출력',

 lim:'5분',fb:'현장 출력이 안 되면 지도자들이 대회 뒤 홈페이지 「결과 · 상장」에서 직접 뽑을 수 있습니다.',img:[['hq_tiles','⑥ 상장 자동 출력 · ② 시작 전 점검']],rel:['coach-cert']},
{id:'hq-real',c:'hq',t:'시험 모드 → 실제 대회로 바꾸기 (대회 날 아침)',k:'시험 모드 실제 대회 바꾸기 가상 경기 지우기 초기화',who:'본부',where:'본부 맨 위 띠',

 lim:'1~2분',fb:'끝내 안 오면 「🚫 기권 처리」.',img:[['p_run_hdr','④ 목록의 「호출」 · ③ 이 조 나중에']],rel:['op-late2','op-wd','room-absent']},

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CAT='all';
const norm=s=>String(s).toLowerCase().replace(/<[^>]+>/g,'').replace(/\s+/g,'');
function score(h,q){if(!q)return 1;const words=q.split(/\s+/).filter(Boolean);let sc=0;
  const T=norm(h.t),K=norm(h.k),S=norm(h.s.join(' ')+' '+(h.where||'')+' '+(h.fb||''));
  for(const w0 of words){const w=norm(w0);if(!w)continue;let ok=false;
    if(T.includes(w)){sc+=10;ok=true;}if(K.includes(w)){sc+=6;ok=true;}if(S.includes(w)){sc+=2;ok=true;}
    if(!ok&&w.length>=2){/* 두 글자씩 쪼개 비슷한 말도 */for(let i=0;i<w.length-1;i++){const bi=w.slice(i,i+2);if(T.includes(bi)||K.includes(bi)){sc+=1;ok=true;}}}
    if(!ok)return 0;}
  return sc;}
function hl(s,q){if(!q)return s;let o=s;q.split(/\s+/).filter(w=>w.length>=1).forEach(w=>{const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','g');o=o.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,'<mark>$1</mark>'));});return o;}
function renderCats(){const q=$('#q').value.trim();
  $('#cats').innerHTML=CATS.map(([k,l])=>{const n=H.filter(h=>(k==='all'||h.c===k)&&score(h,q)).length;return `<button class="${CAT===k?'on':''}" data-cat="${k}">${l}<i>${n}</i></button>`;}).join('');}
function render(){const q=$('#q').value.trim();renderCats();
  const L=H.map(h=>({h,sc:score(h,q)})).filter(x=>x.sc&&(CAT==='all'||x.h.c===CAT)).sort((a,b)=>q?b.sc-a.sc:0);
  $('#list').innerHTML=L.length?L.map(({h})=>`<div class="card" data-id="${h.id}"><span class="c">${CN[h.c]}</span><h3>${hl(esc(h.t),q)}</h3><p>${esc(h.where||'')}</p>${h.img?'<span class="pic">🖼 화면 사진 있음</span>':''}</div>`).join(''):`<div class="none">찾는 말과 맞는 상황이 없습니다. 다른 말로 찾아보거나, <b>본부에 먼저 연락</b>하세요.</div>`;}
function open(id){const h=H.find(x=>x.id===id);if(!h)return;const q=$('#q').value.trim();
  $('#box').innerHTML=`<button class="x" data-close>✕</button><span class="c">${CN[h.c]}</span><h2>${hl(esc(h.t),q)}</h2>
  <dl class="grid4"><dt>누가</dt><dd>${h.who||''}</dd><dt>어디서</dt><dd>${h.where||''}</dd>
  <dt>이렇게</dt><dd><ol class="steps">${h.s.map(x=>`<li><span>${x}</span></li>`).join('')}</ol></dd>
  ${h.lim?`<dt>시간 기준</dt><dd><span class="lim">⏱ ${h.lim}</span> 안에 안 되면 아래로 넘어갑니다</dd>`:''}
  ${h.fb?`<dt>안 되면</dt><dd class="fb">${h.fb}</dd>`:''}</dl>
  ${h.paper?`<div class="rel">${PAPER.map(([n,f])=>`<a href="/sheets/${f}.pdf" target="_blank" style="color:#fff;text-decoration:none"><button>📄 ${n}</button></a>`).join('')}</div>`:''}
  ${h.img?`<div class="shots">${h.img.map(([f,cap])=>`<figure><img src="/help/${f}.jpg" alt="${esc(cap)}" loading="lazy"><figcaption>빨간 번호 · ${esc(cap)}</figcaption></figure>`).join('')}</div>`:''}
  ${h.rel?`<div class="rel"><span style="color:var(--mut);align-self:center">함께 보기</span>${h.rel.map(r=>{const x=H.find(y=>y.id===r);return x?`<button data-id="${x.id}">${esc(x.t)}</button>`:'';}).join('')}</div>`:''}`;
  $('#dlg').classList.add('on');$('#dlg').scrollTop=0;history.replaceState(null,'','#'+id);}
function close(){$('#dlg').classList.remove('on');history.replaceState(null,'',location.pathname);}
document.addEventListener('click',e=>{const c=e.target.closest('[data-cat]');if(c){CAT=c.dataset.cat;render();return;}
  const d=e.target.closest('[data-id]');if(d){open(d.dataset.id);return;}
  if(e.target.closest('[data-close]')||e.target.id==='dlg'){close();return;}
  if(e.target.id==='qx'){$('#q').value='';render();$('#q').focus();}
  if(e.target.id==='toPaper'){e.preventDefault();open('emer-paper');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
$('#q').addEventListener('input',()=>{render();});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const f=document.querySelector('.card');if(f)open(f.dataset.id);}});
render();if(location.hash.length>1)open(location.hash.slice(1));
</script></body></html>
