<script>
const APPS=__APPS__;
let NODE=null,PLAN=null,LIC=null,RUL=0,MORE=false;
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOCAL=['localhost','127.0.0.1'].includes(location.hostname);
async function setRole(role,court){
  const r=await fetch('/api/node',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role,court:court||''})});
  const j=await r.json();if(j.error){alert(j.error);return false;}NODE=j;return true;}
/* 종목 그림 (선 그림) — v1.4.54 자유 품새·태권체조·팀 대항 경연 새로 */
const GLYPH={
 recognized:'<circle cx="32" cy="12" r="5"/><path d="M32 18v18M32 24l-13 6M32 24l14-8M32 36l-11 18M32 36l12 18M16 58h32"/>',
 freestyle:'<circle cx="22" cy="12" r="5"/><path d="M23 18l4 15M27 33l-13 11M27 33l22-7M25 23l-12-3M25 23l12-7"/><path d="M47 6v12a3.2 3.2 0 1 1-3.2-3.2M47 6l9-2.5v11a3.2 3.2 0 1 1-3.2-3.2"/><path d="M12 58h40"/>',
 gym:'<circle cx="32" cy="12" r="5"/><path d="M32 18v18M32 23L20 10M32 23l12-13M32 36l-9 18M32 36l9 18"/><path d="M9 42c3.5-3.5 3.5-8 0-11.5M55 42c-3.5-3.5-3.5-8 0-11.5M14 38c1.8-1.8 1.8-4 0-5.8M50 38c-1.8-1.8-1.8-4 0-5.8"/>',
 team100:'<circle cx="16" cy="17" r="4"/><circle cx="32" cy="12" r="5"/><circle cx="48" cy="17" r="4"/><path d="M16 22v13M16 26l-6 6M16 26l6 4M32 18v18M32 23l-9-7M32 23l9-7M48 22v13M48 26l6 6M48 26l-6 4M16 35l-4 15M16 35l4 15M32 36l-6 18M32 36l6 18M48 35l-4 15M48 35l4 15"/>',
 gyeokpa:'<path d="M10 22h44v7H10zM10 33h18l3 4-3 3H10zM36 33h18v7H36l-2-3zM10 44h44v7H10z"/><path d="M31 10v6M24 12l3 5M38 12l-3 5"/>',
 kyorugi:'<path d="M8 20l14 12-14 12M56 20L42 32l14 12"/><path d="M26 32h12M32 10v8M32 46v8"/>',
 hq:'<path d="M32 6l22 12.7v26.6L32 58 10 45.3V18.7z"/><circle cx="32" cy="32" r="5"/><path d="M32 13v14M32 37v14M15.5 22.5l12 7M36.5 34.5l12 7M48.5 22.5l-12 7M27.5 34.5l-12 7"/>'};
GLYPH.poomsae=GLYPH.recognized;
const EVEN={recognized:'Recognized Poomsae',freestyle:'Freestyle Poomsae',gym:'Taekwon Gymnastics',team100:'Team Performance',gyeokpa:'Gyeokpa',kyorugi:'Kyorugi'};
const glyph=(k,c)=>`<svg class="${c||'glyph'}" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${GLYPH[k]||GLYPH.hq}</svg>`;
const two=n=>String(n).padStart(2,'0');
function openNew(){return window.open('about:blank','_blank');}
function go(w,url){if(w&&!w.closed){w.location.href=url;try{w.focus();}catch(e){}}else location.href=url;}
function stat(){const st=document.getElementById('luxstat');if(!st)return;
  st.innerHTML=`<div><small>Station</small><b class="${NODE?'':'warn'}">${!NODE?'연결 안 됨':NODE.role==='hq'?'대회 본부':NODE.role==='court'?esc(NODE.court)+'코트':'미지정'}</b></div>
    <div><small>License</small><b class="${LIC&&LIC.code?'ok':'warn'}">${LIC&&LIC.code?'허가됨 ~'+esc(LIC.ends):'연습 모드'}</b></div>
    <div><small>Rules</small><b class="${RUL?'ok':''}">${RUL?'본부 규칙 받음':'—'}</b></div>
    <div><small>Address</small><b>${NODE&&NODE.ips&&NODE.ips.length?'http://'+esc(NODE.ips[0])+':'+NODE.port+'/':'와이파이 확인'}</b></div><div><small>Edition</small><b>v__VERSION__</b></div>`;}
/* 1) 처음: 이 노트북의 역할 고르기 — 코트(A~H) 또는 본부 */
function vPick(){const L=MORE?'ABCDEFGH':'ABCDE',cur=NODE&&NODE.role==='court'?NODE.court:'';
  return `<div class="pk"><h2>이 노트북은 어디에 쓰나요?</h2><p class="muted">코트마다 노트북 한 대씩 서로 다른 코트를 고르세요. 한 번 고르면 기억합니다. 종목은 본부 운영표가 보낸 순서대로 저절로 열립니다.</p>
    <div class="pk-grid">${L.split('').map(c=>`<button class="pk-c ${cur===c?'on':''}" data-court="${c}"><b>${c}</b><span>${c}코트</span></button>`).join('')}
      <button class="pk-c hq" data-hqpick>${glyph('hq','pk-g')}<span>대회 본부</span></button></div>
    ${MORE?'':'<button class="lk" data-more>F·G·H 코트 더 보기</button>'}${NODE&&NODE.role?'<button class="lk" data-cancel style="margin-left:14px">취소</button>':''}</div>`;}
/* 2) 코트 노트북: 지금 할 종목 카드 + 오늘 이 코트 순서 */
function vCourt(){const r=window.KS_SEQ&&PLAN?KS_SEQ.seq(PLAN):{B:[],cur:null},b=r.cur,c=NODE.court;
  const nm=b&&b.divs.find(d=>!d.fin),act=r.active&&b&&r.active.app===b.app?r.active.now:null;
  const pc=b&&b.games?Math.round(b.gdone/b.games*100):0;
  const big=b?`<button class="now ev-${b.ev}" data-open="${b.app}">
      <span class="now-k">${b.fin?'모두 끝남':act?'지금 진행 중':'지금 할 종목'}</span>${glyph(b.ev,'now-g')}
      <span class="now-n"><em>${EVEN[b.ev]||''}</em><b>${esc(b.name)}</b><span>${two(b.divs[0].num<1000?b.divs[0].num:b.i+1)}${b.n>1?'~'+two(b.divs[b.n-1].num<1000?b.divs[b.n-1].num:b.i+b.n):''}번 순서 · ${b.n}부문${b.games?` · ${b.games}경기`:''}</span>
        <span class="now-d">${act?`▶ ${esc(act.div||'')} · ${esc(act.label||'')}`:nm?`다음 부문 · ${esc(nm.name)}`:''}</span>
        ${b.pending?'<span class="now-w">📥 본부가 보낸 명단이 있습니다 · 운영석을 열면 들어갑니다</span>':''}
        <span class="now-bar"><i style="width:${pc}%"></i></span><span class="now-p">${b.done}/${b.n} 부문 끝 · ${pc}%</span></span>
      <span class="now-go">${esc(b.name)} 운영석 열기 →</span></button>`
    :`<div class="now none"><span class="now-k">아직 배정된 경기가 없습니다</span>${glyph('hq','now-g')}<span class="now-n"><b>본부를 기다리는 중</b><span>본부 노트북 「대회 운영표 → 📡 코트로 보내기」를 누르면 이 코트의 순서가 여기에 나옵니다. 급하면 아래 「예비 모드」로 종목을 직접 여세요.</span></span></div>`;
  const list=r.B.length?r.B.map(x=>`<li class="${x.fin?'fin':x===b?'cur':''}" data-open="${x.app}">${glyph(x.ev,'sq-g')}<span><b>${esc(x.name)}</b><small>${x.divs[0].num<1000?two(x.divs[0].num)+(x.n>1?'~'+two(x.divs[x.n-1].num):'')+'번 · ':''}${x.n}부문</small></span><em>${x.fin?'✓ 끝':x===b?'● 지금':x.done?`${x.done}/${x.n}`:'대기'}</em></li>`).join(''):'<li class="emp">본부가 보낸 순서가 없습니다</li>';
  return `<div class="ct"><div class="ct-top"><span class="ct-badge">${esc(c)}<small>코트</small></span><div class="ct-t"><b>${esc(c)}코트 노트북</b><span>본부 운영표의 순서대로 종목 운영석이 저절로 이어집니다 · 한 종목이 끝나면 다음 종목으로 넘어가라는 안내가 뜹니다</span></div>
      <button class="lk" data-repick>코트 바꾸기</button></div>
    <div class="ct-main">${big}<div class="sq"><h3>오늘 ${esc(c)}코트 순서</h3><ol>${list}</ol></div></div>
    <div class="spare"><span class="sp-k">예비 모드 · 종목 직접 열기</span>${APPS.map(a=>`<button class="sp" data-open="${a.key}">${glyph(a.key,'sp-g')}${esc(a.title.replace(' 대회',''))}</button>`).join('')}
      <a class="sp" href="/view" target="_blank" rel="noopener">관람객 화면</a><a class="sp" href="/guide">사용 설명서</a><a class="sp" href="/emergency" target="_blank" rel="noopener">🆘 비상 안내</a><button class="sp" data-fromhq title="이 노트북이 고장 난 코트 노트북 대신일 때">🛟 본부에서 이 코트 백업 받기</button><button class="sp" data-hqpick>본부로 바꾸기</button></div></div>`;}
/* 3) 본부 노트북 */
function vHq(){return `<div class="ct"><div class="ct-top"><span class="ct-badge hq">${glyph('hq','pk-g')}</span><div class="ct-t"><b>대회 본부 노트북</b><span>같은 와이파이의 코트 노트북을 자동으로 찾아 모읍니다 · 종목 설정 → 대회 운영표 → 코트로 보내기 순서로 준비하세요</span></div><button class="lk" data-repick>코트로 바꾸기</button></div>
    <div class="ct-main"><button class="now ev-hq" data-hqopen><span class="now-k">대회 본부</span>${glyph('hq','now-g')}<span class="now-n"><em>Headquarters</em><b>본부 운영 열기</b><span>종목별 경기 규칙 · 대회 운영표(관제탑) · 시작 전 점검 · 호출·방송 · 통합 결과</span></span><span class="now-go">본부 열기 →</span></button>
      <div class="sq"><h3>바로 가기</h3><ol><li data-hqopen>${glyph('hq','sq-g')}<span><b>본부 운영</b><small>코트 연결 · 점검 · 운영표</small></span><em>→</em></li>
        <li data-link="/hq/#board">${glyph('hq','sq-g')}<span><b>본부 모니터</b><small>전광판 · 방송</small></span><em>→</em></li>
        <li data-link="/view">${glyph('recognized','sq-g')}<span><b>관람객 화면</b><small>실시간 결과</small></span><em>→</em></li></ol></div></div>
    <div class="spare"><span class="sp-k">예비 모드 · 종목 직접 열기</span>${APPS.map(a=>`<button class="sp" data-open="${a.key}">${glyph(a.key,'sp-g')}${esc(a.title.replace(' 대회',''))}</button>`).join('')}<a class="sp" href="/guide">사용 설명서</a><a class="sp" href="/emergency" target="_blank" rel="noopener">🆘 비상 안내</a></div></div>`;}
let PICK=false;
function draw(){stat();const el=document.getElementById('stage');
  if(!NODE){el.innerHTML='<div class="now none"><span class="now-k">현장 서버에 연결하지 못했습니다</span><span class="now-n"><b>검은 창(현장 모드 프로그램)이 켜져 있는지 확인해 주세요</b></span></div>';return;}
  el.innerHTML=PICK||!NODE.role||NODE.role===''||NODE.role==='none'?vPick():NODE.role==='hq'?vHq():vCourt();}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-court],[data-hqpick],[data-more],[data-cancel],[data-repick],[data-open],[data-hqopen],[data-link]');if(!t)return;
  if(t.dataset.court){if(!LOCAL&&!confirm('다른 기기에서 이 노트북의 코트를 바꿀까요?'))return;if(await setRole('court',t.dataset.court)){PICK=false;await load();}return;}
  if(t.hasAttribute('data-hqpick')){if(NODE&&NODE.role==='court'&&!confirm('이 노트북을 「본부」로 바꿀까요? 코트 운영은 다른 노트북에서 해 주세요.'))return;const w=openNew();if(!(await setRole('hq'))){if(w)w.close();return;}PICK=false;draw();go(w,'/hq/#admin');return;}
  if(t.hasAttribute('data-more')){MORE=true;draw();return;}
  if(t.hasAttribute('data-cancel')){PICK=false;draw();return;}
  if(t.hasAttribute('data-repick')){PICK=true;draw();return;}
  if(t.hasAttribute('data-hqopen')){go(openNew(),'/hq/#admin');return;}
  if(t.dataset.link){go(openNew(),t.dataset.link);return;}
  if(t.dataset.open){go(openNew(),'/'+t.dataset.open+'/#admin-run');return;}});
async function load(){
  try{NODE=await (await fetch('/api/node')).json();}catch(e){NODE=null;}
  try{PLAN=await (await fetch('/api/court/plan',{cache:'no-store'})).json();}catch(e){PLAN=null;}
  try{LIC=(await (await fetch('/api/lic')).json()).lic;}catch(e){}
  try{RUL=(await (await fetch('/api/rules')).json()).at||0;}catch(e){}
  draw();}
/* v1.4.55 하드 남은 공간 · 현장 프로그램 폴더 크기 */
async function disk(){try{const j=await (await fetch('/api/disk',{cache:'no-store'})).json(),el=document.getElementById('disk');if(!el||!j.total)return;
  const gb=v=>(v/1073741824).toFixed(v<10737418240?1:0)+'GB',mb=v=>v<1073741824?Math.round(v/1048576)+'MB':gb(v),low=j.free<3*1073741824;
  el.hidden=false;el.className='disk'+(low?' bad':'');el.textContent=`💾 남은 공간 ${gb(j.free)} · 현장 프로그램 ${mb(j.used)}`+(low?' · 하드 공간이 부족합니다':'');
  el.title=Object.entries(j.parts||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+': '+mb(v)).join('\n');}catch(e){}}
/* v1.4.57 남은 공간 표시를 누르면: 하드를 차지하는 곳 찾기 + 상장 파일 정리 */
document.addEventListener('click',e=>{const fb=e.target.closest('[data-fromhq]');if(fb){fb.disabled=true;fb.textContent='본부에서 받는 중…';
    fetch('/api/backup/fromhq',{method:'POST'}).then(r=>r.json()).then(j=>{if(j.ok){fb.textContent='✓ 받았습니다 · 폴더를 엽니다';fetch('/api/results/open',{method:'POST'}).catch(()=>{});
      alert(`본부에 모인 이 코트 백업을 받았습니다:\n${(j.files||[]).join('\n')}\n\n이제 종목 운영석 → 「대회 설정」 → 「백업과 복구」의 「백업 파일에서 복구」에서 이 파일을 골라 「복구 실행」을 누르세요.`);}
      else{fb.textContent='🛟 본부에서 이 코트 백업 받기';alert(j.error||'받지 못했습니다');}fb.disabled=false;}).catch(()=>{fb.disabled=false;fb.textContent='🛟 본부에서 이 코트 백업 받기';});return;}
  if(e.target.closest('#disk'))scan();if(e.target.closest('[data-dx]'))document.getElementById('dxov').remove();
  const cb=e.target.closest('[data-dclean]');if(cb){if(cb.dataset.arm!=='1'){cb.dataset.arm='1';cb.textContent='한 번 더 누르면 지웁니다';setTimeout(()=>{cb.dataset.arm='';cb.textContent='🧹 상장 파일 지우기';},5000);return;}
    fetch('/api/disk/clean',{method:'POST'}).then(r=>r.json()).then(j=>{cb.textContent=`지웠습니다 · ${j.files||0}개 (${Math.round((j.bytes||0)/1048576)}MB)`;disk();}).catch(()=>{cb.textContent='지우지 못했습니다';});}});
async function scan(){let ov=document.getElementById('dxov');if(!ov){ov=document.createElement('div');ov.id='dxov';ov.className='dxov';document.body.appendChild(ov);}
  const sz=v=>v>=1073741824?(v/1073741824).toFixed(1)+'GB':Math.round(v/1048576)+'MB';
  for(let i=0;i<40&&document.getElementById('dxov');i++){let j=null;try{j=await (await fetch('/api/disk/scan',{cache:'no-store'})).json();}catch(e){}
    if(j){const it=j.items||[];ov.innerHTML=`<div class="dxpn"><div style="display:flex;align-items:center;gap:12px"><h2>💾 하드를 차지하는 곳</h2><button class="sp" data-dx style="margin-left:auto">닫기</button></div>
      <p class="dxs">남은 공간 ${sz(j.free||0)} / 전체 ${sz(j.total||0)}${j.busy?' · 크기를 재는 중입니다 (1분쯤)…':''}</p>
      ${it.length?`<table class="dxt">${it.map(x=>`<tr><td><b>${esc(x.name)}</b><small>${esc(x.hint||'')}</small></td><td class="n">${sz(x.size)}</td></tr>`).join('')}</table>`:'<p class="dxs">재는 중…</p>'}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="sp" data-dclean>🧹 상장 파일 지우기</button><span class="dxs" style="align-self:center">상장 자동 출력용 파일(.cert.json)만 지웁니다 · 결과·백업은 그대로</span></div></div>`;
      if(!j.busy&&it.length)break;}
    await new Promise(r=>setTimeout(r,3000));}}
disk();setInterval(disk,60000);
addEventListener('focus',()=>load());setInterval(()=>{if(!PICK)load();},5000);load();
</script>

</body></html>
