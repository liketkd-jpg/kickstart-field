<title>격파 대회 운영</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: 네이버식 흰 카드 + 초록 주색. 상단에 태극 로고와 검은 띠(도복 띠) 줄. 청·홍은 경기 색 그대로. 전광판은 어두운 경기장 화면 */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --sunk:#F0F2F5; --ink:#1E1E23; --muted:#6B7280; --line:#E5E8EC;
  --green:#03C75A; --green-ink:#029E48; --green-soft:#E6F9EE;
  --blue:#1A56DB; --blue-soft:#E8EFFD; --red:#E02424; --red-soft:#FDECEC;
  --ok:#03A14A; --ok-soft:#E6F9EE; --warn:#C27803; --warn-soft:#FDF6E3; --belt:#17171C;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 4px 14px rgba(17,24,39,.05);
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Roboto Condensed","Arial Narrow",ui-monospace,sans-serif;
  /* 이전 이름 호환 */
  --paper:var(--bg); --f-display:var(--f-body);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1A1D23; --sunk:#22262E; --ink:#ECEEF2; --muted:#9AA1AD; --line:#2C313A;
  --green:#19D46B; --green-ink:#19D46B; --green-soft:#143424;
  --blue:#6B9BFF; --blue-soft:#1A2849; --red:#FF6B6B; --red-soft:#3A1C1F;
  --ok:#3BDB82; --ok-soft:#143424; --warn:#F2B84B; --warn-soft:#3A2D14; --belt:#000;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D23; --sunk:#22262E; --ink:#ECEEF2; --muted:#9AA1AD; --line:#2C313A;
  --green:#19D46B; --green-ink:#19D46B; --green-soft:#143424;
  --blue:#6B9BFF; --blue-soft:#1A2849; --red:#FF6B6B; --red-soft:#3A1C1F;
  --ok:#3BDB82; --ok-soft:#143424; --warn:#F2B84B; --warn-soft:#3A2D14; --belt:#000;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
/* 전광판: 경기장 모니터용 어두운 화면 (테마와 관계없이 고정) */
body.disp{
  --bg:#07090D; --surface:#11151C; --sunk:#171C25; --ink:#FFFFFF; --muted:#A9B1BE; --line:#2A303B;
  --green:#22E07A; --green-soft:#0E2A1B; --blue:#3D7BFF; --blue-soft:#0F1E44; --red:#FF4747; --red-soft:#3A1013;
  --ok:#22E07A; --ok-soft:#0E2A1B; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
/* 상단 바 + 태극 로고 + 띠 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;background:var(--surface);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-shadow:0 1px 0 var(--line)}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:linear-gradient(90deg,var(--red) 0 22px,var(--belt) 22px calc(100% - 22px),var(--blue) calc(100% - 22px))}
body.disp .bar::after{background:linear-gradient(90deg,var(--red) 0 50%,var(--blue) 50%)}
.logo{width:32px;height:32px;flex:none;border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.brand{font-weight:900;font-size:18px;letter-spacing:-.03em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.back:hover{background:var(--sunk)}
.conn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--sunk);padding:5px 10px;border-radius:999px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)} .dot.local{background:var(--warn)}
main{max-width:1180px;margin:0 auto;padding-block:26px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.03em}
h1{font-weight:900;font-size:clamp(26px,5vw,36px);line-height:1.2}
h2{font-size:18px;font-weight:800}
h3{font-size:16px;font-weight:800}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid-run{display:grid;grid-template-columns:minmax(0,350px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.grid2,.grid-run{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.panel > h2:first-child,.panel > h3:first-child,.panel > .row:first-child > h2,.panel > .row:first-child > h3{position:relative;padding-left:12px}
.panel > h2:first-child::before,.panel > h3:first-child::before,.panel > .row:first-child > h2::before,.panel > .row:first-child > h3::before{content:"";position:absolute;left:0;top:.2em;bottom:.2em;width:4px;border-radius:2px;background:var(--green)}
.panel.blue{border:2px solid var(--blue);box-shadow:inset 0 6px 0 var(--blue),var(--shadow)}
.panel.red{border:2px solid var(--red);box-shadow:inset 0 6px 0 var(--red),var(--shadow)}
.label{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-ink);border-color:var(--green-ink)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn.hint{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.btn.big{padding:15px 22px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid color-mix(in srgb,var(--green) 55%,transparent);outline-offset:2px}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px var(--green-soft)}
input[type=file]{font-size:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
/* 네이버식 탭 */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.tab{border:none;background:none;padding:10px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:11px;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab.on{color:#fff;background:var(--green)}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:8px 14px;font-weight:700;cursor:pointer;border-radius:9px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--green-ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.blue{background:var(--blue);color:#fff} .chip.red{background:var(--red);color:#fff} .chip.live{background:var(--green-soft);color:var(--green-ink)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
th:first-child{border-top-left-radius:10px} th:last-child{border-top-right-radius:10px}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;word-break:keep-all}
td.num,th.num{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:16px}
th.num{font-family:var(--f-body);font-size:12px}
.x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.x:hover{color:var(--red)}
.empty{padding:26px 20px;text-align:center;color:var(--muted);background:var(--sunk);border-radius:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hr{border:none;border-top:1px solid var(--line);width:100%;margin:0}
.banner{border-radius:14px;padding:13px 15px;font-weight:700;font-size:14px}
.banner.bad{background:var(--red-soft);color:var(--red)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
/* 호출 목록 */
.perf{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.perf.cur{border:2px solid var(--green);background:var(--green-soft)}
.perf .nm{flex:1;min-width:0}
.perf .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perf .nm b.blue{color:var(--blue)} .perf .nm b.red{color:var(--red)}
/* 타이머 */
.timer{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:52px;line-height:1}
.over,.under{color:var(--red)}
/* 심판 상태 */
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.jcell{border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;font-size:13px;background:var(--surface)}
.jcell.done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.jcell .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:16px}
.drop{text-decoration:line-through;opacity:.45}
/* 심판 채점 화면: 휴대폰에서 누르기 쉬운 큰 버튼 */
.who{font-weight:900;font-size:26px;line-height:1.2;letter-spacing:-.03em}
.accnum{font-family:var(--f-num);font-size:68px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--green-ink)}
.dedbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.dedbtns{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dedbtns .btn{padding:16px 6px;font-size:18px;white-space:normal;line-height:1.25;border-radius:14px;min-height:76px}
.dedbtns .btn .small{font-size:12px;font-weight:600}
.item{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.opts{display:grid;gap:7px}
.opts.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.opts.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:52px;padding:0;font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;font-size:21px;transition:transform .08s}
.opt:hover{border-color:var(--green)}
.opt:active{transform:scale(.96)}
.opt.on{background:var(--green);border-color:var(--green);color:#fff}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;gap:10px}
.sum .n{font-family:var(--f-num);font-size:28px;font-variant-numeric:tabular-nums}
.panel:has(> [data-act="submitScore"]){position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;box-shadow:0 -6px 24px rgba(0,0,0,.10)}
.panel > [data-act="submitScore"]{width:100%;min-height:64px;font-size:20px}
.jpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.jpick button{aspect-ratio:1;max-width:100%;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-num);font-weight:700;font-size:40px;cursor:pointer;box-shadow:var(--shadow)}
.jpick button:hover{border-color:var(--green);color:var(--green-ink)}
/* 전광판: 멀리서 보이는 큰 숫자 */
.board{display:flex;flex-direction:column;gap:20px}
.board .div{font-size:clamp(18px,2.4vw,30px);font-weight:800;color:var(--muted)}
.board .name{font-weight:900;font-size:clamp(48px,10vw,128px);line-height:1.02;letter-spacing:-.04em}
.board .team{font-size:clamp(20px,2.8vw,34px);color:var(--muted);font-weight:700}
.board .clock{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(80px,15vw,210px);line-height:.9;color:var(--green)}
.board .clock.over,.board .clock.under{color:var(--red)}
.board .final{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(110px,22vw,320px);line-height:.85;color:var(--green);text-shadow:0 0 40px color-mix(in srgb,var(--green) 25%,transparent)}
.board .parts{display:flex;gap:30px;flex-wrap:wrap;font-size:clamp(20px,2.8vw,36px);font-weight:700}
.board .parts b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.2em}
.colorband{height:16px;border-radius:8px}
.colorband.blue{background:var(--blue)} .colorband.red{background:var(--red)}
.colorband.none{background:linear-gradient(90deg,var(--red) 0 50%,var(--blue) 50%)}
.bdots{display:flex;gap:10px;flex-wrap:wrap}
.bdot{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:76px;padding:10px 12px;border:2px solid var(--line);border-radius:16px;font-weight:800;font-size:clamp(14px,1.6vw,20px)}
.bdot.done{border-color:var(--ok);color:var(--ok)}
.bdot .sc{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:clamp(18px,2.2vw,28px);color:var(--ink);font-weight:700}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:620px){.vs{grid-template-columns:minmax(0,1fr)}}
.vs .side{border-radius:22px;padding:22px;border:4px solid transparent;display:flex;flex-direction:column;gap:12px;min-width:0}
.vs .side.blue{background:var(--blue-soft);box-shadow:inset 0 10px 0 var(--blue)} .vs .side.red{background:var(--red-soft);box-shadow:inset 0 10px 0 var(--red)}
.vs .side.win{border-color:var(--green)}
.vs .vname{font-weight:900;font-size:clamp(34px,6vw,80px);line-height:1.05;letter-spacing:-.03em}
.vs .vfinal{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(72px,13vw,190px);line-height:.9}
/* 대진표 */
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:200px}
.round h3{font-size:12px;color:var(--muted);letter-spacing:.02em}
.match{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.match .s{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;font-size:14px}
.match .s + .s{border-top:1px solid var(--line)}
.match .s.blue{box-shadow:inset 5px 0 0 var(--blue)} .match .s.red{box-shadow:inset 5px 0 0 var(--red)}
.match .s.win{font-weight:800;background:var(--green-soft)}
.match .s .sc{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:16px}
/* 심판 링크 버튼 */
.lnks{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.lnk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px 12px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.lnk:hover{border-color:var(--green);background:var(--green-soft)}
.lnk .ln{font-family:var(--f-num);font-weight:700;font-size:44px;line-height:1;color:var(--green-ink)}
.lnk.disp .ln{color:var(--ink);font-family:var(--f-body);font-weight:900}
.lnk .lt{font-size:12px;font-weight:700}
.lnk .ls{font-size:11px;color:var(--muted);font-weight:600}
.lnk .ls.on{color:var(--ok);font-weight:800} .lnk .ls.in{color:var(--warn);font-weight:800}
ol.order{margin:0;padding-left:28px;display:flex;flex-direction:column;gap:3px;font-size:14px}

/* ===== 심판 휴대폰 화면 맞춤 ===== */
body.jdg main{max-width:640px}
.jtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:3}
.jtab{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:15px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:var(--shadow)}
.jtab span{font-size:12px;font-weight:700;color:var(--muted)}
.jtab.blue b{color:var(--blue)} .jtab.red b{color:var(--red)}
.jtab.blue.on{border-color:var(--blue);background:var(--blue-soft)} .jtab.red.on{border-color:var(--red);background:var(--red-soft)}
@media (max-width:560px){
  main{padding-block:12px 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .bar{padding-block:9px;gap:8px}
  .logo{width:26px;height:26px}
  .brand{font-size:15px}
  .conn{padding:4px 8px}
  .conn span:last-child{display:none}
  .stack{gap:10px}
  .panel{padding:14px 12px;border-radius:16px;gap:10px}
  .who{font-size:21px}
  .accnum{font-size:54px}
  .timer{font-size:40px}
  .opts{gap:5px}
  .opt{min-height:50px;font-size:19px;border-radius:10px}
  .opts.c6 .opt{min-height:46px;font-size:17px}
  .dedbtns{gap:6px}
  .dedbtns .btn{min-height:66px;font-size:17px;padding:10px 4px}
  .item{gap:8px;padding-top:10px}
  .item b{font-size:14px}
  .sum .n{font-size:24px}
  .panel > [data-act="submitScore"]{min-height:58px;font-size:18px}
  .tabs{border-radius:14px}
  .tab{padding:9px 12px}
  .jtabs{top:calc(env(safe-area-inset-top,0px) + 50px)}
}
@media (max-width:330px){.opts.c6{grid-template-columns:repeat(4,minmax(0,1fr))}.dedbtns .btn{font-size:15px}}
/* ===== 전광판: 모니터 화면에 꽉 맞춤 (스크롤 없음) ===== */
body.disp .bar{display:none}
body.disp main{max-width:none;padding:0}

/* ===== 운영석 알림 ===== */
#alerts:empty{display:none}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.alerts.quiet{flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:var(--shadow)}
.alert{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;border:1.5px solid}
.alert .amsg{flex:1;min-width:200px}
.alert .btn{padding:6px 12px;font-size:13px}
.alert.bad{background:var(--red-soft);color:var(--red);border-color:var(--red);animation:pulse 1.6s ease-in-out infinite}
.alert.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.alert.info{background:var(--blue-soft);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}
.aic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:900;color:#fff;background:currentColor}
.aic{color:inherit}.alert .aic{background:currentColor}.alert .aic{-webkit-text-fill-color:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 35%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 0%,transparent)}}
.match.bye{border:none;background:none;min-height:30px}
.match.bye .s{padding:4px 10px;color:var(--muted)}
.mno{font-size:11px;font-weight:800;color:var(--green-ink);margin-bottom:-6px}

/* ===================================================================
   디자인 v2: 더 선명한 글씨, 정돈된 색, 어두운 상단 바
   =================================================================== */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --sunk:#EEF1F5; --ink:#0E1116; --muted:#545C69; --line:#DDE2E9;
  --green:#00B25B; --green-ink:#008C47; --green-soft:#E3F7EC;
  --blue:#1D4ED8; --blue-soft:#E7EEFE; --red:#DC2626; --red-soft:#FDECEC;
  --ok:#008C47; --ok-soft:#E3F7EC; --warn:#B45309; --warn-soft:#FEF3DD; --belt:#0E1116;
  --shadow:0 1px 2px rgba(14,17,22,.06),0 6px 18px rgba(14,17,22,.06);
  --head:#0E1116;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--muted:#AEB5C1;--line:#2F3540;--head:#07090C}}
:root[data-theme="dark"]{--muted:#AEB5C1;--line:#2F3540;--head:#07090C}
body{font-size:16px;line-height:1.5}
.small{font-size:14px}
.label{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:0}
h2{font-size:20px;font-weight:900}
h3{font-size:18px;font-weight:900}
b,strong{font-weight:800}
/* 상단 바: 도복 띠처럼 어둡게 */
.bar{background:var(--head);color:#fff;box-shadow:none}
body::before{background:var(--head)}
.bar::after{height:4px;bottom:-4px;background:linear-gradient(90deg,var(--red) 0 50%,var(--blue) 50%)}
.brand{font-size:19px;color:#fff}
.logo{box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.back{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.back:hover{background:rgba(255,255,255,.16)}
.conn{background:rgba(255,255,255,.1);color:#E6E9EE;font-size:13px}
/* 카드 */
.panel{border-radius:16px;border-color:var(--line);box-shadow:var(--shadow);padding:20px}
.panel > h2:first-child::before,.panel > h3:first-child::before,.panel > .row:first-child > h2::before,.panel > .row:first-child > h3::before{width:5px;background:var(--green)}
/* 탭 */
.tabs{padding:5px;border-radius:14px;gap:4px;margin-bottom:14px}
.tab{font-size:16px;font-weight:800;color:#3A414C;padding:10px 18px}
.tab.on{background:var(--ink);color:#fff;box-shadow:inset 0 -3px 0 var(--green)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab{color:#C9CFD8}:root:not([data-theme="light"]) .tab.on{background:var(--green);color:#06120B}}
:root[data-theme="dark"] .tab{color:#C9CFD8} :root[data-theme="dark"] .tab.on{background:var(--green);color:#06120B}
/* 버튼·칩 */
.btn{font-weight:800;border-radius:11px;font-size:15px}
.btn.primary{box-shadow:0 2px 0 var(--green-ink)}
.btn.big{font-size:18px}
.btn.sm{font-size:13px}
.chip{font-size:13px;font-weight:800;padding:3px 10px}
.chip.ok{color:var(--green-ink)}
/* 표 */
table{font-size:15px}
th{font-size:13px;font-weight:800;color:#3A414C}
td.num{font-size:18px;font-weight:700}
th.num{font-size:13px}
input[type=text],input[type=number],select{font-size:16px;font-weight:600;border-width:1.5px}
/* 한 줄 심판 링크 */
.lstrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.lstrip > b{font-size:15px}
.lchip{display:inline-flex;align-items:center;gap:6px;font-size:14px}
/* 경기 진행 화면 */
.bitem .bmain b{font-size:16px}
.bitem .sc{font-size:17px;font-weight:700}
.bitem .small.muted{font-weight:700}
.bname{font-size:clamp(24px,4vh,42px)}
.bscore{color:var(--ink);font-size:clamp(46px,9.5vh,104px);letter-spacing:-.01em}
.bent.win .bscore{color:var(--green-ink)}
.bent{border-width:2px}
.bent.win{box-shadow:0 0 0 4px var(--green)}
.jt th{font-size:14px}
.jt td.num{font-weight:800}
.jrow b{font-size:17px}
.rt td{font-size:14px} .rt td.num{font-size:19px;font-weight:800}
.bh-name{font-size:18px}
.bh-now{color:var(--ink)}
.btimer .timer{color:var(--ink)}
.timer{font-weight:700}
@media (min-width:1000px) and (max-height:820px){
  .brd .bp{padding:12px;gap:8px}
  .btimer .timer{font-size:clamp(36px,6vh,56px)}
  .bname{font-size:clamp(22px,3.6vh,32px)}
  .bscore{font-size:clamp(44px,8vh,68px)}
  .bent{padding:10px 12px;gap:2px}
  .jt td,.jt th{padding:4px 8px}
  .jt td.num{font-size:clamp(16px,2.4vh,20px)}
  .bhead{margin-bottom:8px;padding:6px 12px}
  body.brdv main{padding-block:8px}
}
/* 결과 표 순위 강조 */
td.num:first-child{font-weight:900}
/* 심판 채점판: 선택값과 합계 더 선명하게 */
.jo .opt{border-color:#CBD2DC;color:var(--ink)}
.jl,.jrl{color:#262B33}
.jl b.nv,.jrl b.nv{font-weight:800}
.jsh .nm,.jname{font-weight:900}
/* 휴대폰 세로 청·홍 채점판: 빈 공간 없이 버튼을 키움 */
@media (max-width:560px){
  .jsheet.two .jr{align-content:stretch;grid-template-rows:auto minmax(0,1fr)}
  .jsheet.two .jo{grid-auto-rows:minmax(34px,1fr);height:100%}
  .jsheet.two .jo .opt{min-height:0;height:100%}
}
/* 전광판: 보조 글씨도 밝게 */
body.disp{--muted:#C5CCD7}
body.disp .board .div{color:#D5DAE2}
.tie{font-size:min(4.4vw,7.5vh)}

body.disp .chip.ok{background:var(--green);color:#04140A;font-weight:900}
body.disp .board .vs .vfinal{font-size:min(13vw,25vh)}
body.disp .board .vs .vname{font-size:min(5.6vw,10vh)}
body.disp .board .vs .side > .bdots{margin-top:auto}
body.disp .vparts{font-size:min(1.9vw,3.2vh)}
body.disp .board .vs .bdot .sc{font-size:min(1.9vw,3.2vh)}

@media (min-width:900px) and (min-height:600px){
  .jrl{font-size:clamp(13px,1.9vh,17px);padding:0 8px}
  .jrl b{font-size:clamp(18px,2.8vh,24px)}
  .jrl b.nv{font-size:clamp(13px,1.8vh,16px)}
  .jr{grid-template-columns:clamp(80px,17%,120px) minmax(0,1fr)}
  .jsub{font-size:14px}
  .jmeta{font-size:14px}
}

/* ===== 지정품새 ===== */
.pbox{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:14px;padding:12px 14px}
.pbox select{max-width:100%}
.pchip{display:inline-flex;padding:4px 10px;border-radius:999px;background:var(--surface);border:1.5px solid var(--green);color:var(--green-ink);font-weight:800;font-size:14px}
.pchip.back{border-color:var(--ink);color:var(--ink)}
.pdrs{display:flex;flex-wrap:wrap;gap:6px}
.pdr{display:inline-flex;gap:6px;align-items:baseline;padding:5px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.pdr.on{border-color:var(--green)}
.pbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:6px 10px}
.pnow{display:inline-flex;align-items:baseline;gap:4px;padding:4px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;color:var(--muted)}
.pnow b{font-size:20px;color:var(--ink);font-weight:900}
.pnow.on{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.pnow.on b{color:var(--green-ink)}
body.bmax .pnow b{font-size:clamp(20px,3vh,34px)}
.pjc{flex:none;display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:var(--ink);color:#fff;font-weight:900;font-size:clamp(14px,2.2vh,18px);white-space:nowrap}
.pban{display:flex;gap:min(2vw,3vh);align-items:stretch;min-width:0}
.pit{display:flex;flex-direction:column;justify-content:center;padding:min(.8vw,1.3vh) min(1.6vw,2.6vh);border-radius:min(1.2vw,2vh);border:2px solid var(--line);opacity:.55;min-width:0}
.pit.on{opacity:1;border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.plab{font-weight:800;color:var(--muted);font-size:min(1.6vw,2.7vh)}
.pit.on .plab{color:var(--green)}
.pnm{font-weight:900;font-size:min(4.4vw,7.6vh);line-height:1.05;white-space:nowrap;letter-spacing:-.02em}
.pnm[data-roul]:not(.done){color:var(--warn);filter:blur(.4px)}
.pnm.done{animation:pstop .5s ease-out}
@keyframes pstop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.mid2{display:flex;justify-content:space-between;align-items:center;gap:2vw;min-width:0}
.mid2 > .tie{text-align:right}
body.disp .board.one{grid-template-rows:auto auto auto auto minmax(0,1fr) auto}
body.disp .board.one .pban:empty + .who-row{}

@media (min-width:1000px) and (max-height:820px){
  .pbar{padding:3px 8px;gap:6px}
  .pbar .label{display:none}
  .pnow{padding:2px 10px}
  .pnow b{font-size:17px}
  .bscore.wait{padding-block:2px;font-size:18px}

.pavg{font-size:14px;font-weight:700;background:rgba(255,255,255,.6);border-radius:8px;padding:3px 8px}
.pavg b{font-family:var(--f-num);font-size:18px}
.pavg b.av{font-size:22px;color:var(--green-ink)}
.btn.stopb{background:var(--red);border-color:var(--red);color:#fff}
.cmdov{position:fixed;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none;background:rgba(0,0,0,.35)}
.cmdov span{font-weight:900;font-size:min(22vw,40vh);color:#fff;letter-spacing:.05em;text-shadow:0 0 60px rgba(34,224,122,.7);animation:cmdin .25s ease-out}
@keyframes cmdin{0%{transform:scale(1.4);opacity:0}100%{transform:scale(1);opacity:1}}
.tapv{position:fixed;left:50%;bottom:2vh;transform:translateX(-50%);z-index:9;border:2px solid var(--warn);background:#000;color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;font-size:16px;cursor:pointer}

.pavg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:1000px) and (max-height:820px){.pavg{font-size:12px;padding:2px 6px}.pavg b{font-size:15px}.pavg b.av{font-size:18px}}

.bcmd{display:grid;grid-template-columns:1.7fr 1fr .7fr;gap:8px}
.bcmd .btn{padding:12px 8px;font-size:18px}
body.bmax .bcmd .btn{font-size:clamp(18px,2.6vh,28px);padding:clamp(10px,1.6vh,18px) 8px}
@media (min-width:1000px) and (max-height:820px){.bcmd .btn{padding:7px 6px;font-size:16px}.bcmd{gap:6px}}

/* ===== 피라미드 대진표 ===== */

.bksvg .bkt-win{fill:var(--green-ink)}

/* ===== 격파 앱 ===== */
textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font:inherit;color:inherit;resize:vertical;min-width:0}
textarea:focus{outline:none;border-color:var(--brass-2,var(--green));box-shadow:0 0 0 3px color-mix(in srgb,var(--brass-2,var(--green)) 22%,transparent)}

/* ===== 심판 채점표: 한 화면 맞춤 (휴대폰 세로·가로 · 태블릿 · 노트북 공통) =====
   키패드 칸은 화면에 남은 높이·너비를 나눠 가지고, 칸 안 글씨는 keyfit이 칸에 맞춰 줄입니다. */
body.gfit{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.gfit>.bar{flex:none}
body.gfit main{flex:1;min-height:0;width:100%;max-width:1100px;box-sizing:border-box;padding-block:8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
body.jdg.gfit .kstag{display:none!important}
body.gfit .gjtop{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px}
.gfit .gjtop>.jhead{grid-column:1/-1;grid-row:1}
.gfit .gjtop>.gjwho{grid-column:1;grid-row:2;min-width:0}
.gfit .gjtop>.knet.ok{grid-column:2;grid-row:2;align-self:center!important;padding:3px 9px;font-size:11.5px;white-space:nowrap}
.gfit .gjtop>.knet:not(.ok){grid-column:1/-1;grid-row:3}
.gfit .gjsheet{flex:1;min-height:0;padding-bottom:0;gap:8px}
.gfit .gjtop{flex:none;display:flex;flex-direction:column;gap:6px}
.gfit .gjtop .gjwho{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gfit .gjbody{flex:1;min-height:0;overflow:auto;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));grid-auto-rows:minmax(min-content,1fr);align-content:stretch;gap:8px;overscroll-behavior:contain}
.gfit .jcard{container-type:inline-size;min-height:0;padding:8px 10px;gap:6px}
.gfit .jct{flex-wrap:nowrap;min-width:0}
.gfit .jct b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gfit .jct .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gfit .jct .jsub{font-size:20px}
.gfit .gjr{flex:1;min-height:0;gap:4px}
.gfit .gjrl{flex:none;font-size:12.5px}
.gfit .gjrl b{font-size:15px}
.gfit .gjo{flex:1;min-height:0;grid-auto-rows:minmax(34px,1fr);gap:4px}
.gfit .gjo.t10,.gfit .gjo.ones{grid-template-columns:repeat(10,minmax(0,1fr))}
.gfit .gjo .opt{min-height:0;height:100%;padding:0 1px;border-radius:9px;font-size:clamp(15px,3.4vh,26px);line-height:1;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
@media (orientation:landscape),(min-width:700px){
@container (min-width:340px){
  .gfit .gjr{flex-direction:row;align-items:stretch;gap:8px}
  .gfit .gjrl{flex-direction:column;justify-content:center;gap:2px;width:3.9em}
  .gfit .gjo{flex:1}
}
}
.gfit .gjfoot{position:static;flex:none;padding:8px 84px 0 0;background:none;border:0;box-shadow:none}
.gfit .gjfoot .btn{min-height:48px}
body.jdg.gfit:has(.gjfoot) #langsw{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)!important}
.gfit .dfo{overflow:visible}
/* 태블릿·노트북: 넓은 칸 5개씩 두 줄, 단추가 길쭉해지지 않게 높이 상한 */
@media (min-width:700px) and (min-height:700px){
  .gfit .gjo.t10,.gfit .gjo.ones{grid-template-columns:repeat(5,minmax(0,1fr))}
  .gfit .gjo{grid-auto-rows:minmax(44px,96px);align-content:center}
  .gfit .gjo .opt{font-size:clamp(18px,3.2vh,32px);border-radius:12px}
}
/* 좁은 세로 화면: 여백을 줄여 키패드에 높이를 더 줌 */
@media (orientation:portrait) and (max-height:900px){
  .gfit .gjsheet{gap:6px}
  .gfit .gjtop{gap:2px}
  .gfit .gjtop .gjwho{font-size:19px;margin:0}
  .gfit .gjbody{gap:6px}
  .gfit .jcard{padding:6px 8px;gap:4px;border-radius:13px}
  .gfit .gjr{gap:2px}
  .gfit .gjo{grid-auto-rows:minmax(30px,1fr)}
}
/* 휴대폰 가로: 위 띠를 숨기고 정보는 한 줄로 */
@media (orientation:landscape) and (max-height:520px){
  body.gfit>.bar{display:none}
  body.gfit main{max-width:none;padding:max(4px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(4px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .gfit .gjsheet{gap:5px}
  body.gfit .gjtop{display:flex;flex-direction:row;align-items:center;gap:10px;min-width:0}
  .gfit .gjtop .knet{flex:none;padding:3px 10px;font-size:12px}
  .gfit .gjtop .knet small{display:none}
  .gfit .gjtop .jhead{flex:1;min-width:0;gap:8px}
  .gfit .gjtop .jmeta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .gfit .gjtop .gjwho{flex:none;max-width:40%;font-size:15px;order:-1}
  .gfit .gjtop .gjt{font-size:20px}
  .gfit .gjbody{gap:6px}
  .gfit .jcard{padding:5px 8px;gap:3px;border-radius:12px}
  .gfit .jct b{font-size:14px}
  .gfit .jct .jsub{font-size:16px}
  .gfit .gjo{grid-auto-rows:minmax(30px,1fr)}
  .gfit .gjo .opt{font-size:clamp(14px,5.4vh,22px);border-radius:8px}
  .gfit .gjfoot{padding-top:4px}
  .gfit .gjfoot .btn{min-height:40px;padding-block:6px}
  .gfit .gjfoot .gjtot b{font-size:24px}
}

/*@@PREMIUM*/
/* ================= ATELIER 스킨 (글로벌 버전) =================
   레이아웃: 기존 화면 구조 그대로, 재질만 바꿈 — 흑연(graphite) 바탕 + 샴페인 브라스 선 + 넓은 그로테스크 숫자.
   청·홍은 경기 색이라 유지하고 깊이와 광택만 더함. 주 강조색(--green 토큰)은 브라스로 바꿈. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --sunk:#F3F4F6; --ink:#0B0D12; --muted:#5B616C; --line:#DADDE3;
  --green:#9A7339; --green-ink:#7A5A28; --green-soft:#F4EDE1;
  --brass-1:#E6CD97; --brass-2:#B8904E; --brass-ink:#1A1306;
  --blue:#1846C8; --blue-soft:#E8EDFB; --red:#C8202A; --red-soft:#FBEAEB;
  --ok:#17804A; --ok-soft:#E3F3EA; --warn:#B4620B; --warn-soft:#FBEFDF; --head:#0B0D12;
  --hair:rgba(11,13,18,.08);
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(11,13,18,.05),0 10px 30px -12px rgba(11,13,18,.18);
  --f-body:"Archivo","Noto Sans KR","Noto Sans SC","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-disp:"Archivo","Noto Sans KR","Noto Sans SC",system-ui,sans-serif;
  --f-num:"Archivo","Barlow Condensed","Arial Narrow",ui-monospace,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0C10; --surface:#13161C; --sunk:#1A1E25; --ink:#F1EEE7; --muted:#9BA1AB; --line:#272C35;
  --green:#D6B67C; --green-ink:#E2C68E; --green-soft:#2A2418; --brass-1:#EBD5A3; --brass-2:#B8904E;
  --blue:#5C86FF; --blue-soft:#141C33; --red:#FF5A62; --red-soft:#2E1418;
  --ok:#43C985; --ok-soft:#10261A; --warn:#F0A64A; --warn-soft:#2D2111; --head:#06070A; --hair:rgba(255,255,255,.06);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -20px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0C10; --surface:#13161C; --sunk:#1A1E25; --ink:#F1EEE7; --muted:#9BA1AB; --line:#272C35;
  --green:#D6B67C; --green-ink:#E2C68E; --green-soft:#2A2418; --brass-1:#EBD5A3; --brass-2:#B8904E;
  --blue:#5C86FF; --blue-soft:#141C33; --red:#FF5A62; --red-soft:#2E1418;
  --ok:#43C985; --ok-soft:#10261A; --warn:#F0A64A; --warn-soft:#2D2111; --head:#06070A; --hair:rgba(255,255,255,.06);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -20px rgba(0,0,0,.8); color-scheme:dark}
html[data-lang="zh"]{--f-body:"Archivo","Noto Sans SC","Noto Sans KR",system-ui,sans-serif}
body{font-family:var(--f-body);letter-spacing:-.005em;font-feature-settings:"tnum" 0}
h2,h3{font-family:var(--f-disp);font-stretch:112%;letter-spacing:-.01em;font-weight:800}

/* 상단 바: 흑연 + 브라스 헤어라인 */
.bar{background:linear-gradient(180deg,#14171D,#0B0D12);border-bottom:1px solid rgba(214,182,124,.35);padding-right:calc(max(16px,env(safe-area-inset-right,0px)) + 84px)}
.bar::after{height:1px;bottom:-1px;background:linear-gradient(90deg,transparent,rgba(230,205,151,.85) 30%,rgba(230,205,151,.85) 70%,transparent)}
.brand{font-family:var(--f-disp);font-stretch:118%;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#F4EFE4}
.logo{box-shadow:0 0 0 1px rgba(230,205,151,.7),0 0 0 4px rgba(230,205,151,.12)}
.conn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-weight:600;letter-spacing:.02em;color:#D9D4C8}
.back{color:#E6CD97!important}

/* 탭: 밑줄형 */
.tabs{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px}
.tab{font-family:var(--f-disp);font-stretch:108%;font-weight:700;font-size:15px;letter-spacing:.01em;color:var(--muted);border-radius:10px;position:relative}
.tab:hover{background:var(--sunk);color:var(--ink)}
.tab.on,:root .tab.on{background:var(--ink);color:var(--bg);box-shadow:inset 0 -2px 0 var(--brass-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab{color:var(--muted)}:root:not([data-theme="light"]) .tab.on{background:linear-gradient(180deg,#2A2519,#1D1A12);color:var(--brass-1);box-shadow:inset 0 0 0 1px rgba(214,182,124,.35)}}
:root[data-theme="dark"] .tab.on{background:linear-gradient(180deg,#2A2519,#1D1A12);color:var(--brass-1);box-shadow:inset 0 0 0 1px rgba(214,182,124,.35)}

/* 패널·카드 */
.panel,.bhead,.lstrip,.tabs{box-shadow:var(--shadow)}
.panel{border-radius:16px;border-color:var(--line)}
.panel > h2:first-child::before,.panel > h3:first-child::before,.panel > .row:first-child > h2::before,.panel > .row:first-child > h3::before{width:3px;background:linear-gradient(180deg,var(--brass-1),var(--brass-2));border-radius:2px}
.label{text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;font-weight:700}
html[data-lang="ko"] .label,html[data-lang="zh"] .label{text-transform:none;letter-spacing:.02em;font-size:12.5px}
.empty{border:1px dashed var(--line);background:transparent}

/* 버튼 */
.btn{border-radius:10px;font-weight:700;letter-spacing:.01em;transition:background .15s,border-color .15s,transform .08s,box-shadow .15s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary,.btn.go,.ctl .btn.go{background:linear-gradient(180deg,var(--brass-1),var(--brass-2));border-color:#A07E43;color:var(--brass-ink);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 6px 16px -8px rgba(160,126,67,.8)}
.btn.primary:hover,.btn.go:hover{filter:brightness(1.05);background:linear-gradient(180deg,var(--brass-1),var(--brass-2))}
.ctl .btn.stop{background:linear-gradient(180deg,#3A3F49,#20242B);border-color:#14171C;color:#F4EFE4}
.btn.bl{background:linear-gradient(180deg,#2F5BE0,var(--blue));border-color:var(--blue)} .btn.rd{background:linear-gradient(180deg,#E03A43,var(--red));border-color:var(--red)}
.seg button.on{color:var(--ink);box-shadow:0 0 0 1px var(--brass-2) inset,0 1px 3px rgba(0,0,0,.08)}
input[type=text],input[type=number],select{border-radius:10px;border-width:1px}
input:focus,select:focus{border-color:var(--brass-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass-2) 22%,transparent)}
:focus-visible{outline:2px solid var(--brass-2);outline-offset:2px}
.chip{font-weight:700;letter-spacing:.02em}
.toast{background:#0B0D12;color:#F4EFE4;border:1px solid rgba(214,182,124,.45);font-weight:600;letter-spacing:.01em;box-shadow:0 18px 40px -12px rgba(0,0,0,.55)}
th{text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;color:var(--muted)}
html[data-lang="ko"] th,html[data-lang="zh"] th{text-transform:none;letter-spacing:.02em;font-size:12.5px}

/* 숫자: 넓은 그로테스크 */
.sscore,.timer,.dscore,.dclock,.jtime,.bh-now,.jbtn .jv,.lnk .ln,.jpick button,td.num{font-family:var(--f-num);font-stretch:125%;font-weight:800;letter-spacing:-.02em}
.timer,.dclock{font-stretch:112%}

/* 언어 고르기 */
#langsw{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(14px,env(safe-area-inset-right,0px));font-family:var(--f-body)}
#langsw .lsw-cur{display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;border:1px solid rgba(230,205,151,.45);background:rgba(20,23,29,.85);color:#EBD5A3;font-weight:700;font-size:12.5px;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(8px)}
#langsw .lsw-cur:hover{border-color:#E6CD97;color:#F7E7C2}
#langsw .lsw-menu{display:none;position:absolute;right:0;top:38px;min-width:170px;padding:6px;border-radius:14px;background:#13161C;border:1px solid rgba(230,205,151,.3);box-shadow:0 24px 50px -16px rgba(0,0,0,.7)}
#langsw.open .lsw-menu{display:flex;flex-direction:column;gap:2px}
#langsw .lsw-menu button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:9px;background:none;color:#E9E4D8;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
#langsw .lsw-menu button b{display:inline-grid;place-items:center;min-width:28px;height:22px;border-radius:6px;border:1px solid rgba(230,205,151,.35);color:#E6CD97;font-size:11px;letter-spacing:.06em}
#langsw .lsw-menu button:hover{background:rgba(255,255,255,.06)}
#langsw .lsw-menu button.on{background:linear-gradient(180deg,rgba(230,205,151,.18),rgba(184,144,78,.12));color:#F7E7C2}
body.bmax #langsw,body.disp #langsw{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:auto;left:max(12px,env(safe-area-inset-left,0px));opacity:.35;transition:opacity .2s}
body.bmax #langsw:hover,body.disp #langsw:hover,body.bmax #langsw.open,body.disp #langsw.open{opacity:1}
body.bmax #langsw .lsw-menu,body.disp #langsw .lsw-menu{top:auto;bottom:38px;left:0;right:auto}
body.jdg #langsw{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);right:max(10px,env(safe-area-inset-right,0px))}
body.jdg #langsw .lsw-menu{top:auto;bottom:38px}
@media print{#langsw{display:none}}
html:not([data-lang="ko"]) .lnk .ln[style]{font-size:15px!important;line-height:1.2;text-align:center}

/* ---- 품새: 운영석 ---- */
.bar::after{height:1px;bottom:-1px;background:linear-gradient(90deg,transparent,rgba(230,205,151,.85) 30%,rgba(230,205,151,.85) 70%,transparent)}
.back{background:rgba(255,255,255,.04);border-color:rgba(230,205,151,.35)}
.bent{border-width:1px;border-radius:16px}
.bent.win{box-shadow:0 0 0 2px var(--brass-2),0 0 30px -6px var(--brass-2)}
.bent.win .bscore{color:var(--green-ink)}
.bname{font-family:var(--f-disp);font-stretch:108%;font-weight:800}
.bscore,.final,.vfinal,.clock,.sc,.jtot b,.jsec b,.jl b,.jrl b,.jsh .tt b{font-family:var(--f-num);font-stretch:118%;font-weight:800}
.bitem.cur{border:1px solid var(--brass-2);background:var(--green-soft);box-shadow:inset 3px 0 0 var(--brass-2)}
.opt{border-width:1px;border-radius:11px;font-stretch:118%;font-weight:700;background:linear-gradient(180deg,var(--surface),var(--sunk));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 2px rgba(0,0,0,.06)}
.opt:hover{border-color:var(--brass-2)}
.opt.on,.jo .opt.on{background:linear-gradient(180deg,var(--brass-1),var(--brass-2));border-color:#A07E43;color:var(--brass-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 14px -6px rgba(160,126,67,.8)}
.bksvg .bkw{stroke:var(--brass-2)}

/* ---- 품새: 심판 채점표 (어두운 콕핏) ---- */
body.jdg{--bg:#08090C;--surface:#15181E;--sunk:#1B1F26;--ink:#F1EEE7;--muted:#9BA1AB;--line:#2A2F38;--green:#D6B67C;--green-ink:#E2C68E;--green-soft:#2A2418;--blue:#5C86FF;--blue-soft:#121A31;--red:#FF5A62;--red-soft:#2C1217;--warn:#F0A64A;--warn-soft:#2D2111;color-scheme:dark;
  background:radial-gradient(900px 500px at 50% -10%,#1B1F27,#08090C 70%)}
body.jdg .ji,body.jdg .jrl,body.jdg .jwho{background:linear-gradient(180deg,#171A21,#121419);border-color:#262A33}
body.jdg .jwho.blue{border-color:#2F5BE0;background:linear-gradient(160deg,#16244F,#111526)} body.jdg .jwho.red{border-color:#E03A43;background:linear-gradient(200deg,#4A1419,#1A0F12)}
body.jdg .jside.blue{border:1px solid #2F5BE0;background:linear-gradient(165deg,#132049,#0D1020)} body.jdg .jside.red{border:1px solid #E03A43;background:linear-gradient(195deg,#3E1015,#150B0D)}
body.jdg .jl,body.jdg .jrl{color:#E9E4D8}
body.jdg .opt{background:linear-gradient(180deg,#232730,#191C23);border-color:#323743;color:#F1EEE7;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 0 #0B0C10}
body.jdg .opt:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
body.jdg .opt.on{background:linear-gradient(180deg,#EBD5A3,#B8904E);color:#1A1306;border-color:#A07E43;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 18px -4px rgba(230,205,151,.8)}
body.jdg .opt.ded small{color:#9BA1AB}
body.jdg .btn{background:#1A1E25;border-color:#2C313B;color:#F1EEE7}
body.jdg .btn.primary{background:linear-gradient(180deg,#EBD5A3,#B8904E);color:#1A1306;border-color:#A07E43}
body.jdg .jfs{background:transparent;border-color:rgba(230,205,151,.5);color:#E6CD97}
body.jdg .panel{background:#13161C;border-color:#262A33}
body.jdg .tab,body.jdg .jtab{color:#C9C3B6}
body.jdg .rothint{background:rgba(214,182,124,.12);color:#E6CD97}

/* ---- 품새: 전광판 ---- */
body.disp{--bg:#050608;--surface:#0E1116;--sunk:#141821;--ink:#F6F2E9;--muted:#A9AFB9;--line:#262B34;--blue:#3E73FF;--red:#FF3B47;--blue-soft:#0B1636;--red-soft:#33080D;--green:#D6B67C;--green-ink:#EBD5A3;color-scheme:dark;
  background:radial-gradient(1200px 700px at 50% -10%,#1A1D24,#050608 60%)}
body.disp .board .colorband{height:2px;min-height:2px;background:linear-gradient(90deg,transparent,#E6CD97 20%,#E6CD97 80%,transparent)!important;opacity:.85}
body.disp .board .name,body.disp .board .vs .vname{font-family:var(--f-disp);font-stretch:112%;font-weight:800;letter-spacing:-.01em}
body.disp .board .div{font-family:var(--f-disp);font-stretch:112%;letter-spacing:.04em}
body.disp .board .clock{color:#EBD5A3}
body.disp .board .final,body.disp .board .vs .vfinal{color:#fff;text-shadow:0 0 40px rgba(255,255,255,.16)}
body.disp .board .vs .side.blue{background:linear-gradient(165deg,#173A9E 0%,#0B1A49 55%,#070C1F 100%)!important;border:1px solid rgba(255,255,255,.08)}
body.disp .board .vs .side.red{background:linear-gradient(195deg,#A0121C 0%,#4A070D 55%,#1E0306 100%)!important;border:1px solid rgba(255,255,255,.08)}
body.disp .chip.ok{background:linear-gradient(180deg,#EBD5A3,#B8904E);color:#1A1306}
.pjc{background:linear-gradient(180deg,#EBD5A3,#B8904E)!important;color:#1A1306!important;font-stretch:108%}

/* ===== KICKSTART UP 브랜드 ===== */
svg.logo.ks{width:34px;height:34px;box-shadow:none!important;border-radius:0;flex:none;filter:drop-shadow(0 2px 10px rgba(201,162,98,.25))}
.bhead svg.logo.ks{width:30px;height:30px;filter:none}
.ksword{font-family:"Archivo",var(--f-body);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:.06em;color:#F4EFE4;white-space:nowrap;padding-right:12px;margin-right:2px;border-right:1px solid rgba(230,205,151,.35);line-height:1}
.ksword b{margin-left:.35em;background:linear-gradient(180deg,#F3DFAE,#B8904E);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (max-width:720px){.ksword{display:none}}
.kstag{display:none;position:fixed;z-index:7;align-items:center;gap:7px;font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:800;font-size:12px;letter-spacing:.08em;color:rgba(244,239,228,.78);pointer-events:none}
.kstag .ksmark{width:20px;height:20px}
.kstag b{margin-left:.3em;color:#D6B67C}
body.disp .kstag{display:flex;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:min(1.1vw,1.9vh)}
body.disp .kstag .ksmark{width:min(1.8vw,3vh);height:min(1.8vw,3vh)}
body.jdg .kstag{display:flex;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 6px);opacity:.6;font-size:10px}
body.jdg .kstag .ksmark{width:15px;height:15px}
body.jmax .kstag,body.jdg.jfit .kstag{display:none}
.kswm{display:none;position:fixed;inset:0;z-index:0;pointer-events:none;place-items:center}
.kswm .ksmark{width:min(46vw,78vh);height:min(46vw,78vh);opacity:.035}
body.disp .kswm{display:grid}
body.disp main{position:relative;z-index:1}
/* 연출: 전체 화면 오버레이 */
.ksfx{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none;overflow:hidden;
  background:radial-gradient(900px 520px at 50% 45%,rgba(28,31,38,.97),rgba(5,6,8,.985) 70%);animation:ksfxIn .35s ease-out both}
.ksfx.call{background:radial-gradient(900px 520px at 50% 45%,rgba(20,22,28,.55),rgba(5,6,8,.7) 70%)}
.ksfx.win{background:none}.ksfx.win .ksfx-in{display:none}
.ksfx.out{animation:ksfxOut .45s ease-in forwards}
.ksfx-in{display:flex;flex-direction:column;align-items:center;gap:min(1.6vw,2.6vh)}
.ksfx-mark{width:min(16vw,26vh);height:min(16vw,26vh);filter:drop-shadow(0 0 40px rgba(230,205,151,.35))}
.ksfx-mark path:first-child{stroke-dasharray:180;stroke-dashoffset:180;animation:ksDraw 1s .1s cubic-bezier(.6,0,.2,1) forwards}
.ksfx-mark path:not(:first-child){opacity:0;transform-origin:32px 32px;animation:ksRise .6s .55s cubic-bezier(.2,.8,.2,1) forwards}
.ksfx-mark path:last-child{animation:ksStar .9s .95s ease-out forwards}
.ksfx-word{font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:800;font-size:min(5vw,8.5vh);letter-spacing:.06em;color:#F4EFE4;opacity:0;animation:ksRise .7s .75s cubic-bezier(.2,.8,.2,1) forwards;line-height:1}
.ksfx-word b{margin-left:.3em;background:linear-gradient(180deg,#F3DFAE,#B8904E);-webkit-background-clip:text;background-clip:text;color:transparent}
.ksfx-sub{font-family:"Archivo",sans-serif;font-stretch:112%;font-weight:600;font-size:min(1.2vw,2vh);letter-spacing:.55em;color:#9BA1AB;opacity:0;animation:ksRise .7s 1s ease-out forwards}
.ksfx.call .ksfx-sub,.ksfx.win .ksfx-sub{display:none}
.ksfx.call .ksfx-mark,.ksfx.win .ksfx-mark{width:min(10vw,17vh);height:min(10vw,17vh)}
.ksfx.call .ksfx-word,.ksfx.win .ksfx-word{font-size:min(3vw,5vh)}
.ksfx-sheen{position:absolute;top:-20%;bottom:-20%;width:22%;left:-30%;background:linear-gradient(100deg,transparent,rgba(243,223,174,.18),transparent);transform:skewX(-14deg);animation:ksSheen 1.3s .5s ease-in-out forwards}
.ksfx.win .ksfx-sheen{animation-duration:1s;background:linear-gradient(100deg,transparent,rgba(243,223,174,.32),transparent)}
@keyframes ksfxIn{from{opacity:0}to{opacity:1}}
@keyframes ksfxOut{to{opacity:0;transform:scale(1.02)}}
@keyframes ksDraw{to{stroke-dashoffset:0}}
@keyframes ksRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ksStar{0%{opacity:0;transform:scale(.2) rotate(-40deg)}60%{opacity:1;transform:scale(1.35) rotate(10deg)}100%{opacity:1;transform:none}}
@keyframes ksSheen{to{left:120%}}
/* 운영석·심판: 짧은 금빛 스침 */
body.ks-sting .bar::before,body.ks-win .bar::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(243,223,174,.22) 50%,transparent 70%) no-repeat;background-size:40% 100%;animation:ksBar 1.4s ease-in-out}
@keyframes ksBar{from{background-position:-60% 0}to{background-position:160% 0}}
body.ks-sting svg.logo.ks,body.ks-win svg.logo.ks{animation:ksPulse 1.4s ease-in-out}
@keyframes ksPulse{40%{filter:drop-shadow(0 0 14px rgba(243,223,174,.9));transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.ksfx{display:none}}
@media print{.kstag,.kswm,.ksfx{display:none}}

/* ===== 시상 ===== */
.awrun{gap:8px}
.awrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 8px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.awrow.r1{background:linear-gradient(100deg,color-mix(in srgb,#E6CD97 26%,var(--surface)),var(--surface));border-color:color-mix(in srgb,#B8904E 55%,var(--line))}
.awrk{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:var(--f-num);font-weight:800;font-size:15px;background:var(--surface);border:1px solid var(--line)}
.awrow.r1 .awrk{background:linear-gradient(180deg,#F3DFAE,#B8904E);color:#1A1306;border-color:#A07E43}
.awrow.r2 .awrk{background:linear-gradient(180deg,#F1F3F6,#B9C0CB);color:#1B1F26}
.awrow.r3 .awrk{background:linear-gradient(180deg,#F0CFAE,#B07A4A);color:#24140A}
.awtm{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.awtm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.awpt{font-family:var(--f-num);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.awpt small{font-size:11px;margin-left:2px;color:var(--muted);font-family:var(--f-body)}
.awm{display:inline-flex;align-items:center;gap:2px;margin-right:6px;font-weight:700;font-variant-numeric:tabular-nums}
.awm::before{content:"";width:9px;height:9px;border-radius:50%;display:inline-block}
.awm.g::before{background:#D4AF37}.awm.s::before{background:#AEB5C1}.awm.b::before{background:#B87333}
.awpanel h3{margin-top:6px}
.awt td,.awt th{padding:6px 8px}
.awt tr.top td{background:color-mix(in srgb,#E6CD97 14%,transparent)}
.awcoach{width:100%;min-width:110px;max-width:180px;padding:5px 8px!important;font-size:14px!important}
.awmvp{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}

function famOf(level){const s=String(level||'');
  if(/초/.test(s))return 'elem';if(/중/.test(s))return 'mid';if(/고/.test(s))return 'high';if(/대학/.test(s))return 'univ';if(/일반\s*2/.test(s))return 'gen2';if(/일반/.test(s))return 'gen1';return 'gen1';}
/* 부별 글자 정리: "초등부 고학년", "중1", "대학교 3학년", "일반부(30세 이상)" 같은 표기를 표준 이름으로 */
function normLevel(raw,grade,age){
  const s=String(raw||'').replace(/\s/g,''),g=String(grade||'').match(/\d/);const gn=g?Number(g[0]):0;
  if(/초/.test(s)){if(/중학년/.test(s))return '초등 중학년부';if(/고학년/.test(s))return '초등 고학년부';const n=(s.match(/(\d)/)||[])[1]||gn;return Number(n)>=5?'초등 고학년부':'초등 중학년부';}
  if(/중/.test(s)&&!/중학년/.test(s)){const n=Number((s.match(/(\d)/)||[])[1]||gn||1);return `중등 ${Math.min(3,Math.max(1,n))}학년부`;}

  if(/대학/.test(s)){if(/2부|[34]학년/.test(s)||gn>=3)return '대학 2부';return '대학 1부';}

  const a=Number(age);if(a&&!isNaN(a)){if(a>=30)return '일반 2부';if(a>=19)return '일반 1부';}
  return String(raw||'').trim()||'부별 미정';
}

};

const store={
  watchDoc(path,cb){
    if(DB)return DB.doc(path).onSnapshot(s=>cb(s.exists?s.data():null),e=>toast(errMsg(e)));
    const f=()=>cb(mem.get(path)??null);memL.add(f);f();return()=>memL.delete(f);
  },
  watchColl(coll,field,val,cb){
    if(DB){let q=DB.collection(coll);if(field)q=q.where(field,'==',val);
      return q.onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),_id:d.id,_pending:!!(d.metadata&&d.metadata.hasPendingWrites)}))),e=>toast(errMsg(e)));}
    const f=()=>{const out=[];for(const [k,v] of mem){if(k.startsWith(coll+'/')&&!k.slice(coll.length+1).includes('/')&&(!field||v[field]===val))out.push({...v,_id:k.slice(coll.length+1),_pending:false});}cb(out);};
    memL.add(f);f();return()=>memL.delete(f);
  },
  async listIds(coll,field,val){
    if(DB){let q=DB.collection(coll);if(field)q=q.where(field,'==',val);const s=await q.get();return s.docs.map(d=>d.id);}
    return [...mem.entries()].filter(([k,v])=>k.startsWith(coll+'/')&&(!field||v[field]===val)).map(([k])=>k.slice(coll.length+1));
  },

  putQuiet(path,data){return withTimeout(DB?DB.doc(path).set(data):memPut(path,data),8000);},
  del(path){return queue(path,()=>DB?DB.doc(path).delete():(mem.delete(path),memEmit(),Promise.resolve()));}
};

/* ===================== 컷오프 (제8조) =====================
   참가 인원이 "예선 시행 인원"(기본 16명) 이상이면 조를 나눠 예선 → 조별 상위 n명이 결선 진출.

function planOf(d){

function rowOf(d,stKey,aid){
  const r=S.results[perfIdOf(d,stKey,aid)]||null,rms=[];

function cmpRows(d,x,y){

  const kx=x.r.keys||[x.r.final],ky=y.r.keys||[y.r.final];

  for(let i=0;i<n;i++){const a=x.rms[i],b=y.rms[i];if(!a||!b)return {c:0,need:i+1};
    const ka=a.keys||[a.final],kb=b.keys||[b.final];for(let j=0;j<Math.max(ka.length,kb.length);j++){const e=(kb[j]??-1e9)-(ka[j]??-1e9);if(Math.abs(e)>1e-9)return {c:e,by:'rm'};}}

/* 조별 진출자 (경계 동점: 재경기 필요 또는 동점자 모두 진출) */
function advancePlan(d){
  const st=stagesOf(d)[0];if(!st.groups)return null;
  const p=planOf(d),out={groups:[],adv:[],tie:null,need:0,done:true};
  st.groups.forEach((ids,gi)=>{

    const ok=rows.filter(r=>r.ok);let take=ok.slice(0,p.adv);

/* 최종 순위 (시상에 사용) */
function rankDiv(d){const r=rankDiv0(d);return COMM()?r.map(x=>x&&x.rank>3?{...x,rank:3}:x):r;}
function rankDiv0(d){

/* ===================== 호출 목록 ===================== */
function callsOf(d){

/* ===================== 점수 계산 ===================== */
/* 심판 5인(이상): 최고·최저 점수를 뺀 나머지의 평균 (같은 점수가 여럿이면 한 개씩만 뺌) */
function trimInfo(vals){
  const n=vals.length;if(n<5)return {mean:mean(vals),hi:-1,lo:-1};
  let hi=0,lo=0;vals.forEach((v,i)=>{if(v>vals[hi])hi=i;if(v<vals[lo])lo=i;});

function judgeTotal(kind,items,nT){

  if(kind==='comp')return (Number(items.c)||0)+Math.min(40,(Number(items.e)||0)+(Number(items.x)||0))+(Number(items.d)||0);

}

/* 시간 초과 단위: 기술·종합 5초마다, 단체전은 5분±10초를 벗어난 5초마다, 기록(높이)·위력 10초마다 */
function timeUnits(kind,t,limit){

function computeJudged(cur,scores,ded,dq){

  const totals=js.map(s=>judgeTotal(kind,s.items||{},nT));

  const raw=sum(totals),dt=dedTotal(kind,ded);

/* 기록·위력: 운영석(기록원)이 넣은 기록으로 계산 */
function computeRecord(cur,rec){
  const kind=cur.kind,v=k=>Math.max(0,Number(rec[k])||0),a=athlete(cur.athleteId)||{};

  if(kind==='height'){r.score=v('best');r.dedTotal=v('over')*10;r.final=Math.max(0,r.score-r.dedTotal);r.keys=[r.final];r.post=Number(a.height)?[-Number(a.height)]:[];r.unit='cm';}
  else if(kind==='count'){r.score=v('broken');r.dedTotal=v('line');r.final=r.score-r.dedTotal;r.keys=[r.final];r.unit='장';if(v('line')>=3&&!rec.dq){r.dq=true;r.dqWhy='경계선 3회 이상';}}

function resultText(r){

  if(r.kind==='count')return `${fmtN(r.final)}장`;
  if(r.kind==='power'||r.kind==='powerc')return r.zero?'격파 0장':`${fmtN(r.final)}점`;

}

/* ===================== 타이머 (제11조: "시작"부터 마지막 양발 착지까지) ===================== */
function elapsed(t){if(!t)return 0;return t.running?(t.elapsed||0)+(Date.now()-t.startedAt)/1000:(t.elapsed||0);}
function timeFlag(t){if(!t)return '';const e=elapsed(t);if(t.max&&e>t.max+(t.tol||0)+1e-6)return 'over';if(!t.running&&e>0&&t.tol&&e<t.max-t.tol)return 'under';return '';}
function cdText(t){
  if(!t||!t.max)return mmss(elapsed(t));
  const rem=t.max-elapsed(t);
  return rem>=0?mmss(Math.ceil(rem-1e-6)):'+'+mmss(Math.floor(-rem));
}
function prepText(st){const p=st.prep;if(!p||!p.until)return '';const rem=(p.until-Date.now())/1000;return rem>=0?mmss(Math.ceil(rem)):'+'+mmss(Math.floor(-rem));}
function tickTimers(){
  const nowEl=document.querySelectorAll('[data-now]');if(nowEl.length){const d=new Date(),t=[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');nowEl.forEach(el=>el.textContent=t);}
  document.querySelectorAll('[data-readycd]').forEach(el=>{const n=Math.max(0,Math.ceil((Number(el.dataset.readycd)-Date.now())/1000));el.textContent=`시작까지 ${n}초`;if(n===0)schedule();});
  const st=ST(),t=st.timer;
  document.querySelectorAll('[data-timer]').forEach(el=>{el.textContent=cdText(t);const f=timeFlag(t);el.classList.toggle('over',f==='over');el.classList.toggle('under',f==='under');});
  document.querySelectorAll('[data-prep]').forEach(el=>{el.textContent=prepText(st);el.classList.toggle('over',!!(st.prep&&st.prep.until&&Date.now()>st.prep.until));});
}

function editRow(a){const id=a.id,f=(k,l,v,t='text',x='')=>`<label class="field"><span class="label">${l}</span><input type="${t}" id="ea_${id}_${k}" value="${esc(v??'')}" ${x}></label>`;
  return `<tr class="editrow"><td colspan="4"><div class="grid2" style="gap:8px">${f('name','이름 (단체전은 팀명)',a.name)}${f('team','소속',a.team)}

    <label class="field"><span class="label">부별</span><select id="ea_${id}_level">${[...new Set([...LEVELS,'대학부',...(a.level?[a.level]:[])])].map(l=>`<option ${a.level===l?'selected':''}>${esc(l)}</option>`).join('')}</select></label>
    <label class="field"><span class="label">성별</span><select id="ea_${id}_gender">${['남','여','혼성'].map(g=>`<option ${a.gender===g?'selected':''}>${g}</option>`).join('')}</select></label>
    ${f('coach','지도자',a.coach)}${f('weight','체중 kg',a.weight,'number','step="0.1"')}${f('height','신장 cm',a.height,'number','step="0.1"')}${f('members','팀원 (단체전)',a.members)}${f('division','부문 (비우면 자동)',a.division)}</div>${a.division?'<span class="small muted">「부문」 칸에 이름이 적혀 있으면 그 부문이 우선입니다. 성별·부별 등을 바꿀 때는 「부문」 칸도 고치거나 비워 주세요.</span>':''}
    ${athScored(id)?'<div class="banner warn" style="margin-top:8px">이 선수는 이미 점수가 있습니다. 종목·부별·성별을 바꾸면 기존 점수는 원래 부문에 남습니다.</div>':''}
    <div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="saveAth" data-id="${id}">저장</button><button class="btn sm" data-act="editAth">취소</button></div></td></tr>`;}
function athScored(id){if(!S._scoredAt||S._scoredAt.r!==S.results){const set=new Set();Object.values(S.results||{}).forEach(r=>r&&r.athleteId&&set.add(r.athleteId));S._scoredAt={r:S.results,set};}return S._scoredAt.set.has(id);}
function rosterTools(){const n=S.roster.filter(a=>athScored(a.id)).length;return window.ROSTERPICK&&ROSTERPICK.toolbar?ROSTERPICK.toolbar({count:S.roster.length,unit:'명(팀)',undo:undoInfo(),scored:n}):'';}

function teamMusicPanel(){const L=S.roster.filter(a=>a.ev==='team');if(!L.length||!window.LMUS)return '';LMUS.setEntries(teamEntries);
  return `<div style="margin-top:14px">${LMUS.panel(L.map(a=>({id:a.id,name:a.name,team:a.team})),{title:'단체전 음악 (노트북 폴더)',who:'팀',note:'단체전을 호출하면 경기 진행 화면에 음악 버튼이 나오고, "준비 · 시작" 때 함께 재생됩니다(대회 설정에서 자동 재생을 끌 수 있습니다). "바로"를 누르면 멈춥니다.'})}</div>`;}

  if(k==='team')return [...TEAM_ITEMS.map(it=>[it.label,r=>fmt3(r.parts&&r.parts[it.k])]),['감점',r=>r.dedTotal?'−'+fmtN(r.dedTotal):'']];

      const pid=`${d.id}_${newK}_`+r.perfId.slice(`${d.id}_${oldK}_`.length);
      await store.put('results/'+pid,{...clean(r),perfId:pid,callId:pid,stage:newK,label:String(r.label||'').replace(STAGE_NAME[oldK],STAGE_NAME[newK])});await store.del('results/'+r.perfId);moved++;}

  await saveDiv(nd);

/* ===================== 생활체육 대회 (4명·4팀 1조) =====================
   켜면 부문마다 4명(팀)씩 조를 나눠 「부문 이름 · 1조」, 「· 2조」 … 부문으로 만듭니다.
   남는 인원: small = 마지막 조 2~3명 (10명 4·4·2, 9명 4·3·2, 11명 4·4·3) / merge = 1명이 남으면 5명 조.
   조마다 1등 금, 2등 은, 3~5등 동메달(3위). 점수가 있는 조는 다시 나누지 않습니다. */
const COMM=()=>!!SET().comm;
/* 생활체육 대회 기준: 유치 3~5세부 → 유치부 1부, 6~7세부 → 유치부 2부 (실버1부·2부는 그대로) */
function gpLevel(a){const l=String(a.level||'');if(!COMM()||!/유치|유아/.test(l))return a.level;if(/1\s*부/.test(l))return '유치부 1부';if(/2\s*부/.test(l))return '유치부 2부';
  const n=+((l.match(/(\d)\s*세/)||[])[1]||0);return n?(n<=5?'유치부 1부':'유치부 2부'):'유치부';}
const COMM_RE=/ · (\d+)조$/;
function commSizes(n,rem){rem=rem||SET().commRem||'small';if(n<=4)return n?[n]:[];const q=Math.floor(n/4),r=n%4,s=Array(q).fill(4);
  if(r===1){if(rem==='merge')s[q-1]=5;else{s[q-1]=3;s.push(2);}}else if(r)s.push(r);return s;}
const commTeam=id=>{const a=S.roster.find(x=>x.id===id);return a?String(a.team||'').trim():'';};
/* 같은 도장(소속)이 한 조에 몰리지 않게, 1·2번과 3·4번이 같은 도장끼리 붙지 않게 나눕니다 */
function commDeal(ids,sizes){
  const by=new Map();shuffle(ids).forEach(id=>{const t=commTeam(id)||'\u0000'+id;if(!by.has(t))by.set(t,[]);by.get(t).push(id);});
  const gs=sizes.map(n=>({n,ids:[]}));
  [...by.values()].sort((a,b)=>b.length-a.length).flat().forEach(id=>{const t=commTeam(id);let best=null,bs=null;
    gs.forEach(g=>{if(g.ids.length>=g.n)return;const sc=[t?g.ids.filter(x=>commTeam(x)===t).length:0,g.ids.length/g.n];if(!best||sc[0]<bs[0]||(sc[0]===bs[0]&&sc[1]<bs[1])){best=g;bs=sc;}});
    (best||gs[gs.length-1]).ids.push(id);});
  return gs.map(g=>{const o=shuffle(g.ids);for(let i=0;i+1<o.length;i+=2){const t=commTeam(o[i]);if(t&&t===commTeam(o[i+1])){const j=o.findIndex((x,k)=>k>i+1&&commTeam(x)!==t);if(j>0)[o[i+1],o[j]]=[o[j],o[i+1]];}}return o;});
}
/* regenerateDivs 안에서 부문(그룹)을 조로 펼칩니다. getIds: 그룹 → 선수 id, make: (그룹, 새 키, id들) → 새 그룹 */
function commApply(groups,getIds,make){
  if(!COMM())return;
  const out=[];
  groups.forEach((g,k)=>{const ids=getIds(g);
    const prev=S.divs.map(d=>{const m=COMM_RE.exec(d.key||'');return m&&d.key.slice(0,m.index)===k?{no:+m[1],d,ids:(d.order||[]).filter(x=>ids.includes(x))}:null;}).filter(Boolean);
    let parts=null;
    if(prev.length){
      const used=new Set(prev.flatMap(x=>x.ids)),added=ids.filter(x=>!used.has(x));
      const same=!COMM_FORCE&&!added.length&&prev.every(x=>x.ids.length===(x.d.order||[]).length);
      if(same)parts=prev.map(x=>({no:x.no,ids:x.d.order}));
      else{const locked=prev.filter(x=>x.ids.length&&divHasResults(x.d));
        if(locked.length||COMM_FORCE){const ls=new Set(locked.flatMap(x=>x.ids)),rest=ids.filter(x=>!ls.has(x)),nos=new Set(locked.map(x=>x.no));let no=0;
          parts=[...locked.map(x=>({no:x.no,ids:x.ids})),...commDeal(rest,commSizes(rest.length)).map(s=>{do no++;while(nos.has(no));return {no,ids:s};})];}}
    }
    if(!parts)parts=commDeal(ids,commSizes(ids.length)).map((s,i)=>({no:i+1,ids:s}));
    parts.sort((a,b)=>a.no-b.no).forEach(p=>{const key=`${k} · ${p.no}조`;out.push([key,make(g,key,p.ids)]);});

}

function pick(row,inc,exc=[]){for(const k of Object.keys(row)){const n=k.replace(/\s/g,'');if(/중문|중국|영문|영어|한자/.test(n)&&!inc.some(x=>/중문|중국|영문|영어|한자/.test(x)))continue;if(inc.some(x=>n.includes(x))&&!exc.some(x=>n.includes(x)))return row[k];}return '';}
function parseEv(t){const s=String(t||'').replace(/\s/g,'');if(!s)return '';
  if(EV[s])return s;
  if(/높이/.test(s))return 'hjump';if(/후려/.test(s)&&/연속/.test(s))return 'cbk';if(/돌개/.test(s)&&/연속/.test(s))return 'ctn';
  if(/체공|도약/.test(s))return 'air';if(/수직/.test(s))return 'vert';if(/수평/.test(s))return 'horz';if(/단체/.test(s))return 'team';
  if(/손종합|손.*종합/.test(s))return 'hand';if(/종합/.test(s))return 'comp';if(/주먹/.test(s))return 'fist';if(/손날/.test(s))return 'knife';if(/발|옆차기|뒤차기/.test(s))return 'foot';
  return '';}
async function readExcel(file){
  if(!file)return;
  const isPdf=window.PDFROSTER&&PDFROSTER.isPdf(file);let pdfInfo=null,rows;
  if(!isPdf&&!window.XLSX){toast('엑셀 도구를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요');return;}
  if(isPdf){toast('PDF를 읽는 중입니다…');
    try{pdfInfo=await PDFROSTER.read(file);}catch(e){toast(e&&e.code==='lib'?'PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요':'PDF를 읽지 못했습니다. 파일이 손상되었거나 암호가 걸려 있는지 확인해 주세요');return;}
    if(!pdfInfo.rows.length){toast(pdfInfo.mode==='글자 없음'?'PDF에서 글자를 찾지 못했습니다. 스캔한 그림 PDF는 읽을 수 없어요. 엑셀로 올려 주세요':'PDF에서 명단을 찾지 못했습니다. 첫 줄에 "이름" 칸이 있는 표나 "이름(소속)" 대진표 형식이어야 합니다');return;}}
  try{
    if(isPdf)rows=pdfInfo.rows.map(r=>{if(r['부문']&&!r['종목'])r['종목']=r['부문'];if(r['부문']&&!r['부별'])r['부별']=r['부문'];return r;});else{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    rows=XLSX.utils.sheet_to_json((wb.Sheets['선수명단']||wb.Sheets[wb.SheetNames.find(n=>n!=='작성 방법'&&n!=='목록')]||wb.Sheets[wb.SheetNames[0]]),{defval:''});}
    const year=new Date().getFullYear();
    const out=rows.map(r=>{
      const name=String(pick(r,['이름','성명','선수','팀명'],['팀원'])).trim();if(!name||name.includes('(예시)'))return null;
      const ev=parseEv(pick(r,['종목'],['세부']))||parseEv(pick(r,['세부종목','세부']));
      let age=pick(r,['나이','연령']);age=age===''?null:parseInt(age,10);
      if(age==null||isNaN(age)){const b=pick(r,['생년','출생']);let y=null;if(b instanceof Date)y=b.getFullYear();else{const m=String(b).match(/(\d{4})/);if(m)y=Number(m[1]);}age=y?year-y:null;}
      const g=String(pick(r,['성별'])).trim(),num=v=>{const x=parseFloat(String(v).replace(/[^\d.]/g,''));return isNaN(x)?null:x;};
      /* 이름·소속 말고 다른 칸 글자 (종목 칸에 "체공 도약 격파 여자 초등부 3학년"처럼 함께 적힌 경우를 위해) */
      const others=Object.entries(r).filter(([k])=>!/이름|성명|선수|팀명|소속|도장|학교|지도자|코치|감독|팀원/.test(String(k).replace(/\s/g,''))).map(([,v])=>String(v??'')).join(' ');
      let level=normLevel(pick(r,['부별','종별','부'],['부문','세부']),pick(r,['학년']),age);
      if(!LEVELS.includes(level)&&level!=='대학부'){const m=others.match(/(초등|중등|중학|고등|고교|대학|일반)[가-힣]*\s*(\d)?\s*(학년|부)?/);if(m){const lv=normLevel(m[0],(others.match(/(\d)\s*학년/)||[])[1]||'',age);if(LEVELS.includes(lv)||lv==='대학부')level=lv;}}
      const gTxt=g||((/여자|여성|\(여\)|(^|\s)여(\s|$)/.test(others))?'여':(/남자|남성|\(남\)|(^|\s)남(\s|$)/.test(others))?'남':'');
      if(!ev&&!/[가-힣]/.test(name)&&!String(pick(r,['소속','도장','학교'])).trim())return null;
      return {id:rid('a'),zh:String(pick(r,['중문','중국','한자'],['소속','도장','학교','팀원'])).trim(),en:String(pick(r,['영문','영어'],['소속','도장','학교','팀원'])).trim(),zhTeam:String(pick(r,['중문소속','중국소속','중문도장','한자소속'])).trim(),enTeam:String(pick(r,['영문소속','영어소속','영문도장'])).trim(),name,ev,level,team:String(pick(r,['소속','도장','학교'],['팀원'])).trim(),coach:String(pick(r,['지도자','코치','감독'])).trim(),
        gender:EV[ev]&&EV[ev].kind==='team'?'혼성':/여|f|w/i.test(gTxt)?'여':'남',...(gTxt?{}:{gGuess:true}),age,weight:num(pick(r,['체중','몸무게','계체'])),height:num(pick(r,['신장','키'])),
        applied:null,members:String(pick(r,['팀원','명단','구성'])).trim(),division:String(pick(r,['부문'])).trim(),cls:(v=>{const t=String(v??'').trim().toUpperCase().replace(/\s/g,'');return /^A(조|반)?$/.test(t)?'A조':/^B(조|반)?$/.test(t)?'B조':'';})(pick(r,['실력조']))};
    }).filter(Boolean);
    if(!out.length){toast('이름이 있는 줄을 찾지 못했습니다. 첫 줄에 "이름" 열이 있는지 확인해 주세요');return;}

    rows.push([d.name,evLabel(d),STAGE_NAME[st.key],st.groups&&st.groups.length>1?(gi+1)+'조':'',x.rank??'',a.name||'',a.team||'',a.coach||'',r?cols.map(c=>`${c[0]} ${c[1](r)}`).join(' / '):'',r&&r.dedTotal?-r.dedTotal:'',r?(r.dq?'실격':r.final):'',r&&r.dq?r.dqWhy||'':r&&r.zero?'격파 0장':'']);}));});});
  const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:30},{wch:16},{wch:6},{wch:5},{wch:5},{wch:12},{wch:16},{wch:10},{wch:50},{wch:7},{wch:9},{wch:16}];
  const detail=[['부문','단계','이름','심판','심판 합계','세부 점수','최고·최저 제외']];
  Object.values(S.results).forEach(r=>{if(!r.judges)return;r.judges.forEach((j,i)=>detail.push([r.divName,r.label||'',r.name,j.judge+'심',j.total,Object.entries(j.items||{}).map(([k,v])=>`${k}:${v}`).join(' '),i===r.hi||i===r.lo?'제외':'']));});
  const logs=[['시각','누가','작업','대상','내용']];S.logs.forEach(l=>logs.push([hhmm(l.at),whoName(l),l.action,l.target,l.detail]));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'순위');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(detail),'심판별 점수');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(logs),'변경 기록');
  saveFile(`${SET().name||'격파대회'}_결과.xlsx`,XLSX.write(wb,{bookType:'xlsx',type:'array'}));
}
/* ===================== 백업·복구 ===================== */
function backupData(){return {app:'gyeokpa-competition',version:1,savedAt:Date.now(),settings:S.settings||{},roster:S.roster,divisions:S.divs,results:Object.values(S.results).map(r=>({...clean(r),_key:r._id})),logs:S.logs.map(l=>({...clean(l),_key:l._id}))};}
async function doBackup(){
  const data=backupData(),d=new Date(),stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
  const ok=await saveFile(`${SET().name||'격파대회'}_백업_${stamp}.json`,JSON.stringify(data));
  if(ok){addLog('백업','전체',`선수 ${data.roster.length} · 점수 ${data.results.length}건`);toast('백업 파일을 저장했습니다');}
}
async function readBackup(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!data||data.app!=='gyeokpa-competition'||!Array.isArray(data.roster))throw 0;
  data.results=(data.results||[]).filter(r=>r&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(r._key||''));data.divisions=data.divisions||[];ui.restore=data;render();}catch(e){toast('이 앱의 백업 파일이 아닙니다. 파일을 확인해 주세요');}}
async function doRestore(){
  const data=ui.restore;if(!data)return;toast('복구하는 중입니다…');
  try{await deleteAll('scores');await deleteAll('results');
    await saveSettings({...DEFAULTS,...data.settings});await saveRoster(data.roster);await saveDivs(data.divisions);
    for(const r of data.results){const c={...r};delete c._key;await store.put('results/'+r._key,c);}
    const have=new Set(S.logs.map(l=>l._id));for(const l of (data.logs||[])){if(!l._key||have.has(l._key)||!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(l._key))continue;const c={...l};delete c._key;await store.put('logs/'+l._key,c);}
    await saveState({status:'idle',epoch:(ST().epoch||0)+1,current:null,timer:null});
    await addLog('백업 복구','전체',`${hhmm(data.savedAt)} 백업에서 복구 · 점수 ${data.results.length}건`);
    ui.restore=null;toast('복구를 마쳤습니다');render();
  }catch(e){toast('복구 중 오류가 났습니다. 다시 시도해 주세요');}
}
/* ===================== 운영석 알림 ===================== */
let SOUND=lsGet('gp_sound')!=='0';
let audioCtx=null;
function unlockAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
document.addEventListener('click',()=>{if(SOUND&&!KIOSK)unlockAudio();},{capture:true});
function beep(level){
  if(!SOUND||!audioCtx)return;
  try{const t0=audioCtx.currentTime,n=level==='bad'?3:1,f=level==='bad'?880:660;
    for(let i=0;i<n;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=t0+i*0.28;
      o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.24);}}catch(e){}
}
let EVENT_ALERTS=[];const DISMISSED=new Set(),SEEN=new Set(),OFF_SINCE={};
function pushAlert(level,msg){if(KIOSK)return;const key='ev'+Date.now()+Math.random().toString(36).slice(2,6);EVENT_ALERTS.push({key,level,msg,at:Date.now()});EVENT_ALERTS=EVENT_ALERTS.slice(-6);refreshAlerts(true);}
function computeAlerts(){
  const out=[],now=Date.now(),st=ST(),cur=curOf(),N=cur?cur.judgeCount:SET().judges;
  if(window.KS_FIELD&&KS_FIELD.status){if(!KS_FIELD.status().connected)out.push({key:'fnet',level:'bad',msg:'노트북 현장 서버와 연결이 끊겼습니다. 현장 모드 프로그램(검은 창)이 켜져 있는지, 와이파이 연결을 확인해 주세요.'});}
  else if(!navigator.onLine)out.push({key:'net',level:'bad',msg:'이 운영석 기기의 인터넷 연결이 끊겼습니다. 심판 점수를 받을 수 없습니다.'});
  for(let j=1;j<=N;j++){const q=judgeQueued(j);if(q)out.push({key:'q'+j,level:'warn',msg:`${j}심 기기에 아직 도착하지 않은 점수 ${q}건이 있습니다. 연결되면 자동으로 들어옵니다. 점수 공개 전에 잠시 기다려 주세요.`});}
  if(MODE==='local')out.push({key:'local',level:'warn',msg:'실시간 공유가 꺼져 있어 이 기기 안에서만 작동합니다. claude.ai에 로그인한 상태로 이 페이지를 열어 주세요.'});
  const judged=cur&&JUDGED(cur.kind);
  if(ROOM&&judged){for(let j=1;j<=N;j++){const seat=S.seats[j];
    if(seat&&!deviceOnline(seat.device)){OFF_SINCE[j]=OFF_SINCE[j]||now;const sec=Math.round((now-OFF_SINCE[j])/1000);
      if(sec>=10)out.push({key:'off'+j+seat.device,level:st.status==='open'?'bad':'warn',msg:`${j}심 기기 연결이 끊겼습니다 (${sec}초째). 휴대폰 화면이 꺼졌거나 인터넷이 끊겼을 수 있습니다.`+(window.KS_FIELD?' 휴대폰 와이파이가 대회 공유기에 연결돼 있는지 확인하세요.':''),act:`<button class="btn" data-act="armed" data-do="releaseSeat" data-n="${j}">자리 비우기</button>`});}
    else delete OFF_SINCE[j];}}
  if(judged&&st.status==='open'){
    const empty=[];for(let j=1;j<=N;j++)if(!S.seats[j])empty.push(j);
    if(empty.length)out.push({key:'empty'+empty.join('-'),level:'warn',msg:`${empty.map(j=>j+'심').join(', ')} <span>채점기에 아무도 들어오지 않았습니다.</span> <span>「심판 링크」의 번호 버튼을 눌러 링크를 보내 주세요.</span>`});
    const t=st.timer;
    if(t&&!t.running&&t.stoppedAt){const wait=Math.round((now-t.stoppedAt)/1000),cs=curScores(),miss=[];
      for(let j=1;j<=N;j++)if(!cs.some(s=>s.perfId===cur.perfId&&s.judge===j))miss.push(j);
      if(miss.length&&wait>=30)out.push({key:'slow'+cur.callId+st.epoch,level:'bad',msg:`격파가 끝난 지 ${wait}초가 지났는데 ${miss.map(j=>j+'심').join(', ')} 점수가 아직 들어오지 않았습니다.`});}
  }
  if(cur&&st.status==='open'&&curScores().some(s=>s.perfId===cur.perfId&&s.flag==='review'))out.push({key:'rev'+cur.callId+st.epoch,level:'warn',msg:`심판이 영상판독을 요청했습니다 (${curScores().filter(s=>s.perfId===cur.perfId&&s.flag==='review').map(s=>s.judge+'심').join(', ')}).`});
  return out.concat(EVENT_ALERTS);
}
function refreshAlerts(force){
  if(KIOSK||!routeNow().startsWith('admin'))return;
  const el=document.getElementById('alerts');
  const list=computeAlerts(),keys=new Set(list.map(a=>a.key));
  for(const k of [...DISMISSED])if(!keys.has(k)&&!k.startsWith('ev'))DISMISSED.delete(k);
  const shown=list.filter(a=>!DISMISSED.has(a.key));
  let lvl=null;for(const a of shown){if(!SEEN.has(a.key)){SEEN.add(a.key);if(a.level==='bad')lvl='bad';else if(a.level==='warn'&&lvl!=='bad')lvl='warn';}}
  for(const k of [...SEEN])if(!keys.has(k))SEEN.delete(k);
  if(lvl)beep(lvl);
  if(!el)return;
  const html=shown.length
    ?`<div class="alerts">${shown.map(a=>`<div class="alert ${a.level}"><span class="aic">!</span><span class="amsg">${a.msg}</span>${a.act||''}<button class="btn" data-act="dismissAlert" data-k="${a.key}">확인</button></div>`).join('')}
      <div class="row between"><span class="small muted">문제가 해결되면 알림은 저절로 사라집니다.</span><button class="btn" style="padding:6px 12px" data-act="toggleSound">알림 소리 ${SOUND?'켜짐':'꺼짐'}</button></div></div>`
    :`<div class="alerts quiet"><span class="row" style="gap:6px"><span class="dot on"></span><span class="small"><b>이상 없음</b> · 문제가 생기면 여기에 경고가 뜨고 소리로 알려 드립니다.</span></span>
      <span class="row" style="gap:6px"><button class="btn" style="padding:6px 12px" data-act="testAlert">알림 시험</button><button class="btn" style="padding:6px 12px" data-act="toggleSound">알림 소리 ${SOUND?'켜짐':'꺼짐'}</button></span></div>`;
  if(force||el._h!==html){el.innerHTML=html;el._h=html;}
  document.title=shown.some(a=>a.level==='bad')?'(!) 격파 대회 운영':'격파 대회 운영';
}
setInterval(()=>refreshAlerts(false),1000);

(async function boot(){
  navStack=[routeNow()];render();
  const use=n=>(window.claude&&window.claude.use?window.claude.use(n):Promise.resolve(null)).catch(()=>null);

  if(room){ROOM=room;try{room.onPeers(ch=>{PEERS=ch.peers;schedule();},()=>{ROOM=null;PEERS=[];schedule();});}catch(e){ROOM=null;}}
  if(db){DB=db;MODE='db';}else{MODE='local';}
  try{if(window.KS_FIELD&&KS_FIELD.onStatus)KS_FIELD.onStatus(()=>{schedule();try{refreshAlerts(true);}catch(e){}if(KS_FIELD.status().connected)flushOutbox();});}catch(e){}

  setTimeout(()=>{try{window.LMUS&&LMUS.setEntries(()=>S.roster.filter(a=>a.ev==='team').map(a=>({id:a.id,name:a.name,team:a.team})));}catch(err){}},0);
})();
