n.", "Speichern fehlgeschlagen. Verbindung prüfen und erneut versuchen.", "保存失败，请检查网络后重试。"], "칸에 직접 적어 주세요. 단체·복식은 대표 선수 나이로 나눕니다.": [" field yourself. Team·pair use the lead athlete's age.", " selbst ausfüllen. Team·Paar nach Alter des Hauptathleten.", "栏中手动填写。团体·双人按代表选手年龄划分。"], "PDF 도구를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요": ["Could not load the PDF tool. Reload and try again", "PDF-Werkzeug nicht geladen. Neu laden und erneut versuchen", "无法加载 PDF 工具，请刷新后重试"], "전광판에서 소리를 내려면 전광판 화면을 처음에 한 번 눌러 주세요.": ["To play sound on the scoreboard, tap its screen once first.", "Für Ton auf der Anzeige zuerst einmal auf den Bildschirm tippen.", "要在记分屏发声，请先点击记分屏一次。"], "지정품새 뒤쪽 1개를 추첨해 수행하며 이전 점수는 반영하지 않습니다": ["One designated poomsae from the back group is drawn; earlier scores do not count", "Eine Pflicht-Poomsae aus der hinteren Gruppe wird gelost; frühere Punkte zählen nicht", "从指定品势后组抽1个进行，之前分数不计"], "가 아닌 사람(기여자)은 어느 링크로 들어와도 채점 화면만 보입니다.": [" (contributors) only see the scoring screen, whatever link they use.", " (Mitwirkende) sehen nur die Wertungsseite, egal über welchen Link.", "以外的人（协作者）无论从哪个链接进入都只看到评分界面。"], "초기화 전에 백업을 먼저 받아 두세요. 변경 기록은 지우지 않습니다.": ["Download a backup before resetting. The change log is kept.", "Vor dem Zurücksetzen Backup erstellen. Das Protokoll bleibt erhalten.", "重置前请先备份。变更记录不会删除。"], "운영석에 문의하세요. 운영석이 자리를 비우면 다시 들어올 수 있습니다.": ["Ask the control desk. You can rejoin once the desk frees the seat.", "Bitte am Pult melden. Nach Freigabe können Sie erneut beitreten.", "请联系控制台。控制台释放席位后可重新进入。"], "이 부문의 지정품새 부를 찾지 못했습니다 · 대진표 탭에서 골라 주세요": ["Designated poomsae group not found · choose it in the Bracket tab", "Pflicht-Poomsae-Gruppe nicht gefunden · im Turnierbaum-Tab wählen", "未找到本组别的指定品势组 · 请在对阵表页选择"], "재경기를 여러 번 해도 가려지지 않았습니다. 경기운영본부가 결정하세요.": ["Several rematches did not decide it. The organizing committee must decide.", "Mehrere Wiederholungen ohne Entscheidung. Die Turnierleitung entscheidet.", "多次重赛仍未分出胜负，请由赛事运营本部决定。"], "를 하면 그 경기를 다시 호출할 수 있습니다. 모두 변경 기록에 남습니다.": [" lets you call that match again. Everything is kept in the change log.", " erlaubt einen erneuten Aufruf. Alles wird protokolliert.", "后可重新呼叫该比赛。全部记录在变更记录中。"], "이 운영석 기기의 인터넷 연결이 끊겼습니다. 심판 점수를 받을 수 없습니다.": ["This desk device is offline and cannot receive judge scores.", "Dieses Pult ist offline und kann keine Wertungen empfangen.", "本控制台设备已断网，无法接收裁判分数。"], "저장 공간이 가득 찼습니다. 지난 대회 데이터를 백업한 뒤 초기화해 주세요.": ["Storage is full. Back up past tournament data, then reset.", "Speicher voll. Alte Turnierdaten sichern, dann zurücksetzen.", "存储已满，请备份以往赛事数据后重置。"], "진행할 경기가 없습니다. 토너먼트는 앞 경기가 끝나야 다음 경기가 생깁니다.": ["No matches to run. In a tournament, the next match appears when the previous one ends.", "Keine Kämpfe offen. Im K.-o.-System entsteht der nächste Kampf nach dem vorherigen.", "没有可进行的比赛。淘汰赛需前一场结束后才产生下一场。"], "부문 이름으로 부별 지정품새를 찾지 못했습니다. 오른쪽에서 부를 골라 주세요.": ["No designated poomsae found for this division name. Choose a group on the right.", "Keine Pflicht-Poomsae zum Klassennamen gefunden. Rechts Gruppe wählen.", "无法按组别名称找到指定品势，请在右侧选择。"], "이 화면에서는 전체 화면을 쓸 수 없습니다. 브라우저의 F11 키를 눌러 주세요": ["Full screen is not available here. Press F11 in your browser", "Vollbild hier nicht verfügbar. Bitte F11 drücken", "此界面无法全屏，请按浏览器 F11 键"], "소년체전·전국체전·국가대표최종선발전의 준결승·결승처럼 점수차승을 쓰지 않는 경기는": ["For matches without point-gap wins (e.g. national championship semi-finals and finals),", "Für Kämpfe ohne Punktabstandssieg (z. B. Halbfinale und Finale nationaler Meisterschaften)", "对于不适用分差胜的比赛（如全国赛半决赛·决赛），"], "점수가 다른 심판들과 1점 이상 차이 납니다. 입력 실수가 아닌지 확인해 보세요.": ["differs from the other judges by 1 pt or more. Check for an input error.", "weicht um 1 Pkt. oder mehr ab. Bitte Eingabefehler prüfen.", "与其他裁判相差1分以上，请确认是否输入错误。"], "제14조 감점: 상대 1점. 10개면 반칙패, 3전다승제는 한 회전 5개면 그 회전 패": ["Art. 14 gam-jeom: 1 pt to opponent. 10 = loss by penalties; best-of-3: 5 in a round loses that round", "Art. 14 Gam-jeom: 1 Pkt. für Gegner. 10 = Niederlage; Best of 3: 5 in einer Runde = Runde verloren", "第14条扣分：对方得1分。满10次犯规负；三局两胜单回合5次则该回合负"], "잠긴 번호는 다른 기기가 고를 수 없습니다. 심판이 기기를 바꾸거나 휴대폰이 꺼졌을 때는": ["Locked numbers cannot be chosen by other devices. If a judge changes device or the phone turns off,", "Gesperrte Nummern können andere Geräte nicht wählen. Wenn ein Richter das Gerät wechselt oder das Handy aus ist,", "被锁定的编号其他设备无法选择。裁判更换设备或手机关机时，"], "는 그 연기의 점수를 지우고 다시 호출할 수 있게 합니다. 모두 아래 변경 기록에 남습니다.": [" clears that performance's scores so it can be called again. Everything is logged below.", " löscht die Punkte der Vorführung für einen neuen Aufruf. Alles wird unten protokolliert.", "清除该表演分数以便重新呼叫。全部记录在下方变更记录中。"], "심판용 링크: 주소 끝에 #judge-1 … #judge-7 → 그 번호 채점기로 바로 입장": ["Judge links: add #judge-1 … #judge-7 to the address → opens that scorer directly", "Richter-Links: #judge-1 … #judge-7 an die Adresse anhängen → öffnet direkt", "裁判链接：地址末尾加 #judge-1 … #judge-7 → 直接进入该编号评分器"], "(8개: 앞 4·뒤 4, 7개: 앞 4·뒤 3). 재경기는 뒤쪽 그룹에서 1개(제14조 2항)": ["(8: front 4·back 4, 7: front 4·back 3). Rematch: 1 from the back group (Art. 14.2)", "(8: vorne 4·hinten 4, 7: vorne 4·hinten 3). Wiederholung: 1 aus hinterer Gruppe (Art. 14.2)", "（8个：前4·后4，7个：前4·后3）。重赛从后组抽1个（第14条2项）"], "공식 대진표처럼 선수 이름(소속)을 아래에 세로로 쓰고, 선이 위로 올라가 결승에서 만납니다.": ["Like an official bracket: names (club) run vertically at the bottom and lines rise to meet in the final.", "Wie ein offizieller Turnierbaum: Namen (Verein) senkrecht unten, Linien treffen sich oben im Finale.", "如正式对阵表：选手姓名（所属）竖写在下方，线向上延伸在决赛相遇。"], "운영석에서 이 기기의 자리를 비웠습니다. 이 기기로 계속 채점하려면 아래 버튼을 눌러 주세요.": ["The desk freed this device's seat. To keep scoring here, press the button below.", "Das Pult hat diesen Platz freigegeben. Zum Weiterwerten unten tippen.", "控制台已释放本设备的席位。如需继续评分，请按下方按钮。"], "한 컴퓨터로 여러 심판을 채점할 때 각각 새 창(탭)으로 엽니다. 창을 나란히 배치해 쓰세요.": ["To score several judges on one computer, open each in a new window (tab) and place them side by side.", "Für mehrere Richter an einem Computer jeweils ein neues Fenster (Tab) öffnen und nebeneinander anordnen.", "一台电脑代多位裁判评分时，各自在新窗口（标签）打开并并排放置。"], "부전승 선수는 다음 라운드 경기에 바로 연결합니다. 이긴 선수 쪽 선은 초록으로 굵게 그립니다.": ["Byes go straight to the next round. The winner's line is drawn bold.", "Freilose gehen direkt in die nächste Runde. Die Siegerlinie wird fett gezeichnet.", "轮空选手直接进入下一轮。胜者一侧的线加粗显示。"], "까지 경과 시간을 잽니다. 제한 시간을 벗어나면 숫자가 붉게 바뀌고 시간 감점 버튼이 강조됩니다.": [" elapsed time is measured. Outside the time limit the number turns red and the time deduction button is highlighted.", " wird die Zeit gemessen. Außerhalb des Limits wird die Zahl rot und die Zeitabzug-Taste hervorgehoben.", "计时。超出时间限制时数字变红，时间扣分按钮高亮。"], "부심 입력(ev 문서)을 시간순으로 묶어, 같은 쪽·같은 기술을 정해진 시간(기본 1.5초) 안에": ["Judge inputs are grouped by time; same side and technique within the window (default 1.5 s),", "Richtereingaben werden zeitlich gruppiert; gleiche Seite und Technik im Zeitfenster (Standard 1,5 s),", "边裁输入按时间分组，同一方·同一技术在规定时间（默认1.5秒）内"], "심제로 진행합니다. 번호를 고르면 이 기기에 잠기고, 다른 기기는 같은 번호를 고를 수 없습니다.": ["-judge system. Choosing a number locks it to this device; other devices cannot choose it.", "-Richter-System. Die gewählte Nummer wird an dieses Gerät gebunden; andere Geräte können sie nicht wählen.", "裁制进行。选择编号后锁定在本设备，其他设备无法选择相同编号。"], "열기가 안 되면: 복사 → 새 탭(Ctrl+T) → 주소창에 붙여넣기(Ctrl+V) → Enter": ["If Open does not work: Copy → new tab (Ctrl+T) → paste in address bar (Ctrl+V) → Enter", "Wenn Öffnen nicht geht: Kopieren → neuer Tab (Strg+T) → in Adresszeile einfügen (Strg+V) → Enter", "若无法打开：复制 → 新标签页（Ctrl+T）→ 粘贴到地址栏（Ctrl+V）→ Enter"], "심판은 claude.ai 계정으로 로그인해야 합니다. 이 페이지 오른쪽 위 공유 메뉴에서 각 심판을": ["Judges must sign in with a claude.ai account. From the Share menu at top right, invite each judge as", "Richter müssen mit einem claude.ai-Konto angemeldet sein. Über das Teilen-Menü oben rechts jeden Richter einladen als", "裁判需用 claude.ai 账号登录。请在本页右上角共享菜单中将各裁判邀请为"], "차렷·준비 / 시작 / 바로. 설정에 따라 운영석이나 전광판 컴퓨터(또는 둘 다)에서 소리를 냅니다": ["Charyeot·Joonbi / Shijak / Baro. Played on the desk or scoreboard computer (or both), as set", "Charyeot·Joonbi / Shijak / Baro. Ton am Pult- oder Anzeigecomputer (oder beiden), je nach Einstellung", "立正·准备 / 开始 / 还原。根据设置在控制台或记分屏电脑（或两者）发声"], "제12조 득점: 주먹 1, 몸통 발 2, 머리 발 3, 회전 몸통 4, 회전 머리 6, 상대 감점 1": ["Art. 12 points: punch 1, body kick 2, head kick 3, spinning body 4, spinning head 6, opponent gam-jeom 1", "Art. 12 Punkte: Faust 1, Rumpftritt 2, Kopftritt 3, Drehkick Rumpf 4, Drehkick Kopf 6, Gam-jeom des Gegners 1", "第12条得分：拳1、躯干踢2、头部踢3、旋转躯干4、旋转头部6、对方扣分1"], "3전다승제 회전 동점: 회전공격 점수 → 기술가치(머리·몸통·주먹·감점) → 유효타 → 심판 우세 판정": ["Best-of-3 round tie: spinning-kick points → technique value (head·body·punch·gam-jeom) → valid hits → superiority decision", "Best of 3, Rundengleichstand: Drehkickpunkte → Technikwert (Kopf·Rumpf·Faust·Gam-jeom) → gültige Treffer → Überlegenheitsentscheid", "三局两胜回合平分：旋转技得分 → 技术价值（头·躯干·拳·扣分）→ 有效击打 → 裁判优势判定"], "4.1 개인전 / 4.2 단체·복식전 부별 지정품새. 품새 2개면 앞쪽 그룹에서 1개, 뒤쪽 그룹에서 1개": ["4.1 individual / 4.2 team·pair designated poomsae by age group. With 2 poomsae: 1 from the front group, 1 from the back group", "4.1 Einzel / 4.2 Team·Paar Pflicht-Poomsae je Altersgruppe. Bei 2 Poomsae: 1 aus vorderer, 1 aus hinterer Gruppe", "4.1 个人赛 / 4.2 团体·双人赛 各年龄组指定品势。2个品势时前组1个、后组1个"], "필요한 인원 이상이 누르면 1번의 득점으로 인정합니다. 운영석 입력(전자호구 점수·감점·정정)은 바로 인정.": ["pressed by enough judges count as one score. Desk inputs (PSS points·gam-jeom·corrections) count immediately.", "von genug Richtern gedrückt, zählen als eine Wertung. Pulteingaben (PSS-Punkte·Gam-jeom·Korrekturen) zählen sofort.", "达到所需人数即计为一次得分。控制台输入（电子护具分·扣分·更正）立即生效。"], "실시간 공유가 꺼져 있어 이 기기 안에서만 작동합니다. claude.ai에 로그인한 상태로 이 페이지를 열어 주세요.": ["Live sharing is off, so this only works on this device. Open this page while signed in to claude.ai.", "Live-Freigabe ist aus; nur auf diesem Gerät. Bitte angemeldet bei claude.ai öffnen.", "实时共享已关闭，仅在本设备运行。请登录 claude.ai 后打开此页面。"], "인터넷 연결이 끊겼습니다. 채점은 계속하세요. 보낸 점수는 이 기기에 보관했다가 연결되면 자동으로 운영석에 보냅니다.": ["You are offline. Keep scoring. Scores are stored on this device and sent to the desk when you reconnect.", "Keine Verbindung. Weiter werten. Wertungen werden gespeichert und bei Verbindung ans Pult gesendet.", "网络已断开。请继续评分。分数暂存本设备，连接后自动发送至控制台。"], "학교부는 출생연도 기준 나이(올해 − 출생연도), 성인부는 만 나이 기준입니다. 대학부처럼 나이로 나눌 수 없는 부는": ["School divisions use age by birth year (this year − birth year); adult divisions use full age. For groups not split by age (e.g. university), fill in the", "Schulklassen nach Geburtsjahr (dieses Jahr − Geburtsjahr), Erwachsene nach vollendetem Alter. Für Gruppen ohne Altersteilung (z. B. Universität) das Feld", "学校组按出生年计算年龄（今年 − 出生年），成人组按周岁。大学组等无法按年龄划分的组，请在"], "제16조 점수차승: 2회전 종료 또는 3회전 중 20점 차 / 제16조의2 3전다승제: 한 회전 12점 차면 회전 종료": ["Art. 16 point-gap win: 20-pt gap at end of round 2 or during round 3 / Art. 16-2 best of 3: a 12-pt gap ends the round", "Art. 16 Punktabstand: 20 Pkt. nach Runde 2 oder in Runde 3 / Art. 16-2 Best of 3: 12 Pkt. Abstand beendet die Runde", "第16条分差胜：第2回合结束或第3回合中20分差 / 第16条之2 三局两胜：单回合12分差则回合结束"], "부심들이 이 시간 안에 같은 쪽·같은 기술을 눌러야 한 번의 득점으로 인정합니다. 와이파이가 느리면 1.5~2초를 권합니다.": ["Judges must press the same side and technique within this time for one score. On slow Wi-Fi, 1.5–2 s is recommended.", "Richter müssen in dieser Zeit gleiche Seite und Technik drücken. Bei langsamem WLAN 1,5–2 s empfohlen.", "边裁须在此时间内按下同一方·同一技术才计为一次得分。Wi-Fi 较慢时建议1.5~2秒。"], "제15조 골든라운드: 2점 선취 승. 못 가리면 주먹 득점 → 유효타 → 회전 승리 수 → 감점 적은 선수 → 심판 우세 판정": ["Art. 15 Golden Round: first to 2 points wins. Otherwise punch points → valid hits → rounds won → fewer gam-jeom → superiority decision", "Art. 15 Golden Round: wer zuerst 2 Punkte hat, gewinnt. Sonst Faustpunkte → gültige Treffer → gewonnene Runden → weniger Gam-jeom → Überlegenheitsentscheid", "第15条金局：先得2分者胜。未分胜负时：拳得分 → 有效击打 → 回合胜数 → 扣分少者 → 裁判优势判定"], "경기장 스피커가 연결된 컴퓨터를 고르세요. 전광판에서 음성을 내려면 전광판 화면을 처음에 한 번 눌러 주어야 합니다(브라우저 정책).": ["Choose the computer connected to the venue speakers. For voice on the scoreboard, tap its screen once first (browser policy).", "Computer mit Hallenlautsprechern wählen. Für Ton auf der Anzeige zuerst einmal tippen (Browser-Richtlinie).", "请选择连接场馆音箱的电脑。要在记分屏播放语音，需先点击记分屏一次（浏览器策略）。"], "(예: 중등부 1학년 남자 -45kg)으로 자동으로 묶여 대진표까지 만들어집니다. 열: 번호, 이름, 소속, 부별, 학년, 성별, 체급.": ["(e.g. Middle school 1st yr male -45kg) are grouped automatically and brackets are built. Columns: No., name, club, age group, grade, gender, weight class.", "(z. B. Mittelstufe 1. Jg. männlich -45kg) werden automatisch gruppiert und Turnierbäume erstellt. Spalten: Nr., Name, Verein, Altersgruppe, Klasse, Geschlecht, Gewicht.", "（如：初中1年级 男子 -45kg）自动分组并生成对阵表。列：编号、姓名、所属、年龄组、年级、性别、级别。"], "를 누르면 새 탭에 그 부심 화면이 열립니다. 1·2·3부심을 각각 열어 두고 이 운영석 탭에서 경기를 시작하면 됩니다. 다른 기기에서는": [" opens that judge's screen in a new tab. Open judges 1·2·3, then start the match from this desk tab. For other devices,", " öffnet die Richterseite in einem neuen Tab. Richter 1·2·3 öffnen und den Kampf in diesem Pult-Tab starten. Für andere Geräte", "在新标签页打开该边裁界面。分别打开1·2·3号边裁后，在此控制台标签页开始比赛即可。其他设备请"], "숫자를 누르면 그 심판의 링크가 복사됩니다. 카카오톡에 붙여넣어 해당 심판에게 보내세요. 링크를 열면 그 번호 채점기로 바로 들어갑니다.": ["Tap a number to copy that judge's link. Paste it into a messenger and send it. The link opens that judge's scorer directly.", "Auf eine Nummer tippen kopiert den Richter-Link. Per Messenger senden. Der Link öffnet direkt die Wertung.", "点击编号即复制该裁判链接，粘贴到即时通讯发送。打开链接即直接进入该编号评分器。"], "제13조 채점: 3부심제는 2명 이상, 2부심제는 2명 모두 인정 시 유효. 전자호구는 몸통·머리를 PSS가, 회전 추가점과 주먹은 부심이": ["Art. 13 scoring: with 3 judges 2 or more, with 2 judges both must agree. With PSS, body·head come from PSS; spin bonus and punches from the judges", "Art. 13 Wertung: bei 3 Richtern mind. 2, bei 2 Richtern beide. Mit PSS: Rumpf·Kopf vom PSS, Drehbonus und Faust von den Richtern", "第13条评分：3名边裁需2名以上、2名边裁需2名一致方有效。电子护具时躯干·头部由 PSS 计分，旋转加分与拳由边裁"], "대회 설정, 선수 명단, 부문·대진, 공개된 점수, 변경 기록을 파일 하나(.json)로 저장합니다. 대회 중간중간, 그리고 끝난 뒤에 꼭 백업해 두세요.": ["Saves settings, roster, divisions·brackets, revealed scores and the change log in one file (.json). Back up during and after the tournament.", "Speichert Einstellungen, Liste, Klassen·Turnierbäume, Punkte und Protokoll in einer Datei (.json). Während und nach dem Turnier sichern.", "将赛事设置、选手名单、组别·对阵、已公布分数、变更记录保存为一个文件（.json）。比赛中途及结束后请务必备份。"], "규정(제17조)은 5심제 또는 7심제입니다. 5심제 이상은 항목별로 최고·최저 점수를 빼고 평균합니다(제15조). 3심제는 소규모 대회용으로 세 심판 평균입니다.": ["Rules (Art. 17) use 5 or 7 judges. With 5 or more, the highest and lowest are removed per item and the rest averaged (Art. 15). 3 judges is for small events: plain average.", "Regeln (Art. 17): 5 oder 7 Richter. Ab 5 werden je Kriterium Höchst- und Tiefstwert gestrichen (Art. 15). 3 Richter für kleine Turniere: einfacher Durchschnitt.", "规则（第17条）为5人或7人裁判制。5人以上按项目去掉最高·最低分后平均（第15条）。3人制用于小型赛事，取三人平均。"], "숫자를 누르면 그 부심의 링크가 복사됩니다. 카카오톡으로 보내면 그 번호 채점기로 바로 들어갑니다. 부심은 claude.ai 계정으로 로그인하고, 이 페이지 공유 메뉴에서": ["Tap a number to copy that judge's link. Send it by messenger; it opens that scorer directly. Judges sign in with claude.ai; from this page's Share menu invite them as", "Auf eine Nummer tippen kopiert den Richter-Link. Per Messenger senden; er öffnet direkt die Wertung. Richter melden sich bei claude.ai an; über das Teilen-Menü einladen als", "点击编号即复制该边裁链接，发送后直接进入该编号评分器。边裁用 claude.ai 账号登录，并在本页共享菜单中邀请为"], "컷오프는 인원에 따라 단계가 자동으로 정해집니다: 11명 이하 결선만, 12~21명 본선(8명 선발) → 결선, 22명 이상 예선(상위 50%) → 본선 → 결선. 품새 2개면 두 점수의 평균으로 순위를 냅니다.": ["Cut-off stages are set by entries: 11 or fewer final only; 12–21 semi-final (top 8) → final; 22+ preliminary (top 50%) → semi-final → final. With 2 poomsae, ranks use the average.", "Cut-off-Stufen nach Teilnehmerzahl: bis 11 nur Finale; 12–21 Halbfinale (Top 8) → Finale; ab 22 Vorrunde (Top 50 %) → Halbfinale → Finale. Bei 2 Poomsae zählt der Durchschnitt.", "淘汰制阶段按人数自动确定：11人以下仅决赛；12~21人复赛（选8人）→ 决赛；22人以上预赛（前50%）→ 复赛 → 决赛。2个品势时按平均分排名。"], "(예: 공인 개인전 중등부 1학년 남자)으로 자동으로 묶여 대진표까지 만들어집니다. 열: 번호, 이름, 소속, 부별, 학년, 성별, 공인/자유, 종목, 팀원. 예전 양식(나이·생년, 구분, 부문 열)도 그대로 읽습니다.": ["(e.g. Recognized individual, middle school 1st yr, male) are grouped automatically and brackets are built. Columns: No., name, club, age group, grade, gender, recognized/freestyle, event, team members. Older templates (age·birth year, category, division) are also read.", "(z. B. Anerkannt Einzel, Mittelstufe 1. Jg., männlich) werden automatisch gruppiert. Spalten: Nr., Name, Verein, Altersgruppe, Klasse, Geschlecht, Anerkannt/Freestyle, Disziplin, Teammitglieder. Ältere Vorlagen werden ebenfalls gelesen.", "（如：公认个人赛 初中1年级 男子）自动分组并生成对阵表。列：编号、姓名、所属、年龄组、年级、性别、公认/自由、项目、队员。旧模板（年龄·出生年、类别、组别列）也可读取。"], "매 경기 현장 추첨: 경기를 호출하면 부별 지정품새 중에서 자동으로 추첨해 전광판에 돌림판처럼 보여 줍니다. 당일 일괄 추첨: 대진표 탭에서 부문별로 라운드(단계)마다 미리 추첨해 두고 모든 경기에 같은 품새를 씁니다.": ["Draw at each match: calling a match draws from the designated poomsae and spins a roulette on the scoreboard. Draw all on the day: draw per division and stage in the Bracket tab; every match uses the same poomsae.", "Auslosung je Kampf: beim Aufruf wird aus den Pflicht-Poomsae gelost und als Roulette angezeigt. Tagesauslosung: im Turnierbaum-Tab je Klasse und Stufe vorab losen; alle Kämpfe nutzen dieselbe Poomsae.", "每场现场抽签：呼叫比赛时自动从指定品势中抽签，并在记分屏以转盘显示。当天统一抽签：在对阵表页按组别·阶段预先抽签，所有比赛使用相同品势。"], "겨루기": ["Kyorugi", "Kyorugi", "竞技"], "겨루기 대회": ["Kyorugi Tournament", "Kyorugi-Turnier", "竞技赛事"], "링크": ["link", "Link", "链接"], "화면 ↗": ["screen ↗", "Ansicht ↗", "界面 ↗"], "비어 있음": ["Empty", "Frei", "空闲"], "진행": ["In progress", "Läuft", "进行中"], "회전 종료": ["Round end", "Rundenende", "回合结束"], "회전 점수": ["Round score", "Rundenpunkte", "回合分数"], "아직 없음": ["None yet", "Noch nichts", "暂无"], "경기를 기다리는 중": ["Waiting for the match", "Warte auf den Kampf", "等待比赛"], "선수 대기": ["Waiting for athletes", "Warte auf Athleten", "等待选手"], "모든 부심": ["All judges", "Alle Richter", "全部边裁"], "모든 부심 동시": ["All judges at once", "Alle Richter gleichzeitig", "全部边裁同时"], "적용": ["On", "Ein", "适用"], "없음": ["None", "Keine", "无"], "1장": ["1 card", "1 Karte", "1张"], "2장": ["2 cards", "2 Karten", "2张"], "둘 다": ["Both", "Beide", "两者"], "끄기": ["Off", "Aus", "关闭"], "자동": ["Auto", "Auto", "自动"], "수동 (버튼)": ["Manual (button)", "Manuell (Taste)", "手动（按钮）"], "수동": ["Manual", "Manuell", "手动"], "주심직권승": ["Win by referee stop", "Sieg durch Kampfrichterabbruch", "主裁终止胜"], "기권승": ["Win by withdrawal", "Sieg durch Aufgabe", "弃权胜"], "실격승": ["Win by disqualification", "Sieg durch Disqualifikation", "失格胜"], "인정": ["Accept", "Annehmen", "成立"], "기술가치": ["technique value", "Technikwert", "技术价值"], "유효타": ["valid hits", "gültige Treffer", "有效击打"], "미만": ["under", "unter", "不足"], "처음": ["Showing first", "Es werden die ersten", "仅显示前"], "만 보입니다. 검색해 주세요.": [" only. Please search.", " angezeigt. Bitte suchen.", "人，请搜索。"], "공식 결과 불인정": ["not an official result", "kein offizielles Ergebnis", "不计正式成绩"], "공식 결과로 인정되지 않습니다": ["Not counted as an official result", "Zählt nicht als offizielles Ergebnis", "不计为正式成绩"], "예: 제1회 경민대학교 총장배 태권도대회": ["e.g. 1st Kyungmin University President's Cup", "z. B. 1. Kyungmin University President's Cup", "例：第1届庆民大学校长杯跆拳道大赛"], "예: 중등부": ["e.g. Middle School", "z. B. Mittelstufe", "例：初中组"], "예: 1학년": ["e.g. Grade 1", "z. B. 1. Klasse", "例：1年级"], "예: -63kg / 웰터급": ["e.g. -63kg / Welter", "z. B. -63kg / Welter", "例：-63kg / 次中量级"], "비우면 부별+학년+성별+체급": ["Blank = age group + grade + gender + weight class", "Leer = Altersgruppe + Klasse + Geschlecht + Gewicht", "留空 = 年龄组+年级+性别+级别"], "이름·소속·체급 검색": ["Search name·club·weight class", "Name·Verein·Gewicht suchen", "搜索姓名·所属·级别"], "감점 1개 → 상대 선수에게 1점": ["1 gam-jeom → 1 point to the opponent", "1 Gam-jeom → 1 Punkt für den Gegner", "1次扣分 → 对方得1分"], "잘못 들어간 점수 바로잡기 +1": ["Correct a wrong score +1", "Falsche Wertung korrigieren +1", "更正错误分数 +1"], "잘못 들어간 점수 바로잡기 −1 (감점 아님)": ["Correct a wrong score −1 (not a gam-jeom)", "Falsche Wertung korrigieren −1 (kein Gam-jeom)", "更正错误分数 −1（不是扣分）"], "이 선수에 대한 운영석 마지막 입력 취소": ["Undo the last desk input for this athlete", "Letzte Pulteingabe für diesen Athleten zurücknehmen", "撤销该选手的最后一次控制台输入"], "영상판독 인정: 카드 유지": ["Video replay accepted: card kept", "Videobeweis angenommen: Karte bleibt", "回放成立：保留卡"], "영상판독 불인정: 카드 회수": ["Video replay rejected: card lost", "Videobeweis abgelehnt: Karte verloren", "回放不成立：收回卡"], "한 컴퓨터에서 1·2·3부심 입력을 시험합니다": ["Test judge 1·2·3 inputs on one computer", "Eingaben von Richter 1·2·3 an einem Computer testen", "在一台电脑上测试1·2·3号边裁输入"], "3부심: 2명 이상이 같은 점수를 누르면 인정": ["3 judges: counted when 2 or more press the same score", "3 Richter: zählt, wenn mind. 2 dieselbe Wertung drücken", "3名边裁：2名以上按下相同分数即有效"], "2부심: 2명 모두 같은 점수를 누르면 인정": ["2 judges: counted when both press the same score", "2 Richter: zählt, wenn beide dieselbe Wertung drücken", "2名边裁：2名都按下相同分数即有效"], "일반호구: 부심이 주먹 1, 몸통 2, 머리 3, 회전 몸통 4, 회전 머리 6점을 모두 누릅니다. 이 앱은 전자호구 장비와 직접 연결되지 않습니다.": ["Standard hogu: judges press all points — punch 1, body 2, head 3, spinning body 4, spinning head 6. This app does not connect directly to PSS equipment.", "Normale Weste: Richter drücken alle Punkte — Faust 1, Rumpf 2, Kopf 3, Drehkick Rumpf 4, Drehkick Kopf 6. Diese App ist nicht direkt mit PSS-Geräten verbunden.", "普通护具：边裁输入全部得分——拳1、躯干2、头部3、旋转躯干4、旋转头部6。本应用不直接连接电子护具设备。"], "회전마다 승자를 정하고 2회전을 먼저 이기면 승리합니다. 한 회전 12점 차면 그 회전 종료, 한 회전 감점 5개면 그 회전 패. 회전 동점은 회전공격 점수 → 기술가치 → 유효타 → 심판 우세 순(제15조 5항).": ["A winner is decided each round; the first to win 2 rounds wins. A 12-point gap ends the round; 5 gam-jeom in a round loses that round. Round ties: spinning-kick points → technique value → valid hits → superiority decision (Art. 15.5).", "Jede Runde hat einen Sieger; wer zuerst 2 Runden gewinnt, siegt. 12 Punkte Abstand beenden die Runde; 5 Gam-jeom in einer Runde = Runde verloren. Gleichstand: Drehkickpunkte → Technikwert → gültige Treffer → Überlegenheitsentscheid (Art. 15.5).", "每回合决出胜者，先赢2回合者获胜。单回合12分差即结束该回合；单回合5次扣分则该回合负。回合平分：旋转技得分 → 技术价值 → 有效击打 → 裁判优势判定（第15条5项）。"], "3전 다승제에는 골든라운드가 없습니다(제7조 1.1).": ["Best of 3 has no Golden Round (Art. 7 1.1).", "Best of 3 hat keine Golden Round (Art. 7 1.1).", "三局两胜制没有金局（第7条1.1）。"], "소년체전·전국체전·국가대표최종선발전의 준결승·결승처럼 점수차승을 쓰지 않는 경기는 \"적용 안 함\"으로 바꾸세요.": ["For matches without point-gap wins (e.g. national championship semi-finals and finals), set this to \"Off\".", "Für Kämpfe ohne Punktabstandssieg (z. B. Halbfinale und Finale nationaler Meisterschaften) „Aus“ wählen.", "对于不适用分差胜的比赛（如全国赛半决赛·决赛），请改为“不适用”。"], "숫자를 누르면 그 부심의 링크가 복사됩니다. 카카오톡으로 보내면 그 번호 채점기로 바로 들어갑니다. 부심은 claude.ai 계정으로 로그인하고, 이 페이지 공유 메뉴에서 \"기여자\"로 초대해 주세요.": ["Tap a number to copy that judge's link. Send it by messenger; it opens that judge's scorer directly. Judges sign in with a claude.ai account; invite them as \"contributor\" from this page's Share menu.", "Auf eine Nummer tippen kopiert den Richter-Link. Per Messenger senden; er öffnet direkt die Wertung. Richter melden sich mit einem claude.ai-Konto an; über das Teilen-Menü als „Mitwirkender“ einladen.", "点击编号即复制该边裁链接，发送后直接进入该编号评分器。边裁用 claude.ai 账号登录，请在本页共享菜单中邀请为“协作者”。"], "\"시작\"을 누른 뒤(경기 중·갈려) 입력할 수 있습니다.": ["Inputs work after \"Start\" (in play·Kalyeo).", "Eingaben sind nach „Start“ möglich (läuft·Kalyeo).", "按“开始”后（比赛中·分开）可输入。"], "부심 2명이 1.5초 안에 같은 기술을 누르면 점수가 올라갑니다. 맨 아래 \"모든 부심 동시\"는 한 번에 인정됩니다.": ["A score counts when 2 judges press the same technique within 1.5 s. The bottom row \"All judges at once\" counts immediately.", "Eine Wertung zählt, wenn 2 Richter dieselbe Technik innerhalb von 1,5 s drücken. Die untere Zeile „Alle Richter gleichzeitig“ zählt sofort.", "2名边裁在1.5秒内按下相同技术即得分。最下方“全部边裁同时”一次即有效。"], "\"승자 바꾸기\"는 판정 정정용입니다. \"결과 삭제\"를 하면 그 경기를 다시 호출할 수 있습니다. 모두 변경 기록에 남습니다.": ["\"Swap winner\" is for correcting decisions. \"Delete result\" lets you call that match again. Everything is kept in the change log.", "„Sieger tauschen“ dient zur Korrektur. „Ergebnis löschen“ erlaubt einen erneuten Aufruf. Alles wird protokolliert.", "“更换胜者”用于更正判定。“删除成绩”后可重新呼叫该比赛。全部记录在变更记录中。"], "\"빈 양식 내려받기\"로 받은 엑셀에 적어 불러오면": ["Fill in the Excel file from \"Download blank template\" and import it; athletes", "Die Excel-Datei aus „Leere Vorlage herunterladen“ ausfüllen und importieren; Athleten", "用“下载空白模板”得到的 Excel 填写后导入，"], "승자 음성 (\"청 승\" / \"홍 승\")": ["Winner voice (\"Chung seung\" / \"Hong seu m → Überlegenheitsentscheid", "优势（第15条第4项）：金分回合拳得分 → 有效击打数 → 回合胜数 → 扣分较少者 → 裁判优势判定"], "감점 적은 선수": ["fewer gam-jeom", "weniger Gam-jeom", "扣分较少者"], "반칙패": ["Loss by penalties", "Niederlage durch Strafen", "犯规负"], "주심직권": ["Referee stops contest", "Abbruch durch Kampfrichter", "主裁终止"], "부심 여러 명이 정해진 시간 안에 같은 기술을 눌러야 점수가 올라갑니다.": ["A score counts when enough judges press the same technique within the time window.", "Eine Wertung zählt, wenn genug Richter dieselbe Technik im Zeitfenster drücken.", "足够数量的边裁在规定时间内按下相同技术才计分。"], "전자호구: 몸통·머리 점수는 전자호구가 표시한 대로 운영석(기록원)이 누르고, 부심은 주먹 1점과 회전 추가점(몸통 +2, 머리 +3)만 누릅니다.": ["Electronic PSS: the control desk (recorder) enters body and head points as the PSS shows them; judges press only punch (1) and spinning bonuses (body +2, head +3).", "Elektronische PSS: Rumpf- und Kopfpunkte gibt das Steuerpult (Protokoll) laut PSS ein; die Richter drücken nur Faust (1) und Drehkick-Zuschläge (Rumpf +2, Kopf +3).", "电子护具：躯干、头部得分由记录台按电子护具显示输入，边裁只按拳（1分）和旋转加分（躯干+2、头部+3）。"], "1부심: 누르는 즉시 인정 (전자호구+전자글러브 경기용, 제13조 8항)": ["1 judge: counted on press (for PSS + e-glove contests, Art. 13.8)", "1 Richter: zählt sofort (für PSS + E-Handschuh, Art. 13.8)", "1名边裁：按下即有效（电子护具+电子手套比赛，第13条第8项）"], "2부심: 2명 모두 같은 점수를 눌러야 인정": ["2 judges: counted when both press the same score", "2 Richter: zählt, wenn beide dieselbe Wertung drücken", "2名边裁：2名都按下相同分数即有效"], "3회전 점수를 합산합니다. 2회전 종료 시 또는 3회전 중 20점 차면 점수차승, 감점 10개면 반칙패. 동점이면 골든라운드(켜진 경우).": ["Scores of 3 rounds are added. A 20-point gap after round 2 or during round 3 is a point-gap win; 10 gam-jeom is a loss by penalties. A tie goes to the Golden Round (if on).", "Die Punkte aus 3 Runden werden addiert. 20 Punkte Vorsprung nach Runde 2 oder in Runde 3 = Sieg durch Punktabstand; 10 Gam-jeom = Niederlage durch Strafen. Bei Gleichstand Golden Round (falls an).", "三回合得分相加。第2回合结束或第3回合中分差20分为分差胜，扣分10次为犯规负。平局进入金分回合（如开启）。"], "골든라운드에서는 이전 점수를 지우고, 먼저 2점을 얻은 선수가 이깁니다. 못 가리면 주먹 득점 → 유효타 → 회전 승리 수 → 감점 적은 선수 → 심판 우세 판정 순입니다.": ["In peichert", "张已保存"], "음성 구령 (준비 · 시작 / 바로 · 쉬어)": ["Voice commands (Joonbi · Shijak / Baro · Swieo)", "Sprachkommandos (Joonbi · Shijak / Baro · Swieo)", "语音口令（准备·开始 / 还原·稍息）"], "🔊 바로 · 쉬어": ["🔊 Baro · Swieo", "🔊 Baro · Swieo", "🔊 还原 · 稍息"], "점수를 보낼 수 없습니다.": ["Scores cannot be sent.", "Wertungen können nicht gesendet werden.", "无法提交分数。"], "점수를 보낼 수 없습니다": ["Scores cannot be sent", "Wertungen können nicht gesendet werden", "无法提交分数"], "운영자에게 이 앱을 공유받았는지 확인해 주세요.": ["Please check that the organizer has shared this app with you.", "Bitte prüfen, ob der Veranstalter diese App mit Ihnen geteilt hat.", "请确认运营者已向您共享此应用。"], "이 휴대폰에서 claude.ai에 로그인되어 있지 않습니다. 로그인한 뒤 이 링크를 다시 열어 주세요.": ["This phone is not signed in to claude.ai. Sign in, then open this link again.", "Dieses Handy ist nicht bei claude.ai angemeldet. Bitte anmelden und den Link erneut öffnen.", "此手机未登录 claude.ai。请登录后重新打开此链接。"], "문제가 계속되면 운영석에 알려 주세요.": ["If the problem continues, tell the control desk.", "Wenn das Problem bleibt, bitte das Steuerpult informieren.", "如问题持续，请告知控制台。"], "점수를 보낼 권한이 없습니다. 운영자에게 공유를 요청해 주세요": ["No permission to send scores. Ask the organizer to share the app.", "Keine Berechtigung zum Senden. Bitte den Veranstalter um Freigabe bitten.", "没有提交分数的权限，请向运营者申请共享。"], "claude.ai에 로그인한 뒤 다시 열어 주세요": ["Sign in to claude.ai and open it again", "Bei claude.ai anmelden und erneut öffnen", "请登录 claude.ai 后重新打开"], "점수를 보낼 권한이 없습니다. 운영자가 이 심판의 claude.ai 이메일을 공유 메뉴에서 「편집자」로 초대하고, 「링크가 있는 모든 사람」 공유는 꺼 두어야 합니다.": ["No permission to send scores. The organizer must invite this judge's claude.ai email as \"Editor\" in the Share menu and turn off \"Anyone with the link\" sharing.", "Keine Berechtigung zum Senden. Der Veranstalter muss die claude.ai-E-Mail dieses Richters im Teilen-Menü als „Bearbeiter“ einladen und „Jeder mit dem Link“ ausschalten.", "没有提交分数的权限。运营者需在共享菜单中将该裁判的 claude.ai 邮箱邀请为“编辑者”，并关闭“任何拥有链接的人”共享。"], "공인+자유": ["Recognized + freestyle", "Anerkannt + Freestyle", "公认+自由"], "🎵 자유품새 음악": ["🎵 Fr 异议即进行录像审查）"], "1차 도전에 실패하면 1회 더 도전합니다. 실패하면 직전에 성공한 높이가 기록입니다. 착지 후 무릎 위 신체가 닿으면 실패입니다.": ["After a failed 1st attempt, one more attempt is allowed. If it fails, the last successful height counts. Touching the floor above the knee after landing is a fail.", "Nach einem Fehlversuch gibt es einen weiteren Versuch. Scheitert er, zählt die letzte geschaffte Höhe. Bodenkontakt über dem Knie nach der Landung gilt als Fehlversuch.", "第1次失败后可再挑战1次。若仍失败，以前一次成功高度为记录。落地后膝盖以上触地视为失败。"], "✓ 이상 없음": ["✓ No issue", "✓ In Ordnung", "✓ 无异议"], "⚠ 영상판독 요청": ["⚠ Request video review", "⚠ Videobeweis anfordern", "⚠ 请求录像审查"], "격파가 끝나면 수행 과정을 확인해 주세요. 한 명이라도 문제를 제기하면 영상판독을 합니다.": ["After the break, check how it was performed. If any judge objects, the video is reviewed.", "Prüfen Sie nach dem Bruch die Ausführung. Erhebt jemand Einspruch, wird das Video geprüft.", "击破结束后请确认执行过程。任一裁判提出异议即进行录像审查。"], "기록이 확정되었습니다. 다음 선수를 기다려 주세요.": ["The record is confirmed. Please wait for the next athlete.", "Das Ergebnis ist bestätigt. Bitte auf die nächste Person warten.", "记录已确认。请等待下一位选手。"], "필수 기술": ["Required techniques", "Pflichttechniken", "必选技术"], "미성립": ["Not established", "Nicht zustande", "未成立"], "채점": ["Scoring", "Wertung", "评分"], "모든 심판 점수가 오면 자동 공개": ["Reveal automatically when all judges have scored", "Automatisch anzeigen, wenn alle gewertet haben", "所有裁判评分后自动公开"], "운영석에서 눌러 공개": ["Reveal from the control desk", "Über die Steuerung anzeigen", "由控制台点击公开"], "초등부 남녀": ["Elementary boys/girls", "Grundschule Jungen/Mädchen", "小学组男女"], "남녀 따로": ["Separate", "Getrennt", "男女分开"], "남녀 통합": ["Combined", "Gemeinsam", "男女合并"], "제7조 2.1: 초등부는 종목별로 경기가 성립하지 않으면 대표자 회의에서 남녀를 통합할 수 있습니다. 바꾼 뒤 「부문·조 편성」에서 「부문 다시 편성」을 눌러 주세요.": ["Art. 7 2.1: If an elementary event has too few entries, boys and girls may be combined by the representatives' meeting. After changing this, press “Rebuild divisions” in “Divisions & groups”.", "Art. 7 2.1: Kommt in der Grundschule eine Disziplin nicht zustande, können Jungen und Mädchen zusammengelegt werden. Danach unter „Klassen & Gruppen“ auf „Klassen neu bilden“ tippen.", "第7条2.1：小学组项目不成立时，可经代表会议合并男女。修改后请在“组别·分组”中点击“重新编组”。"], "경기장 스피커가 연결된 컴퓨터를 고르세요. 「준비 · 시작」을 누르면 \"준비\" 구령 5초 뒤 \"시작\" 구령과 함께 시간이 흐릅니다.": ["Choose the computer connected to the venue speakers. “Joonbi · Start” calls “Joonbi”, then 5 seconds later “Start” and the clock runs.", "Wählen Sie den Computer an den Hallenlautsprechern. „Joonbi · Start“ ruft „Joonbi“, 5 Sekunden später „Start“, und die Zeit läuft.", "请选择连接场馆音箱的电脑。按“准备 · 开始”后先喊“准备”，5秒后喊“开始”并开始计时。"], "컷오프 방식 (제8조)": ["Cut-off format (Art. 8)", "Cut-off-Modus (Art. 8)", "淘汰制（第8条）"], "컷오프 계획": ["Cut-off plan", "Cut-off-Plan", "淘汰计划"], "예선과 결선으로 진행합니다. 참가 인원이 아래 인원 이상이면 조를 나누어 예선을 치르고, 조별 상위 선수가 결선에 오릅니다. 그보다 적으면 예선 없이 결선만 치릅니다.": ["Competition has a preliminary and a final. If entries reach the number below, athletes are split into groups for the preliminary and the top of each group go to the final. Otherwise only the final is held.", "Es gibt Vorrunde und Finale. Ab der unten genannten Teilnehmerzahl wird in Gruppen vorgekämpft; die Besten jeder Gruppe erreichen das Finale. Sonst nur Finale.", "比赛分预赛与决赛。参赛人数达到下方人数时分组进行预赛，各组前几名进入决赛；否则只进行决赛。"], "예선을 치르는 인원 (이상)": ["Entries needed for a preliminary (or more)", "Teilnehmer für eine Vorrunde (ab)", "进行预赛的人数（以上）"], "조당 최대 인원": ["Max athletes per group", "Max. pro Gruppe", "每组最多人数"], "조별 결선 진출 인원": ["Finalists per group", "Finalisten pro Gruppe", "每组晋级决赛人数"], "결선 인원 (자동일 때)": ["Finalists (when automatic)", "Finalisten (automatisch)", "决赛人数（自动时）"], "규정 예시: 16명 이상이면 조를 나누어 8명 선발, 15명 이하면 예선 없이 결선. 진출 경계에서 동점이면 동점 처리 규정을 적용하고, 그래도 같으면 재경기(초등부 기술격파는 동점자 모두 진출)입니다.": ["Rule example: 16 or more → groups, 8 selected; 15 or fewer → final only. Ties at the cut line use the tie-break rules, then a re-match (elementary technical breaking: all tied advance).", "Regelbeispiel: ab 16 Gruppen, 8 kommen weiter; bis 15 nur Finale. Gleichstand an der Grenze: Tie-Break-Regeln, dann Wiederholung (Grundschule Technik: alle Gleichen kommen weiter).", "规则示例：16人以上分组选8人，15人以下不设预赛直接决赛。晋级线平分时按平分规则处理，仍相同则重赛（小学技术击破则同分者全部晋级）。"], "규정은 5인 심판입니다. 5심제 이상은 심판 점수 중 최고·최저를 빼고 평균합니다. 3심제는 소규모 대회용으로 세 심판 평균입니다.": ["The rules call for 5 judges. With 5 or more, the highest and lowest scores are dropped and the rest averaged. The 3-judge option averages all three, for small events.", "Die Regeln sehen 5 Kampfrichter vor. Ab 5 werden höchste und niedrigste Wertung gestrichen und der Rest gemittelt. 3 Richter: Mittel aller drei (kleine Turniere).", "规则为5名裁判。5人以上去掉最高分和最低分后取平均。3人制适用于小型比赛，取三人平均。"], "종목과 경기 시간 (제6조 · 제9조)": ["Events and time limits (Art. 6 · 9)", "Disziplinen und Zeiten (Art. 6 · 9)", "项目与比赛时间（第6条 · 第9条）"], "대회 설정, 선수 명단, 부문·조 편성, 점수, 변경 기록을 파일 하나(.json)로 저장합니다. 대회 중간중간, 그리고 끝난 뒤에 꼭 백업해 두세요.": ["Saves settings, roster, divisions and groups, scores and change log in one file (.json). Back up during and after the tournament.", "Speichert Einstellungen, Liste, Klassen/Gruppen, Wertungen und Protokoll in einer Datei (.json). Während und nach dem Turnier sichern.", "将比赛设置、名单、组别与分组、分数、变更记录保存为一个文件（.json）。比赛期间及结束后请务必备份。"], "자동이면 결선 인원(8명)을 조 수로 나눠 정합니다. 부문마다 다르게 하려면 「부문·조 편성」에서 바꿀 수 있습니다.": ["Automatic divides the finalists (8) by the number of groups. To set it per division, use “Divisions & groups”.", "Automatisch: Finalisten (8) geteilt durch Gruppenzahl. Pro Klasse unter „Klassen & Gruppen“ änderbar.", "自动时按组数分配决赛人数（8人）。如需各组别不同，请在“组别·分组”中修改。"], "심판은 claude.ai 계정으로 로그인해야 하고, 이 앱의 공유 메뉴에서 「편집자」로 초대되어 있어야 점수를 보낼 수 있습니다.": ["Judges must sign in to claude.ai and be invited as “Editor” in this app's Share menu to send scores.", "Kampfrichter müssen bei claude.ai angemeldet und im Teilen-Menü als „Bearbeiter“ eingeladen sein.", "裁判需登录claude.ai，并在本应用的共享菜单中被邀请为“编辑者”才能提交分数。"], "· 한 컴퓨터로 여러 심판을 시험할 때 각각 새 창(탭)으로 엽니다.": ["· To test several judges on one computer, open each in a new window (tab).", "· Zum Testen mehrerer Richter an einem Computer je ein neues Fenster (Tab) öffnen.", "· 在一台电脑测试多名裁判时，分别在新窗口（标签页）打开。"], "종목 + 성별 + 부별": ["event + gender + age group", "Disziplin + Geschlecht + Altersklasse", "项目 + 性别 + 组别"], "「양식 내려받기」로 받은 엑셀에 적어 불러오면": ["Fill in the Excel from “Download template” and import it, and athletes are grouped by", "Füllen Sie die Excel-Vorlage aus und importieren Sie sie; gruppiert wird nach", "在“下载模板”的Excel中填写并导入后，将按"], "(위력격파는 체급까지)로 자동으로 묶여 부문이 만들어집니다. 한 선수가 여러 종목에 나가면 종목마다 한 줄씩 적어 주세요.": ["(plus weight class for power breaking) into divisions. If an athlete enters several events, use one row per event.", "(bei Kraft-Bruchtest auch Gewichtsklasse). Bei mehreren Disziplinen bitte je Disziplin eine Zeile.", "（威力击破另加体重级别）自动编成组别。一名选手参加多个项目时，每个项目写一行。"], "이름 (단체전은 팀명)": ["Name (team name for team events)", "Name (Teamname bei Team)", "姓名（团体赛填队名）"], "체중 kg (위력격파)": ["Weight kg (power breaking)", "Gewicht kg (Kraft-Bruchtest)", "体重kg（威力击破）"], "신장 cm (높이 뛰어차기)": ["Height cm (high jump kick)", "Körpergröße cm (Hochsprung-Kick)", "身高cm（跳高踢）"], "팀원 (단체전)": ["Members (team)", "Mitglieder (Team)", "队员（团体赛）"], "예: 체공 도약 격파 남자 대학 1부": ["e.g. Aerial jump breaking Men University 1", "z. B. Sprungbruchtest Herren Universität 1", "例：腾空跳跃击破 男子 大学1组"], "예: 제1회 경민대학교 총장배 격파대회": ["e.g. 1st Kyungmin University President's Cup Breaking", "z. B. 1. Kyungmin University Präsidenten-Cup Bruchtest", "例：第1届庆民大学校长杯击破比赛"], "홍길동 / 경민대 A팀": ["Hong Gil-dong / Kyungmin Team A", "Hong Gil-dong / Kyungmin Team A", "洪吉童 / 庆民大A队"], "김하나, 이두리, …": ["Kim Hana, Lee Duri, …", "Kim Hana, Lee Duri, …", "金一，李二，…"], "추가한 뒤 「부문·조 편성」에서 「부문 다시 편성」을 누르면 부문에 들어갑니다.": ["After adding, press “Rebuild divisions” in “Divisions & groups” to place them in divisions.", "Danach unter „Klassen & Gruppen“ auf „Klassen neu bilden“ tippen.", "添加后在“组别·分组”中点击“重新编组”即可编入组别。"], "출전 명단": ["Entry list", "Teilnehmerliste", "参赛名单"], "이름·소속·부문 검색": ["Search name, club, division", "Name, Verein, Klasse suchen", "搜索姓名·单位·组别"], "제7조 4항: 4명 이상 참가하지 않은 부는 대표자 회의에서 폐지할 수 있습니다(위력격파는 상위 체급과 통합 가능).": ["Art. 7.4: Divisions with fewer than 4 entries may be cancelled by the representatives' meeting (power breaking may merge into the next class up).", "Art. 7.4: Klassen mit weniger als 4 Meldungen können gestrichen werden (Kraft-Bruchtest: Zusammenlegung mit höherer Klasse möglich).", "第7条第4款：参赛不足4人的组别可经代表会议取消（威力击破可与上一级别合并）。"], "부문·조 편성": ["Divisions & groups", "Klassen & Gruppen", "组别·分组"], "부문 다시 편성": ["Rebuild divisions", "Klassen neu bilden", "重新编组"], "결과·시상": ["Results & awards", "Ergebnisse & Ehrungen", "成绩·颁奖"], "명단을 바꾼 뒤에는 「부문 다시 편성」을 눌러 주세요. 이미 점수가 있는 부문의 조 편성은 그대로 둡니다.": ["After changing the roster, press “Rebuild divisions”. Groups in divisions that already have scores stay as they are.", "Nach Änderungen an der Liste „Klassen neu bilden“ tippen. Gruppen mit Wertungen bleiben unverändert.", "修改名单后请点击“重新编组”。已有分数的组别分组保持不变。"], "예선 치름": ["Hold preliminary", "Mit Vorrunde", "进行预赛"], "결선만": ["Final only", "Nur Finale", "仅决赛"], "출전 순서 다시 추첨": ["Redraw running order", "Startreihenfolge neu losen", "重新抽签出场顺序"], "점수가 있어 조 편성은 바꿀 수 없습니다. 바꾸려면 이 부문 점수를 먼저 지워 주세요.": ["Groups can't be changed because scores exist. Clear this division's scores first.", "Gruppen sind wegen vorhandener Wertungen gesperrt. Zuerst die Wertungen dieser Klasse löschen.", "已有分数，无法修改分组。请先清除该组别的分数。"], "예선이 모두 끝나면 여기서 결선 진출자를 확정합니다.": ["When the preliminary is finished, confirm the finalists here.", "Nach der Vorrunde hier die Finalisten bestätigen.", "预赛全部结束后在此确认决赛晋级者。"], "세부 지정 종목 (실시 순서)": ["Designated techniques (in order)", "Pflichttechniken (Reihenfolge)", "指定技术（实施顺序）"], "규정대로": ["Reset to rules", "Laut Regel", "按规则"], "한 줄에 한 기술. 심판 채점표가 이 순서로 나옵니다. 최종 점수가 같으면 마지막 기술부터 거꾸로 비교합니다.": ["One technique per line. The judges' sheet follows this order. On a tied total, techniques are compared from the last one backwards.", "Eine Technik pro Zeile. Der Wertungsbogen folgt dieser Reihenfolge. Bei Gleichstand wird von der letzten Technik rückwärts verglichen.", "每行一个技术。裁判评分表按此顺序显示。总分相同时从最后一个技术往前比较。"], "결선 진출 확정 · 결선 순서 추첨": ["Confirm finalists · draw final order", "Finalisten bestätigen · Finalreihenfolge losen", "确认决赛晋级 · 抽签决赛顺序"], "순서 자유": ["free order", "freie Reihenfolge", "顺序自由"], "격파물 10매 이내": ["up to 10 boards", "bis 10 Bretter", "击破物10块以内"], "진출 경계 동점": ["Tie at the cut line", "Gleichstand an der Grenze", "晋级线平分"], "입상 순위 동점": ["Tie for a medal place", "Gleichstand um Medaillenplatz", "获奖名次平分"], "아래 목록 끝의 재경기를 호출해 주세요.": ["call the re-match at the end of the list below.", "rufen Sie die Wiederholung am Listenende auf.", "请呼叫下方列表末尾的重赛。"], "「경기 진행」에서 재경기를 호출해 주세요.": ["call the re-match in “Run matches”.", "rufen Sie die Wiederholung unter „Wettkampf“ auf.", "请在“比赛进行”中呼叫重赛。"], "신청한 격파물을 1장도 격파하지 못해 결선 진출·입상에서 제외됩니다.": ["No declared board was broken, so the athlete cannot advance or place.", "Kein angemeldetes Brett gebrochen – kein Finale, keine Platzierung.", "申报的击破物一块都未击破，不能晋级决赛及获奖。"], "격파 0장": ["0 boards broken", "0 Bretter", "击破0块"], "심판 평균": ["Judges' average", "Richter-Mittel", "裁判平均"], "현재": ["Current", "Aktuell", "当前"], "그래도 공개": ["reveal anyway", "trotzdem anzeigen", "仍然公开"], "측정 시간 기준 시간 감점": ["Time deduction from measured time:", "Zeitabzug laut Messung:", "按计时扣时间分"], "넣기": ["apply", "übernehmen", "加入"], "측정 시간 기준": ["From measured time:", "Laut Messung:", "按计时"], "심판이 영상판독을 요청했습니다. 판독 결과에 맞춰 기록을 확인한 뒤 확정해 주세요.": ["A judge requested video review. Check the record against the review before confirming.", "Ein Richter hat den Videobeweis angefordert. Ergebnis danach prüfen und bestätigen.", "有裁判请求录像审查。请根据审查结果确认记录后再确定。"], "도착 ✓": ["Received ✓", "Erhalten ✓", "已收到 ✓"], "판독 요청": ["Review requested", "Videobeweis angefragt", "请求审查"], "연결 끊김": ["Disconnected", "Getrennt", "已断开"], "내 점수": ["My score", "Meine Wertung", "我的分数"], "운영석에서 선수를 호출하면 채점표가 나타납니다.": ["The score sheet appears when the control desk calls an athlete.", "Der Wertungsbogen erscheint, sobald die Steuerung aufruft.", "控制台呼叫选手后将显示评分表。"], "운영석에서 다음 선수를 호출하면 새 채점표가 열립니다.": ["A new sheet opens when the next athlete is called.", "Beim nächsten Aufruf öffnet sich ein neuer Bogen.", "控制台呼叫下一位选手后将打开新评分表。"], "다시 채점": ["Score again", "Neu werten", "重新评分"], "이 단계의 경기를 모두 마쳤습니다": ["All performances in this stage are done", "Alle Durchgänge dieser Runde sind fertig", "本阶段比赛已全部完成"], "아직 부문이 없습니다. 「선수 등록」 → 「부문·조 편성」 순서로 준비해 주세요.": ["No divisions yet. Go to “Athletes” → “Divisions & groups”.", "Noch keine Klassen. Erst „Athleten“, dann „Klassen & Gruppen“.", "尚无组别。请按“选手登记”→“组别·分组”的顺序准备。"], "「부문 다시 편성」을 누르면 명단을 종목·성별·부별로 묶어 부문을 만듭니다.": ["Press “Rebuild divisions” to group the roster by event, gender and age group.", "„Klassen neu bilden“ gruppiert die Liste nach Disziplin, Geschlecht und Altersklasse.", "点击“重新编组”将按项目·性别·组别编成组别。"], "먼저 「선수 등록」에서 명단을 넣어 주세요.": ["Add athletes in “Athletes” first.", "Zuerst Athleten unter „Athleten“ eintragen.", "请先在“选手登记”中录入名单。"], "종목을 알아보지 못한 줄이": ["Rows with an unrecognised event:", "Zeilen ohne erkannte Disziplin:", "无法识别项目的行"], "격파가 끝난 지": ["Since the break:", "Seit dem Bruch:", "击破结束已"], "심판이 영상판독을 요청했습니다": ["A judge requested video review", "Ein Richter hat den Videobeweis angefordert", "有裁判请求录像审查"], "1차": ["1st", "1.", "第1次"], "\"종목\" 칸에 종목 이름(예: 체공 도약 격파, 주먹 격파)을 적어 주세요.": ["Enter the event name in the “Event” column (e.g. Aerial jump breaking, Punch breaking).", "Tragen Sie die Disziplin in die Spalte „Disziplin“ ein (z. B. Sprungbruchtest, Faust-Bruchtest).", "请在“项目”栏填写项目名称（例：腾空跳跃击破、拳击破）。"], "「심판 링크」의 번호 버튼을 눌러 링크를 보내 주세요.": ["Press the numbers under “Judge links” to send the links.", "Tippen Sie unter „Richter-Links“ auf die Nummern, um die Links zu senden.", "请点击“裁判链接”中的号码按钮发送链接。"], "예선 없이 결선": ["Final only (no preliminary)", "Nur Finale (ohne Vorrunde)", "不设预赛直接决赛"], "뒤로 가기": ["Go back", "Zurück", "返回"], "검색": ["Search", "Suchen", "搜索"], "(초·중)": ["(elem./middle)", "(GS/Mittelstufe)", "（小学·初中）"], "이상": ["or more", "oder mehr", "以上"], "한국어": ["Korean", "Koreanisch", "韩语"], "장": ["boards", "Bretter", "块"], "난이도표로 계산": ["Calculate from difficulty table", "Aus Schwierigkeitstabelle berechnen", "按难度表计算"], "기술 평균": ["Average of techniques", "Mittel der Techniken", "技术平均"], "가장 높은 기술": ["Highest technique", "Höchste Technik", "最高技术"], "합계 (최대 20)": ["Sum (max 20)", "Summe (max. 20)", "合计（最多20）"], "선수가 실시한 기술을 하나씩 추가하면 난이도 점수가 자동으로 들어갑니다.": ["Add each technique the athlete performed and the difficulty score fills in automatically.", "Fügen Sie jede ausgeführte Technik hinzu – die Schwierigkeit wird automatisch eingetragen.", "逐一添加选手完成的技术，难度分将自动填入。"], "체공 도약": ["Aerial jump", "Flug", "腾空跳跃"], "수직축 회전": ["Vertical spin", "Vertikaldrehung", "垂直轴旋转"], "수평축·복합 회전": ["Horizontal/combined spin", "Horizontal-/Kombidrehung", "水平轴·复合旋转"], "딛고 기본 격파": ["Step-up basic breaking", "Abstoß-Grundbruch", "踏踩基本击破"], "딛고 수직축 회전": ["Step-up vertical spin", "Abstoß-Vertikaldrehung", "踏踩垂直轴旋转"], "딛고 수평축·복합 회전": ["Step-up horizontal/combined spin", "Abstoß-Horizontal-/Kombidrehung", "踏踩水平轴·复合旋转"], "투척물 격파": ["Thrown-object breaking", "Bruch geworfener Objekte", "投掷物击破"], "투척물 가산": ["Thrown-object bonus", "Bonus geworfene Objekte", "投掷物加分"], "(표현성에 더함, 최대 40)": ["(added to expression, max 40)", "(zum Ausdruck addiert, max. 40)", "（加到表现力，最多40）"], "기술을 골라 주세요": ["Choose a technique", "Technik wählen", "请选择技术"], "+ 추가:": ["+ Add:", "+ Hinzufügen:", "+ 添加："], "투척": ["thrown", "geworfen", "投掷"], "종합격파 난이도 (난이도표 계산)": ["Combination breaking difficulty (table calculation)", "Schwierigkeit Kombinations-Bruchtest (Tabelle)", "综合击破难度（难度表计算）"], "실시한 기술 평균": ["Average of performed techniques", "Mittel der ausgeführten Techniken", "已完成技术平均"], "심판이 채점기에서 선수가 실시한 기술을 고르면 난이도표 점수로 계산해 난이도 칸에 넣습니다. 여러 기술을 어떻게 한 점수로 합칠지 고르세요 (규정에 따로 정해진 방식이 있으면 그에 맞춰 주세요). 심판은 계산된 점수를 직접 고칠 수도 있습니다.": ["When judges pick the techniques performed, the app calculates difficulty from the table. Choose how several techniques combine into one score (follow any method set by the rules). Judges can still adjust the result.", "Wählen Kampfrichter die ausgeführten Techniken, wird die Schwierigkeit aus der Tabelle berechnet. Legen Sie fest, wie mehrere Techniken zusammengefasst werden (gemäß Regelwerk). Richter können den Wert anpassen.", "裁判在评分器中选择选手完成的技术后，系统按难度表计算难度分。请选择多个技术合并为一个分数的方式（如规则另有规定请按规则）。裁判也可直接修改计算结果。"], "단체전 음악": ["Team music", "Team-Musik", "团体赛音乐"], "시작과 함께 자동 재생": ["Auto-play on start", "Beim Start automatisch", "开始时自动播放"], "운영석에서 눌러 재생": ["Play from control desk", "Über Steuerung abspielen", "由控制台点击播放"], "음악 (노트북 폴더)": ["Music (laptop folder)", "Musik (Laptop-Ordner)", "音乐（笔记本文件夹）"], "단체전 음악 (노트북 폴더)": ["Team music (laptop folder)", "Team-Musik (Laptop-Ordner)", "团体赛音乐（笔记本文件夹）"], "자유품새 음악 (노트북 폴더)": ["Freestyle music (laptop folder)", "Freestyle-Musik (Laptop-Ordner)", "自由品势音乐（笔记本文件夹）"], "운영석 노트북의 음악 폴더를 고르면,": ["Pick the music folder on the control laptop and files are matched automatically by", "Wählen Sie den Musikordner am Steuerungs-Laptop; die Zuordnung erfolgt automatisch über", "选择控制台笔记本的音乐文件夹后，将按"], "파일 이름에 들어 있는 팀명(이름)": ["the team (athlete) name in the file name", "den Team-/Namen im Dateinamen", "文件名中的队名（姓名）"], "으로 자동 연결됩니다. 예: \"경민대A팀.mp3\". 음악은 서버에 올리지 않고": ["e.g. \"KyungminA.mp3\". Music is not uploaded; it is stored", "z. B. „KyungminA.mp3“. Musik wird nicht hochgeladen, sondern", "自动关联。例：“庆民大A队.mp3”。音乐不会上传到服务器，只"], "이 컴퓨터에만": ["on this computer only", "nur auf diesem Computer", "保存在本电脑"], "담아 두므로 용량 걱정이 없고, 새로고침해도 남아 있습니다. 대회 당일에는 음악을 담은 이 노트북으로 운영해 주세요.": [", so there is no size limit and it survives reloads. Run the tournament on this laptop.", "gespeichert – kein Größenlimit, bleibt nach Neuladen erhalten. Bitte das Turnier mit diesem Laptop leiten.", "因此无容量负担，刷新后仍保留。比赛当天请用存有音乐的这台笔记本运营。"], "📁 음악 폴더 고르기": ["📁 Choose music folder", "📁 Musikordner wählen", "📁 选择音乐文件夹"], "＋ 파일 더 넣기": ["＋ Add more files", "＋ Weitere Dateien", "＋ 添加更多文件"], "이 컴퓨터의 음악 비우기": ["Clear music on this computer", "Musik auf diesem Computer löschen", "清空本电脑的音乐"], "이 컴퓨터에 담긴 음악을 확인하는 중…": ["Checking music on this co const EN=()=>CFG().lang==='en';
function medalCert(x){const en=EN();const aw=en?(x.rank===1?'GOLD MEDAL · 1st Place':x.rank===2?'SILVER MEDAL · 2nd Place':'BRONZE MEDAL · 3rd Place'):(x.rank===1?'금메달 · 제1위':x.rank===2?'은메달 · 제2위':'동메달 · 제3위');
  return {kind:'medal',award:aw,name:x.name,team:x.team,div:x.div.name,members:x.members};}
function teamCert(r){const en=EN();return {kind:'team',award:en?(r.rank===1?'OVERALL CHAMPION':r.rank===2?'OVERALL RUNNER-UP':'OVERALL 3rd PLACE'):(r.rank===1?'종합 우승':r.rank===2?'종합 준우승':'종합 3위'),name:r.team,team:'',coach:r.coach,div:''};}
function mvpCert(r,k){const en=EN();return {kind:'mvp',award:en?'MOST VALUABLE PLAYER':'최우수 선수상',name:r.name,team:r.team,div:k==='대회 전체'?r.div.name:`${k} · ${r.div.name}`};}
function coachCert(c){const en=EN();return {kind:'coach',award:en?'BEST COACH AWARD':'최우수 지도자상',name:c.coach,team:c.team,div:''};}
function bodyText(c){const cf=CFG(),comp=SET().name||(KY?'태권도 겨루기 대회':typeof APP_KIND!=='undefined'&&APP_KIND==='gyeokpa'?'태권도 격파 대회':'태권도 품새 대회');
  if(EN()){const b={medal:`has achieved outstanding results at the ${comp} and is hereby awarded this certificate.`,team:`has achieved the above result in the overall team standings of the ${comp} and is hereby awarded this certificate.`,
      mvp:`has displayed outstanding skill and sportsmanship at the ${comp} and is hereby named the Most Valuable Player.`,coach:`has led the team with dedication at the ${comp}, achieving excellent results, and is hereby awarded this certificate.`};return b[c.kind];}
  const b={medal:`위 선수는 ${comp}에서 위와 같이 우수한 성적을 거두었으므로 이 상장을 수여합니다.`,team:`위 팀은 ${comp}에서 우수한 성적으로 위와 같이 입상하였으므로 이 상장을 수여합니다.`,
    mvp:`위 선수는 ${comp}에서 뛰어난 기량과 모범적인 경기 태도로 타의 귀감이 되었으므로 최우수 선수로 선정하여 이 상장을 수여합니다.`,coach:`위 지도자는 ${comp}에서 열정적인 지도로 선수들을 이끌어 우수한 성적을 거두었으므로 이 상장을 수여합니다.`};
  return b[c.kind];}

const CW=1240,CH=1754,SERIF='"Noto Serif KR","Nanum Myeongjo","Batang",serif';
function wrap(ctx,text,maxW){const out=[];let line='';const words=text.split(' ');const sep=' ';
  for(const w of words){const t=line?line+sep+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}if(line)out.push(line);return out;}
function sealImg(){return new Promise(r=>{if(!SEAL)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=SEAL;});}
async function drawCert(ctx,c,no,seal){
  const cf=CFG(),en=EN();window.__I18N_OFF=true;
  try{
  ctx.fillStyle='#FFFDF6';ctx.fillRect(0,0,CW,CH);

</script><script>/* ===== 노트북 음악 폴더: 운영석 컴퓨터의 폴더를 골라 파일 이름으로 선수(팀)와 자동 연결, 이 컴퓨터에 보관해 바로 재생 =====

(function(){

const saveMap=()=>{try{localStorage.setItem('ks_lm_map_'+APPK,JSON.stringify(MAP));}catch(err){}};
function idb(){if(DBP)return DBP;DBP=new Promise((res,rej)=>{try{const r=indexedDB.open('ks-localmusic',1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('files')){const os=d.createObjectStore('files',{keyPath:'k'});os.createIndex('app','app');}};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(err){rej(err);}});DBP.catch(()=>{DBP=null;});return DBP;}
function tx(mode,fn){return idb().then(d=>new Promise((res,rej)=>{const t=d.transaction('files',mode),os=t.objectStore('files');let out;try{out=fn(os);}catch(err){rej(err);return;}
  t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}));}
async function loadList(){
  try{const keys=await tx('readonly',os=>os.index('app').getAllKeys(APPK));const metas=[];
    for(const k of keys||[]){const x=await tx('readonly',os=>os.get(k));if(x)metas.push({k:x.k,name:x.name,size:x.size});}
    FILES=metas.sort((a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true}));}catch(err){FILES=[];}

/* ---------- 현장 모드: 노트북의 눈에 보이는 「음원」 폴더와 맞추기 ----------

    if(nw.length){let n=0;for(const f of nw){try{const x=await fetch(`/api/music/file?app=${APPK}&name=${encodeURIComponent(f.name)}`,{cache:'no-store'});if(!x.ok)continue;const b=await x.blob();

/* 파일 이름 ↔ 선수(팀) 자동 연결: 파일 이름에 팀명(이름)이 들어 있으면 연결, 없으면 소속 이름으로 (그 소속이 한 팀일 때) */
const norm=s=>String(s||'').toLowerCase().replace(/\.[a-z0-9]{2,4}$/,'').replace(/[\s_\-()\[\]{}·.,'"]/g,'');
function autoMap(entries){
  const out={},used=new Set();const fn=FILES.map(f=>({k:f.k,n:norm(f.name)}));
  const byName=[...entries].sort((a,b)=>norm(b.name).length-norm(a.name).length);
  byName.forEach(en=>{const n=norm(en.name);if(n.length<2)return;const hits=fn.filter(f=>f.n.includes(n)&&!used.has(f.k));if(hits.length>=1){out[en.id]=hits[0].k;used.add(hits[0].k);}});

let AUTO={},AUTO_KEY='';
function auto(){const ents=ENTRIES()||[];const key=FILES.map(f=>f.k).join('|')+'#'+ents.map(x=>x.id+x.name+x.team).join('|');if(key!==AUTO_KEY){AUTO_KEY=key;AUTO=autoMap(ents);}return AUTO;}

</script><script>/* ===== PDF 명단 읽기: 표 형식(첫 줄에 이름·소속 등 제목) 또는 대진표 형식("이름(소속)")을 엑셀 행처럼 바꿔 줍니다 ===== */
(function(){

async function lib(){

  if(!window.pdfjsWorker)await load(BASE+'pdf.worker.min.js');   /* 작업 스레드 대신 이 화면에서 바로 읽기(공유 페이지에서도 동작) */

/* 쪽마다 글자 조각을 줄(y)로 묶고, 줄 안에서는 왼쪽(x)부터 정렬 */
async function pages(file){
  const L=await lib();const pdf=await L.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p),tc=await page.getTextContent();
    const items=tc.items.filter(it=>it.str).map(it=>({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0,h:Math.abs(it.transform[3])||10}));
    items.sort((a,b)=>b.y-a.y||a.x-b.x);

</script><script>/* ===== 본부 연동 (현장 모드에서만) =====

(function(){
const F=window.KS_FIELD||window.KS_HOST;   /* 현장 모드(노트북) 또는 통합 대회 본부(Claude) 안에서 열린 코트 */
if(!F||!F.app||F.app==='hq')return;
const HOST=!window.KS_FIELD&&!!window.KS_HOST;
const APP=F.app,APPNAME={poomsae:'품새',gyeokpa:'격파',kyorugi:'겨루기'}[APP]||'';
/* 코트 이름을 화면 위쪽 제목 앞에 */
if(F.court){
  const st=document.createElement('style');
  st.textContent=`.brand::before{content:"${F.court}코트 · ";color:#E6CD97;font-weight:900}`;
  (document.head||document.documentElement).appendChild(st);
}
const g=n=>{try{return (0,eval)(n);}catch(e){return undefined;}};   /* 앱의 함수·값 (없으면 undefined) */
const person=id=>{const a=(g('athlete')||(()=>null))(id)||{};return {name:a.name||'',team:a.team||''};};
function isOperator(){try{return !g('KIOSK')&&String(g('routeNow')()).startsWith('admin');}catch(e){return false;}}

/* ---------- 종목별: 부문의 경기 목록과 끝난 경기 ---------- */
function itemsOf(d){
  if(APP==='kyorugi'){const ms=(g('matchesOf')(d)||[]);return ms.map(m=>({id:m.id,label:m.label,done:!!m.res,names:[{...person(m.blue),side:'blue'},{...person(m.red),side:'red'}]}));}

}
function current(){
  const S=g('S');
  if(APP==='kyorugi'){const L=(g('live')||(()=>null))();if(!L)return null;const d=S.divs.find(x=>x.id===L.divId);
    return {divId:L.divId,div:(d&&d.name)||L.divName||'',id:L.matchId,label:L.label||'',status:({ready:'준비',fight:'경기 중',break:'갈려',rest:'휴식',decide:'판정',end:'경기 끝'})[L.phase]||'경기 중',
      names:[{name:(L.blue&&L.blue.name)||'',team:(L.blue&&L.blue.team)||'',side:'blue'},{name:(L.red&&L.red.name)||'',team:(L.red&&L.red.team)||'',side:'red'}]};}
  const cur=(g('curOf')||(()=>null))();if(!cur)return null;const st=g('ST')();const d=S.divs.find(x=>x.id===cur.divId);
  const status=st.status==='revealed'?'점수 공개':'경기 중';
  if(APP==='gyeokpa')return {divId:cur.divId,div:(d&&d.name)||cur.divName||'',id:cur.callId||cur.perfId,label:cur.label||'',status,names:[{name:cur.name||person(cur.athleteId).name,team:cur.team||person(cur.athleteId).team}]};
  return {divId:cur.divId,div:(d&&d.name)||'',id:cur.callId,label:cur.label||'',status,names:(cur.entries||[]).map(e=>({...person(e.athleteId),side:e.side||''}))};
}
/* ---------- 심판 기기 연결 상태 (본부 「연결 점검」용) ----------
   st: ok(연결됨) · off(끊김) · wait(보내지 못한 점수 보관 중) · none(아직 아무도 안 들어옴) · solo(운영석에서 직접 채점) */
const OFF_SINCE={};
function judgeStatus(){
  const S=g('S'),SET=g('SET');if(!S||!SET)return {list:[],label:'심'};
  const set=SET(),kyo=APP==='kyorugi',N=Number(kyo?set.refs:set.judges)||0,label=kyo?'부심':'심';
  const devOn=g('deviceOnline'),jq=g('judgeQueued'),seats=S.seats||{},now=Date.now();

  let open=false,sent=new Set();
  try{if(!kyo){const cur=g('curOf')(),st=g('ST')();if(cur&&st.status==='open'){open=true;
      const ids=APP==='gyeokpa'?[cur.perfId]:(cur.entries||[]).map(e=>e.perfId);
      const cs=(g('curScores')()||[]);
      for(let j=1;j<=N;j++)if(ids.length&&ids.every(id=>cs.some(x=>x.perfId===id&&x.judge===j)))sent.add(j);}}
    else{const L=(g('live')||(()=>null))();open=!!(L&&(L.phase==='fight'||L.phase==='break'||L.phase==='ready'));}}catch(e){}
  const list=[];
  for(let j=1;j<=N;j++){
    const seat=seats[j];let on=false,q=0;

    let st=!seat?'none':!on?'off':q?'wait':'ok';
    if(kyo&&N===1&&!seat)st='solo';
    if(st==='off'){OFF_SINCE[j]=OFF_SINCE[j]||now;}else delete OFF_SINCE[j];
    list.push({n:j,st,q,sec:st==='off'?Math.round((now-OFF_SINCE[j])/1000):0,sent:sent.has(j)});
  }

}
function board(){
  const S=g('S'),SET=g('SET');if(!S||!S.divs)return null;
  const divs=S.divs,now=current(),ui=g('ui')||{};
  const info=divs.map(d=>{let it=[];try{it=itemsOf(d);}catch(e){}return {d,it,done:it.filter(x=>x.done).length,total:it.length};});
  let ci=now?divs.findIndex(d=>d.id===now.divId):-1;
  if(ci<0&&ui.div)ci=divs.findIndex(d=>d.id===ui.div);
  if(ci<0)ci=info.findIndex(x=>x.total>x.done);
  if(ci<0)ci=0;
  const next=[];
  for(let k=0;k<info.length&&next.length<10;k++){const x=info[(ci+k)%info.length];if(!x)continue;
    for(const it of x.it){if(it.done||(now&&it.id===now.id))continue;next.push({div:x.d.name,label:it.label,names:it.names});if(next.length>=10)break;}}
  let nextDiv=null;
  for(let k=1;k<info.length;k++){const x=info[(ci+k)%info.length];if(x&&x.total>x.done&&x.done===0){nextDiv=x.d.name;break;}}
  if(!nextDiv)for(let k=1;k<info.length;k++){const x=info[(ci+k)%info.length];if(x&&x.total>x.done){nextDiv=x.d.name;break;}}
  const c=info[ci];
  return {v:1,app:APP,appName:APPNAME,court:F.court||'',comp:(SET&&SET().name)||'',
    now,curDiv:c?c.d.name:'',progress:c?{done:c.done,total:c.total}:null,next,nextDiv,
    divs:info.map(x=>({name:x.d.name,done:x.done,total:x.total})),
    totals:{divs:info.length,doneDivs:info.filter(x=>x.total&&x.done===x.total).length},
    judges:(()=>{try{return judgeStatus();}catch(e){return null;}})()};
}
function results(){
  const AW=window.AW,S=g('S');if(!AW||!AW.medalists||!S)return null;
  let list=[];try{list=AW.medalists();}catch(e){return null;}
  const by=new Map();
  list.forEach(x=>{const k=x.div.id;if(!by.has(k))by.set(k,{div:x.div.name,podium:[]});by.get(k).podium.push({rank:x.rank,name:x.name,team:x.team});});
  const divs=[...by.entries()].map(([id,v])=>{const d=S.divs.find(x=>x.id===id);let pending=0;try{pending=itemsOf(d).filter(x=>!x.done).length;}catch(e){}
    v.podium.sort((a,b)=>a.rank-b.rank);return {...v,done:pending===0&&v.podium.some(p=>p.rank===1)};});
  return {v:1,app:APP,appName:APPNAME,court:F.court||'',divs};
}
let lastB='',lastR='',lastAt=0,busy=false,lastDiv=null;
/* 통합 본부(Claude): 서버가 없으니 코트 운영석이 새 부문 시작을 직접 본부에 알림 */
async function hostAutoCall(b){
  if(!HOST||!F.rawDb)return;const cd=b.curDiv||'';
  if(lastDiv===null){lastDiv=cd;return;}
  if(cd===lastDiv||!cd||!b.nextDiv){lastDiv=cd;return;}
  lastDiv=cd;
  try{const c=await F.rawDb.doc('hqcfg/main').get();const cf=c.exists?c.data():{};if(cf.autoCall===false)return;
    const now=Date.now(),id='a'+now.toString(36)+F.court,text=`${F.court}코트, ${b.nextDiv} 선수는 준비해 주세요.`;
    await F.rawDb.doc('hq/announce').set({id,text,court:F.court,div:b.nextDiv,app:APP,auto:true,at:now});
    await F.rawDb.doc('calllog/'+id).set({text,court:F.court,auto:true,at:now});}catch(e){}
}
async function publish(){
  if(busy||!isOperator()||!F.db)return;
  const st=F.status&&F.status();if(st&&!st.connected)return;

  if(!b)return;
  hostAutoCall(b);
  const bj=JSON.stringify(b),rj=JSON.stringify(r),now=Date.now();

</script><script>/* ===== 심판 키패드 글씨 자동 맞춤 (품새·격파·겨루기 공통) =====
   화면 크기가 바뀌면 키패드 칸이 먼저 정해지고, 칸 안의 숫자·글씨는 칸에 들어갈 만큼만 줄어듭니다.
   CSS가 정한 크기가 기준이고, 넘칠 때만 그 칸의 글씨를 비율대로 줄입니다(커질 때는 CSS 크기로 돌아감). */
(function(){
const SEL='body.jdg .opt,body.jdg .jbtn,body.jdg .jpick button,body.jdg .gjfoot .btn,body.jdg .jfoot .btn';
const PAD=2;
function nodesOf(el){return [el,...el.querySelectorAll('*')].filter(n=>!(n instanceof SVGElement));}
function over(el){
  if(!el.isConnected)return 0;
  const cs=getComputedStyle(el);if(cs.display==='none'||cs.visibility==='hidden')return 0;
  const r=el.getBoundingClientRect();if(r.width<4||r.height<4)return 0;
  const bl=parseFloat(cs.borderLeftWidth)+parseFloat(cs.paddingLeft),br=parseFloat(cs.borderRightWidth)+parseFloat(cs.paddingRight);
  const bt=parseFloat(cs.borderTopWidth),bb=parseFloat(cs.borderBottomWidth);
  const iw=r.width-bl-br-PAD,ih=r.height-bt-bb-PAD;
  const rg=document.createRange();rg.selectNodeContents(el);const t=rg.getBoundingClientRect();
  if(!t.width||!t.height)return 0;
  const k=Math.min(iw/t.width,ih/t.height,el.clientWidth/el.scrollWidth||1,1);
  return k<0.995?k:0;
}
let busy=false,queued=false;
function run(){
  queued=false;if(busy)return;busy=true;
  try{
    const els=[...document.querySelectorAll(SEL)];
    if(!els.length)return;
    /* 1) 모두 CSS 크기로 되돌림 */
    for(const el of els)if(el.dataset.kf){for(const n of nodesOf(el))n.style.removeProperty('font-size');delete el.dataset.kf;}
    /* 2) 넘치는 칸만 줄임 (두 번까지 다시 확인) */
    let todo=els;

      const plan=[];for(const el of todo){const k=over(el);if(k)plan.push([el,k]);}

      ${devices.length>1?`<select data-rp="cam">${devices.map((d,i)=>`<option value="${d.deviceId}" ${d.deviceId===cur?'selected':''}>${camName(d,i)}</option>`).join('')}</select>`:''}</div>`;
    box.querySelector('.vw').appendChild(video);video.play().catch(()=>{});

}
/* 앱 화면이 다시 그려져도 판독 칸은 그대로 */
setInterval(()=>{drawBox();const r=box.querySelector('.rec');if(r&&stream){const x=`녹화 중 · 최근 ${secTxt(bufSec())}`;if(!r.textContent.endsWith(x)){r.innerHTML='<i></i>'+x;}}},1000);

/* ---------- 카메라 켜기 · 담아 두기 ---------- */
async function start(id){
  err='';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){err='이 브라우저에서는 카메라를 쓸 수 없습니다. 크롬이나 엣지로 현장 모드 운영석(http://localhost:…)을 열어 주세요.';drawBox();return;}
  try{
    stop(true);
    const want={width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}};
    if(id)want.deviceId={exact:id};
    try{stream=await navigator.mediaDevices.getUserMedia({video:want,audio:false});}
    catch(e1){/* 지난번 카메라 번호가 바뀐 경우(다른 USB 구멍 등): 연결된 아무 카메라로 */
      if(id&&e1&&(e1.name==='OverconstrainedError'||e1.name==='NotFoundError')){delete want.deviceId;stream=await navigator.mediaDevices.getUserMedia({video:want,audio:false});}else throw e1;}
    const tr=stream.getVideoTracks()[0];const st=tr.getSettings?tr.getSettings():{};if(st.deviceId)LS.set('ks_rp_cam',st.deviceId);
    tr.addEventListener('ended',()=>{err='카메라 연결이 끊겼습니다. USB 케이블을 확인한 뒤 「다시 켜기」를 눌러 주세요.';stop(true);drawBox();});
    try{devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');}catch(e){devices=[];}
    video=document.createElement('video');video.muted=true;video.playsInline=true;video.autoplay=true;video.srcObject=stream;
    await video.play().catch(()=>{});
    cap=document.createElement('canvas');ctx=cap.getContext('2d');frames=[];
    timer=setInterval(grab,1000/FPS);
    LS.set('ks_rp_on','1');box.innerHTML='';drawBox();
  }catch(e){
    stop(true);
    err=e&&e.name==='NotAllowedError'?'카메라 사용이 막혀 있습니다. 주소 칸 왼쪽 자물쇠(🔒)를 눌러 「카메라: 허용」으로 바꾼 뒤 다시 켜 주세요.'
      :e&&(e.name==='NotFoundError'||e.name==='OverconstrainedError')?'카메라를 찾지 못했습니다. USB 웹캠을 꽂았는지 확인해 주세요.'
      :e&&e.name==='NotReadableError'?'다른 프로그램이 카메라를 쓰고 있습니다. 화상회의·카메라 앱을 닫고 다시 켜 주세요.'
      :'카메라를 켜지 못했습니다'+(window.KS_FIELD?'':' (Claude 앱 안에서는 카메라가 막혀 있을 수 있습니다. 현장 모드 노트북에서 써 주세요)')+'.';
    drawBox();
  }
}
function stop(keepFlag){
  clearInterval(timer);timer=null;
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;video=null;frames=[];
  if(!keepFlag)LS.set('ks_rp_on','0');
}
function grab(){
  if(busy||!video||video.readyState<2)return;
  const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return;
  const w=Math.min(W,vw),h=Math.round(vh*w/vw);
  if(cap.width!==w||cap.height!==h){cap.width=w;cap.height=h;}
  const t=performance.now();if(frames.length&&t-frames[frames.length-1].t<1000/fpsNow()-8)return;
  busy=true;
  try{ctx.drawImage(video,0,0,w,h);}catch(e){busy=false;return;}
  const wall=Date.now(),B=bufSec();
  cap.toBlob(b=>{busy=false;if(!b)return;frames.push({t,wall,b});
    const cut=t-B*1000;let i=0;while(i<frames.length&&frames[i].t<cut)i++;if(i)frames.splice(0,i);
    while(marks.length&&marks[0].t<cut-5000)marks.shift();},'image/jpeg',qualNow());
}

/* ---------- 경기 시작·그만 표시 (판독 화면의 바로 가기 단추) ---------- */
let marks=[],wasRun=false,lastCall='',kStart='',kEnded=true;
function appRun(){
  const app=(window.KS_FIELD&&KS_FIELD.app)||(window.KS_HOST&&KS_HOST.app)||'';
  try{
    if(app==='kyorugi'){const L=g('live')();if(!L)return {run:false,kyo:true};const t=L.timer||{};
      let left=1;try{left=g('remain')(t);}catch(e){}
      return {kyo:true,run:!!t.running,key:(L.mid||L.matchId||'')+'|'+L.round,label:(g('roundLabel')(L.round)||'회전')+' 시작',
        ended:L.phase==='rest'||L.phase==='decide'||!!L.result||(!t.running&&left<=0)};}
    const st=g('ST')(),cur=g('curOf')(),t=st&&st.timer||{};
    if(app==='poomsae'){let nm='';try{nm=g('pnameOfCall')(cur)||'';}catch(e){}return {run:!!t.running,call:cur&&cur.callId||'',label:nm,poom:true};}
    return {run:!!t.running,call:cur&&cur.callId||'',label:cur?((g('EV')[cur.ev]||{}).label||'경기')+' 시작':'경기 시작'};
  }catch(e){return {run:false};}
}
setInterval(()=>{
  if(!stream)return;const r=appRun(),t=performance.now(),wall=Date.now();
  if(r.kyo){/* 겨루기: 「갈려」로 잠깐 멈춰도 같은 회전이면 시작 표시를 다시 남기지 않음 */
    if(r.run&&r.key!==kStart){marks.push({t,wall,kind:'start',label:r.label});kStart=r.key;kEnded=false;}
    if(kStart&&!kEnded&&r.ended){marks.push({t,wall,kind:'stop'});kEnded=true;}
    return;}
  if(r.run&&!wasRun){
    let label=r.label,n=0;
    if(r.poom){/* 1품새를 끝내고 3분 20초 안에 다시 시작하면 2품새 */
      const last=marks.filter(m=>m.kind==='start').pop();n=last&&last.n===1&&t-last.t<200000?2:1;
      label=`${n}품새${r.label?' · '+r.label:''}`;}
    marks.push({t,wall,kind:'start',label,n});lastCall=r.call;}
  if(!r.run&&wasRun)marks.push({t,wall,kind:'stop'});
  wasRun=!!r.run;
},200);

/* ---------- 판독 화면 ---------- */
let cv=null,cctx=null,shown=-1,drawing=false;
function openOv(){
  if(!frames.length){alert('아직 담긴 장면이 없습니다. 잠시 뒤 다시 눌러 주세요.');return;}
  snap=frames.slice();pos=idxAt(snap[snap.length-1].t-3000);playing=false;speed=0.5;
  ov=document.createElement('div');ov.id='ksrpov';ov.setAttribute('data-noi18n','');
  ov.innerHTML=`<div class="top"><span class="tag">영상 판독</span><b>${COURT?COURT+'코트 · ':''}${APPNAME}</b><span class="sp"></span><span class="t" data-rt></span></div>
    <canvas></canvas>
    <div class="tl"><input type="range" min="0" max="${snap.length-1}" value="${pos}" data-rr></div>
    <div><div class="ctl">
      <button data-rv="-10">⏪ 10초</button><button data-rv="-3">⏪ 3초</button><button data-rv="f-1">◀ 한 장</button>
      <button data-rv="play" style="min-width:110px">▶ 재생</button>
      <button data-rv="f1">한 장 ▶</button><button data-rv="3">3초 ⏩</button><span class="gap"></span>
      ${[0.25,0.5,1].map(s=>`<button data-rs="${s}">${s===1?'보통':s===0.5?'1/2 느리게':'1/4 느리게'}</button>`).join('')}<span class="gap"></span>
      <button data-rv="save">💾 이 장면 저장</button><button data-rv="seg">💾 구간 전체 저장</button><button data-rv="close">닫기 (실시간으로)</button></div>
      <div class="ctl jmp">${jumpBtns()}</div>
      <div class="note">스페이스: 재생/멈춤 · ←/→: 한 장씩 · Esc: 닫기 · 최근 ${secTxt(bufSec())}을 담아 둡니다 · 판독 중에도 카메라는 계속 녹화합니다</div></div>`;
  document.body.appendChild(ov);
  cv=ov.querySelector('canvas');cctx=cv.getContext('2d');shown=-1;
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}
  updUi();show(pos);
}
/* 바로 가기: 경기(품새·회전) 시작 지점, 30초 전, 처음 */
let SM=[];
function jumpBtns(){
  if(!snap)return '';const t0=snap[0].t;
  SM=marks.filter(m=>m.kind==='start'&&m.t>=t0-1000).slice(-3);
  return `<span class="lbl">바로 가기</span>${SM.map((m,i)=>`<button data-rv="m${i}">▶ ${esc(m.label||'시작')}</button>`).join('')}
    <button data-rv="b30">⏪ 30초 전</button><button data-rv="first">⏮ 맨 처음</button>`;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function idxAt(t){if(!snap)return 0;let i=0;while(i<snap.length-1&&snap[i].t<t)i++;return i;}
/* 지금 보는 장면이 들어 있는 구간: 시작 표시(1초 앞) ~ 그만 표시(2초 뒤) */
function segOf(p){
  const t=snap[p].t;const st=marks.filter(m=>m.kind==='start'&&m.t<=t+1500).pop();
  const a=st?Math.max(snap[0].t,st.t-1000):snap[0].t;
  const en=marks.find(m=>m.kind==='stop'&&m.t>(st?st.t:a));const b=en?Math.min(snap[snap.length-1].t,en.t+2000):snap[snap.length-1].t;
  return [idxAt(a),Math.max(idxAt(a),idxAt(b))];
}
function closeOv(){
  playing=false;clearTimeout(playT);
  if(ov)ov.remove();ov=null;snap=null;cv=null;
  try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}
}
async function show(i){
  if(!snap)return;i=Math.max(0,Math.min(snap.length-1,i));pos=i;
  const r=ov&&ov.querySelector('[data-rr]');if(r&&Number(r.value)!==i)r.value=i;
  const lbl=ov&&ov.querySelector('[data-rt]');
  if(lbl){const back=(snap[snap.length-1].t-snap[i].t)/1000;const d=new Date(snap[i].wall);
    lbl.textContent=`${d.toTimeString().slice(0,8)} · ${back<0.05?'마지막 장면':back.toFixed(1)+'초 전'}`;}
  if(drawing){shown=-2;return;}
  drawing=true;
  try{const bm=await createImageBitmap(snap[i].b);
    if(cv){if(cv.width!==bm.width||cv.height!==bm.height){cv.width=bm.width;cv.height=bm.height;}cctx.drawImage(bm,0,0);}
    bm.close&&bm.close();shown=i;}catch(e){}
  drawing=false;
  if(shown===-2)show(pos);
}
function updUi(){
  if(!ov)return;
  ov.querySelectorAll('[data-rs]').forEach(b=>b.classList.toggle('on',Number(b.dataset.rs)===speed));
  const p=ov.querySelector('[data-rv=play]');if(p){p.textContent=playing?'⏸ 멈춤':'▶ 재생';p.classList.toggle('on',playing);}
  const s=ov.querySelector('[data-rv=save]');if(s){s.textContent=saving?'저장 중…':'💾 이 장면 저장';s.disabled=saving;}
  const s2=ov.querySelector('[data-rv=seg]');if(s2){if(!saving)s2.textContent='💾 구간 전체 저장';s2.disabled=saving;}
}
function tick(){
  if(!playing||!snap)return;
  if(pos>=snap.length-1){playing=false;updUi();return;}
  const dt=(snap[pos+1].t-snap[pos].t)/speed;
  show(pos+1);playT=setTimeout(tick,Math.max(10,dt));
}
function seekSec(s){if(!snap)return;const t=snap[pos].t+s*1000;let i=pos;
  if(s<0){while(i>0&&snap[i].t>t)i--;}else{while(i<snap.length-1&&snap[i].t<t)i++;}show(i);}
function act(v){
  if(v==='play'){playing=!playing;if(playing){if(pos>=snap.length-1)pos=0;tick();}else clearTimeout(playT);updUi();return;}
  if(v==='close'){closeOv();return;}
  if(v==='save'){saveClip();return;}
  if(v==='seg'){const [a,b]=segOf(pos);saveClip(a,b);return;}
  if(/^m\d$/.test(v)){const m=SM[Number(v.slice(1))];if(m){playing=false;clearTimeout(playT);updUi();show(idxAt(m.t-1000));}return;}
  if(v==='b30'){playing=false;clearTimeout(playT);updUi();show(idxAt(snap[snap.length-1].t-30000));return;}
  if(v==='first'){playing=false;clearTimeout(playT);updUi();show(0);return;}
  playing=false;clearTimeout(playT);updUi();
  if(v==='f-1')show(pos-1);else if(v==='f1')show(pos+1);else seekSec(Number(v));
}

/* ---------- 이 장면 저장: 앞뒤 5초를 영상 파일(webm)로 ---------- */
async function saveClip(A,B){
  if(saving||!snap)return;const S0=snap;
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){alert('이 브라우저에서는 영상 저장을 할 수 없습니다. 크롬이나 엣지를 써 주세요.');return;}
  saving=true;updUi();
  let a=pos,b=pos;
  if(A!=null){a=A;b=B;}else{const c=snap[pos].t;while(a>0&&snap[a-1].t>=c-SAVE_HALF*1000)a--;while(b<snap.length-1&&snap[b+1].t<=c+SAVE_HALF*1000)b++;}
  const part=snap.slice(a,b+1),wall0=snap[pos].wall,segSave=A!=null;
  if(segSave)note(`구간 ${Math.round((part[part.length-1].t-part[0].t)/1000)}초를 저장합니다. 영상 길이만큼 시간이 걸리며, 판독 화면을 닫아도 계속 저장합니다`);
  try{
    const first=await createImageBitmap(part[0].b);const ec=document.createElement('canvas');ec.width=first.width;ec.height=first.height;const ex=ec.getContext('2d');ex.drawImage(first,0,0);first.close&&first.close();
    const st=ec.captureStream(FPS);const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    const rec=new MediaRecorder(st,mt?{mimeType:mt,videoBitsPerSecond:4e6}:{});const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    const done=new Promise(r=>rec.onstop=r);rec.start(500);
    for(let i=0;i<part.length;i++){const bm=await createImageBitmap(part[i].b);ex.drawImage(bm,0,0);bm.close&&bm.close();
      const s=ov&&ov.querySelector(segSave?'[data-rv=seg]':'[data-rv=save]');if(s)s.textContent=`저장 중… ${Math.round(i/part.length*100)}%`;
      const dt=i<part.length-1?part[i+1].t-part[i].t:1000/FPS;await new Promise(r=>setTimeout(r,dt));}
    rec.stop();await done;st.getTracks().forEach(t=>t.stop());
    const blob=new Blob(chunks,{type:'video/webm'});
    const d=new Date(wall0),p2=n=>String(n).padStart(2,'0');
    const name=`판독${segSave?'구간':''}_${COURT?COURT+'코트_':''}${APPNAME}_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}.webm`;
    await saveBlob(blob,name);
  }catch(e){alert('영상을 저장하지 못했습니다: '+(e&&e.message||e));}
  saving=false;updUi();
}
async function saveBlob(blob,name){
  if(F&&F.local&&F.app){
    try{const r=await fetch('/'+F.app+'/api/save?folder=video&name='+encodeURIComponent(name),{method:'POST',body:blob});const j=await r.json();
      if(j&&j.ok){note(`노트북 「판독영상」 폴더에 저장했습니다: ${name}`);return;}}catch(e){}
  }
  try{const dl=await (window.KSC||window.claude).use('downloads');if(dl){await dl.save({filename:name,data:new Uint8Array(await blob.arrayBuffer())});return;}}catch(e){}
  const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},4000);
  note('영상을 내려받았습니다: '+name);
}
function note(m){try{const t=g('toast');if(typeof t==='function'){t(m);return;}}catch(e){}}

/* ---------- 입력 ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-rp]');
  if(a&&a.tagName!=='SELECT'){const v=a.dataset.rp;e.preventDefault();e.stopPropagation();
    if(v==='on')start(LS.get('ks_rp_cam')||'');else if(v==='off'){stop();box.innerHTML='';drawBox();}else if(v==='hide'){err='';drawBox();}else if(v==='open')openOv();return;}
  const b=e.target.closest('[data-rv]');if(b&&ov){e.preventDefault();act(b.dataset.rv);return;}
  const s=e.target.closest('[data-rs]');if(s&&ov){speed=Number(s.dataset.rs);updUi();return;}
},true);
document.addEventListener('change',e=>{if(e.target.matches&&e.target.matches('select[data-rp=cam]')){LS.set('ks_rp_cam',e.target.value);start(e.target.value);}},true);
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('[data-rr]')&&ov){playing=false;clearTimeout(playT);updUi();show(Number(e.target.value));}},true);
document.addEventListener('keydown',e=>{

  if(e.key===' '){e.preventDefault();act('play');}else if(e.key==='ArrowLeft'){e.preventDefault();act(e.shiftKey?'-3':'f-1');}
