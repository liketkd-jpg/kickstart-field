/* 지난번에 켜 두었으면 운영석을 열 때 자동으로 다시 켬 (현장 모드 노트북) */
(()=>{let n=0;const t=setInterval(()=>{n++;if(stream||n>20||LS.get('ks_rp_on')!=='1'||!F){clearInterval(t);return;}
  if(isOperator()){clearInterval(t);start(LS.get('ks_rp_cam')||'');}},700);})();
drawBox();
window.KS_REPLAY={start,stop,open:openOv,close:closeOv,frames:()=>frames.length,act,state:()=>({on:!!stream,frames:frames.length,ov:!!ov,pos,saving}),video:()=>video,stream:()=>stream,box:()=>box,bufSec,marks:()=>marks.slice(),seg:()=>snap?segOf(pos):null,pos:()=>pos,snapLen:()=>snap?snap.length:0,saveSeg:()=>{if(snap){const [a,b]=segOf(pos);return saveClip(a,b);}}};
})();
</script><script>/* ===== 구령 음성: 인터넷 없이도 나오게 (품새·격파 공통, 겨루기는 녹음 신호음이라 그대로) =====
   원인: 기기 음성 중 「Google 한국의」「Microsoft … Online」은 인터넷으로 만드는 목소리라 현장 모드(인터넷 없음)에서 소리가 안 납니다.
   1) 현장 모드이거나 인터넷이 끊기면 노트북 안에 들어 있는 한국어 목소리(예: Microsoft Heami)를 먼저 씁니다.
   2) 노트북 프로그램 폴더의 「구령음성」 폴더에 녹음 파일(준비.mp3 등)을 넣으면 그 파일을 가장 먼저 씁니다.
   (차렷·경례 단추는 대회 운영 요청으로 뺐습니다) */
(function(){
const g=n=>{try{return (0,eval)(n);}catch(e){return undefined;}};
if(typeof g('sayCmd')!=='function'||!g('VOICE_TXT'))return;
const F=window.KS_FIELD||null;
const OFFLINE=()=>!!F||!navigator.onLine;

/* ---------- 1) 목소리 고르기: 오프라인이면 기기 안 목소리만 ---------- */
const MALE=/InJoon|Minsu|Hyunsu|Jinho|Bongjin|Gookmin|Male|남성|남자/i;
function pick(){
  try{const vs=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));if(!vs.length)return null;
    const local=vs.filter(v=>v.localService!==false&&!/Online|Google|Natural/i.test(v.name));
    if(OFFLINE())return local.find(v=>MALE.test(v.name))||local[0]||null;
    return vs.find(v=>MALE.test(v.name))||local[0]||vs[0];}catch(e){return null;}
}
window.koVoice=pick;
function hasLocalKo(){try{return speechSynthesis.getVoices().some(v=>/^ko/i.test(v.lang)&&v.localService!==false&&!/Online|Google|Natural/i.test(v.name));}catch(e){return false;}}



/* ---------- 2) 노트북 「구령음성」 폴더의 녹음 파일 ---------- */
const FILES={ready:['준비'],start:['시작'],stop:['바로','쉬어'],blue:['청승','청 승'],red:['홍승','홍 승']};
let LIST=null;   /* 폴더에 있는 파일 이름 → 주소 */
async function loadList(){
  if(!F)return;
  try{const r=await fetch('/voice/list',{cache:'no-store'});const j=await r.json();LIST={};(j.files||[]).forEach(f=>{LIST[f.base]=f.url;});}catch(e){LIST={};}
}
loadList();setInterval(loadList,30000);
/* 소리 안정화 모듈이 「구령음성」 폴더 파일을 미리 읽어 두도록 */
const PREV_URLS=window.KS_VOICE_URLS;
window.KS_VOICE_URLS=()=>[...(LIST?Object.values(LIST):[]),...(typeof PREV_URLS==='function'?(PREV_URLS()||[]):[])];
function fileSeq(key){
  if(!LIST)return null;const want=FILES[key];if(!want)return null;
  if(key==='blue'||key==='red'){const u=LIST[want[0]]||LIST[want[1]];return u?[u]:null;}
  const out=want.map(n=>LIST[n]).filter(Boolean);
  return out.length&&LIST[want[0]]?out:null;
}
let PLAY=null;
function playSeq(urls,key){
  if(PLAY){try{PLAY.pause();}catch(e){}PLAY=null;}
  try{window.KS_AUDIO&&KS_AUDIO.stopAll();}catch(e){}
  const one=i=>{if(i>=urls.length)return;const nx=()=>setTimeout(()=>one(i+1),key==='stop'?4000:200);
    if(window.KS_AUDIO&&KS_AUDIO.play(urls[i],{onended:nx}))return;
    const a=new Audio(urls[i]);PLAY=a;a.volume=1;a.onended=nx;a.play().catch(()=>{});};
  one(0);
}
const PREV=window.KS_VOICE;
window.KS_VOICE=function(key){
  const seq=F?fileSeq(key):null;
  if(seq){playSeq(seq,key);return true;}
  if(typeof PREV==='function'&&PREV(key))return true;     /* 온라인: 앱에 올린 녹음 파일 */
  if(OFFLINE()&&!hasLocalKo()){warnNoVoice();}
  return false;
};
let WARNED=0;
function warnNoVoice(){
  if(Date.now()-WARNED<20000)return;WARNED=Date.now();
  try{g('toast')('이 노트북에는 인터넷 없이 쓰는 한국어 목소리가 없습니다. 「구령음성」 폴더에 녹음 파일을 넣거나, Windows 설정 › 시간 및 언어 › 음성에서 한국어 음성을 추가해 주세요.');}catch(e){}
}

/* 「차렷·경례」 단추는 쓰지 않습니다 (대회 운영 요청: 준비 → 5초 뒤 시작, 바로 → 4초 뒤 쉬어만) */
/* ---------- 소리 확인 정보 (대회 설정 화면의 「지금 소리 확인」 옆) ---------- */
window.KS_VOICEINFO=()=>{try{const vs=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)),v=pick();
  return {voices:vs.map(x=>x.name+(x.localService===false?' (인터넷)':'')),use:v?v.name:'',files:LIST?Object.keys(LIST):[],offline:OFFLINE()};}catch(e){return null;}};
})();
</script><script>/* ===== 경기 소리 안정화 (품새·격파·겨루기 공통) =====
   1) HDMI·모니터 스피커는 소리가 잠깐 멈추면 절전으로 꺼졌다가 다음 소리 앞부분을 잘라 먹습니다("띠디디", "준…비").
      → 들리지 않을 만큼 아주 작은 소리를 계속 흘려 소리 장치가 꺼지지 않게 합니다.
   2) 녹음 파일·신호음은 미리 읽어(디코딩) 두었다가 누르는 즉시 같은 소리 통로로 냅니다.
   3) 기기 음성(TTS)은 첫 구령이 늦게 나오지 않도록 미리 깨워 둡니다.
   4) 브라우저는 화면을 한 번 눌러야 소리를 허락하므로, 전광판에서 소리가 막혀 있으면 「🔊 소리 켜기」 단추를 보여 줍니다. */
(function(){
if(window.KS_AUDIO)return;
const AC=window.AudioContext||window.webkitAudioContext;
const g=n=>{try{return (0,eval)(n);}catch(e){return undefined;}};
let ctx=null,master=null,keep=null;
function C(){
  if(!AC)return null;
  if(!ctx){try{ctx=new AC({latencyHint:'interactive'});}catch(e){try{ctx=new AC();}catch(_){return null;}}
    master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination);
    ctx.onstatechange=()=>{if(ctx.state==='running')startKeep();refreshBtn();};}
  if(ctx.state==='suspended'||ctx.state==='interrupted'){try{ctx.resume().catch(()=>{});}catch(e){}}
  return ctx;
}
const running=()=>!!ctx&&ctx.state==='running';
/* 1) 소리 장치 깨워 두기: -80dB 정도의 아주 작은 잡음(사람 귀에는 들리지 않음) */
function startKeep(){
  const c=C();if(!c||keep||c.state!=='running')return;
  try{const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*0.0001;
    const s=c.createBufferSource();s.buffer=b;s.loop=true;s.connect(c.destination);s.start();keep=s;}catch(e){}
}
/* 2) 미리 읽어 둔 소리 재생 */
const CACHE=new Map();
function buf(url){
  if(!url)return Promise.reject(new Error('no url'));
  if(CACHE.has(url))return CACHE.get(url);
  const c=C();if(!c)return Promise.reject(new Error('no audio'));
  const p=fetch(url).then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.arrayBuffer();})
    .then(ab=>new Promise((res,rej)=>{const q=c.decodeAudioData(ab,res,rej);if(q&&q.then)q.then(res,rej);}));
  CACHE.set(url,p);p.catch(()=>CACHE.delete(url));
  if(CACHE.size>60){const k=CACHE.keys().next().value;CACHE.delete(k);}
  return p;
}
let NOWS=[];
function stopAll(){NOWS.forEach(s=>{try{s.stop();}catch(e){}});NOWS=[];}
/* 재생할 수 있으면 true. 소리가 아직 막혀 있으면 false → 앱이 원래 방식으로 재생 */
function play(url,opt){
  opt=opt||{};if(!url||url==='null')return false;const c=C();if(!c||!running())return false;
  buf(url).then(b=>{const s=c.createBufferSource();s.buffer=b;const v=c.createGain();v.gain.value=opt.vol==null?1:opt.vol;s.connect(v);v.connect(master);
    s.onended=()=>{NOWS=NOWS.filter(x=>x!==s);if(opt.onended)opt.onended();};
    s.start(c.currentTime+0.03);NOWS.push(s);startKeep();})
   .catch(()=>{try{const a=new Audio(url);a.volume=1;if(opt.onended)a.onended=opt.onended;a.play().catch(()=>{});}catch(e){}});
  return true;
}
function preload(url){if(url&&C())buf(url).catch(()=>{});}
/* 3) 기기 음성 미리 깨우기 */
let TTSW=0;
function warmTTS(){try{const ss=window.speechSynthesis;if(!ss||Date.now()-TTSW<60000||ss.speaking||ss.pending)return;TTSW=Date.now();
  const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='ko-KR';ss.speak(u);}catch(e){}}

/* 앱별 연결 ---------------------------------------------------------- */
function hookKyorugi(){
  /* 겨루기 신호음(경적·부저): 미리 읽어 두고 바로 재생 */
  const DEF=g('DEF_SND'),FILE=g('SND_FILE');
  if(!DEF||typeof window.playFile!=='function'||window.playFile.__ks)return;
  const old=window.playFile;
  const nf=function(key){const d=(FILE&&FILE[key])||DEF[key];if(!d)return false;if(play(d))return true;return old(key);};
  nf.__ks=1;window.playFile=nf;
  if(typeof window.actx==='function'){const oa=window.actx;window.actx=function(){return C()||oa();};}
  const pre=()=>{Object.values(DEF).forEach(preload);if(FILE)Object.values(FILE).forEach(u=>u&&preload(u));};
  pre();setInterval(pre,60000);
}
function preloadVoices(){try{if(typeof window.KS_VOICE_URLS==='function')(window.KS_VOICE_URLS()||[]).forEach(p=>Promise.resolve(p).then(preload,()=>{}));}catch(e){}}

/* 4) 소리 허락 받기 */
function unlock(){const c=C();if(!c)return;startKeep();warmTTS();preloadVoices();hookKyorugi();refreshBtn();}
['pointerdown','touchstart','keydown','click'].forEach(t=>addEventListener(t,unlock,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx)C();});
/* 바로 시도 (현장 모드 등 자동 재생이 허용된 경우) */
setTimeout(()=>{C();if(running())unlock();},300);
setInterval(()=>{if(running()){startKeep();preloadVoices();}},30000);
hookKyorugi();

/* 전광판에서 소리가 막혀 있으면 단추 표시 */
let BTN=null;
function isDisp(){return document.body&&document.body.classList.contains('disp');}
function refreshBtn(){
  const need=isDisp()&&!running()&&!document.querySelector('.tapv');
  if(need&&!BTN){BTN=document.createElement('button');BTN.type='button';BTN.className='ksaudio';BTN.setAttribute('data-noi18n','');
    BTN.textContent='🔊 소리 켜기 (한 번 눌러 주세요)';BTN.addEventListener('click',e=>{e.stopPropagation();unlock();setTimeout(refreshBtn,200);});document.body.appendChild(BTN);}
  else if(!need&&BTN){BTN.remove();BTN=null;}
}
setInterval(refreshBtn,1500);

window.KS_AUDIO={ctx:C,play,preload,stopAll,unlocked:running,keepAlive:startKeep,warmTTS,unlock};
})();

async function pickVideoConfig(){

  else if(S.step==='send'){const R0=S.res||{rows:[]},med=R0.rows.filter(r=>r.kind==='medal'),tm=R0.rows.filter(r=>r.kind==='team'),c=n=>med.filter(r=>r.rank===n).length;

      <div class="rgrow"><a class="btn primary" href="${SITE}#admin" target="_blank" rel="noopener">접수 홈페이지 열기</a><button type="button" class="btn" data-rgact="x">닫기</button></div>`
    :`<p><b>${esc(S.comp.name)}</b><br><span class="small muted">${SP[sp]} 결과</span></p>
      ${R0.rows.length?`<div class="rgk"><div><b>${c(1)}</b><span>금</span></div><div><b>${c(2)}</b><span>은</span></div><div><b>${c(3)}</b><span>동</span></div></div>
      <p class="small muted">입상 ${med.length}건${tm.length?` + 팀 종합 ${tm.length}건`:''}을 보냅니다. 이 대회 ${SP[sp]} 결과를 전에 보냈다면 새 결과로 바뀝니다. 「시상」 설정의 주최·대표 이름도 상장에 함께 쓰입니다.</p>

  else if(S.step==='draw'){const D=S.draw||{divs:[]},t=D.divs.filter(x=>x.kind==='t').length,o=D.divs.length-t,ppl=D.divs.reduce((a,x)=>a+x.n,0);
    b=`<p><b>${esc(S.comp.name)}</b><br><span class="small muted">${esc(S.comp.date)}</span></p>
      ${D.divs.length?`<div class="rgk"><div><b>${D.divs.length}</b><span>부문</span></div><div><b>${t}</b><span>토너먼트 대진</span></div><div><b>${o}</b><span>출전 순서</span></div></div>
      <p class="small muted">선수 ${ppl}명의 대진표·출전 순서를 올립니다. 누구나 홈페이지 「대회 안내」에서 볼 수 있고, 접수한 지도자 첫 화면에 「대진표가 올라왔습니다」 알림이 뜹니다. 전에 올린 ${SP[sp]} 대진은 새것으로 바뀝니다. 경기가 진행된 뒤 다시 보내면 이긴 선수도 함께 보입니다.</p>
      ${S.sent?`<p class="small"><b>✅ ${S.sent.divs}개 부문을 올렸습니다.</b> <a href="${SITE}#draw-${esc(S.comp.id)}" target="_blank" rel="noopener">홈페이지에서 보기 ↗</a></p>`:''}
      <div class="rgrow"><button type="button" class="btn" data-rgact="back">← 다른 대회</button><button type="button" class="btn primary" data-rgact="drawsend" ${S.busy?'disabled':''}>${S.busy?'보내는 중…':S.sent?'다시 보내기':`${D.divs.length}개 부문 보내기`}</button></div>`
      :`<p class="muted">아직 부문이 없습니다. 명단을 넣고 대진(순서)을 만든 뒤 보내 주세요.</p><div class="rgrow"><button type="button" class="btn" data-rgact="back">← 다른 대회</button></div>`}`;}
  else if(S.step==='preview'){const E=S.E||[],paid=E.filter(e=>e.status==='paid').length,use=S.paidOnly?E.filter(e=>e.status==='paid'):E,n=use.reduce((s,e)=>s+e.athletes.length,0);
    b=`<p><b>${esc(S.comp.name)}</b><br><span class="small muted">${esc(S.comp.date)}</span></p>
      ${E.length?`<div class="rgk"><div><b>${E.length}</b><span>${SP[sp]} 접수</span></div><div><b>${paid}</b><span>입금 확인</span></div><div><b>${E.length-paid}</b><span>입금 전</span></div></div>
      <label class="rgchk"><input type="checkbox" data-rgact="paidOnly" ${S.paidOnly?'checked':''}> 입금 확인된 접수만 가져오기</label>
      ${(()=>{const need=use.filter(e=>/^(자유|태권체조|팀대항 종합경연)$/.test((e.f&&e.f.type)||'')),got=use.filter(e=>e.music&&e.music.path);return sp==='poomsae'&&(need.length||got.length)?`<p class="small">🎵 음원 <b>${got.length}/${need.length}곡</b> 제출됨 · ${S.mode==='music'?'「음원 받기」를 누르면':'가져올 때'} 이 노트북 음악 폴더에 함께 담아 팀(선수) 순서에 바로 틀 수 있습니다.</p>`:'';})()}
      ${S.prog?`<p class="small"><b>${esc(S.prog)}</b></p>`:''}
      ${S.mode==='music'?`<div class="rgrow"><button type="button" class="btn" data-rgact="back">← 다른 대회</button><button type="button" class="btn primary" data-rgact="music" ${use.some(e=>e.music)&&!S.busy?'':'disabled'}>${S.busy?'받는 중…':`🎵 음원 ${use.filter(e=>e.music).length}곡 받기`}</button></div>`
      :`<p class="small muted">「가져오기」를 누르면 엑셀 파일을 올린 것과 똑같이 ${use.length}건(선수 ${n}명)을 읽어 부문을 만듭니다.</p>
      <div class="rgrow"><button type="button" class="btn" data-rgact="back">← 다른 대회</button><button type="button" class="btn primary" data-rgact="go" ${use.length&&!S.busy?'':'disabled'}>${S.busy?'가져오는 중…':`${use.length}건 가져오기`}</button></div>`}`
      :`<p class="muted">아직 ${SP[sp]} 접수가 없습니다.</p><div class="rgrow"><button type="button" class="btn" data-rgact="back">← 다른 대회</button></div>`}`;}
  BOX.innerHTML=`<div class="rgbox"><div class="rghd"><b>${S.mode==='send'?'🌐 결과를 접수 홈페이지로 보내기':S.mode==='draw'?'📋 대진표를 접수 홈페이지로 보내기':S.mode==='music'?'🎵 접수 홈페이지에서 음원 받기':'🌐 접수 홈페이지에서 가져오기'}</b><button type="button" class="btn" data-rgact="x" aria-label="닫기">✕</button></div>
    ${S.err?`<div class="rgerr" role="alert">${esc(S.err)}</div>`:''}${b}
    <div class="rgft small muted">${A?`${esc(A.email)} 로그인 · <button type="button" class="rglink" data-rgact="logout">로그아웃</button> · `:''}<a href="${SITE}" target="_blank" rel="noopener">접수 홈페이지 열기</a></div></div>`;
  const e=BOX.querySelector('#rgE');if(e&&!e.value)e.focus();else{const p=BOX.querySelector('#rgP');if(p)p.focus();}}
async function loadList(){S.busy=true;S.err='';draw();try{S.L=await comps();S.step='list';}catch(e){S.err=e.message;}S.busy=false;draw();if(S.deep&&S.L.length)pickDeep();}
/* 접수 홈페이지 「경기 앱으로 보내기」: 주소 #ksreg-대회번호 로 열리면 그 대회 명단을 바로 보여 줍니다 */
async function pickDeep(){const id=S.deep;S.deep=null;const c=S.L.find(x=>x.id===id);if(!c){S.err='접수 홈페이지에서 보낸 대회를 이 종목 목록에서 찾지 못했습니다';draw();return;}
  S.comp=c;S.busy=true;S.err='';draw();try{S.E=await roster(c.id);S.step='preview';}catch(err){S.err=/관리자/.test(err.message)?'대회 본부(관리자) 계정만 명단을 가져올 수 있습니다. 관리자 계정으로 다시 로그인해 주세요.':err.message;if(!A)S.step='login';}
  S.busy=false;draw();}
function deepCheck(first){const m=(location.hash||'').match(/^#ksreg-([0-9A-Za-z_-]+)/);if(!m)return;S.deep=m[1];
  setTimeout(()=>{try{location.hash='admin-players';}catch(e){}setTimeout(()=>open_(),first?600:200);},first?700:50);}
deepCheck(true);addEventListener('hashchange',()=>deepCheck(false));
document.addEventListener('submit',async e=>{if(!e.target||e.target.id!=='rgLogin')return;e.preventDefault();e.stopPropagation();
  S.email=document.getElementById('rgE').value.trim();const pw=document.getElementById('rgP').value;S.busy=true;S.err='';draw();try{await login(S.email,pw);S.busy=false;S.step='list';await loadList();}
  catch(err){S.busy=false;S.err=err.message;draw();}},true);
document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-rgact]');if(!b)return;const a=b.dataset.rgact;
  if(a==='open'){e.preventDefault();open_();return;}
  if(a==='sendRes'){e.preventDefault();open_('send');return;}
  if(a==='sendDraw'){e.preventDefault();open_('draw');return;}
  if(a!=='paidOnly'){e.preventDefault();e.stopPropagation();}
  if(a==='x')close_();
  else if(a==='logout'){A=null;saveA();S.step='login';S.err='';draw();}
  else if(a==='back'){S.step='list';S.E=null;S.sent=null;S.err='';draw();}
  else if(a==='paidOnly'){S.paidOnly=b.checked;draw();}
  else if(a==='pick'&&S.mode==='send'){S.comp=S.L.find(c=>c.id===b.dataset.id);S.sent=null;S.err='';
    try{S.res=window.AW&&AW.results?AW.results():{rows:[]};}catch(err){S.res={rows:[]};}S.step='send';draw();}
  else if(a==='pick'&&S.mode==='draw'){S.comp=S.L.find(c=>c.id===b.dataset.id);S.sent=null;S.err='';try{S.draw=drawData();}catch(err){S.draw={divs:[]};S.err=err.message;}S.step='draw';draw();}
  else if(a==='drawsend'){S.busy=true;S.err='';draw();
    try{S.draw=drawData();S.sent=await publishDraws(S.comp.id,S.draw);try{localStorage.setItem('ks_draw_comp_'+sport(),S.comp.id);}catch(e){}say(`대진표 ${S.sent.divs}개 부문을 접수 홈페이지에 올렸습니다`);}
    catch(err){S.err=/관리자/.test(err.message)?'대회 본부(관리자) 계정만 대진표를 올릴 수 있습니다.':/publish_draws|function|schema cache/i.test(err.message)?'홈페이지 데이터베이스에 대진표 기능이 아직 없습니다. Supabase에서 10단계 SQL(schema10.sql)을 실행해 주세요.':netErr(err);}
    S.busy=false;draw();}
  else if(a==='send'){S.busy=true;S.err='';draw();
    try{S.sent=await publish(S.comp.id,S.res);say(`결과 ${S.sent.rows}건을 접수 홈페이지로 보냈습니다`);}catch(err){S.err=/관리자/.test(err.message)?'대회 본부(관리자) 계정만 결과를 보낼 수 있습니다.':/publish_results|function/i.test(err.message)?'홈페이지 데이터베이스에 결과 기능이 아직 없습니다. Supabase에서 3단계 SQL을 실행해 주세요.':err.message;}
    S.busy=false;draw();}
  else if(a==='pick'){S.comp=S.L.find(c=>c.id===b.dataset.id);S.busy=true;S.err='';draw();
    try{S.E=await roster(S.comp.id);S.step='preview';}catch(err){S.err=/관리자/.test(err.message)?'대회 본부(관리자) 계정만 명단을 가져올 수 있습니다. 관리자 계정으로 다시 로그인해 주세요.':err.message;if(!A)S.step='login';}
    S.busy=false;draw();}
  else if(a==='go'){const E=S.paidOnly?S.E.filter(x=>x.status==='paid'):S.E;S.busy=true;draw();
    try{const f=toFile(rows(sport(),E),`${S.comp.name}_${SP[sport()]}_접수명단.xlsx`);close_();await feed(f);say(`접수 홈페이지에서 ${E.length}건을 가져왔습니다`);
      const nm=E.filter(e=>e.music&&e.music.path).length;
      if(sport()==='poomsae'&&nm&&window.LMUS)setTimeout(()=>{say(`음원 ${nm}곡을 이 노트북에 받는 중…`);fetchMusic(E).then(r=>say(`음원 ${r.n}곡을 이 노트북 음악 폴더에 담았습니다${r.fail?` (${r.fail}곡은 받지 못함)`:''}`)).catch(err=>say('음원을 받지 못했습니다: '+netErr(err)));},1500);}
    catch(err){S.busy=false;S.err=err.message;draw();}}
  else if(a==='music'){const E=(S.paidOnly?S.E.filter(x=>x.status==='paid'):S.E);S.busy=true;S.prog='음원을 받는 중…';draw();
    try{const r=await fetchMusic(E,(k,n)=>{S.prog=`음원 ${k}/${n}곡 받는 중…`;draw();});S.busy=false;S.prog='';close_();say(`음원 ${r.n}곡을 이 노트북 음악 폴더에 담았습니다${r.fail?` (${r.fail}곡은 받지 못함)`:''}`);}
    catch(err){S.busy=false;S.prog='';S.err=netErr(err);draw();}}
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&BOX)close_();});

/* 「📋 대진표 홈페이지로」 단추: 대진표 PDF 단추 옆(품새·겨루기), 코트 나누기 칸(격파) */

  const kc=document.querySelector('details.kscourt');if(kc&&!pdf&&!document.querySelector('.ksdrawrow'))kc.insertAdjacentHTML('beforebegin','<div class="row ksdrawrow" style="margin-bottom:10px;gap:8px"><button class="btn" type="button" data-rgact="sendDraw">📋 출전 순서 홈페이지로 보내기</button><span class="small muted">누구나 접수 홈페이지 「대회 안내」에서 볼 수 있습니다 (인터넷 필요)</span></div>');}
new MutationObserver(()=>{try{attachDraw();}catch(e){}}).observe(document.documentElement,{subtree:true,childList:true});

</script><script>/* ===== KICKSTART UP 브랜드 전광판 (품새·겨루기·격파 공통) =====

</script><script>/*@@HQSEND*//* ===== 본부로 보내기: 자동 백업 파일 · 상장 자동 출력 (현장 모드, 품새·겨루기·격파 공통) =====
   1) 대회 데이터가 바뀌면 백업 파일(.json)을 「대회결과\자동저장」에 덮어써 저장 → 본부가 모아 Supabase에 올립니다.
   2) 부문(조)의 경기가 모두 끝나면 그 부문 입상자의 상장 그림을 만들어 「…상장….cert.json」으로 저장 → 본부가 모아 프린터로 출력합니다.

(function(){
if(window.KS_HQSEND)return;
const g=n=>{try{return (0,eval)(n);}catch(e){return undefined;}};
const FLD=()=>!!(window.KS_FIELD&&window.KS_FIELD.status);
const opRoute=()=>{const h=(location.hash||'').replace('#','');return h===''||/^admin/.test(h);};
const APPK=typeof g('SHEETS')!=='undefined'?'poomsae':typeof g('KINDS')!=='undefined'?'kyorugi':'gyeokpa';
const ST={bsig:'',bat:0,cat:0,cn:0,busy:false,err:''};
const comp=()=>((g('SET')||(()=>({})))()||{}).name||'';
const LSK=()=>'ks_certsent_'+APPK+'_'+comp();
let SENT={},SENTK='';
const sentLoad=()=>{if(SENTK===LSK())return;SENTK=LSK();try{SENT=JSON.parse(localStorage.getItem(SENTK)||'{}')||{};}catch(e){SENT={};}};

const safe=s=>String(s||'').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').trim().slice(0,70);

/* 부문이 끝났는지: 남은 경기가 없고, 마지막 단계(결선·결승)까지 끝남 */
function finished(d){
  try{
    if(APPK==='kyorugi'){const ms=g('matchesOf')(d)||[];return ms.length>0&&ms.every(m=>m.res);}
    const cs=g('callsOf')(d)||[],done=g('callDone');if(!cs.length||!cs.every(c=>done(c)))return false;
    if(APPK==='poomsae'&&d.format!=='tournament'){const st=g('curStage')(d);return st&&st.key==='final';}
    if(APPK==='gyeokpa'){const sts=g('stagesOf')(d)||[];return sts.some(s=>s.key==='final');}

  }catch(e){return false;}
}
let CV=null;

  const AW=window.AW;if(!AW||!AW.medalists||!AW.drawCert||!AW.medalCert)return;sentLoad();
  let list=[];try{list=AW.medalists()||[];}catch(e){return;}
  const by=new Map();list.forEach(x=>{const id=x.div&&x.div.id;if(!id)return;if(!by.has(id))by.set(id,{d:x.div,rows:[]});by.get(id).rows.push(x);});
  for(const [id,v] of by){
    if(!v.rows.some(x=>x.rank===1)||!finished(v.d))continue;

      await AW.drawCert(ctx,AW.medalCert(x),no,seal);pages.push(CV.toDataURL('image/jpeg',.82));await new Promise(r=>setTimeout(r,0));}
    const job={kind:'cert',v:1,app:APPK,comp:comp(),court:(window.KS_FIELD&&KS_FIELD.court)||'',div:v.d.name,sig,at:Date.now(),
      people:v.rows.map(x=>({rank:x.rank,name:x.name,team:x.team})),pages,again:!!SENT[id]};
    await post(`${base()}_상장_${safe(v.d.name)}.cert.json`,new Blob([JSON.stringify(job)],{type:'application/json'}));
    SENT[id]=sig;sentSave();ST.cat=Date.now();
  }
}
async function tick(){if(!FLD()||ST.busy||!opRoute())return;const S=g('S');if(!S||!S.divs)return;ST.busy=true;
  try{await backup();await certs();ST.err='';}catch(e){ST.err=String(e&&e.message||e);}finally{ST.busy=false;}}
setInterval(tick,8000);setTimeout(tick,4000);
window.KS_HQSEND={tick,state:ST};
})();
</script><script>/*@@SETSHELL*//* ===================== 설정·백업 화면 정리 (카드 · 요약판 · 대회 전 확인) =====================

  ['basic','🏷️','대회 기본'],['format','⚖️','경기 방식'],['poomsae','📜','품새 지정'],['comm','🤝','생활체육'],
  ['awards','🏅','상장·시상'],['av','🔊','음성·전광판'],['field','📡','현장 연결'],['backup','💾','백업·복구'],['etc','📁','기타']];

const F_RULES=[
  [/^대회명/,'basic'],[/부별 구분/,'basic'],[/^심판 수/,'basic'],[/^부심 수/,'basic'],[/^호구/,'basic'],

  [/기본 경기 방식|경기 방식|컷오프 진출|점수 공개|제한 시간|음원 기준|태권체조|팀 대항|회전 시간|회전 간 휴식/,'format'],

const jump=k=>k.startsWith('go:')?`data-act="go" data-r="${k.slice(3)}"`:`data-act="ssGo" data-k="${k}"`;

/* ---- 화면 다시 묶기 ---- */
function shell(html){

    case 'end':{const L=[['대회 이름',v.name||'(없음)'],['대회 종류',v.comm?'생활체육 대회 (4명 1조)':'일반 대회']];
      if(APP==='poomsae')L.push(['경기 방식',v.format==='tournament'?'토너먼트':'컷오프']);if(APP==='kyorugi')L.push(['경기 방식',v.system==='sum'?'3회전 점수 합산':'3전 다승제']);
      L.push(APP==='kyorugi'?['부심',v.refs+'명']:['심판',v.judges+'명'],['상장',[v.host,[v.title,v.rep].filter(Boolean).join(' ')].filter(Boolean).join(' · ')||'(나중에)']);
      return WZ.done?`<h3>✅ 설정을 저장했습니다</h3><span>다음 차례입니다.</span><div class="ss-wzopts"><button class="ss-wzopt" data-act="wzNext2" data-r="admin-players"><b>1. 선수 명단 불러오기</b><span>접수 홈페이지에서 가져오거나 엑셀을 올립니다</span></button>${APP==='poomsae'?'<button class="ss-wzopt" data-act="wzNext2" data-k="poomsae"><b>2. 학년·라운드별 품새 정하기</b><span>「품새 지정」 카드 · 엑셀로 한 번에 넣기</span></button>':''}<button class="ss-wzopt" data-act="wzNext2" data-r="admin-draw"><b>${APP==='poomsae'?3:2}. 대진표 확인</b><span>${v.comm?'4명씩 자동으로 나뉜 조를 확인합니다':'부문 편성을 확인합니다'}</span></button></div>`
        :`<h3>이대로 저장할까요?</h3><table class="ss-wzsum">${L.map(([a,b])=>`<tr><th>${a}</th><td>${E(b)}</td></tr>`).join('')}</table>${(G('S').divs||[]).some(d=>{try{return G('divHasResults')(d);}catch(e){return false;}})?'<span class="small" style="color:var(--warn)">점수가 들어간 부문이 있습니다. 경기 방식·조 편성이 바뀌면 결과가 달라질 수 있습니다.</span>':''}`;}
  }
  return '';
}
function wzHtml(){
  if(!WZ.open)return '';if(!WZ.v)wzInit();const steps=wzSteps(),i=Math.min(WZ.step,steps.length-1),st=steps[i];

    <div class="ss-wzfoot">${i>0&&!WZ.done?'<button class="btn" data-act="wzPrev">← 이전</button>':'<span></span>'}${st==='end'?(WZ.done?'<button class="btn primary" data-act="wzClose">닫기</button>':'<button class="btn primary" data-act="wzApply">설정 저장</button>'):'<button class="btn primary" data-act="wzNext">다음 →</button>'}</div>
  </div></div>`;
}
async function wzApply(){const v=WZ.v,s=G('SET')(),S=G('S'),save=G('saveSettings');
  const P={name:v.name.trim(),aw:{...(s.aw||{}),host:v.host.trim(),title:v.title.trim(),rep:v.rep.trim()}};
  if(APP==='kyorugi'){P.refs=Number(v.refs);P.system=v.system;}else P.judges=Number(v.judges);
  const n={...s,...P};S.settings=n;await save(n);
  if(APP==='poomsae'&&v.format!==(s.format||'cutoff')){try{await G('ACT').setFormat({dataset:{v:v.format}});S.settings={...G('SET')(),format:v.format};}catch(e){}}
  if(v.comm!==!!s.comm&&G('commSet'))await G('commSet')({comm:v.comm});
  try{G('addLog')('시작 마법사','설정',`${v.name} · ${v.comm?'생활체육':'일반'}`);}catch(e){}
  WZ.done=true;G('render')();
}

/* 되돌리기·다시 실행: 대회 설정이 바뀔 때마다 바로 앞 상태를 기억합니다 (최근 60번).
   대회명처럼 글자를 칠 때는 2초 안의 연속 입력을 한 번으로 묶습니다. 선수 명단·점수는 대상이 아닙니다. */
const UR={u:[],r:[],last:null,at:0,key:'',skip:0};window.__SS_UR=UR;
const UR_L={name:'대회명',judges:'심판 수',refs:'부심 수',comm:'생활체육 대회',commRem:'남는 인원 처리',format:'경기 방식',poomsae:'품새 수',pfix:'지정 품새표',aw:'상장·시상',voice:'음성',ageScheme:'부별 구분',pdraw:'품새 추첨 방식',cutMode:'컷오프 진출 방식',advN:'결선 진출 인원',system:'경기 방식',hogu:'호구',roundSec:'회전 시간',restSec:'회전 간 휴식',finalN:'결선 인원',preMin:'예선 인원',elemMix:'초등부 남녀',autoReveal:'점수 공개',tieAll:'진출 경계 동점'};
const urSnap=()=>{try{const S=G('S');if(!S)return null;return JSON.stringify(G('SET')());}catch(e){return null;}};
const urDiff=(a,b)=>{try{const x=JSON.parse(a),y=JSON.parse(b);return Object.keys({...x,...y}).filter(k=>JSON.stringify(x[k])!==JSON.stringify(y[k])&&!/^(ageBefore|certSince)$/.test(k));}catch(e){return [];}};
const urLabel=ks=>[...new Set(ks.map(k=>UR_L[k]||'설정'))].slice(0,3).join(', ');
setInterval(()=>{const cur=urSnap();if(cur==null)return;if(UR.last==null){UR.last=cur;return;}if(cur===UR.last)return;
  if(UR.skip>Date.now()){UR.last=cur;return;}
  const d=urDiff(UR.last,cur);if(!d.length){UR.last=cur;return;}const now=Date.now(),key=d.join();
  if(!(now-UR.at<2000&&key===UR.key&&key==='name')){UR.u.push(UR.last);if(UR.u.length>60)UR.u.shift();}
  UR.r=[];UR.last=cur;UR.at=now;UR.key=key;
  try{if(String(G('routeNow')()).startsWith('admin-settings'))G('render')();}catch(e){}},400);
async function urApply(str){const S=G('S'),prev=S.settings||{},n=JSON.parse(str);UR.skip=Date.now()+1500;S.settings=n;await G('saveSettings')(n);
  try{if(APP==='poomsae'&&(prev.format||'cutoff')!==(n.format||'cutoff'))await G('ACT').setFormat({dataset:{v:n.format||'cutoff'}});
    if(APP==='poomsae'&&(prev.poomsae===2?2:1)!==(n.poomsae===2?2:1))await G('ACT').setPoomsaeAll({dataset:{v:String(n.poomsae===2?2:1)}});}catch(e){}
  if((!!prev.comm!==!!n.comm||(prev.commRem||'small')!==(n.commRem||'small')||(prev.ageScheme||'kta')!==(n.ageScheme||'kta'))&&(S.roster||[]).length){try{await G('regenerateDivs')();}catch(e){}}
  S.settings=n;UR.skip=Date.now()+1500;UR.last=JSON.stringify(n);G('render')();}
async function urGo(dir){const from=dir<0?UR.u:UR.r,to=dir<0?UR.r:UR.u;if(!from.length)return;const cur=urSnap()||UR.last,tgt=from.pop();to.push(cur);
  const lab=urLabel(urDiff(cur,tgt));await urApply(tgt);try{G('toast')(`${dir<0?'되돌렸습니다':'다시 실행했습니다'}${lab?' · '+lab:''}`);}catch(e){}}
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||e.altKey)return;let r='';try{r=String(G('routeNow')());}catch(x){}if(!r.startsWith('admin-settings'))return;
  const t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();urGo(-1);}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();urGo(1);}},true);
