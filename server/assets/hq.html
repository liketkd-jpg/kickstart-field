/* ===== 본부 모니터 ===== */
html:has(body.mon),body.mon{height:100%;background:#050608 radial-gradient(1400px 800px at 50% -10%,#1A1D24,#050608 60%) no-repeat fixed}

.sec{font-size:min(1.05vw,1.8vh);font-weight:800;color:#CFC8B8;letter-spacing:.06em;margin-top:.4vh}

.nd{margin-top:auto;font-size:min(1.2vw,2vh);font-weight:800;color:#F5B66A}
.nd b{color:#F6F2E9}
.offmsg{font-size:min(1.4vw,2.3vh);font-weight:800;color:#FF8A90}
.mf{display:flex;align-items:center;gap:1vw;min-height:0}

.mf .ks{font-stretch:125%;font-weight:800;font-size:min(1vw,1.7vh);letter-spacing:.1em;color:rgba(244,239,228,.5)}
.full{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(1200px 700px at 50% 30%,#1D1A12,#050608 70%);text-align:center;padding:6vh 6vw}

.ann{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);z-index:30;background:linear-gradient(90deg,rgba(184,144,78,.95),rgba(230,205,151,.97),rgba(184,144,78,.95));color:#1A1306;text-align:center;padding:4vh 4vw;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:ain .35s ease-out}

.nocourt{display:grid;place-items:center;text-align:center;color:#A9AFB9;font-size:min(2vw,3.4vh);font-weight:700}

/* ===== 기존 대회 앱과 같은 모습 (KICKSTART UP) ===== */
:root{--f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--f-disp:"Archivo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
body{font-family:var(--f-body);font-size:15px;letter-spacing:-.01em}
h2{font-family:var(--f-body);font-weight:900;font-size:20px}
.bar{gap:12px;padding-block:12px}
.bar svg.logo{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 10px rgba(201,162,98,.25))}
.ksword{font-family:"Archivo",var(--f-body);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:.06em;color:#F4EFE4;white-space:nowrap;padding-right:12px;margin-right:2px;border-right:1px solid rgba(230,205,151,.35);line-height:1}

.tabwrap .tabs a{font-family:var(--f-body);font-weight:700;font-size:15px;color:var(--muted);text-decoration:none;padding:9px 14px;border-radius:10px;white-space:nowrap}
.tabwrap .tabs a:hover{background:var(--sunk);color:var(--ink)}
.tabwrap .tabs a.on{background:var(--ink);color:var(--bg);box-shadow:inset 0 -2px 0 var(--brass-2)}
@media (prefers-color-scheme:dark){:root:not(.light) .tabwrap .tabs a.on{background:linear-gradient(180deg,#2A2519,#1D1A12);color:var(--brass-1);box-shadow:inset 0 0 0 1px rgba(214,182,124,.35)}}
main{max-width:1180px;padding-top:14px}
body.mon .tabwrap{display:none}
.btn.primary{box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 6px 16px -8px rgba(160,126,67,.8)}

/* 본부 모니터: 전광판과 같은 금색 선·K 문양·로고 표시 */
.mh{position:relative;padding-bottom:1.4vh}

/* 심판 연결 점검 */
.jrow{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px}
.jch{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}

<script src="/vendor/fieldmode.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT=null;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800);}
const route=()=>{const h=location.hash.replace('#','');return ['board','admin','results','print'].includes(h)?h:'admin';};
const S={courts:{},cfg:{},announce:null,log:[],ready:false,moves:{},mvArm:null};window.KS_HQS=()=>S;
let DB=null,DL=null;
const CFGDEF={autoCall:true,voice:true,notice:{text:'',mode:'off'},manual:[],points:[3,2,1]};
const CFG=()=>({...CFGDEF,...(S.cfg||{})});
const saveCfg=p=>DB.doc('hqcfg/main').set({...CFG(),...p}).catch(()=>toast('저장하지 못했습니다'));
const NOW=()=>Date.now();
/* 전광판 디자인: 「따라가기」면 품새 코트 노트북의 전광판 디자인을 그대로 씁니다 */
const THEMES=[['follow','코트 전광판 따라가기'],['gold','기본 금빛'],['ed','매거진'],['ch','시계'],['tm','데이터'],['ink','한지와 먹'],['st','스트리트']];
function hqTheme(list){const t=CFG().theme||'follow';if(t!=='follow')return t==='classic'?'gold':t;
  const cs=(list||[]).filter(c=>c.app&&c.app.board&&c.app.board.theme);const c=cs.find(c=>c.app.board.app==='poomsae')||cs[0];const v=c?c.app.board.theme:'gold';return v==='classic'?'gold':v;}
const themePick=cls=>`<select class="${cls}" data-hqtheme title="본부 화면 디자인">${THEMES.map(([k,l])=>`<option value="${k}" ${(CFG().theme||'follow')===k?'selected':''}>🎨 ${l}</option>`).join('')}</select>`;
document.addEventListener('change',e=>{const s=e.target.closest&&e.target.closest('[data-hqtheme]');if(s)saveCfg({theme:s.value});});

/* ---------- 코트 정리 ---------- */
/* 코트별 유튜브 생중계 표시 */
function liveChip(c){const L=c&&c.online&&c.live;if(!L)return '';const ok=L.state==='live';
  return ` <span class="chip ${ok?'livec':'bad'}" title="유튜브 생중계"><i class="dot"></i>${ok?'🔴 생중계 중':L.state==='retry'?'생중계 끊김 · 다시 연결 중':'생중계 연결 중'}</span>`;}
function courtList(){
  return Object.entries(S.courts).map(([id,c])=>{
    const apps=c.apps||{};let best=null;
    for(const [k,v] of Object.entries(apps)){const b=v&&v.board;if(b&&(!best||(b.at||0)>(best.board.at||0)))best={key:k,board:b,results:v.results||null};}
    const age=best&&best.board.at?NOW()-best.board.at:null;
    return {id,addr:c.addr,via:c.via,court:c.court||'?',online:!!c.online,lastSeen:c.lastSeen||0,app:best,stale:c.online&&(!best||age>40000),apps,live:c.live&&c.live.on?c.live:null};
  }).sort((a,b)=>(a.court||'').localeCompare(b.court||'')||a.addr.localeCompare(b.addr));
}
function dupLetters(list){const m={};list.forEach(c=>{m[c.court]=(m[c.court]||0)+1;});return Object.keys(m).filter(k=>m[k]>1);}
function ago(t){if(!t||t<1e12)return '—';const s=Math.round((NOW()-t)/1000);return s<60?s+'초 전':Math.round(s/60)+'분 전';}
const VIA={beacon:'자동',scan:'주소 훑기',manual:'직접 입력'};
function alerts(list){
  const out=[];
  list.forEach(c=>{if(c.online&&c.live&&c.live.state==='retry')out.push(['bad',`${c.court}코트 유튜브 생중계가 끊겼습니다. 다시 연결하는 중입니다. 체육관 인터넷(공유기 인터넷선)을 확인해 주세요.`]);});
  list.forEach(c=>{if(!c.online)out.push(['bad',`${c.court}코트 노트북과 연결이 끊겼습니다 (${c.addr} · 마지막 연결 ${ago(c.lastSeen)}). 노트북 전원, 와이파이, 현장 모드 프로그램(검은 창)을 확인해 주세요.`]);
    else if(c.stale)out.push(['warn',`${c.court}코트: 운영석 화면이 열려 있지 않거나 멈춰 있습니다. 코트 노트북에서 운영석(경기 진행)을 열어 주세요.`]);
    else if(c.app)out.push(...judgeAlerts(c.court,c.app.board));});
  dupLetters(list).forEach(l=>out.push(['warn',`${l}코트로 설정된 노트북이 두 대 이상입니다. 코트 노트북 첫 화면의 「역할 바꾸기」에서 코트 이름을 다르게 해 주세요.`]));
  return out;
}

const FIELD_MODE=true;
/* ---------- 심판 연결 점검: 코트마다 심판 휴대폰 하나하나 ---------- */
const JST={ok:['ok','연결됨'],off:['bad','끊김'],wait:['warn','전송 대기'],none:['idle','미접속'],solo:['ok','운영석 직접 채점']};
function fmtSec(s){return s<60?s+'초':Math.floor(s/60)+'분 '+(s%60)+'초';}
function judgeChips(b,live){
  const J=b&&b.judges;if(!J||!J.list||!J.list.length)return '';
  return `<div class="jrow"><span class="small muted">심판</span>${J.list.map(j=>{const [c,l]=live?(JST[j.st]||['idle','?']):['idle','알 수 없음'];
    return `<span class="jch ${c}" title="${j.n}${J.label} · ${l}${j.q?' · 보관 '+j.q+'건':''}"><i></i>${j.n}${J.label}${live&&j.st==='off'?' 끊김':live&&j.st==='wait'?' 대기 '+j.q:live&&j.st==='none'?' 미접속':''}${live&&J.open&&j.sent?' ✓':''}</span>`;}).join('')}</div>`;
}
function judgeAlerts(court,b){
  const out=[],J=b&&b.judges;if(!J||!J.list)return out;const L=J.label;
  const wifi=FIELD_MODE?'휴대폰 와이파이가 대회 공유기에 연결돼 있는지':'휴대폰 인터넷(와이파이·데이터)이 켜져 있는지';
  J.list.forEach(j=>{
    if(j.st==='off'&&j.sec>=10)out.push([J.open?'bad':'warn',`${court}코트 ${j.n}${L} 휴대폰 연결 끊김 (${fmtSec(j.sec)}째) → ${wifi}, 화면이 꺼지지 않았는지 확인하세요. 다시 연결되면 보관된 점수는 자동으로 들어갑니다.`]);
    else if(j.st==='wait')out.push(['warn',`${court}코트 ${j.n}${L}: 보내지 못한 점수 ${j.q}건이 휴대폰에 보관 중 → 곧 자동으로 들어갑니다. 계속 남아 있으면 ${wifi} 확인하세요.`]);
  });
  const none=J.open?J.list.filter(j=>j.st==='none').map(j=>j.n):[];
  if(none.length)out.push(['warn',`${court}코트 ${none.join('·')}${L} 채점기에 아무도 들어오지 않았습니다 → 코트 운영석의 「📱 QR 접속」으로 심판 휴대폰을 연결하세요.`]);
  return out;
}
function checkSummary(list,al){
  const live=list.filter(c=>c.online&&!c.stale),nJ=live.reduce((a,c)=>{const J=c.app0?c.app0.board.judges:(c.app&&c.app.board&&c.app.board.judges);return a+(J&&J.list?J.list.length:0);},0);
  const bad=al.filter(a=>a[0]==='bad').length,warn=al.filter(a=>a[0]==='warn').length;
  return bad?`<span class="chip bad"><i class="dot"></i>확인할 곳 ${bad+warn}</span>`:warn?`<span class="chip warn"><i class="dot"></i>살펴볼 곳 ${warn}</span>`:list.length?`<span class="chip ok"><i class="dot"></i>모두 정상 · 코트 ${live.length} · 심판 ${nJ}</span>`:'';
}
const JLEGEND='<div class="small muted jleg"><span class="jch ok"><i></i>연결됨</span><span class="jch warn"><i></i>전송 대기</span><span class="jch bad"><i></i>끊김</span><span class="jch idle"><i></i>미접속</span> · ✓ 지금 경기 점수 도착</div>';


/* ---------- 코트 진행 · 시작 전 부문 옮기기 ---------- */
const PER={poomsae:2.5,gyeokpa:2,kyorugi:6};     /* 진행 기록이 모자랄 때 1경기(호출) 예상 분 */
const APPN={poomsae:'품새',gyeokpa:'격파',kyorugi:'겨루기'};
const HIST={};
function sample(){const t=NOW();for(const c of courtList()){if(!c.online)continue;for(const [app,v] of Object.entries(c.apps||{})){const b=v&&v.board;if(!b||!Array.isArray(b.divs))continue;
  const done=b.divs.reduce((a,x)=>a+(x.done||0),0),key=c.court+'|'+app,h=HIST[key]||(HIST[key]=[]);
  if(!h.length||h[h.length-1].done!==done)h.push({t,done});while(h.length>2&&t-h[1].t>40*60e3)h.shift();}}}
function pace(court,app){const h=HIST[court+'|'+app]||[];if(h.length>=2){const a=h[0],z=h[h.length-1],dd=z.done-a.done,dt=(z.t-a.t)/60000;if(dd>=3&&dt>=4&&dd>0)return {min:Math.max(.5,dt/dd),real:true};}
  return {min:PER[app]||2,real:false};}
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
function lanes(){const out=[];for(const c of courtList()){if(!c.online)continue;for(const [app,v] of Object.entries(c.apps||{})){const b=v&&v.board;if(!b||!Array.isArray(b.divs)||!b.divs.length)continue;
    const p=pace(c.court,app),divs=b.divs.map(x=>({...x,done:x.done||0,total:x.total||0,live:!!(b.now&&b.now.div===x.name),fresh:(x.done||0)===0&&!(b.now&&b.now.div===x.name)&&(x.total||0)>0})),
      rem=divs.filter(x=>x.total>x.done),left=rem.reduce((a,x)=>a+(x.total-x.done),0);
    out.push({court:c.court,app,b,p,rem,left,end:NOW()+left*p.min*60000,divs});}}
  return out.sort((a,b)=>a.court.localeCompare(b.court));}
const MVST={req:'원래 코트 확인 중',sending:'명단·음원 보내는 중',sent:'받는 코트에 넣는 중',done:'옮김',err:'못 옮김',cancel:'취소됨'};
function mvLine(m){const age=NOW()-(m.at||0),slow=m.state==='req'&&age>20000;
  const site=m.site==='ok'?' · 홈페이지 대진표도 고침':m.site==='local'?' · 본부 앱 코트 나누기 고침 (홈페이지에 올린 대진표 없음)':m.site==='err'?` · 홈페이지 대진표 다시 올리기 실패: ${m.siteErr||''}`:m.state==='done'||m.state==='sent'?' · 본부 노트북 경기 앱을 열면 코트 나누기·홈페이지 대진표가 고쳐집니다':'';
  return `<tr><td class="small muted" style="white-space:nowrap;width:1%">${hhmm(m.at)}</td><td><b>${esc(m.from)}→${esc(m.to)}코트</b> <span class="chip">${esc(APPN[m.app]||m.app)}</span> ${esc(m.div)}${m.n?` <span class="small muted">${m.n}건${m.music?` · 음원 ${m.music}곡`:''}</span>`:''}</td>
    <td><span class="chip ${m.state==='done'?'ok':m.state==='err'?'bad':'warn'}"><i class="dot"></i>${MVST[m.state]||esc(m.state)}</span><div class="small ${m.state==='err'?'':'muted'}">${m.state==='err'?esc(m.err||''):slow?`${esc(m.from)}코트 노트북의 운영석(경기 진행) 화면이 열려 있어야 옮겨집니다`:m.state==='sent'?`${m.taken?'✓ ':''}${esc(m.to)}코트 받음 · ${m.removed?'✓ ':''}${esc(m.from)}코트에서 뺌`:''}${esc(site)}${m.musicErr?` · 음원 ${m.musicErr}곡 못 보냄`:''}</div></td></tr>`;}
function vMove(){const L=lanes();if(!L.length)return '';const MV=Object.values(S.moves||{}).sort((a,b)=>b.at-a.at);
  const busy=new Set(MV.filter(m=>['req','sending','sent'].includes(m.state)).map(m=>m.from+'|'+m.app+'|'+m.div));
  const act=L.filter(x=>x.left>0),late=act.length>1?act.reduce((a,b)=>b.end>a.end?b:a):null,early=act.length>1?L.reduce((a,b)=>b.end<a.end?b:a):null;
  const gap=late&&early?Math.round((late.end-early.end)/60000):0;
  const tip=gap>=20&&late.rem.some(x=>x.fresh)?`<div class="alert warn">⏱ ${esc(late.court)}코트(${esc(APPN[late.app]||'')})가 가장 늦게 끝납니다 (약 ${hhmm(late.end)}). 시작 전 부문을 먼저 끝나는 ${esc(early.court)}코트(약 ${hhmm(early.end)})로 옮기면 약 ${gap}분 차이를 줄일 수 있습니다.</div>`:'';
  return `<div class="panel"><div class="row between"><h2>🔀 코트 진행 · 부문 옮기기</h2><span class="small muted">끝나는 시각은 진행 속도로 어림합니다 · 점수가 들어간 부문은 옮기지 않습니다</span></div>${tip}
    <div class="mvgrid">${L.map(x=>{const to=L.filter(y=>y.app===x.app&&y.court!==x.court).map(y=>y.court);
      return `<div class="mvc ${late&&x===late&&gap>=20?'late':''}"><div class="row between"><b style="font-size:18px">${esc(x.court)}코트 <span class="chip">${esc(APPN[x.app]||x.app)}</span></b>${x.left?`<span class="chip ${late&&x===late&&gap>=20?'warn':'ok'}">끝 약 ${hhmm(x.end)}</span>`:'<span class="chip ok">모두 끝</span>'}</div>
        <span class="small muted">남은 부문 ${x.rem.length}개 · 남은 경기 ${x.left} · 1경기 약 ${x.p.min.toFixed(1)}분${x.p.real?'':' (기본값)'}</span>
        <div class="mvl">${x.rem.map(d=>{const k=x.court+'|'+x.app+'|'+d.name,sid='mvto_'+btoa(unescape(encodeURIComponent(k))).replace(/[^A-Za-z0-9]/g,'');
          return `<div class="mvr"><span class="mvn" title="${esc(d.name)}">${esc(d.name)}</span><span class="small muted">${d.done}/${d.total}</span>${d.live?'<span class="chip ok">진행 중</span>':d.fresh?(busy.has(k)?'<span class="chip warn">옮기는 중</span>':to.length?`<select id="${sid}" class="mvsel">${to.map(c=>`<option value="${esc(c)}">${esc(c)}코트로</option>`).join('')}</select><button class="btn sm ${S.mvArm===k?'primary':''}" data-a="mv" data-k="${esc(k)}" data-sel="${sid}">${S.mvArm===k?'한 번 더 누르면 옮김':'옮기기'}</button>`:'<span class="small muted">같은 종목 코트 없음</span>'):'<span class="chip">진행 중</span>'}</div>`;}).join('')||'<span class="small muted">남은 부문이 없습니다</span>'}</div></div>`;}).join('')}</div>
    ${MV.length?`<div><span class="small muted">옮긴 기록</span><table>${MV.slice(0,8).map(mvLine).join('')}</table></div>`:''}</div>`;}

/* ---------- 본부 운영 ---------- */
function vAdmin(){
  const list=courtList(),cf=CFG(),al=alerts(list),n=cf.notice||{};
  const rows=list.length?list.map(c=>{const b=c.app&&c.app.board;
    return `<tr><td><b style="font-size:18px">${esc(c.court)}코트</b><div class="small muted">${esc(c.addr)} · ${VIA[c.via]||esc(c.via)}</div></td>
      <td>${c.online?(c.stale?'<span class="chip warn"><i class="dot"></i>운영석 꺼짐</span>':'<span class="chip ok"><i class="dot"></i>연결됨</span>'):`<span class="chip bad"><i class="dot"></i>끊김 · ${ago(c.lastSeen)}</span>`}${liveChip(c)}</td>
      <td>${b?`<span class="chip">${esc(b.appName||'')}</span> <b>${esc(b.curDiv||'')}</b><div class="small muted">${b.now?esc(b.now.label)+' · '+esc((b.now.names||[]).map(x=>x.name).join(' · ')):'호출 대기'}${b.progress?` · 경기 ${b.progress.done}/${b.progress.total}`:''}</div>${b.nextDiv?`<div class="small">다음 부문: <b>${esc(b.nextDiv)}</b></div>`:''}${judgeChips(b,c.online&&!c.stale)}`:'<span class="muted small">진행 정보 없음</span>'}</td>
      <td style="white-space:nowrap">${b&&b.nextDiv?`<button class="btn sm primary" data-a="callNext" data-id="${esc(c.id)}">📣 다음 부문 호출</button> `:''}<button class="btn sm" data-a="forget" data-addr="${esc(c.addr)}" title="목록에서 빼기">빼기</button></td></tr>`;}).join('')
    :`<tr><td colspan="4"><div class="empty">아직 찾은 코트가 없습니다. 코트 노트북에서 현장 모드를 켜고 역할을 「코트」로 고르면 자동으로 나타납니다.<br>같은 공유기 와이파이에 연결되어 있는지 확인해 주세요.</div></td></tr>`;
  const presets=['점심시간입니다. 13시에 경기가 다시 시작됩니다.','시상식을 시작합니다. 입상 선수는 시상대 앞으로 모여 주세요.','잠시 후 오후 경기가 시작됩니다. 선수들은 준비해 주세요.','대회장 안에서는 음식물 섭취를 삼가 주세요.'];
  return `${[...al].sort((x,y)=>(x[0]==='bad'?0:1)-(y[0]==='bad'?0:1)).map(a=>`<div class="alert ${a[0]}">${esc(a[1])}</div>`).join('')}
  <div class="panel"><div class="row between"><h2>코트 연결 ${checkSummary(list,al)}</h2><span class="row"><span class="small muted">같은 와이파이의 코트 노트북을 자동으로 찾습니다</span><button class="btn sm" data-a="scan">🔎 지금 다시 찾기</button></span></div>
    <div style="overflow-x:auto"><table><tr><th>코트</th><th>상태</th><th>지금 진행 · 심판 연결</th><th></th></tr>${rows}</table></div>${JLEGEND}
    <div class="row"><span class="small muted">자동으로 안 보이면 코트 노트북 검은 창의 주소를 넣으세요</span><input type="text" id="manAddr" placeholder="예: 192.168.0.12:8080" style="width:220px"><button class="btn sm" data-a="addMan">주소로 추가</button></div></div>
  ${vMove()}
  <div class="grid2">
  <div class="panel"><div class="row between"><h2>📣 호출</h2><span class="row"><button class="btn sm ${cf.autoCall?'on':''}" data-a="autoCall">자동 호출 ${cf.autoCall?'켜짐':'꺼짐'}</button><button class="btn sm ${cf.voice?'on':''}" data-a="voice">음성 ${cf.voice?'켜짐':'꺼짐'}</button></span></div>
    <span class="small muted">자동 호출: 코트가 새 부문을 시작하면 그다음 부문 선수에게 「○코트, ○○부 선수는 준비해 주세요」를 본부 모니터에 크게 띄우고 소리로 알립니다.</span>

function allResults(){
  const out=[];courtList().forEach(c=>{for(const [k,v] of Object.entries(c.apps||{})){const r=v&&v.results;if(!r||!r.divs)continue;r.divs.forEach(d=>out.push({court:c.court,app:r.appName||k,...d}));}});
  return out.sort((a,b)=>(a.court||'').localeCompare(b.court||'')||a.app.localeCompare(b.app)||a.div.localeCompare(b.div,'ko'));
}
function teamTally(rs){
  const pt=CFG().points||[3,2,1],m=new Map();
  rs.forEach(d=>d.podium.forEach(p=>{if(!p.team)return;const t=m.get(p.team)||{team:p.team,g:0,s:0,b:0};if(p.rank===1)t.g++;else if(p.rank===2)t.s++;else if(p.rank===3)t.b++;m.set(p.team,t);}));
  const list=[...m.values()].map(t=>({...t,pts:t.g*pt[0]+t.s*pt[1]+t.b*pt[2]})).sort((a,b)=>b.pts-a.pts||b.g-a.g||b.s-a.s||b.b-a.b||a.team.localeCompare(b.team,'ko'));
  let rank=0,prev=null;list.forEach((t,i)=>{const k=[t.pts,t.g,t.s,t.b].join();if(k!==prev){rank=i+1;prev=k;}t.rank=rank;});
  return list;
}
function vResults(){
  const rs=allResults(),tally=teamTally(rs),done=rs.filter(d=>d.done).length;

  if(Date.now()/1000>(a.expires_at||0)-60){const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:a.refresh_token})});
    if(!r.ok){localStorage.removeItem(SB_LS);throw new Error('로그인이 만료되었습니다. 다시 로그인해 주세요');}const j=await r.json();a={...a,access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)};localStorage.setItem(SB_LS,JSON.stringify(a));}
  return a.access_token;}
async function sbLogin(email,pw){const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||'로그인하지 못했습니다');
  localStorage.setItem(SB_LS,JSON.stringify({email,access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)}));}
/* 백업 한 번: 모인 백업 파일 중 바뀐 것만 올림 */
async function backupNow(force){
  if(BK.busy)return;BK.busy=true;BK.err='';schedule();let n=0;
  try{const tok=await sbToken();if(!tok)throw new Error('관리자 계정으로 로그인해 주세요');
    for(const f of bkFiles()){if(!force&&BK.sent[f.key]===f.at)continue;
      const r=await fetch(`/api/hq/cfile?court=${encodeURIComponent(f.court)}&name=${encodeURIComponent(f.name)}`,{cache:'no-store'});if(!r.ok)continue;const data=await r.json();
      const comp=(data.settings&&data.settings.name)||'(대회명 없음)',app=String(data.app||'').replace(/-competition$/,'')||'app';
      const up=await fetch(SB_URL+'/rest/v1/field_backups?on_conflict=comp,court,app',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify({comp,court:f.court,app,file:f.name,data,saved_at:new Date(data.savedAt||f.at).toISOString(),updated_at:new Date().toISOString()})});
      if(!up.ok){const t=await up.text().catch(()=>'');throw new Error(/field_backups/.test(t)&&/exist|find/i.test(t)?'Supabase에 백업 표가 없습니다. schema13.sql을 먼저 실행해 주세요':up.status===401||up.status===403?'이 계정은 백업 권한이 없습니다 (관리자·직원 계정)':'올리지 못했습니다 (HTTP '+up.status+')');}
      BK.sent[f.key]=f.at;n++;}
    localStorage.setItem('ks_hq_bksent',JSON.stringify(BK.sent));
    await DB.doc('hqbackup/main').set({at:NOW(),n,files:bkFiles().length,by:sbAuth()?.email||''});if(force)toast(n?`백업 파일 ${n}개를 Supabase에 올렸습니다`:'바뀐 백업이 없습니다');
  }catch(e){BK.err=e.message||String(e);if(force)toast(BK.err);}
  finally{BK.busy=false;schedule();}
}
setInterval(async()=>{const cf=CFG();if(!DB||!cf.backupAuto||BK.busy||route()==='board')return;
  const last=(S.bk&&S.bk.at)||0,iv=Math.max(1,Number(cf.backupMin)||5)*60000;if(NOW()-last<iv)return;

async function printLoop(){
  if(route()!=='print'||PR.busy||!PR.ready)return;const f=certFiles().find(needPrint);if(!f)return;
  PR.busy=true;PR.now=certLabel(f.name)+' · '+f.court;PR.err='';schedule();
  try{const r=await fetch(`/api/hq/cfile?court=${encodeURIComponent(f.court)}&name=${encodeURIComponent(f.name)}`,{cache:'no-store'});if(!r.ok)throw new Error('파일을 읽지 못했습니다');
    const job=await r.json(),box=document.getElementById('prt');box.innerHTML=(job.pages||[]).map(p=>`<img class="prtp" src="${p}" alt="">`).join('');
    await Promise.all([...box.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()));
    window.print();await new Promise(r=>setTimeout(r,1500));box.innerHTML='';
    const done={...PR.done,[f.key]:Math.max(f.at,PR.req[f.key]||0)};PR.done=done;await DB.doc('hqprint/main').set({done,req:PR.req});
    await DB.doc('hqprint/log').set({list:[{at:NOW(),court:f.court,div:certLabel(f.name),n:(job.pages||[]).length,again:!!job.again},...((S.plog&&S.plog.list)||[])].slice(0,60)});
  }catch(e){PR.err=e.message||String(e);const done={...PR.done,[f.key]:Math.max(f.at,PR.req[f.key]||0)};PR.done=done;try{await DB.doc('hqprint/main').set({done,req:PR.req});}catch(x){}}
  finally{PR.busy=false;PR.now='';schedule();}
}

let HSEL=null,HLISTY=0;try{HSEL=localStorage.getItem('ks_hq_sel')||null;}catch(e){}
const HQ_T=[[/코트 연결/,'court','🖥️','코트 연결'],[/코트 진행|옮기기/,'move','🔀','코트 진행·옮기기'],[/호출/,'call','📣','호출'],[/공지/,'notice','📢','공지'],[/결과 자동 모음/,'coll','💾','결과 모음'],

function hqTileState(k){const cf=CFG(),list=courtList(),n=cf.notice||{};
  switch(k){
    case 'court':{const on=list.filter(c=>c.online).length,bad=list.filter(c=>!c.online||c.stale).length;return [list.length?`${on}/${list.length}곳 연결`:'아직 코트 없음',list.length&&!bad?'ok':list.length?'warn':''];}
    case 'call':return [`자동 호출 ${cf.autoCall?'켜짐':'꺼짐'}${S.log[0]?' · 최근 '+new Date(S.log[0].at).toTimeString().slice(0,5):''}`,''];
    case 'notice':return [n.mode==='full'?'전체 화면 표시 중':n.mode==='banner'&&n.text?'아래 띠 표시 중':'표시 안 함',n.mode&&n.mode!=='off'&&n.text?'ok':''];
    case 'coll':{const c=Object.keys((S.coll&&S.coll.courts)||{}).length;return [c?`${c}개 코트 모음`:'아직 없음',c?'ok':''];}
    case 'cert':{const q=certFiles().filter(needPrint).length;return [`${cf.certAuto?'켜짐':'꺼짐'}${q?` · 대기 ${q}`:''}`,cf.certAuto?(q?'warn':'ok'):''];}
    case 'backup':{const b=S.bk||{};return [`${cf.backupAuto?'켜짐':'꺼짐'}${b.at?' · '+ago(b.at):''}${BK.err?' · 오류':''}`,BK.err?'warn':cf.backupAuto&&b.at?'ok':''];}
    case 'mon':return ['대기실 TV·태블릿',''];
    default:return ['',''];
  }
}
function hqShell(html){
  let t;try{t=document.createElement('template');t.innerHTML=html;}catch(e){return html;}
  const top=[],cards=[];
  const walk=el=>[...el.children].forEach(c=>{if(c.classList.contains('panel')){const h=c.querySelector('h2'),ht=h?h.textContent:'';const m=HQ_T.find(x=>x[0].test(ht));
      const key=m?m[1]:'p'+cards.length;cards.push({key,ic:m?m[2]:'📁',title:m?m[3]:(ht.trim().slice(0,20)||'기타'),el:c});}
    else if(c.classList.contains('grid2')||(!c.className&&c.querySelector('.panel')))walk(c);else top.push(c);});
  walk(t.content);
  if(HSEL&&!cards.some(c=>c.key===HSEL))HSEL=null;
  const out=document.createElement('div');out.className='hqs'+(HSEL?' hqs-open':'');
  top.forEach(x=>out.appendChild(x));
  const tiles=document.createElement('div');tiles.className='hqs-tiles';if(HSEL)tiles.hidden=true;
  tiles.innerHTML=cards.map(c=>{const [st,cl]=hqTileState(c.key);return `<button class="hqs-tile ${cl}" data-a="hqOpen" data-k="${c.key}"><span class="hqs-ic">${c.ic}</span><b>${esc(c.title)}</b><span class="hqs-st">${esc(st||'열어서 보기')}</span>${cl==='warn'?'<i class="hqs-dot"></i>':''}</button>`;}).join('');
  out.appendChild(tiles);
  cards.forEach(c=>{const w=document.createElement('div');w.className='hqs-page';if(HSEL!==c.key)w.hidden=true;
    w.innerHTML=`<div class="hqs-head"><button class="btn" data-a="hqClose">← 본부 메뉴</button><span class="hqs-ic">${c.ic}</span><h2>${esc(c.title)}</h2><button class="btn primary" data-a="hqClose">닫기 ✕</button></div>`;
    w.appendChild(c.el);out.appendChild(w);});
  return out.outerHTML;
}

  else if(a==='forget'){hqctl('forget',b.dataset.addr);const man=(cf.manual||[]).filter(x=>!b.dataset.addr.startsWith(x.replace(/^https?:\/\//,'').split('/')[0]));if(man.length!==(cf.manual||[]).length)saveCfg({manual:man});}
  else if(a==='addMan'){const v=($('#manAddr').value||'').trim();if(!v)return toast('코트 노트북 주소를 넣어 주세요');await saveCfg({manual:[...new Set([...(cf.manual||[]),v])]});hqctl('add',v);$('#manAddr').value='';toast('추가했습니다. 연결되면 목록에 나타납니다');}
  else if(a==='autoCall')saveCfg({autoCall:!cf.autoCall});
  else if(a==='voice')saveCfg({voice:!cf.voice});
  else if(a==='announce'){const v=($('#annText').value||'').trim();if(!v)return toast('호출할 내용을 넣어 주세요');await announce(v);$('#annText').value='';}
  else if(a==='callNext'){const c=courtList().find(x=>x.id===b.dataset.id);const bd=c&&c.app&&c.app.board;if(bd&&bd.nextDiv)await announce(`${c.court}코트, ${bd.nextDiv} 선수는 준비해 주세요.`,{court:c.court});}
  else if(a==='preset'){const p=['점심시간입니다. 13시에 경기가 다시 시작됩니다.','시상식을 시작합니다. 입상 선수는 시상대 앞으로 모여 주세요.','잠시 후 오후 경기가 시작됩니다. 선수들은 준비해 주세요.','대회장 안에서는 음식물 섭취를 삼가 주세요.'][Number(b.dataset.i)];$('#noticeText').value=p;}
  else if(a==='notice'){const t=($('#noticeText').value||'').trim();const m=b.dataset.m;if(m!=='off'&&!t)return toast('공지 내용을 넣어 주세요');await saveCfg({notice:{text:m==='off'?(cf.notice||{}).text||'':t,mode:m,at:NOW()}});toast(m==='off'?'공지를 내렸습니다':'본부 모니터에 공지를 띄웠습니다');}
  else if(a==='noticeSay'){const t=($('#noticeText').value||'').trim();if(t)await announce(t);}
  else if(a==='xlsx')exportXlsx();
  else if(a==='print')window.print();
  else if(a==='qr'){if(window.KSQR)KSQR.open({title:'본부 모니터',items:[{label:'본부 모니터',sub:'대기실 TV·태블릿',url:(window.KS_FIELD.base||location.href.split('#')[0])+'#board'}]});}
});

/* ---------- 시작 ---------- */
(async function boot(){
  render();
  DB=await window.claude.use('db');DL=await window.claude.use('downloads');
  DB.collection('courts').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.courts=m;S.ready=true;try{sample();}catch(e){}schedule();});
  DB.collection('moves').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.moves=m;schedule();});
  DB.doc('hqcfg/main').onSnapshot(s=>{S.cfg=s.exists?s.data():{};S.ready=true;schedule();});
  DB.doc('hqprint/main').onSnapshot(s=>{const d=s.exists?s.data():{};PR.done=d.done||{};PR.req=d.req||{};PR.ready=true;schedule();});
  DB.doc('hqprint/log').onSnapshot(s=>{S.plog=s.exists?s.data():null;schedule();});
  DB.doc('hqbackup/main').onSnapshot(s=>{S.bk=s.exists?s.data():null;schedule();});
  DB.doc('hq/announce').onSnapshot(s=>{onAnnounce(s.exists?s.data():null);schedule();});
  DB.collection('calllog').onSnapshot(s=>{S.log=s.docs.map(d=>d.data()).sort((a,b)=>b.at-a.at).slice(0,30);schedule();});
  if(window.KS_FIELD&&KS_FIELD.onStatus)KS_FIELD.onStatus(()=>schedule());
  const coll=async()=>{try{const r=await fetch('/api/hq/collected',{cache:'no-store'});if(r.ok){S.coll=await r.json();if(route()==='admin')schedule();}}catch(e){}};coll();setInterval(coll,5000);
})();
})();

<!--@@AUDIOFIX--><script>/* ===== 경기 소리 안정화 (품새·격파·겨루기 공통) =====
   1) HDMI·모니터 스피커는 소리가 잠깐 멈추면 절전으로 꺼졌다가 다음 소리 앞부분을 잘라 먹습니다("띠디디", "준…비").
      → 들리지 않을 만큼 아주 작은 소리를 계속 흘려 소리 장치가 꺼지지 않게 합니다.
   2) 녹음 파일·신호음은 미리 읽어(디코딩) 두었다가 누르는 즉시 같은 소리 통로로 냅니다.
   3) 기기 음성(TTS)은 첫 구령이 늦게 나오지 않도록 미리 깨워 둡니다.
   4) 브라우저는 화면을 한 번 눌러야 소리를 허락하므로, 전광판에서 소리가 막혀 있으면 「🔊 소리 켜기」 단추를 보여 줍니다. */
(function(){
if(window.KS_AUDIO)return;
const AC=window.AudioContext||window.webkitAudioContext;
const g=n=>{try{return (0,eval)(n);}catch(e){return undefined;}};
let ctx=null,master=null,keep=null;
function C(){
  if(!AC)return null;
  if(!ctx){try{ctx=new AC({latencyHint:'interactive'});}catch(e){try{ctx=new AC();}catch(_){return null;}}
    master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination);
    ctx.onstatechange=()=>{if(ctx.state==='running')startKeep();refreshBtn();};}
  if(ctx.state==='suspended'||ctx.state==='interrupted'){try{ctx.resume().catch(()=>{});}catch(e){}}
  return ctx;
}
const running=()=>!!ctx&&ctx.state==='running';
/* 1) 소리 장치 깨워 두기: -80dB 정도의 아주 작은 잡음(사람 귀에는 들리지 않음) */
function startKeep(){
  const c=C();if(!c||keep||c.state!=='running')return;
  try{const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*0.0001;
    const s=c.createBufferSource();s.buffer=b;s.loop=true;s.connect(c.destination);s.start();keep=s;}catch(e){}
}
/* 2) 미리 읽어 둔 소리 재생 */
const CACHE=new Map();
function buf(url){
  if(!url)return Promise.reject(new Error('no url'));
  if(CACHE.has(url))return CACHE.get(url);
  const c=C();if(!c)return Promise.reject(new Error('no audio'));
  const p=fetch(url).then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.arrayBuffer();})
    .then(ab=>new Promise((res,rej)=>{const q=c.decodeAudioData(ab,res,rej);if(q&&q.then)q.then(res,rej);}));
  CACHE.set(url,p);p.catch(()=>CACHE.delete(url));
  if(CACHE.size>60){const k=CACHE.keys().next().value;CACHE.delete(k);}
  return p;
}
let NOWS=[];
function stopAll(){NOWS.forEach(s=>{try{s.stop();}catch(e){}});NOWS=[];}
/* 재생할 수 있으면 true. 소리가 아직 막혀 있으면 false → 앱이 원래 방식으로 재생 */
function play(url,opt){
  opt=opt||{};if(!url||url==='null')return false;const c=C();if(!c||!running())return false;
  buf(url).then(b=>{const s=c.createBufferSource();s.buffer=b;const v=c.createGain();v.gain.value=opt.vol==null?1:opt.vol;s.connect(v);v.connect(master);
    s.onended=()=>{NOWS=NOWS.filter(x=>x!==s);if(opt.onended)opt.onended();};

   .catch(()=>{try{const a=new Audio(url);a.volume=1;if(opt.onended)a.onended=opt.onended;a.play().catch(()=>{});}catch(e){}});

  const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='ko-KR';ss.speak(u);}catch(e){}}

/* 앱별 연결 ---------------------------------------------------------- */
function hookKyorugi(){
  /* 겨루기 신호음(경적·부저): 미리 읽어 두고 바로 재생 */
  const DEF=g('DEF_SND'),FILE=g('SND_FILE');
  if(!DEF||typeof window.playFile!=='function'||window.playFile.__ks)return;
  const old=window.playFile;
  const nf=function(key){const d=(FILE&&FILE[key])||DEF[key];if(!d)return false;if(play(d))return true;return old(key);};
  nf.__ks=1;window.playFile=nf;
