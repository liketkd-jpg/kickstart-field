<title>대회 본부</title>
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
:root{--bg:#ECEEF1;--surface:#fff;--sunk:#F3F4F6;--ink:#0B0D12;--muted:#5B616C;--line:#DADDE3;--brass-1:#E6CD97;--brass-2:#B8904E;--brass-ink:#1A1306;
  --ok:#17804A;--ok-soft:#E3F3EA;--warn:#B4620B;--warn-soft:#FBEFDF;--red:#C8202A;--red-soft:#FBEAEB;--blue:#1846C8;--blue-soft:#E8EDFB;
  --f:"Archivo","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;--shadow:0 1px 2px rgba(11,13,18,.05),0 10px 30px -12px rgba(11,13,18,.18)}
@media (prefers-color-scheme:dark){:root:not(.light){--bg:#0A0C10;--surface:#13161C;--sunk:#1A1E25;--ink:#F1EEE7;--muted:#9BA1AB;--line:#272C35;--ok:#43C985;--ok-soft:#10261A;--warn:#F0A64A;--warn-soft:#2D2111;--red:#FF5A62;--red-soft:#2E1418;--blue:#5C86FF;--blue-soft:#141C33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left));background:linear-gradient(180deg,#14171D,#0B0D12);color:#F4EFE4;border-bottom:1px solid rgba(214,182,124,.35)}
.bar .brand{font-stretch:118%;font-weight:700;letter-spacing:.06em;font-size:15px}.bar .brand span{color:var(--brass-1)}
.bar .sub{color:#CFC8B8;font-size:14px;font-weight:600}
.bar .sp{flex:1}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:3px}
.tabs a{color:#D9D4C8;text-decoration:none;font-weight:700;font-size:14px;padding:7px 14px;border-radius:9px}
.tabs a.on{background:linear-gradient(180deg,#2A2519,#1D1A12);color:var(--brass-1);box-shadow:inset 0 0 0 1px rgba(214,182,124,.35)}
main{max-width:1240px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:14px}
.mvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.mvr.mvrec{background:rgba(217,164,65,.14);border-radius:8px;box-shadow:inset 3px 0 0 #D9A441;padding:2px 4px}.mvtip{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.mvgo{font-size:15px;padding:10px 16px}
/* v1.4.49 기능 화면을 열면 모니터 가로 폭 전체를 쓰고(글씨는 그대로), 칸을 옆으로 펼쳐 스크롤을 줄입니다 */
main:has(.hqs-open){max-width:none;padding:12px 22px 16px}
.hqs-open .hqs-head{padding-block:2px}
.hqs-page[data-k="call"]>.panel{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);column-gap:22px;row-gap:10px;align-content:start}
.hqs-page[data-k="call"]>.panel>*{grid-column:1}
.hqs-page[data-k="call"]>.panel>.row.between{grid-column:1/-1}
.hqs-page[data-k="call"]>.panel>div:nth-last-child(2){grid-column:2;grid-row:2/span 5;align-self:start}
.hqs-page[data-k="call"]>.panel>div:last-child{max-height:calc(100vh - 560px);min-height:110px;overflow:auto}
.hqs-page[data-k="call"] .rmph .btn{font-size:15px}
.hqs-page .mvgrid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.hqs-page .mvl{max-height:calc(100vh - 360px);min-height:180px}
.hqs-page .mvr{font-size:15px;padding-block:2px}
.hqs-page[data-k="court"] table td,.hqs-page[data-k="court"] table th{font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;border-right:1px solid var(--line);color:var(--muted,#A39D91);font:inherit;font-weight:800;font-size:14px;padding:7px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(180deg,#EBD5A3,#B8904E);color:#1A1306}
.rchk{background:var(--sunk,transparent);border:1px solid var(--line);color:var(--muted,#A39D91);border-radius:999px;padding:7px 14px;font:inherit;font-weight:800;font-size:14.5px;cursor:pointer}
.rchk.on{color:#1A1306;background:linear-gradient(180deg,#EBD5A3,#B8904E);border-color:transparent}
.rtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rtile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(201,162,98,.10),rgba(201,162,98,.02));color:inherit;font:inherit;cursor:pointer}
.rtile:hover{border-color:#C9A262}.rtile .ic{font-size:30px}.rtile b{font-size:19px}.rtile .sm{font-size:13px;color:var(--muted,#A39D91);line-height:1.45}.rtile .go{margin-top:auto;font-size:13px;font-weight:800;color:#EAD7A8}
.rdet{border:1px solid rgba(201,162,98,.45);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,rgba(201,162,98,.08),transparent)}
.rmmss{display:inline-flex;align-items:center;gap:4px}
.rfoot{border-top:1px solid var(--line);padding-top:10px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.rbox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--sunk,transparent)}
.rbox h3{margin:0;font-size:17px}.rrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.rrow>b{min-width:110px;font-size:15px}
.cktab td,.cktab th{font-size:15px;padding:8px 6px}
.mvc{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mvc.late{border-color:#D9A441;box-shadow:0 0 0 2px rgba(217,164,65,.25)}
.mvl{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.mvr{display:flex;align-items:center;gap:8px;font-size:13.5px}.mvn{flex:1;min-width:0;line-height:1.25;word-break:keep-all}
.mvsel{width:auto;padding:3px 6px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
h2{margin:0;font-size:19px;font-stretch:105%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;font-size:14.5px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:linear-gradient(180deg,var(--brass-1),var(--brass-2));border-color:#A07E43;color:var(--brass-ink)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.on{box-shadow:inset 0 0 0 2px var(--brass-2)}
input[type=text],textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
textarea{width:100%;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--red-soft);color:var(--red)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{text-align:left;font-size:12.5px;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;width:1%;white-space:nowrap;padding-left:22px}
.alert{border-radius:12px;padding:10px 14px;font-weight:700;font-size:14.5px;border:1.5px solid}
.alert.bad{background:var(--red-soft);color:var(--red);border-color:var(--red)}.alert.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0B0D12;color:#F4EFE4;border:1px solid rgba(214,182,124,.45);padding:11px 18px;border-radius:999px;font-weight:700;z-index:90}
.medal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:900;color:#1A1306;margin-right:6px}
.m1{background:linear-gradient(180deg,#F6DE8D,#C9A13B)}.m2{background:linear-gradient(180deg,#E9EDF2,#AEB6C1)}.m3{background:linear-gradient(180deg,#F0C49B,#B9783F)}

/* ===== 본부 모니터 ===== */
html:has(body.mon),body.mon{height:100%;background:#050608 radial-gradient(1400px 800px at 50% -10%,#1A1D24,#050608 60%) no-repeat fixed}
body.mon{color:#F6F2E9;overflow:hidden}
body.mon .bar,body.mon main{display:none}
#mon{display:none}
body.mon #mon{display:grid;position:fixed;inset:0;grid-template-rows:auto minmax(0,1fr) auto;gap:1.4vh;padding:1.8vh 1.6vw}
.mh{display:flex;align-items:center;gap:1.2vw}
.mh .logo{width:min(3.4vw,5.4vh);height:min(3.4vw,5.4vh)}
.mh b{font-size:min(2.4vw,4vh);font-stretch:110%;letter-spacing:-.01em}
.mh .sp{flex:1}
.mh .clock{font-variant-numeric:tabular-nums;font-size:min(2.8vw,4.6vh);font-weight:800;color:#EBD5A3;font-stretch:112%}
.mh .ctl{display:flex;gap:6px;opacity:.25;transition:opacity .2s}.mh .ctl:hover{opacity:1}
.mh .ctl button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#F6F2E9;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer}
.cols{display:grid;gap:1.2vw;min-height:0}
.col{display:flex;flex-direction:column;gap:1.1vh;min-height:0;min-width:0;background:linear-gradient(180deg,#14171D,#0D0F13);border:1px solid rgba(255,255,255,.08);border-radius:min(1.4vw,2.2vh);padding:min(1.2vw,2vh);overflow:hidden;position:relative}
.col.off{opacity:.55}
.col.off::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,60,70,.06) 0 14px,transparent 14px 28px);pointer-events:none}
.ch{display:flex;align-items:center;gap:.8vw;min-width:0}
.ch .lt{display:grid;place-items:center;width:min(5vw,8vh);height:min(5vw,8vh);border-radius:min(1vw,1.6vh);background:linear-gradient(180deg,#EBD5A3,#B8904E);color:#1A1306;font-weight:900;font-size:min(3.4vw,5.6vh);font-stretch:118%;flex:none}
.ch .cn{display:flex;flex-direction:column;min-width:0}.ch .cn b{font-size:min(2vw,3.4vh)}.ch .cn span{font-size:min(1.3vw,2.2vh);color:#A9AFB9;font-weight:700}
.ch .st{margin-left:auto;font-size:min(1.1vw,1.9vh);font-weight:800;padding:.35em .8em;border-radius:999px;white-space:nowrap}
.st.live{background:rgba(67,201,133,.15);color:#6BE0A4}.st.off{background:rgba(255,90,98,.15);color:#FF8A90}.st.idle{background:rgba(240,166,74,.15);color:#F5B66A}
.now{border-radius:min(1vw,1.6vh);padding:min(1vw,1.6vh);background:linear-gradient(160deg,rgba(230,205,151,.16),rgba(230,205,151,.04));border:1px solid rgba(230,205,151,.35)}
.now .k{font-size:min(1.1vw,1.9vh);font-weight:800;color:#E6CD97;letter-spacing:.08em}
.now .dv{font-size:min(1.5vw,2.5vh);font-weight:800;color:#E9E4D8;margin-top:.2vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .lb{font-size:min(1.2vw,2vh);color:#A9AFB9;font-weight:700}
.now .nm{display:flex;flex-direction:column;gap:.3vh;margin-top:.6vh}
.nm .p{font-size:min(2.6vw,4.4vh);font-weight:900;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .p small{font-size:.48em;color:#A9AFB9;font-weight:700;margin-left:.5em}
.p.blue{color:#8FB0FF}.p.red{color:#FF8E95}
.prog{height:min(.7vw,1.1vh);border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:.8vh}.prog i{display:block;height:100%;background:linear-gradient(90deg,#B8904E,#EBD5A3)}
.pl{font-size:min(1.05vw,1.8vh);color:#A9AFB9;font-weight:700;margin-top:.4vh}
.sec{font-size:min(1.05vw,1.8vh);font-weight:800;color:#CFC8B8;letter-spacing:.06em;margin-top:.4vh}
.nx{display:flex;flex-direction:column;gap:.6vh}
.nx div{display:flex;gap:.6vw;align-items:baseline;min-width:0;padding:.5vh .6vw;border-radius:.6vw;background:rgba(255,255,255,.04)}
.nx .lb2{flex:none;font-size:min(1vw,1.7vh);color:#A9AFB9;font-weight:700;min-width:4.5em}
.nx .nn{font-size:min(1.45vw,2.4vh);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt{display:flex;flex-wrap:wrap;gap:.5vh .4vw}
.wt span{font-size:min(1.1vw,1.9vh);font-weight:700;padding:.25em .7em;border-radius:999px;background:rgba(255,255,255,.07);color:#E9E4D8;white-space:nowrap}
.nd{margin-top:auto;font-size:min(1.2vw,2vh);font-weight:800;color:#F5B66A}
.nd b{color:#F6F2E9}
.offmsg{font-size:min(1.4vw,2.3vh);font-weight:800;color:#FF8A90}
.mf{display:flex;align-items:center;gap:1vw;min-height:0}
.ticker{flex:1;overflow:hidden;white-space:nowrap;border-radius:999px;background:linear-gradient(90deg,rgba(230,205,151,.10),rgba(230,205,151,.18),rgba(230,205,151,.10));border:1px solid rgba(230,205,151,.45);padding:.7vh 1.4vw;font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-weight:400;font-size:min(2vw,3.3vh);letter-spacing:.02em;color:#F7E7C2}
.ticker span{display:inline-block;padding-left:100%;animation:tk var(--d,22s) linear infinite}
.ticker.fit span{padding-left:0;animation:none}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.mf .ks{font-stretch:125%;font-weight:800;font-size:min(1vw,1.7vh);letter-spacing:.1em;color:rgba(244,239,228,.5)}
.full{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(1200px 700px at 50% 30%,#1D1A12,#050608 70%);text-align:center;padding:6vh 6vw}
.full b{display:block;font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-weight:400;font-size:min(6.6vw,11vh);line-height:1.28;letter-spacing:.01em;word-break:keep-all;white-space:pre-wrap;background:linear-gradient(180deg,#FFF6DE 0%,#F1D79A 55%,#C9A35C 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(0,0,0,.65))}
.full span{display:block;margin-top:4vh;font-family:'Archivo','Malgun Gothic',sans-serif;font-size:min(1.6vw,2.6vh);color:#C9B48A;font-weight:800;letter-spacing:.3em}
/* 호출·안내: 어두운 칠기 판 + 금빛 테두리 + 굵은 검은고딕(Black Han Sans) 금빛 글씨 — 멀리서도 또렷하게 */
.ann b .al,.full b .al{display:block}.ann b .al+.al,.full b .al+.al{margin-top:.18em}.ann b .crt{font-size:1.18em;color:#F4E2B4}.ann b .div{font-size:.82em;opacity:.97}
.ann{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(1400px 800px at 50% 50%,rgba(20,16,8,.55),rgba(2,3,5,.82));backdrop-filter:blur(5px);animation:afade .3s ease-out}
.ann>div{width:min(94vw,1700px);padding:5vh 4vw 6vh;border-radius:30px;text-align:center;background:linear-gradient(180deg,#1A160D,#0A0A0C 70%);border:2px solid rgba(230,205,151,.6);
  box-shadow:0 0 0 1px rgba(0,0,0,.7),0 50px 140px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,240,200,.28),0 0 120px rgba(214,182,124,.22);animation:apop .45s cubic-bezier(.2,.9,.25,1.15)}
.ann small{display:inline-block;font-family:'Archivo','Malgun Gothic',sans-serif;font-size:min(1.7vw,2.8vh);font-weight:800;letter-spacing:.32em;color:#1A1306;background:linear-gradient(180deg,#F4E2B4,#C9A35C);padding:.7vh 1.6vw .7vh 1.9vw;border-radius:999px;margin-bottom:3.4vh;box-shadow:0 6px 20px rgba(201,163,92,.35)}
.ann b{display:block;font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-weight:400;font-size:min(6.4vw,11.5vh);line-height:1.28;letter-spacing:.01em;word-break:keep-all;
  background:linear-gradient(180deg,#FFF7E2 0%,#F3DAA0 55%,#C9A35C 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(0,0,0,.7))}
@keyframes afade{from{opacity:0}to{opacity:1}}@keyframes apop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ain{from{transform:translateY(-50%) scaleY(.2);opacity:0}to{transform:translateY(-50%) scaleY(1);opacity:1}}
.tapv{position:fixed;left:50%;top:1.4vh;transform:translateX(-50%);z-index:40;border:2px solid #F0A64A;background:#000;color:#fff;border-radius:999px;padding:12px 20px;font-weight:800;font-size:16px;cursor:pointer}
.idlecomp{display:grid;place-content:center;gap:3vh;text-align:center;min-height:60vh}
.idlecomp b{font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-weight:400;font-size:min(7vw,12vh);line-height:1.2;word-break:keep-all;background:linear-gradient(180deg,#FFF6DE 0%,#F1D79A 55%,#C9A35C 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(0,0,0,.6))}
.idlecomp span{color:#A9AFB9;font-size:min(1.8vw,3vh);font-weight:700}
.nocourt{display:grid;place-items:center;text-align:center;color:#A9AFB9;font-size:min(2vw,3.4vh);font-weight:700}

/* ===== 기존 대회 앱과 같은 모습 (KICKSTART UP) ===== */
:root{--f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--f-disp:"Archivo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
body{font-family:var(--f-body);font-size:15px;letter-spacing:-.01em}
h2{font-family:var(--f-body);font-weight:900;font-size:20px}
.bar{gap:12px;padding-block:12px}
.bar svg.logo{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 10px rgba(201,162,98,.25))}
.ksword{font-family:"Archivo",var(--f-body);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:.06em;color:#F4EFE4;white-space:nowrap;padding-right:12px;margin-right:2px;border-right:1px solid rgba(230,205,151,.35);line-height:1}
.ksword b{margin-left:.35em;background:linear-gradient(180deg,#F3DFAE,#B8904E);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar .brand{font-family:var(--f-body);font-weight:700;font-size:16px;letter-spacing:.04em;color:#F4EFE4;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){.ksword{display:none}}
.tabwrap{max-width:1180px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 0}
.tabwrap .tabs{display:flex;gap:2px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.tabwrap .tabs a{font-family:var(--f-body);font-weight:700;font-size:15px;color:var(--muted);text-decoration:none;padding:9px 14px;border-radius:10px;white-space:nowrap}
.tabwrap .tabs a:hover{background:var(--sunk);color:var(--ink)}

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT=null;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800);}
const route=()=>{const h=location.hash.replace('#','');return ['board','admin','results','print'].includes(h)||/^room-r[1-6]$/.test(h)?h:'admin';};
const S={courts:{},cfg:{},announce:null,log:[],ready:false,moves:{},mvArm:null};window.KS_HQS=()=>S;
let DB=null,DL=null;
const CFGDEF={autoCall:true,voice:true,notice:{text:'',mode:'off'},manual:[],points:[3,2,1]};
const CFG=()=>({...CFGDEF,...(S.cfg||{})});
const saveCfg=p=>DB.doc('hqcfg/main').set({...CFG(),...p}).catch(()=>toast('저장하지 못했습니다'));
const NOW=()=>Date.now();
/* 전광판 디자인: 「따라가기」면 품새 코트 노트북의 전광판 디자인을 그대로 씁니다 */
const THEMES=[['follow','코트 전광판 따라가기'],['gold','기본 금빛'],['ed','매거진'],['ch','시계'],['tm','데이터'],['ink','한지와 먹'],['st','스트리트']];
function hqTheme(list){const t=CFG().theme||'follow';if(t!=='follow')return t==='classic'?'gold':t;
  const cs=(list||[]).filter(c=>c.app&&c.app.board&&c.app.board.theme);const c=cs.find(c=>c.app.board.app==='poomsae')||cs[0];const v=c?c.app.board.theme:'gold';return v==='classic'?'gold':v;}
const themePick=cls=>`<select class="${cls}" data-hqtheme title="본부 화면 디자인">${THEMES.map(([k,l])=>`<option value="${k}" ${(CFG().theme||'follow')===k?'selected':''}>🎨 ${l}</option>`).join('')}</select>`;
document.addEventListener('change',e=>{const s=e.target.closest&&e.target.closest('[data-hqtheme]');if(s)saveCfg({theme:s.value});});

/* ---------- 코트 정리 ---------- */
/* 코트별 유튜브 생중계 표시 */
function liveChip(c){const L=c&&c.online&&c.live;if(!L)return '';const ok=L.state==='live';
  return ` <span class="chip ${ok?'livec':'bad'}" title="유튜브 생중계"><i class="dot"></i>${ok?'🔴 생중계 중':L.state==='retry'?'생중계 끊김 · 다시 연결 중':'생중계 연결 중'}</span>`;}
function courtList(){
  return Object.entries(S.courts).map(([id,c])=>{
    const apps=c.apps||{};let best=null;
    for(const [k,v] of Object.entries(apps)){const b=v&&v.board;if(b&&(!best||(b.at||0)>(best.board.at||0)))best={key:k,board:b,results:v.results||null};}
    const age=best&&best.board.at?NOW()-best.board.at:null;
    return {id,addr:c.addr,via:c.via,court:c.court||'?',online:!!c.online,lastSeen:c.lastSeen||0,app:best,stale:c.online&&(!best||age>40000),apps,live:c.live&&c.live.on?c.live:null,rulesAt:c.rulesAt||0,licEnds:c.licEnds||''};
  }).sort((a,b)=>(a.court||'').localeCompare(b.court||'')||a.addr.localeCompare(b.addr));
}
function dupLetters(list){const m={};list.forEach(c=>{m[c.court]=(m[c.court]||0)+1;});return Object.keys(m).filter(k=>m[k]>1);}
function ago(t){if(!t||t<1e12)return '—';const s=Math.round((NOW()-t)/1000);return s<60?s+'초 전':Math.round(s/60)+'분 전';}
const VIA={beacon:'자동',scan:'주소 훑기',manual:'직접 입력'};
function alerts(list){
  const out=[];
  list.forEach(c=>{if(c.online&&c.live&&c.live.state==='retry')out.push(['bad',`${c.court}코트 유튜브 생중계가 끊겼습니다. 다시 연결하는 중입니다. 체육관 인터넷(공유기 인터넷선)을 확인해 주세요.`]);});
  list.forEach(c=>{if(!c.online)out.push(['bad',`${c.court}코트 노트북과 연결이 끊겼습니다 (${c.addr} · 마지막 연결 ${ago(c.lastSeen)}). 노트북 전원, 와이파이, 현장 모드 프로그램(검은 창)을 확인해 주세요.`]);
    else if(c.stale)out.push(['warn',`${c.court}코트: 운영석 화면이 열려 있지 않거나 멈춰 있습니다. 코트 노트북에서 운영석(경기 진행)을 열어 주세요.`]);
    else if(c.app)out.push(...judgeAlerts(c.court,c.app.board));});
  stallAlerts(list).forEach(x=>out.push(x));
  dupLetters(list).forEach(l=>out.push(['warn',`${l}코트로 설정된 노트북이 두 대 이상입니다. 코트 노트북 첫 화면의 「역할 바꾸기」에서 코트 이름을 다르게 해 주세요.`]));
  return out;
}

const FIELD_MODE=true;
/* ---------- 심판 연결 점검: 코트마다 심판 휴대폰 하나하나 ---------- */
const JST={ok:['ok','연결됨'],off:['bad','끊김'],wait:['warn','전송 대기'],none:['idle','미접속'],solo:['ok','운영석 직접 채점']};
function fmtSec(s){return s<60?s+'초':Math.floor(s/60)+'분 '+(s%60)+'초';}
function judgeChips(b,live){
  const J=b&&b.judges;if(!J||!J.list||!J.list.length)return '';
  return `<div class="jrow"><span class="small muted">심판</span>${J.list.map(j=>{const [c,l]=live?(JST[j.st]||['idle','?']):['idle','알 수 없음'];
    return `<span class="jch ${c}" title="${j.n}${J.label} · ${l}${j.q?' · 보관 '+j.q+'건':''}"><i></i>${j.n}${J.label}${live&&j.st==='off'?' 끊김':live&&j.st==='wait'?' 대기 '+j.q:live&&j.st==='none'?' 미접속':''}${live&&J.open&&j.sent?' ✓':''}</span>`;}).join('')}</div>`;
}
function judgeAlerts(court,b){
  const out=[],J=b&&b.judges;if(!J||!J.list)return out;if(window.KSPLAN&&KSPLAN.simOn)return out;/* 가상 경기 중에는 심판 휴대폰 알림을 띄우지 않음 */const L=J.label;

/* ---------- 통합 결과 ---------- */
function allResults(){
  const out=[];courtList().forEach(c=>{for(const [k,v] of Object.entries(c.apps||{})){const r=v&&v.results;if(!r||!r.divs)continue;r.divs.forEach(d=>out.push({court:c.court,app:r.appName||k,...d}));}});
  return out.sort((a,b)=>(a.court||'').localeCompare(b.court||'')||a.app.localeCompare(b.app)||a.div.localeCompare(b.div,'ko'));
}
function teamTally(rs){
  const pt=CFG().points||[3,2,1],m=new Map();
  rs.forEach(d=>d.podium.forEach(p=>{if(!p.team)return;const t=m.get(p.team)||{team:p.team,g:0,s:0,b:0};if(p.rank===1)t.g++;else if(p.rank===2)t.s++;else if(p.rank===3)t.b++;m.set(p.team,t);}));
  const list=[...m.values()].map(t=>({...t,pts:t.g*pt[0]+t.s*pt[1]+t.b*pt[2]})).sort((a,b)=>b.pts-a.pts||b.g-a.g||b.s-a.s||b.b-a.b||a.team.localeCompare(b.team,'ko'));
  let rank=0,prev=null;list.forEach((t,i)=>{const k=[t.pts,t.g,t.s,t.b].join();if(k!==prev){rank=i+1;prev=k;}t.rank=rank;});
  return list;
}
function vResults(){
  const rs=allResults(),tally=teamTally(rs),done=rs.filter(d=>d.done).length;
  const med=r=>`<span class="medal m${r}">${r}</span>`;
  return `<div class="panel"><div class="row between"><h2>팀 종합 순위 <span class="small muted">· 모든 코트 합계 (금 ${CFG().points[0]} · 은 ${CFG().points[1]} · 동 ${CFG().points[2]}점)</span></h2><span class="row"><button class="btn primary" data-a="xlsx">엑셀로 저장</button><button class="btn" data-a="print">인쇄</button></span></div>
    ${tally.length?`<div style="overflow-x:auto"><table><tr><th class="num" style="text-align:left">순위</th><th>팀(소속)</th><th class="num">금</th><th class="num">은</th><th class="num">동</th><th class="num">점수</th></tr>${tally.map(t=>`<tr><td class="num" style="width:1%">${t.rank<=3?med(t.rank):t.rank}</td><td><b>${esc(t.team)}</b></td><td class="num">${t.g}</td><td class="num">${t.s}</td><td class="num">${t.b}</td><td class="num">${t.pts}</td></tr>`).join('')}</table></div>`:'<div class="empty">아직 입상 결과가 없습니다.</div>'}</div>
  <div class="panel"><div class="row between"><h2>부문별 입상자</h2><span class="small muted">${rs.length}개 부문 · 확정 ${done}개</span></div>
    ${rs.length?`<div style="overflow-x:auto"><table><tr><th>코트</th><th>부문</th><th>상태</th><th>1위</th><th>2위</th><th>3위</th></tr>${rs.map(d=>{const by=r=>d.podium.filter(p=>p.rank===r).map(p=>`<div><b>${esc(p.name)}</b> <span class="small muted">${esc(p.team)}</span></div>`).join('')||'<span class="muted">—</span>';
      return `<tr><td style="white-space:nowrap"><b>${esc(d.court)}</b> <span class="small muted">${esc(d.app)}</span></td><td>${esc(d.div)}</td><td>${d.done?'<span class="chip ok">확정</span>':'<span class="chip warn">진행 중</span>'}</td><td>${by(1)}</td><td>${by(2)}</td><td>${by(3)}</td></tr>`;}).join('')}</table></div>`:'<div class="empty">코트에서 경기 결과가 나오면 여기에 모입니다.</div>'}</div>`;
}
function exportXlsx(){
  if(typeof XLSX==='undefined'){toast('엑셀 도구를 불러오지 못했습니다');return;}
  const rs=allResults(),tally=teamTally(rs),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['순위','팀(소속)','금','은','동','점수'],...tally.map(t=>[t.rank,t.team,t.g,t.s,t.b,t.pts])]),'팀 종합');
  const rows=[['코트','종목','부문','상태','순위','이름','소속']];rs.forEach(d=>d.podium.forEach(p=>rows.push([d.court+'코트',d.app,d.div,d.done?'확정':'진행 중',p.rank,p.name,p.team])));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'부문별 입상');
  const data=XLSX.write(wb,{bookType:'xlsx',type:'array'}),d=new Date(),f=`본부_통합결과_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.xlsx`;
  (DL?DL.save({filename:f,data:new Uint8Array(data)}):Promise.reject()).catch(()=>toast('저장하지 못했습니다'));
}

/* ---------- 음성 ---------- */
/* v1.4.45 자연스러운 AI 목소리
   엣지: Microsoft 선히·인준·현수 (Online Natural · 인터넷 필요) / 크롬: Google 한국의 (인터넷 필요) / 윈도우 기본: Heami (인터넷 없이)
   인터넷 목소리가 끊기거나 5초 안에 소리가 나지 않으면 노트북 기본 목소리로 자동으로 다시 읽습니다. */
const VNET=v=>!!v&&(v.localService===false||/Online|Natural|Neural|Google/i.test(v.name));
const VMALE=v=>!!v&&/InJoon|Hyunsu|Gookmin|Bongjin|male|남자|남성/i.test(v.name)&&!/female|여자|여성/i.test(v.name);
function koVoices(){try{return speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));}catch(e){return [];}}
function vRank(v){return (/Natural|Neural/i.test(v.name)?0:/Online/i.test(v.name)?1:/Google/i.test(v.name)?2:3)*2+(VMALE(v)?1:0);}
function localVoice(){const L=koVoices().filter(v=>!VNET(v));return L.find(v=>!VMALE(v))||L[0]||null;}
function koVoice(){const vs=koVoices(),online=navigator.onLine!==false;
  /* 본부 설정에서 고른 목소리가 이 노트북에 있으면 그 목소리 (인터넷 목소리는 인터넷이 있을 때만) */

function hqTileState(k){const cf=CFG(),list=courtList(),n=cf.notice||{};

    case 'call':return [`자동 호출 ${cf.autoCall?'켜짐':'꺼짐'}${S.log[0]?' · 최근 '+new Date(S.log[0].at).toTimeString().slice(0,5):''}`,''];
    case 'notice':return [n.mode==='full'?'전체 화면 표시 중':n.mode==='banner'&&n.text?'아래 띠 표시 중':'표시 안 함',n.mode&&n.mode!=='off'&&n.text?'ok':''];
    case 'coll':{const c=Object.keys((S.coll&&S.coll.courts)||{}).length;return [c?`${c}개 코트 모음`:'아직 없음',c?'ok':''];}
    case 'cert':{const q=certFiles().filter(needPrint).length;return [`${cf.certAuto?'켜짐':'꺼짐'}${q?` · 대기 ${q}`:''}`,cf.certAuto?(q?'warn':'ok'):''];}

    case 'bat':return window.KS_BAT?KS_BAT.tile():['정보 없음',''];
    case 'check':{const R=list.map(ckRow),n=R.filter(r=>r.ok).length;return [R.length?`${n}/${R.length} 코트 준비됨`:'코트 없음',R.length&&n===R.length?'ok':R.length?'warn':''];}
    case 'rules':{const on=list.filter(c=>c.online),got=on.filter(c=>RULES.at&&c.rulesAt===RULES.at).length,ne=Object.values(rulesNow().events).filter(Boolean).length;return [RULES.at?`종목 ${ne}개 · ${got}/${on.length} 코트 받음`:'아직 정하지 않음',RULES.at?(got===on.length?'ok':'warn'):'warn'];}

function hqShell(html){
  let t;try{t=document.createElement('template');t.innerHTML=html;}catch(e){return html;}
  const top=[],cards=[];
  const walk=el=>[...el.children].forEach(c=>{if(c.classList.contains('panel')){const h=c.querySelector('h2'),ht=h?h.textContent:'';const m=HQ_T.find(x=>x[0].test(ht));
      const key=m?m[1]:'p'+cards.length;cards.push({key,ic:m?m[2]:'📁',title:m?m[3]:(ht.trim().slice(0,20)||'기타'),el:c});}
    else if(c.classList.contains('grid2')||(!c.className&&c.querySelector('.panel')))walk(c);else top.push(c);});
  walk(t.content);
  if(HSEL&&!cards.some(c=>c.key===HSEL))HSEL=null;
  const out=document.createElement('div');out.className='hqs'+(HSEL?' hqs-open':'');
  top.forEach(x=>out.appendChild(x));
  const tiles=document.createElement('div');tiles.className='hqs-tiles';if(HSEL)tiles.hidden=true;
  tiles.innerHTML=cards.map(c=>{const [st,cl]=hqTileState(c.key);return `<button class="hqs-tile ${cl}" data-a="hqOpen" data-k="${c.key}"><span class="hqs-ic">${c.ic}</span><b>${esc(c.title)}</b><span class="hqs-st">${esc(st||'열어서 보기')}</span>${cl==='warn'?'<i class="hqs-dot"></i>':''}</button>`;}).join('');
  out.appendChild(tiles);
  cards.forEach(c=>{const w=document.createElement('div');w.className='hqs-page';w.dataset.k=c.key;if(HSEL!==c.key)w.hidden=true;
    w.innerHTML=`<div class="hqs-head"><button class="btn" data-a="hqClose">← 본부 메뉴</button><span class="hqs-ic">${c.ic}</span><h2>${esc(c.title)}</h2><button class="btn primary" data-a="hqClose">닫기 ✕</button></div>`;
    w.appendChild(c.el);out.appendChild(w);});
  return out.outerHTML;
}

   대기실(2~6곳, 이름·종목 바꾸기)마다 QR → 진행 요원 휴대폰이 「#room-r1」 화면을 엽니다 (대회장 와이파이).
   - 대기실 → 본부: 「이 부문 불러 주세요」(자동: 바로 본부 모니터·음성 / 수동: 본부가 「전광판 보내기」), 「추가 대기 요청」(코트 운영석에도 알림),
     🚨 긴급(본부에 큰 알림·소리), 메시지·자주 쓰는 말
   - 본부 → 대기실: 메시지(휴대폰에 크게 + 소리) → 대기실이 「확인」 → 본부에 읽음 표시
   - 대기실 화면: 코트별 지금·다음 부문, 남은 경기, 예상 시작 · 출석 체크(도착·불참 → 본부·코트 운영석) · 연락 기록
   저장: roommsg/* (연락 기록), att/* (출석), hqcfg/main 의 roomN·rooms·roomAuto·phHQ·phRoom·voiceName */
const RDEF=[{id:'r1',name:'품새 대기실',app:'poomsae',kw:'-체조,-경연,-단체'},{id:'r2',name:'격파 대기실',app:'gyeokpa',kw:'-경연,-단체'},{id:'r3',name:'팀 대항 대기실',app:'',kw:'체조,경연,단체'},
  {id:'r4',name:'대기실 4',app:'',kw:''},{id:'r5',name:'대기실 5',app:'',kw:''},{id:'r6',name:'대기실 6',app:'',kw:''}];
const PH_HQ=['다음 부문 선수 입장 준비해 주세요.','5분 뒤 입장합니다. 선수 줄 세워 주세요.','잠시 대기해 주세요. 코트 정리 중입니다.','점심시간입니다. 13시에 다시 시작합니다.'];
const PH_ANN=['중등부 3학년 대기실로 모여 주시기 바랍니다.','시상식을 시작합니다.','입상 선수는 시상대 앞으로 모여 주세요.','점심시간입니다. 13시에 경기가 다시 시작됩니다.','잠시 후 오후 경기가 시작됩니다. 선수들은 준비해 주세요.','대회장 안에서는 음식물 섭취를 삼가 주세요.'];
const PH_RM=['선수 입장 준비 끝났습니다.','선수가 아직 다 오지 않았습니다.','물·구급함이 필요합니다.','대기실이 붐빕니다. 안내 요원을 보내 주세요.'];
const RK={call:['📣','호출 요청'],ann:['📢','방송 요청'],wait:['⏳','추가 대기 요청'],emg:['🚨','긴급'],msg:['💬','메시지']};
const RST={new:['warn','새 요청'],sending:['warn','보내는 중'],sent:['ok','전광판에 나감'],done:['','처리함'],ack:['ok','확인함']};
const RS={seen:null,view:null,hv:null,div:'',all:false,unlocked:false,lastBeep:0,fwdT:{}};
function rooms(){const cf=CFG(),n=Math.min(6,Math.max(2,Number(cf.roomN)||3)),sv=cf.rooms||[];return RDEF.slice(0,n).map((d,i)=>({...d,...(sv[i]||{}),id:d.id}));}
const roomOf=id=>rooms().find(r=>r.id===id)||null;
function kwMatch(r,app,div){if(r.app&&r.app!==app)return false;div=String(div||'');const ks=String(r.kw||'').split(/[,\s]+/).filter(Boolean),inc=ks.filter(k=>k[0]!=='-'),exc=ks.filter(k=>k[0]==='-').map(k=>k.slice(1)).filter(Boolean);
  return (!inc.length||inc.some(k=>div.includes(k)))&&!exc.some(k=>div.includes(k));}
const spoken=d=>String(d||'').replace(/^\d+\s+/,'');
const callText=(u,r)=>`${u.court}코트, ${spoken(u.div)} 선수는 ${r.name}로 와 주세요.`;
const rid=p=>(p||'m')+NOW().toString(36)+Math.random().toString(36).slice(2,6);
const hash36=s=>{let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return (h>>>0).toString(36);};
const msgs=()=>S.rmsg||[];
/* 코트별 진행 (대기실 종목만 / 전체): 지금 부문 + 남은 부문의 예상 시작 */
function roomLanes(r,all){return lanes().map(L=>{let t=NOW();const items=[];
    L.rem.forEach(d=>{const left=d.total-d.done,mine=all||!r||kwMatch(r,L.app,d.name);if(mine)items.push({name:d.name,done:d.done,total:d.total,left,live:d.live,start:t});t+=left*L.p.min*60000;});
    return {...L,items};}).filter(L=>L.items.length);}
/* 출석: 보드의 upcoming(지금·다음 부문 선수) + 저장된 도착·불참 */
function upcoming(r,all){const out=[];for(const c of courtList()){if(!c.online)continue;for(const [app,v] of Object.entries(c.apps||{})){const b=v&&v.board;if(!b||!Array.isArray(b.upcoming))continue;
    b.upcoming.forEach((u,i)=>{if(all||!r||kwMatch(r,app,u.name))out.push({court:c.court,app,div:u.name,names:u.names||[],order:i,live:b.curDiv===u.name});});}}
  return out.sort((a,b)=>a.order-b.order||a.court.localeCompare(b.court));}
const attKey=(court,app,div)=>'a'+hash36(court+'|'+app+'|'+div);
function attList(u){const d=(S.att||{})[attKey(u.court,u.app,u.div)],st={};((d&&d.list)||[]).forEach(p=>st[p.name+'|'+(p.team||'')]=p.st);
  return u.names.map(p=>({name:p.name,team:p.team||'',st:st[p.name+'|'+(p.team||'')]||''}));}
async function toCourt(court,app,kind,id,doc){try{const r=await fetch('/api/hq/tocourt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({court,app,kind,id,doc})});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||'HTTP '+r.status);}return true;}catch(e){toast('코트 운영석에 알리지 못했습니다: '+e.message);return false;}}

/* 자동 호출: 대기실 휴대폰이 보낸 「부문 호출」·「방송」을 본부 노트북(본부 운영 또는 본부 모니터 화면)이 바로 내보냄.
   (예전에는 휴대폰이 직접 내보내서, 휴대폰과 노트북 시계가 다르면 본부 모니터가 「지난 호출」로 보고 무시했음)
   본부 화면을 연 순간 이미 쌓여 있던 요청은 내보내지 않음 (수동 확인) */
const DTAB='d'+Math.random().toString(36).slice(2,8),DSENT=new Set();let DINIT=null;
function dispLeader(){if(route().startsWith('room-'))return false;try{const v=JSON.parse(localStorage.getItem('ks_hq_disp')||'null'),now=Date.now();
  if(!v||v.t===DTAB||now-v.at>4000){localStorage.setItem('ks_hq_disp',JSON.stringify({t:DTAB,at:now}));return true;}return false;}catch(e){return true;}}
async function autoDispatch(){if(route().startsWith('room-')||!DB||!S.rmsg)return;
  if(DINIT===null){DINIT=new Set(msgs().filter(m=>m.st==='new').map(m=>m.id));return;}
  if(!dispLeader()||!CFG().roomAuto)return;
  for(const m of msgs().filter(m=>m.dir==='up'&&(m.kind==='call'||m.kind==='ann')&&m.st==='new')){if(DSENT.has(m.id)||DINIT.has(m.id))continue;DSENT.add(m.id);
    try{await callOut(m);}catch(e){DSENT.delete(m.id);}}}
setInterval(autoDispatch,700);

/* ----- 알림: 새 요청·긴급 (본부) / 새 메시지 (대기실) ----- */

/* ----- 버튼 ----- */
async function roomClick(a,b){
  const r=route(),me=r.startsWith('room-')?r.slice(5):null,room=me&&roomOf(me),cf=CFG();
  const pickDiv=()=>{const v=($('#rmDiv')||{}).value||RS.div||'';const U=upcoming(room,RS.all);return U.find(u=>`${u.court}|${u.app}|${u.div}`===v)||U[0]||null;};
  switch(a){
    case 'rmView':RS.view=b.dataset.k||null;render();scrollTo({top:0});return true;
    case 'hqRmView':RS.hv=b.dataset.k||null;render();return true;
    case 'rmAll':RS.all=!RS.all;render();return true;
    case 'rmUnlock':RS.unlocked=true;chime();try{speechSynthesis.speak(new SpeechSynthesisUtterance(' '));}catch(e){}render();return true;
    case 'rmAck':{const m=msgs().find(x=>x.id===b.dataset.id);if(m)await DB.doc('roommsg/'+m.id).set({...m,st:'ack',ackAt:NOW()});return true;}
    case 'rmAtt':{const u=pickDiv();if(!u)return true;const L=attList(u),k=b.dataset.n+'|'+(b.dataset.t||''),p=L.find(x=>x.name+'|'+x.team===k);if(!p)return true;
      p.st=p.st===b.dataset.st?'':b.dataset.st;const id=attKey(u.court,u.app,u.div),doc={court:u.court,app:u.app,div:u.div,list:L,at:NOW(),room:me,roomName:room.name};
      S.att={...(S.att||{}),[id]:doc};render();await DB.doc('att/'+id).set(doc);
      clearTimeout(RS.fwdT[id]);RS.fwdT[id]=setTimeout(()=>toCourt(u.court,u.app,'att',id,{div:u.div,list:L,at:NOW(),room:room.name}),700);return true;}
    case 'rmCall':{const u=pickDiv();if(!u)return toast('부문을 골라 주세요'),true;const text=(($('#rmCallTxt')||{}).value||'').trim()||callText(u,room);
      await postMsg({dir:'up',room:me,roomName:room.name,kind:'call',text,court:u.court,app:u.app,div:u.div,st:'new'});if($('#rmCallTxt'))$('#rmCallTxt').value='';
      toast(cf.roomAuto?'보냈습니다 · 곧 본부 모니터·음성으로 나갑니다':'본부에 호출을 요청했습니다');return true;}
    case 'rmAnn':case 'rmAnnTxt':{const text=a==='rmAnn'?(cf.annPh||PH_ANN)[+b.dataset.i]:(($('#rmAnnTxt')||{}).value||'').trim();if(a==='rmAnnTxt'&&$('#rmAnnTxt'))$('#rmAnnTxt').blur();if(!text)return toast('방송할 문구를 써 주세요'),true;
      await postMsg({dir:'up',room:me,roomName:room.name,kind:'ann',text,st:'new'});if(a==='rmAnnTxt'&&$('#rmAnnTxt'))$('#rmAnnTxt').value='';render();
      toast(cf.roomAuto?'보냈습니다 · 곧 본부 모니터·음성으로 나갑니다':'본부에 방송을 요청했습니다');return true;}
    case 'rmAnnSave':{const t=(($('#rmAnnTxt')||{}).value||'').trim();if(!t)return toast('저장할 문구를 써 주세요'),true;await saveCfg({annPh:[...(cf.annPh||PH_ANN),t].slice(0,30)});$('#rmAnnTxt').value='';toast('방송 문구를 저장했습니다');return true;}
    case 'annPhDelR':{if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='지울까요?';setTimeout(()=>{b.dataset.arm='';b.textContent='×';},3000);return true;}const L=[...(cf.annPh||PH_ANN)];L.splice(+b.dataset.i,1);await saveCfg({annPh:L});return true;}
    case 'rmWait':case 'rmWaitQ':{const u=pickDiv();if(!u)return toast('부문을 골라 주세요'),true;const why=a==='rmWaitQ'?b.dataset.t:(($('#rmWaitTxt')||{}).value||'').trim(),text=`${u.court}코트 ${spoken(u.div)} 추가 대기 요청${why?' — '+why:''}`;
      const id=await postMsg({dir:'up',room:me,roomName:room.name,kind:'wait',text,court:u.court,app:u.app,div:u.div,st:'new'});if($('#rmWaitTxt'))$('#rmWaitTxt').value='';
      const ok=await toCourt(u.court,u.app,'note',id,{text:why?'추가 대기 요청 — '+why:'추가 대기 요청',div:u.div,room:room.name,at:NOW()});toast(ok?`본부와 ${u.court}코트 운영석에 알렸습니다`:'본부에 알렸습니다');return true;}
    case 'rmMsg':case 'rmPh':{const text=a==='rmPh'?(cf.phRoom||PH_RM)[+b.dataset.i]:($('#rmMsg').value||'').trim();if(!text)return toast('보낼 말을 넣어 주세요'),true;
      await postMsg({dir:'up',room:me,roomName:room.name,kind:'msg',text,st:'new'});if(a==='rmMsg')$('#rmMsg').value='';toast('본부에 보냈습니다');return true;}
    case 'rmEmg':{const t=($('#rmEmgTxt').value||'').trim();await postMsg({dir:'up',room:me,roomName:room.name,kind:'emg',text:b.dataset.t+(t?' — '+t:''),st:'new'});$('#rmEmgTxt').value='';toast('🚨 본부에 긴급 알림을 보냈습니다');return true;}
    case 'rmPhAdd':case 'hqPhAdd':{const key=a==='rmPhAdd'?'phRoom':'phHQ',inp=$(a==='rmPhAdd'?'#rmPhNew':'#hqPhNew'),t=(inp.value||'').trim();if(!t)return toast('저장할 말을 넣어 주세요'),true;
      await saveCfg({[key]:[...(cf[key]||(key==='phRoom'?PH_RM:PH_HQ)),t].slice(0,20)});inp.value='';toast('자주 쓰는 말을 저장했습니다');return true;}
    case 'rmPhDel':case 'hqPhDel':{const key=a==='rmPhDel'?'phRoom':'phHQ',L=[...(cf[key]||(key==='phRoom'?PH_RM:PH_HQ))];
      if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='지울까요?';setTimeout(()=>{b.dataset.arm='';b.textContent='×';},3000);return true;}
      L.splice(+b.dataset.i,1);await saveCfg({[key]:L});return true;}
    case 'hqRmSend':case 'hqRmPh':{const text=a==='hqRmPh'?(cf.phHQ||PH_HQ)[+b.dataset.i]:($('#hqRmText').value||'').trim();if(!text)return toast('보낼 말을 넣어 주세요'),true;
      const to=($('#hqRmTo')||{}).value||'all',R=to==='all'?rooms():[roomOf(to)].filter(Boolean);
      for(const x of R)await postMsg({dir:'down',room:x.id,kind:'msg',text,st:'new'});if(a==='hqRmSend')$('#hqRmText').value='';toast(`${to==='all'?'모든 대기실':R[0].name}에 보냈습니다`);return true;}
    case 'hqRmOut':{const m=msgs().find(x=>x.id===b.dataset.id);if(m){await callOut(m);toast('본부 모니터에 띄웠습니다');}return true;}
    case 'hqRmAck':{const m=msgs().find(x=>x.id===b.dataset.id);if(m)await DB.doc('roommsg/'+m.id).set({...m,st:m.kind==='call'||m.kind==='ann'||m.kind==='wait'?'done':'ack',doneAt:NOW()});return true;}
    case 'roomAuto':await saveCfg({roomAuto:!cf.roomAuto});return true;
    case 'hqRmSave':{const R=rooms().map((x,i)=>({name:(($('#rmName_'+i)||{}).value||x.name).trim()||x.name,app:($('#rmApp_'+i)||{}).value??x.app,kw:(($('#rmKw_'+i)||{}).value??x.kw).trim()}));
      const sv=[...(cf.rooms||[])];R.forEach((x,i)=>sv[i]=x);await saveCfg({rooms:sv});toast('대기실 설정을 저장했습니다');return true;}
    case 'hqRmQR':{if(window.KSQR){const base=(window.KS_FIELD&&KS_FIELD.base)||location.href.split('#')[0];KSQR.open({title:'대기실 휴대폰',items:rooms().map(x=>({label:x.name,sub:'진행 요원 휴대폰으로 찍기',url:base+'#room-'+x.id}))});}return true;}
    case 'hqOpenEdge':{try{const j=await (await fetch('/api/hq/openedge',{method:'POST'})).json();toast(j.ok?'엣지로 본부 모니터(전광판)를 열었습니다 · 이제 방송 소리는 그 창에서만 나옵니다':'이 노트북에서 엣지를 찾지 못했습니다');}catch(e){toast('본부 노트북(현장 프로그램)에서만 열 수 있습니다');}return true;}
    case 'hqVoiceTest':{const v=($('#hqVoice')||{}).value||'';if(v!==(cf.voiceName||''))await saveCfg({voiceName:v});sayTest('본부 모니터 목소리 시험입니다. B코트, 중등부 3학년 선수는 준비해 주세요.');return true;}
  }
  return false;
}
document.addEventListener('change',e=>{const el=e.target;if(!el||!el.id)return;
  if(el.id==='hqRmN'){saveCfg({roomN:Number(el.value)||3});}
  else if(el.id==='hqVoice'){saveCfg({voiceName:el.value||''});}
  else if(el.id==='hqVoiceRate'){saveCfg({voiceRate:el.value||''});}
  else if(el.id==='rmDiv'&&route().startsWith('room-')){RS.div=el.value;el.blur();render();}
  else if(el.id==='rmAnnDiv'&&el.value){const r=roomOf(route().slice(5)),[court,app,...rest]=el.value.split('|'),t=$('#rmAnnTxt');if(r&&t){t.value=callText({court,div:rest.join('|')},r);t.focus();}el.value='';}});
function sayTest(t){try{speakKo(t,1);}catch(e){}}

/* ---------- 📱 지도자용 진행 상황 (인터넷) ----------
   본부 노트북이 인터넷에 연결되어 있으면, 코트 진행 상황·입상 결과(+ 코트별 예상 시각)를 접수 홈페이지 「실시간 결과」로 올립니다.
   지도자·학부모는 링크·QR로 휴대폰 데이터에서 봅니다 (대회장 와이파이에 들어오지 않음 → 심판 휴대폰 와이파이 부담 없음).
   - 바뀐 것이 있을 때만, 12초에 한 번까지 / 바뀐 것이 없어도 1분에 한 번 (「LIVE」 유지)
   - 로그인: 「☁️ 자동 백업」과 같은 관리자 계정 (Supabase) */
const LV_SITE='https://liketkd-jpg.github.io/kickstart-field/';
const LVS={comps:null,err:'',n:0,lastAt:0,last:'',busy:false,loading:false};
const lvUrl=id=>LV_SITE+'#live-'+id;
const LVTAB='l'+Math.random().toString(36).slice(2,8);
function lvLeader(){if(route().startsWith('room-'))return false;try{const v=JSON.parse(localStorage.getItem('ks_hq_lv')||'null'),now=Date.now();
  if(!v||v.t===LVTAB||now-v.at>15000){localStorage.setItem('ks_hq_lv',JSON.stringify({t:LVTAB,at:now}));return true;}return false;}catch(e){return true;}}
async function lvComps(){LVS.loading=true;schedule();try{const tok=await sbToken();if(!tok)throw new Error('관리자 계정으로 로그인해 주세요');
  const r=await fetch(SB_URL+'/rest/v1/comps?select=id,name,date&order=date.desc',{headers:{apikey:SB_KEY,Authorization:'Bearer '+tok}});if(!r.ok)throw new Error('대회 목록을 불러오지 못했습니다 ('+r.status+')');
  LVS.comps=await r.json();LVS.err='';const cf=CFG();
  if(!cf.lvComp&&LVS.comps.length){const t=Date.now(),c=LVS.comps.slice().sort((a,b)=>Math.abs(new Date(a.date)-t)-Math.abs(new Date(b.date)-t))[0];await saveCfg({lvComp:c.id,lvCompName:c.name});}}
  catch(e){LVS.err=e.message||String(e);}finally{LVS.loading=false;schedule();}}
/* 코트별 예상 시각 (본부 「코트 진행」과 같은 계산) */
function lvEta(court,app){const L=lanes().find(x=>x.court===court&&x.app===app);if(!L)return null;let t=NOW();const divs=[];let next=0;
  L.rem.forEach(d=>{const left=d.total-d.done;if(!d.live&&!next)next=t;if(divs.length<4)divs.push({name:d.name,start:d.live?0:t});t+=left*L.p.min*60000;});
  return {end:L.end,next,divs,real:!!L.p.real};}
async function lvPush(force){const cf=CFG();if(!cf.lvOn||!cf.lvComp||LVS.busy||!lvLeader())return;const now=Date.now();
  if(!force&&now-LVS.lastAt<12000)return;
  LVS.busy=true;try{const r=await fetch('/api/view',{cache:'no-store'});if(!r.ok)throw new Error('진행 정보를 읽지 못했습니다');const snap=await r.json();
    (snap.courts||[]).forEach(c=>(c.apps||[]).forEach(a=>{const e=lvEta(c.court,a.app);if(e)a.eta=e;}));
    try{const sc=window.KSPLAN&&KSPLAN.sched&&KSPLAN.sched();if(sc)snap.sched=sc;}catch(e){}
    const key=JSON.stringify({...snap,at:0,sig:0,courts:(snap.courts||[]).map(c=>({...c,apps:(c.apps||[]).map(a=>({...a,eta:a.eta?{e:Math.round(a.eta.end/60000),n:Math.round(a.eta.next/60000)}:0,board:a.board?{...a.board,at:0}:a.board}))}))});
    if(!force&&key===LVS.last&&now-LVS.lastAt<60000)return;
    const tok=await sbToken();if(!tok)throw new Error('관리자 계정으로 로그인해 주세요');
    const up=await fetch(SB_URL+'/rest/v1/rpc/push_live',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({p_comp:cf.lvComp,p_data:{...snap,comp:snap.comp||cf.lvCompName||''}})});
    if(!up.ok){const t=await up.text().catch(()=>'');throw new Error(up.status===401||up.status===403?'관리자 계정 권한을 확인해 주세요':'올리지 못했습니다 ('+up.status+') '+t.slice(0,80));}
    LVS.last=key;LVS.lastAt=now;LVS.n++;LVS.err='';}
  catch(e){LVS.err=/fetch|network|Failed/i.test(String(e&&e.message))?'인터넷에 연결되어 있지 않습니다 (본부 노트북 인터넷 확인)':(e.message||String(e));LVS.lastAt=now;}
  finally{LVS.busy=false;schedule();}}
setInterval(()=>lvPush(false),5000);

/* QR 그림 (SVG) — 묶여 있는 qrcode 도구로 칸을 직접 그림 */
function qrSvgOf(t){try{const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount();let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${n+4} ${n+4}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff"/><path d="${d}" fill="#0B0D12"/></svg>`;}catch(e){return '';}}
const KS_LOGO=`<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lvg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3DFAE"/><stop offset=".55" stop-color="#C9A262"/><stop offset="1" stop-color="#8E6A30"/></linearGradient></defs><path fill="none" stroke="url(#lvg)" stroke-width="2.2" stroke-linejoin="round" d="M32 3 57.1 17.5v29L32 61 6.9 46.5v-29z"/><path fill="url(#lvg)" d="M19 16h7.5v32H19z"/><path fill="url(#lvg)" d="M26.5 36.5 34.5 32l11 16h-8.6z"/><path fill="url(#lvg)" d="M26.5 32v-6.3c7.4-1.4 13.6-5.7 17.6-12l5.4 3.8C44.6 25.4 36.4 30.9 26.5 32z"/><path fill="url(#lvg)" d="M53 4.5l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z"/></svg>`;

</style></head><body><div class="pg"><div class="fr"></div>
<div class="br">${KS_LOGO}<span>KICKSTART<b>UP</b></span></div>
<div class="ey">LIVE · 지도자 · 학부모</div><h1>실시간 경기 진행<br>&amp; 결과 보기</h1><div class="cn">${esc(name)}</div>
<div class="qr">${qr}</div>
<div class="st"><div><i>1</i>휴대폰 카메라로<br>QR을 찍어 주세요</div><div><i>2</i>「⭐ 내 도장」을<br>골라 주세요</div><div><i>3</i>우리 선수 출전 순서·<br>예상 시각·입상 확인</div></div>
<div class="url">${esc(url)}</div><div class="ft">앱 설치 없이 · 휴대폰 데이터로 어디서나</div></div>
<script>Promise.all([document.fonts.load('400 40px "Black Han Sans"','실시간경기진행결과보기'),document.fonts.load('800 20px "Archivo"','KICKSTART')]).catch(()=>{}).then(()=>document.fonts.ready).then(()=>setTimeout(()=>print(),400));<\/script></body></html>`);
  /* 실제 주소가 있는 새 창(blob)으로 열어야 글꼴 파일을 제대로 불러옴 */
  const w=window.open(URL.createObjectURL(new Blob([html],{type:'text/html'})),'_blank');if(!w)toast('새 창이 막혔습니다. 팝업을 허용해 주세요');}

  if(au&&LVS.comps===null&&!LVS.loading&&!LVS.err)setTimeout(lvComps,0);

      <span class="small muted">오픈 채팅방에는 링크를, 대회장 입구·관중석에는 A4 QR을 붙이세요. 「보내기」를 켜기 전에는 「경기 소식을 기다리는 중」으로 보입니다.</span></div></div>`:''}
    <span class="small muted">로그인: ${esc(au.email||'')} · <a href="#" data-a="lvOut">로그아웃</a></span>`}</div>`;}
async function lvClick(a,b){const cf=CFG();
  if(a==='lvLogin'){try{await sbLogin(($('#lvEm').value||'').trim(),$('#lvPw').value||'');LVS.comps=null;LVS.err='';toast('로그인했습니다');}catch(e){toast(e.message);}render();}
  else if(a==='lvOut'){localStorage.removeItem(SB_LS);LVS.comps=null;await saveCfg({lvOn:false});render();}
  else if(a==='lvToggle'){await saveCfg({lvOn:!cf.lvOn});LVS.err='';LVS.last='';if(!cf.lvOn)setTimeout(()=>lvPush(true),300);}
  else if(a==='lvNow')lvPush(true);
  else if(a==='lvCopy'){const u=lvUrl(cf.lvComp);try{await navigator.clipboard.writeText(u);toast('링크를 복사했습니다 · 오픈 채팅방에 붙여 넣으세요');}catch(e){prompt('이 주소를 복사하세요',u);}}
  else if(a==='lvQR'){if(window.KSQR)KSQR.open({title:'지도자용 진행 상황',items:[{label:cf.lvCompName||'실시간 결과',sub:'휴대폰 카메라로 찍으면 어디서나 (인터넷)',url:lvUrl(cf.lvComp)}]});}
  else if(a==='lvPrint'||a==='lvPrintW')lvPrint(a==='lvPrintW');}
document.addEventListener('change',e=>{if(e.target&&e.target.dataset&&e.target.dataset.lvcomp){const c=(LVS.comps||[]).find(x=>x.id===e.target.value);if(c){saveCfg({lvComp:c.id,lvCompName:c.name});LVS.last='';}e.target.blur();}});

/* ---------- 시작 ---------- */
(async function boot(){
  render();
  DB=await window.claude.use('db');DL=await window.claude.use('downloads');
  DB.collection('courts').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.courts=m;S.ready=true;try{sample();}catch(e){}schedule();});
  DB.collection('moves').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.moves=m;schedule();});
  DB.doc('hqcfg/main').onSnapshot(s=>{S.cfg=s.exists?s.data():{};S.ready=true;schedule();});
  DB.doc('hqprint/main').onSnapshot(s=>{const d=s.exists?s.data():{};PR.done=d.done||{};PR.req=d.req||{};PR.ready=true;schedule();});
  DB.doc('hqprint/log').onSnapshot(s=>{S.plog=s.exists?s.data():null;schedule();});
  DB.doc('hqbackup/main').onSnapshot(s=>{S.bk=s.exists?s.data():null;schedule();});
  DB.doc('hq/announce').onSnapshot(s=>{onAnnounce(s.exists?s.data():null);schedule();});
  DB.doc('hq/speaker').onSnapshot(s=>{onSpk(s.exists?s.data():null);});setTimeout(spkTick,1500);
  DB.collection('roommsg').onSnapshot(s=>{onRoomMsgs(s.docs.map(d=>d.data()).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,400));schedule();});
  DB.collection('att').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.att=m;schedule();});
  DB.collection('calllog').onSnapshot(s=>{S.log=s.docs.map(d=>d.data()).sort((a,b)=>b.at-a.at).slice(0,30);schedule();});
  if(window.KS_FIELD&&KS_FIELD.onStatus)KS_FIELD.onStatus(()=>schedule());
  const coll=async()=>{try{const r=await fetch('/api/hq/collected',{cache:'no-store'});if(r.ok){S.coll=await r.json();if(route()==='admin')schedule();}}catch(e){}};coll();setInterval(coll,5000);
})();
})();

const DEF={courts:5,start:'09:30',openOn:false,openS:'09:30',openE:'10:00',lunchOn:true,lunchS:'12:00',lunchE:'13:00',awardOn:false,awardS:'14:30',awardE:'15:00',lateOn:true,lateAt:'11:00',buf:10,target:'15:00',gap:1,per:{},courtEv:[],lanes:[],roster:[],src:''};

const appOf=e=>/격파|종합경연/.test(e)?'gyeokpa':/겨루기/.test(e)?'kyorugi':'poomsae';   /* 요강: 팀 종합경연은 격파 단일 종목 → 격파 앱 「기술격파 단체전」 */
const APPN={poomsae:'품새',gyeokpa:'격파',kyorugi:'겨루기'};

/* ---------- 명단 → 경기 카드 ---------- */
function rebuild(){
  G={};
  P.roster.forEach((r,i)=>{const id=[r.ev,r.div,r.grp||'',isTeam(r.ev)?'':(r.sex||'')].join('|');
    const g=G[id]||(G[id]={id,ev:r.ev,div:r.div,grp:r.grp||'',sex:isTeam(r.ev)?'':(r.sex||''),units:0,people:0,members:[]});
    g.units++;g.people+=isTeam(r.ev)?(+r.cnt||1):1;g.members.push(i);});
}
const perOf=e=>{const v=Number(P.per[e]);return v>0?v:(DEFPER[e]||(isTeam(e)?4:1.5));};
const dur=g=>g.units*perOf(g.ev);
const gap=()=>Math.max(0,Number(P.gap)||0);
const events=()=>[...new Set(Object.values(G).map(g=>g.ev))].sort((a,b)=>evRank(a)-evRank(b)||a.localeCompare(b));
/* v1.4.59 같은 부별 안에서는 B조 먼저, A조 다음 */
const grpRank=g=>/B/i.test(g||'')?0:/A/i.test(g||'')?1:2;
const cmpG=(a,b)=>evRank(a.ev)-evRank(b.ev)||divRank(a.div)-divRank(b.div)||a.div.localeCompare(b.div)||grpRank(a.grp)-grpRank(b.grp)||a.grp.localeCompare(b.grp)||(a.sex==='남'?0:1)-(b.sex==='남'?0:1);
const gamesOf=e=>Object.values(G).filter(g=>g.ev===e).sort(cmpG);
const wt=g=>dur(g)+gap();

/* ---------- 시각 계산 ----------
   쉬는 시간(개회식·점심·시상식)에 걸리는 부문은 통째로 쉬는 시간 뒤로 넘김 */
const BRK=[['open','🎌','개회식'],['lunch','🍱','점심'],['award','🏆','시상식']];
function breaks(){return BRK.map(([k,ic,l])=>({k,ic,l,on:!!P[k+'On'],s:toMin(P[k+'S']),e:toMin(P[k+'E'])})).filter(b=>b.on&&b.e>b.s).sort((a,b)=>a.s-b.s);}
/* v1.4.59 유치부·실버부는 개회식 뒤 「○○시 이후」에 시작 (설정에서 끄고 켬) */
const isLateG=g=>/유치|유아|실버/.test(g.div||'');
const lateMin=()=>P.lateOn===false?0:toMin(P.lateAt||'11:00');
function place(ids){const st=toMin(P.start),B=breaks(),LM=lateMin();let t=st;const items=[],marks=[],used=new Set();
  ids.forEach(id=>{const g=G[id];if(!g)return;const d=dur(g);if(LM&&isLateG(g)&&t<LM)t=LM;
    for(let k=0;k<6;k++){const b=B.find(b=>t<b.e&&t+d>b.s);if(!b)break;if(!used.has(b.k)){used.add(b.k);marks.push({at:items.length,b});}t=Math.max(t,b.e);}
    items.push({g,s:t,e:t+d});t+=d+gap();});
  return {items,marks,end:items.length?items[items.length-1].e:st};}
function timeline(){return P.lanes.map(ids=>{const x=place(ids);return {...x,people:x.items.reduce((a,y)=>a+y.g.people,0),evs:[...new Set(x.items.map(y=>y.g.ev))]};});}
/* 선수 겹침: 같은 이름·도장·부별 = 같은 선수. 부문 안 순서(명단 순)로 어림한 출전 시각 차이가 「경기 시간 + 겹침 여유」보다 짧으면 겹침 */
const pkey=r=>[r.name,r.dojang,r.div].map(v=>String(v||'').replace(/\s/g,'')).join('|');
function overlaps(TL){const M={};
  TL.forEach((x,ci)=>x.items.forEach(it=>{if(isTeam(it.g.ev))return;const per=perOf(it.g.ev);
    it.g.members.forEach((ri,k)=>{const r=P.roster[ri];if(!r||!r.name)return;const key=pkey(r);(M[key]=M[key]||[]).push({r,ev:it.g.ev,court:ci,t:it.s+k*per,per,gid:it.g.id});});}));
  const list=[],by={},buf=Math.max(0,Number(P.buf)||0);
  Object.values(M).forEach(a=>{if(a.length<2)return;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const x=a[i],y=a[j];if(x.gid===y.gid)continue;const gp=Math.abs(x.t-y.t);
    if(gp<Math.max(x.per,y.per)+buf){list.push({a:x,b:y,gap:gp});by[x.gid]=(by[x.gid]||0)+1;by[y.gid]=(by[y.gid]||0)+1;}}});
  return {list:list.sort((p,q)=>Math.min(p.a.t,p.b.t)-Math.min(q.a.t,q.b.t)),by};}
/* 선수마다 예상 출전 시각 (도장별 시간표·엑셀) */
function personRows(TL){const R=[];TL.forEach((x,ci)=>x.items.forEach((it,no)=>{const per=perOf(it.g.ev);it.g.members.forEach((ri,k)=>{const r=P.roster[ri];if(!r)return;
  R.push({r,dj:r.dojang||'(소속 없음)',nm:r.name||'',ev:it.g.ev,div:it.g.div,grp:it.g.grp,sex:it.g.sex,c:ci+1,no:no+1,s:it.s,e:it.e,t:it.s+k*per,n:isTeam(it.g.ev)?(+r.cnt||1):1});});}));return R;}

/* ---------- 자동 배정 ---------- */
function splitContig(gs,k){const parts=Array.from({length:k},()=>[]);const T=gs.reduce((a,g)=>a+wt(g),0)||1;let acc=0;
  gs.forEach(g=>{const d=wt(g);parts[Math.min(k-1,Math.floor((acc+d/2)/(T/k)))].push(g);acc+=d;});return parts;}
/* 쉬는 시간까지 넣어 실제 끝나는 시각으로 이웃 코트 경계를 한 부문씩 옮겨 가며 맞추기 */
function laneEnd(ids){return place(ids).end;}
function balance(lanes,cs){if(cs.length<2)return;const worst=()=>Math.max(...cs.map(i=>laneEnd(lanes[i])));
  for(let it=0;it<300;it++){let best=worst(),mv=null;
    for(let j=0;j+1<cs.length;j++){const a=lanes[cs[j]],b=lanes[cs[j+1]];

/* 「자동」 코트(작은 종목을 함께 쓰는 코트)가 일찍 끝나면, 가장 늦게 끝나는 코트의 마지막 부문을 한 개씩 넘겨 받기
   (넘겨 받은 부문은 그 코트 원래 순서 뒤에, 원래 순서대로 붙음 → 그 코트에도 해당 종목 장비가 필요) */
function fillPool(lanes,ce){const pool=ce.map((x,i)=>!x?i:-1).filter(i=>i>=0);if(!pool.length)return;
  const base={};pool.forEach(i=>base[i]=lanes[i].length);
  for(let it=0;it<200;it++){const ends=lanes.map(laneEnd),worst=Math.max(...ends),src=ends.indexOf(worst);
    if(pool.includes(src)||lanes[src].length<2)break;
    const dst=pool.reduce((a,b)=>ends[b]<ends[a]?b:a),id=lanes[src][lanes[src].length-1];

    if(Math.max(...lanes.map(laneEnd))>=worst-0.01){lanes[dst].splice(base[dst],1);lanes[src].push(id);break;}}}
function recommendEv(){
  /* 종목별 걸리는 시간 ÷ (전체 ÷ 코트 수)로 코트 수를 나눔. 반 코트도 안 되는 작은 종목(태권체조·팀 종합경연 등)은 한 코트를 함께 씀 → 「자동 (남는 종목)」 */
  const n=P.courts,evs=events(),tot={};evs.forEach(e=>tot[e]=gamesOf(e).reduce((a,g)=>a+wt(g),0));
  if(!evs.length)return new Array(n).fill('');
  const T=evs.reduce((a,e)=>a+tot[e],0)||1,tgt=T/n,k={};evs.forEach(e=>k[e]=Math.floor(tot[e]/tgt+0.35));
  const sh=()=>evs.filter(e=>!k[e]),shT=()=>sh().reduce((a,e)=>a+tot[e],0);
  let s=sh().length?Math.max(1,Math.round(shT()/tgt)):0;
  const sum=()=>evs.reduce((a,e)=>a+k[e],0)+s;
  for(let guard=0;guard<80&&sum()>n;guard++){
    const c=evs.filter(e=>k[e]>0).map(e=>[e,tot[e]/k[e]]);if(s>1||(s===1&&!sh().length))c.push(['',shT()/s]);
    if(!c.length)break;const [e]=c.sort((a,b)=>a[1]-b[1])[0];
    if(e==='')s--;else{k[e]--;if(!k[e]&&!s)s=1;}}
  for(let guard=0;guard<80&&sum()<n;guard++){
    const c=evs.filter(e=>k[e]>0).map(e=>[e,tot[e]/k[e]]);if(sh().length)c.push(['',s?shT()/s:Infinity]);
    const [e]=c.sort((a,b)=>b[1]-a[1])[0];if(e==='')s++;else k[e]++;}
  const out=[];evs.forEach(e=>{for(let i=0;i<k[e];i++)out.push(e);});for(let i=0;i<s;i++)out.push('');
  while(out.length<n)out.push('');return out.slice(0,n);
}
function plan(ce){
  const n=P.courts,evs=events();ce=(ce||[]).slice(0,n);while(ce.length<n)ce.push('');
  ce=ce.map(x=>evs.includes(x)?x:'');P.courtEv=ce;
  const lanes=Array.from({length:n},()=>[]),load=i=>lanes[i].reduce((a,id)=>a+wt(G[id]),0),left=[];
  evs.forEach(e=>{const cs=ce.map((x,i)=>x===e?i:-1).filter(i=>i>=0);
    if(!cs.length){left.push(e);return;}
    splitContig(gamesOf(e),cs.length).forEach((part,k)=>lanes[cs[k]].push(...part.map(g=>g.id)));
    balance(lanes,cs);});
  let warn='';
  if(left.length){let pool=ce.map((x,i)=>!x?i:-1).filter(i=>i>=0);
    if(!pool.length){pool=lanes.map((_,i)=>i);warn=`${left.join('·')}을(를) 맡은 코트가 없어 일찍 끝나는 코트에 넣었습니다`;}
    left.map(e=>[e,gamesOf(e)]).sort((a,b)=>b[1].reduce((s,g)=>s+wt(g),0)-a[1].reduce((s,g)=>s+wt(g),0)).forEach(([e,gs])=>{
      const i=pool.reduce((a,b)=>load(b)<load(a)?b:a);lanes[i].push(...gs.map(g=>g.id));});
    pool.forEach(i=>lanes[i].sort((a,b)=>cmpG(G[a],G[b])));}
  fillPool(lanes,ce);
  P.lanes=lanes;return warn;
}

/* ---------- 가상 명단 (품새 250 · 개인 격파 350 · 팀 태권체조 40팀 200명) ---------- */
function virtualRoster(){
  let s=20261128;const rnd=()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const DIVS=[['유치부',.12],['초등 1·2학년',.22],['초등 3·4학년',.24],['초등 5·6학년',.22],['중등부',.12],['고등·일반부',.08]];
  const DJ=['아크리아점','에스파이브점','글로벌점','아라점','한빛도장','청룡도장','새솔도장','정의도장','용인도장','하늘도장'];
  const LN='김이박최정강조윤장임한오서신권황안송류홍'.split(''),FN=['민준','서연','도윤','하은','시우','지우','예준','수아','주원','지호','유나','건우','서준','하린','은우','채원','준서','다인','현우','소율'];
  const split=n=>{const k=DIVS.map(([,p])=>Math.round(n*p));k[k.length-1]+=n-k.reduce((a,b)=>a+b,0);return k;};
  const out=[];

  if(ctx.state==='suspended'||ctx.state==='interrupted'){try{ctx.resume().catch(()=>{});}catch(e){}}
  return ctx;
}
const running=()=>!!ctx&&ctx.state==='running';
/* 1) 소리 장치 깨워 두기: -80dB 정도의 아주 작은 잡음(사람 귀에는 들리지 않음) */
function startKeep(){
  const c=C();if(!c||keep||c.state!=='running')return;
  try{const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*0.0001;
    const s=c.createBufferSource();s.buffer=b;s.loop=true;s.connect(c.destination);s.start();keep=s;}catch(e){}
}
/* 2) 미리 읽어 둔 소리 재생 */
const CACHE=new Map();
function buf(url){
  if(!url)return Promise.reject(new Error('no url'));
  if(CACHE.has(url))return CACHE.get(url);
  const c=C();if(!c)return Promise.reject(new Error('no audio'));
  const p=fetch(url).then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.arrayBuffer();})
    .then(ab=>new Promise((res,rej)=>{const q=c.decodeAudioData(ab,res,rej);if(q&&q.then)q.then(res,rej);}));
  CACHE.set(url,p);p.catch(()=>CACHE.delete(url));
  if(CACHE.size>60){const k=CACHE.keys().next().value;CACHE.delete(k);}
  return p;
}
let NOWS=[];
function stopAll(){NOWS.forEach(s=>{try{s.stop();}catch(e){}});NOWS=[];}
/* 재생할 수 있으면 true. 소리가 아직 막혀 있으면 false → 앱이 원래 방식으로 재생 */
function play(url,opt){
  opt=opt||{};if(!url||url==='null')return false;const c=C();if(!c||!running())return false;
  buf(url).then(b=>{const s=c.createBufferSource();s.buffer=b;const v=c.createGain();v.gain.value=opt.vol==null?1:opt.vol;s.connect(v);v.connect(master);
    s.onended=()=>{NOWS=NOWS.filter(x=>x!==s);if(opt.onended)opt.onended();};
    s.start(c.currentTime+0.03);NOWS.push(s);startKeep();})
   .catch(()=>{try{const a=new Audio(url);a.volume=1;if(opt.onended)a.onended=opt.onended;a.play().catch(()=>{});}catch(e){}});
  return true;
}
function preload(url){if(url&&C())buf(url).catch(()=>{});}
/* 3) 기기 음성 미리 깨우기 */
let TTSW=0;
function warmTTS(){try{const ss=window.speechSynthesis;if(!ss||Date.now()-TTSW<60000||ss.speaking||ss.pending)return;TTSW=Date.now();
  const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='ko-KR';ss.speak(u);}catch(e){}}

/* 앱별 연결 ---------------------------------------------------------- */
function hookKyorugi(){
  /* 겨루기 신호음(경적·부저): 미리 읽어 두고 바로 재생 */
  const DEF=g('DEF_SND'),FILE=g('SND_FILE');
  if(!DEF||typeof window.playFile!=='function'||window.playFile.__ks)return;
  const old=window.playFile;
  const nf=function(key){const d=(FILE&&FILE[key])||DEF[key];if(!d)return false;if(play(d))return true;return old(key);};
  nf.__ks=1;window.playFile=nf;
  if(typeof window.actx==='function'){const oa=window.actx;window.actx=function(){return C()||oa();};}
  const pre=()=>{Object.values(DEF).forEach(preload);if(FILE)Object.values(FILE).forEach(u=>u&&preload(u));};
  pre();setInterval(pre,60000);
}
function preloadVoices(){try{if(typeof window.KS_VOICE_URLS==='function')(window.KS_VOICE_URLS()||[]).forEach(p=>Promise.resolve(p).then(preload,()=>{}));}catch(e){}}

/* 4) 소리 허락 받기 */
function unlock(){const c=C();if(!c)return;startKeep();warmTTS();preloadVoices();hookKyorugi();refreshBtn();}
['pointerdown','touchstart','keydown','click'].forEach(t=>addEventListener(t,unlock,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx)C();});
/* 바로 시도 (현장 모드 등 자동 재생이 허용된 경우) */
setTimeout(()=>{C();if(running())unlock();},300);
setInterval(()=>{if(running()){startKeep();preloadVoices();}},30000);
hookKyorugi();

/* 전광판에서 소리가 막혀 있으면 단추 표시 */
let BTN=null;
function isDisp(){return document.body&&document.body.classList.contains('disp');}
function refreshBtn(){
  const need=isDisp()&&!running()&&!document.querySelector('.tapv');
  if(need&&!BTN){BTN=document.createElement('button');BTN.type='button';BTN.className='ksaudio';BTN.setAttribute('data-noi18n','');
    BTN.textContent='🔊 소리 켜기 (한 번 눌러 주세요)';BTN.addEventListener('click',e=>{e.stopPropagation();unlock();setTimeout(refreshBtn,200);});document.body.appendChild(BTN);}
  else if(!need&&BTN){BTN.remove();BTN=null;}
}
setInterval(refreshBtn,1500);

window.KS_AUDIO={ctx:C,play,preload,stopAll,unlocked:running,keepAlive:startKeep,warmTTS,unlock};
})();
</script><script>
/* v1.4.47 한 화면 맞춤: 화면보다 내용이 길면 스크롤 대신 전체를 알맞게 줄여 한눈에 다 보이게 합니다 (노트북·태블릿·휴대폰 크기에 맞춰 자동) */
(function(){
  const MODE='hq';
  const app=document.getElementById('app');if(!app||!window.MutationObserver)return;
  const hash=()=>location.hash.replace('#','').split('?')[0];
  function on(){if(MODE==='hq'){const h=hash();return !h||h==='admin';}const c=document.body.classList;return c.contains('jfit')||c.contains('jmax');}
  const MIN=MODE==='hq'?1:.55; /* v1.4.49 본부는 글씨를 줄이지 않음 (넓게 펼친 배치로 한 화면) */
  function over(){let b=0;[...app.children].forEach(c=>{const r=c.getBoundingClientRect();if(r.height)b=Math.max(b,r.bottom+scrollY);});const sc=/(auto|scroll)/.test(getComputedStyle(app).overflowY)?app.scrollHeight-app.clientHeight:0;return Math.max(b+(MODE==='hq'?14:6)-innerHeight,sc,0);}
  function setZ(z){[...app.children].forEach(c=>{c.style.zoom=z===1?'':String(z);});}
  function fit(){setZ(1);if(MODE==='hq')app.style.paddingBottom='';document.documentElement.dataset.fit='1';if(!on())return;let o=over();if(o>1){
    /* 가장 크게 보이면서 한 화면에 다 들어가는 크기를 찾습니다 */
    let lo=MIN,hi=1;setZ(lo);o=over();if(o<=1){for(let i=0;i<7;i++){const m=(lo+hi)/2;setZ(m);if(over()<=1)lo=m;else hi=m;}setZ(lo);o=over();}
    const z=lo;
    document.documentElement.dataset.fit=String(o>1&&MODE==='hq'?1:Math.round(z*100)/100);}
    /* 본부: 내용이 화면에 다 들어오면 아래 빈 여백 때문에 생기는 스크롤도 없앱니다 */
    if(MODE==='hq'&&o<=1){const d=document.documentElement,ex=d.scrollHeight-innerHeight;if(ex>0){const pb=parseFloat(getComputedStyle(app).paddingBottom)||0;app.style.paddingBottom=Math.max(0,pb-ex)+'px';}}}
  let q=false;const run=()=>{if(q)return;q=true;queueMicrotask(()=>{q=false;try{fit();}catch(e){}});};
  new MutationObserver(run).observe(app,{childList:true,subtree:true});
  new MutationObserver(run).observe(document.body,{attributes:true,attributeFilter:['class']});
  addEventListener('resize',run);addEventListener('hashchange',run);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(run);run();
})();
</script>
<style>/* v1.4.57 심판 태블릿 배터리 배지 */

<script>/* v1.4.57 본부 맨 위 「🔋 태블릿」 배지: 평소엔 정상, 20% 아래(충전 중이 아닐 때)는 빨갛게 깜빡이고 알림음 한 번.
   누르면 A~E 코트별로 심판 태블릿 배터리·충전 중 표시를 크게 펼쳐 봅니다. (안드로이드 크롬 태블릿만 배터리를 알려 줍니다) */
(function(){
  const LOW=0.2,WARN=0.35,APPN={poomsae:'품새',gyeokpa:'격파',kyorugi:'겨루기'};let OPEN=false,ALERTED={};
  const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function chime(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),t=c.currentTime;[[988,0],[740,.22],[988,.44]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='square';g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.12,t+d+.02);g.gain.linearRampToValueAtTime(0,t+d+.2);o.connect(g).connect(c.destination);o.start(t+d);o.stop(t+d+.22);});}catch(e){}}
  function data(){const out={};try{const S=window.KS_HQS?KS_HQS():{courts:{}};Object.values(S.courts||{}).forEach(doc=>{const b=Array.isArray(doc.bat)?doc.bat:[];const ct=doc.court;if(!ct||ct==='?')return;
    const L=out[ct]||(out[ct]={court:ct,online:!!doc.online,list:[]});if(doc.online)L.online=true;b.forEach(x=>L.list.push(x));});}catch(e){}
    return Object.values(out).sort((a,b)=>a.court.localeCompare(b.court));}
  const cls=x=>!x.charging&&x.level<LOW?'l':!x.charging&&x.level<WARN?'w':'';
  function badge(){const bar=document.querySelector('header.bar'),barOk=bar&&bar.getBoundingClientRect().height>0;let el=document.getElementById('batb');
    if(!el){el=document.createElement('button');el.id='batb';el.type='button';el.addEventListener('click',()=>{OPEN=true;panel();});}
    /* 맨 위 줄이 보이면 그 오른쪽 끝, 안 보이면 화면 오른쪽 위에 떠 있게 */
    if(barOk&&el.parentNode!==bar){bar.appendChild(el);el.classList.remove('batfloat');}else if(!barOk&&el.parentNode!==document.body){document.body.appendChild(el);}
    el.dataset.float=barOk?'':'1';
    const bp=document.getElementById('batpanel');if(bp&&bp.offsetParent){const h=inner();if(bp.dataset.h!==h){bp.dataset.h=h;const t=bp.querySelector('.batin')||bp.appendChild(Object.assign(document.createElement('div'),{className:'batin'}));bp.querySelectorAll(':scope>.batnone,:scope>.batgrid').forEach(x=>x.remove());t.innerHTML=h;}}
    const D=data(),all=D.flatMap(c=>c.list.map(x=>({...x,court:c.court}))),low=all.filter(x=>cls(x)==='l'),warn=all.filter(x=>cls(x)==='w');
    el.className='batb '+(low.length?'low':warn.length?'warn':'ok')+(el.dataset.float?' batfloat':'');
    el.textContent=!all.length?'🔋 태블릿 정보 없음':low.length?`🪫 ${low.slice(0,2).map(x=>`${x.court}코트 ${x.seat?x.seat+'심':'심판'} ${Math.round(x.level*100)}%`).join(' · ')}${low.length>2?` 외 ${low.length-2}대`:''}`
      :warn.length?`🔋 ${warn.length}대 35% 아래`:`🔋 태블릿 ${all.length}대 정상`;
    el.title='누르면 코트별 심판 태블릿 배터리를 크게 봅니다';
    let ring=false;low.forEach(x=>{if(!ALERTED[x.id]){ALERTED[x.id]=1;ring=true;}});all.forEach(x=>{if(cls(x)!=='l')delete ALERTED[x.id];});
    if(ring)chime();
    if(OPEN)panel();}
  function panel(){let ov=document.getElementById('batov');if(!OPEN){if(ov)ov.remove();return;}
    if(!ov){ov=document.createElement('div');ov.id='batov';ov.className='batov';ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-batx]')){OPEN=false;panel();}});document.body.appendChild(ov);}
    ov.innerHTML=`<div class="batpn"><div style="display:flex;align-items:center;gap:12px"><h2>🔋 심판 태블릿 배터리</h2><button class="x" data-batx>닫기</button></div>${inner()}</div>`;}
  function inner(){const D=data();
    return `<div class="batnone" style="margin-top:6px">20% 아래는 빨강, 35% 아래는 노랑 · ⚡는 충전 중 · 1분마다 새로 받습니다. 안드로이드 크롬으로 심판 화면을 연 태블릿만 보입니다.</div>
      <div class="batgrid">${D.length?D.map(c=>`<div class="batct"><h3>${esc(c.court)}코트${c.online?'':' <span style="font-size:14px;color:#FF8A80">연결 끊김</span>'}</h3>
        ${c.list.length?c.list.map(x=>{const p=Math.round(x.level*100);return `<div class="batrow ${cls(x)}"><span>${x.seat?x.seat+'심':'심판'}${Object.keys(APPN).length&&c.list.some(y=>y.app!==x.app)?`<small style="display:block;font-size:11px;color:#9C968A">${APPN[x.app]||''}</small>`:''}</span><span class="batbar"><i style="width:${Math.max(3,p)}%"></i></span><span class="pc">${x.charging?'⚡':''}${p}%</span></div>`;}).join('')
          :'<div class="batnone">배터리 정보를 보낸 태블릿이 없습니다</div>'}</div>`).join(''):'<div class="batnone">연결된 코트가 없습니다</div>'}</div>`;}
  function tile(){const all=data().flatMap(c=>c.list),low=all.filter(x=>cls(x)==='l').length,warn=all.filter(x=>cls(x)==='w').length;
    return [!all.length?'아직 정보 없음':low?`🪫 ${low}대 20% 아래`:warn?`${warn}대 35% 아래`:`${all.length}대 정상`,low?'warn':all.length?'ok':''];}
  addEventListener('keydown',e=>{if(e.key==='Escape'&&OPEN){OPEN=false;panel();}});
  setInterval(badge,3000);setTimeout(badge,1200);
  window.KS_BAT={data,inner,tile,open:()=>{OPEN=true;panel();}};
})();
</script>
